n P15. You did not say what level you consider moderate."}, {"title": "Natural rights that consequences can override", "evidence": ["P17", "P11", "P19", "P28"], "assumption": "You assume rights can exist independently of government while still being overridden when the benefits of violating them clearly exceed the harms.", "why_it_matters": "This decides whether your positions on surveillance and speech rest on rights or on cost-benefit judgments.", "what_would_resolve": "A statement of which rights, if any, you would not trade for a clear welfare gain.", "detail": "In P17 you ground fundamental rights in natural rights that exist independently of government. On that view, rights usually limit what a government may do even when a violation would produce net benefits. Yet in P11 you said privacy is a powerful presumption, but \"the consequences ultimately determine permissibility.\" You passed over the option that some rights should never be violated, and also the option that allows exceptions only for catastrophic consequences. Your speech answers follow the same pattern. In P19 and P28 you protect speech strongly but allow narrow exceptions. Your answers treat rights as strong presumptions, and you did not say how that fits a natural-rights foundation."}, {"title": "Fair rules may not deliver genuinely equal opportunity", "evidence": ["P5", "P10", "P2", "P6"], "assumption": "You assume that once legal discrimination is removed and access to education and healthcare is expanded, opportunity is genuinely equal, even when inequalities persist across generations.", "why_it_matters": "Your choice in P10 to focus on fair rules depends on this assumption.", "what_would_resolve": "Data on how strongly parents' income and wealth still predict children's outcomes in societies that have expanded education and healthcare access.", "detail": "In P5 you defined justice as everyone having genuinely equal opportunities to succeed, and you passed over protecting equal rights and impartial treatment under the law. In P2 you said excessive inequality threatens opportunity. In P6 you supported higher taxes on the wealthy when they improve opportunities for poorer citizens. But in P10, where inequalities persist across groups and generations, you chose to focus on equal rights and fair rules. You passed over the option to keep improving opportunity and social mobility. That choice fits your P5 standard only if opportunity in that society is already genuinely equal. You did not say why persistent inequality between generations would not limit children's chances."}], "open_questions": ["You rated the purpose of government (P1) as one of your most important answers but rejected every listed option. What do you think government is for?", "You treat markets as the default (P7), yet on housing you give weight to local preferences that restrict construction against expert advice (P32). Why should zoning get more deference than other market restrictions?", "You let communities preserve their norms through voluntary institutions (P13), but require public-facing institutions to meet secular equality standards (P24). Where does a voluntary institution end and a public-facing one begin?"], "affiliations": {"traditions": [{"name": "The social market economy (ordoliberalism)", "definition": "A school, founded in postwar Germany, that holds markets work best inside firm legal rules set by the state, especially strong competition law, with a social safety net alongside.", "overlap": "You make markets the default and want government to correct identifiable failures. You answer concentrated corporate power with competition policy, and you want stronger antitrust paired with simpler regulation. You keep private enterprise and back measures for competition and worker mobility. You also see a strong public duty to guarantee a decent minimum.", "differences": "Ordoliberals are wary of state support for chosen industries. You back targeted subsidies and public investment in strategic sectors, and you pair carbon pricing with targeted public investment.", "evidence": ["P7", "P27", "P29", "U4", "P23", "U15", "P33"]}, {"name": "Classical liberalism", "definition": "The tradition that puts individual rights, limited government, free markets, and free speech first.", "overlap": "You ground fundamental rights in natural rights that exist independently of government. You say suppressing offensive political speech is almost never legitimate, and you would have a court strike down a law banning peaceful criticism of government. You generally oppose restricting risky adult behavior. You hold that unequal outcomes are not intrinsically unjust under fair rules.", "differences": "Classical liberals tend to favor open immigration. You want to reduce legal immigration and expand deportations. You also accept that consequences can outweigh privacy, and you support higher taxes on the wealthy when benefits outweigh costs.", "evidence": ["P17", "P28", "P19", "P8", "P10", "U6", "U7", "P11", "P6"]}, {"name": "National conservatism", "definition": "A current on the right that puts the nation, its shared culture, and its citizens' interests at the center of politics.", "overlap": "You say a substantive national culture and historical identity matter alongside civic principles. You say governments have special obligations to citizens even when foreign aid would do more good. You favor moderate immigration that puts citizens first, fewer legal admissions, and more deportations.", "differences": "National conservatives usually favor a strong role for tradition and religion in public life. You judge traditions on their merits, you want public-facing religious institutions to meet secular equality standards, and you support abortion access throughout pregnancy. You also want to preserve significant ordinary trade with China.", "evidence": ["P22", "P20", "P15", "U6", "U7", "P4", "P24", "U16", "U23"]}, {"name": "Foreign policy realism", "definition": "The view that foreign policy should serve national interests and the balance of power, not the spread of political values.", "overlap": "You prefer diplomatic engagement and targeted measures over broad confrontation with human rights abusers. You decide aid to countries under attack case by case. You keep a large, globally capable military.", "differences": "Realists will accept high costs when the balance of power is at stake. Facing an authoritarian threat to a democracy, you chose limited aid and diplomacy over the option that weighs strategic consequences. You doubt such efforts work, writing: \"I wonder if America has ever been truly successful when attempting to protect another country’s threatened democracy.\"", "evidence": ["P25", "U24", "U21", "P35"]}], "thinkers": [{"name": "John Stuart Mill", "why": "Like Mill, you oppose most restrictions on risky adult choices and on offensive speech, yet you judge hard cases such as privacy and welfare trade-offs by their consequences.", "cited_by_you": false, "evidence": ["P8", "P28", "P11", "P12"]}, {"name": "Wilhelm Ropke", "why": "Ropke, an ordoliberal economist, joined support for competitive markets policed against concentrated power with concern for the cultural ties that hold a society together, as you do.", "cited_by_you": false, "evidence": ["P7", "P27", "U4", "P22"]}, {"name": "Samuel Huntington", "why": "Huntington argued that a shared national culture matters for political community and questioned high immigration, which matches your answers on national identity and admissions.", "cited_by_you": false, "evidence": ["P22", "U6", "P15"]}], "party_summary": "You agree with Democrats on deficits, policing, public schools, targeted industrial policy, defense spending, and China trade, and you go further than them on abortion. You agree with Republicans on the minimum wage, a market-led health system, and lower legal immigration with more deportations. You break from both parties on energy, environmental permitting, alliances, military aid, and surveillance, where you prefer to judge each case separately rather than apply one rule.", "party_rows": [{"qid": "U1", "issue": "Federal taxation", "your_position": "Keep the overall burden similar, simplify the code, close loopholes", "D": {"agreement": "disagree", "note": "Democrats want substantial tax increases on high earners and corporations.", "summary": "The 2024 Democratic platform calls for a 25 percent minimum income tax on billionaires, taxing capital gains of millionaires at the same rate as wages, ending the stepped-up basis and carried interest loopholes, and raising the corporate rate from 21 to 28 percent. It pledges no tax increase for anyone earning under $400,000 and uses the revenue for families, health care, and child care.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans want further cuts, one step beyond your position.", "summary": "The 2024 Republican platform pledges to make the 2017 Trump tax cuts permanent, end taxes on tips, and pursue additional tax cuts. The 2025 reconciliation law (Public Law 119-21) made the 2017 individual rates permanent and added new deductions, which the Congressional Budget Office scores as a $4.5 trillion revenue reduction over ten years.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "CBO: Effects on Deficits and the Debt of Public Law 119-21", "url": "https://www.cbo.gov/publication/61466", "date": "2025"}]}}, {"qid": "U2", "issue": "Federal spending and deficits", "your_position": "Maintain core services, combine targeted tax increases and spending restraint", "D": {"agreement": "agree", "note": "Democrats pair new spending with higher taxes on the wealthy to reduce deficits.", "summary": "The 2024 Democratic platform pairs new investment in families, health care, and climate with higher taxes on the wealthy and corporations, and says this will reduce the deficit. It opposes adding to the debt for tax cuts. It does not propose broad spending cuts.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans favor spending cuts and growth over deficit targets, and their main law raised deficits.", "summary": "The 2024 Republican platform promises to rein in wasteful federal spending and restore fiscal sanity. In practice, the 2025 reconciliation law adds about $3.4 trillion to deficits over 2025 to 2034 by Congressional Budget Office estimates, while cutting Medicaid and other spending. Congress also passed a $9 billion rescissions package in July 2025.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "CBO: Effects on Deficits and the Debt of Public Law 119-21", "url": "https://www.cbo.gov/publication/61466", "date": "2025"}, {"title": "ICAEW: Chart of the week, One Big Beautiful Bill Act 2025 (summarizes CBO estimate)", "url": "https://www.icaew.com/insights/viewpoints-on-the-news/2025/jul-2025/chart-of-the-week-one-big-beautiful-bill-act-2025", "date": "2025-07"}, {"title": "Rep. Tokuda: vote against Rescissions Act cuts to public broadcasting and foreign aid", "url": "https://tokuda.house.gov/media/in-the-news/tokuda-and-case-vote-against-cuts-to-public-broadcasting-foreign-aid", "date": "2025-07-21"}]}}, {"qid": "U3", "issue": "Minimum wage", "your_position": "Modest federal floor, with most increases left to states and cities", "D": {"agreement": "disagree", "note": "Democrats want a federal minimum of $15 to $17.", "summary": "The 2024 Democratic platform pledges to raise the federal minimum wage to at least $15 an hour. In April 2025 congressional Democrats reintroduced the Raise the Wage Act, which would lift the federal minimum to $17 by 2030 and then index it, with more than 140 House Democratic cosponsors.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Pelosi joins House Democrats introducing Raise the Wage Act of 2025", "url": "https://pelosi.house.gov/news/press-releases/pelosi-joins-house-democrats-introducing-bill-raise-minimum-wage", "date": "2025-04"}, {"title": "House Education and Workforce Democrats: Labor leaders introduce bill to raise minimum wage", "url": "https://democrats-edworkforce.house.gov/media/press-releases/labor-leaders-introduce-bill-to-raise-minimum-wage", "date": "2025-04-08"}]}, "R": {"agreement": "agree", "note": "Republicans have kept the federal floor at $7.25.", "summary": "The 2024 Republican platform does not address the minimum wage. The federal floor has stayed at $7.25 under Republican control of Congress and the White House. Senator Josh Hawley, a Republican, introduced a bipartisan bill in June 2025 to raise it to $15 and index it, but he is described as a rare Republican on this issue.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Sen. Hawley: Hawley, Welch introduce legislation to increase federal minimum wage to $15", "url": "https://www.hawley.senate.gov/hawley-welch-introduce-legislation-to-increase-federal-minimum-wage-to-15-per-hour", "date": "2025-06-10"}, {"title": "Pelosi joins House Democrats introducing Raise the Wage Act of 2025", "url": "https://pelosi.house.gov/news/press-releases/pelosi-joins-house-democrats-introducing-bill-raise-minimum-wage", "date": "2025-04"}]}}, {"qid": "U4", "issue": "Business regulation and antitrust", "your_position": "Stronger antitrust with simpler regulation", "D": {"agreement": "partial", "note": "Democrats share your stronger antitrust but want more regulation, not less.", "summary": "The 2024 Democratic platform praises the Biden administration's increased antitrust enforcement by the Justice Department and Federal Trade Commission, its Competition Council, a ban on non-compete agreements, and a crackdown on junk fees. It pledges to keep using antitrust law against hospital, insurance, drug, and media mergers.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans share your simplification but favor broad deregulation with only selective antitrust cases.", "summary": "The 2024 Republican platform promises to slash regulations. Executive Order 14192 (January 2025) requires agencies to repeal ten rules for each new one. The administration has also continued the large antitrust cases against Google and Meta that began under prior administrations.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House fact sheet: 10-to-1 deregulation initiative (Executive Order 14192)", "url": "https://www.whitehouse.gov/fact-sheets/2025/01/fact-sheet-president-donald-j-trump-launches-massive-10-to-1-deregulation-initiative/", "date": "2025-01-31"}, {"title": "Technology Policy Institute: After Google and Meta, what comes next for antitrust policy", "url": "https://techpolicyinstitute.org/publications/antitrust-and-competition/after-google-and-meta-what-comes-next-for-antitrust-policy-with-jon-nuechterlein-and-bill-kovacic/", "date": "2025"}]}}, {"qid": "U5", "issue": "Healthcare system", "your_position": "Market-led system with targeted public support for vulnerable people", "D": {"agreement": "partial", "note": "Democrats want to build on the Affordable Care Act with larger subsidies, an adjacent position.", "summary": "The 2024 Democratic platform says health care is a right and pledges to protect and build on the Affordable Care Act, keep the expanded premium tax credits, and extend drug price caps. In January 2026 House Democrats, joined by 17 Republicans, passed a three-year extension of the expanded credits, which expired at the end of 2025.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Ballotpedia News: House passes three-year extension of expanded ACA subsidies", "url": "https://news.ballotpedia.org/2026/01/12/house-passes-three-year-extension-of-expanded-aca-subsidies/", "date": "2026-01-12"}, {"title": "Rep. Jayapal: Jayapal, Sanders, Dingell introduce Medicare for All Act", "url": "https://jayapal.house.gov/2025/04/29/jayapal-sanders-dingell-hundreds-of-health-care-workers-introduce-medicare-for-all", "date": "2025-04-29"}]}, "R": {"agreement": "agree", "note": "Republicans favor a market-led system with choice and competition.", "summary": "The 2024 Republican platform promises more transparency, choice, and competition in health care and to protect Medicare. The 2025 reconciliation law added Medicaid work requirements and cut federal Medicaid spending. In January 2026 President Trump proposed the Great Healthcare Plan, which would send subsidy money to individuals for health savings accounts instead of to insurers.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "Morgan Lewis: One Big Beautiful Bill Act key final Medicaid changes explained", "url": "https://www.morganlewis.com/pubs/2025/07/one-big-beautiful-bill-act-key-final-medicaid-changes-explained", "date": "2025-07"}, {"title": "White House: President Trump unveils the Great Healthcare Plan", "url": "https://www.whitehouse.gov/releases/2026/01/president-trump-unveils-the-great-healthcare-plan-to-lower-costs-and-deliver-money-directly-to-the-people", "date": "2026-01-15"}, {"title": "Ballotpedia News: House passes three-year extension of expanded ACA subsidies", "url": "https://news.ballotpedia.org/2026/01/12/house-passes-three-year-extension-of-expanded-aca-subsidies/", "date": "2026-01-12"}]}}, {"qid": "U6", "issue": "Legal immigration levels", "your_position": "Reduce legal immigration and favor high economic contributors", "D": {"agreement": "disagree", "note": "Democrats want more family, employment, and refugee admissions.", "summary": "The 2024 Democratic platform calls on Congress to increase the number of family-sponsored and employment-based immigrant visas so people do not wait decades. It highlights rebuilding refugee admissions to over 100,000 a year.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "The Republican platform calls for merit-based immigration and fewer family admissions.", "summary": "The 2024 Republican platform calls for merit-based immigration and an end to chain migration. In office, the administration set the fiscal 2026 refugee ceiling at a record-low 7,500 (later raised to 17,500), added a $100,000 fee to new H-1B worker visas, and in January 2026 paused immigrant visa issuance for nationals of 75 countries.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Presidential Determination on Refugee Admissions for Fiscal Year 2026 (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/presidential-determination-refugee-admissions-for-fiscal-year-2026", "date": "2025-09-30"}, {"title": "CRS: U.S. Refugee Admissions Program in FY2025 and FY2026", "url": "https://www.everycrsreport.com/reports/IF13277.html", "date": "2026-07-28"}, {"title": "White House proclamation: Restriction on Entry of Certain Nonimmigrant Workers ($100,000 H-1B fee)", "url": "https://www.whitehouse.gov/presidential-actions/2025/09/restriction-on-entry-of-certain-nonimmigrant-workers/", "date": "2025-09-19"}, {"title": "Mintz: State Department suspends immigrant visa processing for 75 countries", "url": "https://www.mintz.com/insights-center/viewpoints/2806/2026-01-29-state-department-suspends-immigrant-visa-processing-75", "date": "2026-01-29"}]}}, {"qid": "U7", "issue": "Unauthorized immigration", "your_position": "Expand deportations substantially; you said you are between this and narrower legalization", "D": {"agreement": "disagree", "note": "Democrats back a path to legal status for long-term residents.", "summary": "The 2024 Democratic platform backs the 2024 bipartisan border deal, more border agents and immigration judges, and a pathway to citizenship for Dreamers, farmworkers, care workers, and other long-term undocumented residents. In February 2026 Democratic leaders Hakeem Jeffries and Chuck Schumer conditioned Homeland Security funding on limits for immigration agents, such as judicial warrants to enter homes, no masks, and body cameras.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "News4Jax (AP): What Democrats are demanding in the fight over ICE funding", "url": "https://www.news4jax.com/news/politics/2026/02/04/what-democrats-are-demanding-in-the-fight-over-immigration-and-customs-enforcement-funding/", "date": "2026-02-04"}]}, "R": {"agreement": "agree", "note": "Republicans promise the largest deportation program in American history.", "summary": "The 2024 Republican platform promises the largest deportation program in American history, to finish the border wall, and to invoke the Alien Enemies Act against suspected gang members. The 2025 reconciliation law funded large increases in immigration enforcement and detention.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "News4Jax (AP): What Democrats are demanding in the fight over ICE funding", "url": "https://www.news4jax.com/news/politics/2026/02/04/what-democrats-are-demanding-in-the-fight-over-immigration-and-customs-enforcement-funding/", "date": "2026-02-04"}]}}, {"qid": "U8", "issue": "Policing and public disorder", "your_position": "Enforce minor and serious offenses consistently, with accountable policing and diversion", "D": {"agreement": "agree", "note": "Democrats back more accountable community policing plus violence intervention.", "summary": "The 2024 Democratic platform says to fund the police, not defund them. It backs 100,000 more officers for accountable community policing, $5 billion for community violence intervention, action against retail crime, and passage of the George Floyd Justice in Policing Act.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans favor a larger push on police presence and penalties, one step beyond your position.", "summary": "The 2024 Republican platform promises to replenish police departments, protect officers from lawsuits, and stand up to progressive prosecutors. In August 2025 President Trump declared a crime emergency in Washington, D.C., took control of its police, deployed the National Guard, and ordered moves against cashless bail nationwide.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Declaring a Crime Emergency in the District of Columbia", "url": "https://www.whitehouse.gov/presidential-actions/2025/08/declaring-a-crime-emergency-in-the-district-of-columbia/", "date": "2025-08-11"}, {"title": "NPR: Trump signs executive orders focused on law and order in Washington, D.C.", "url": "https://npr.org/2025/08/26/nx-s1-5515695/trump-signs-executive-orders-focused-on-law-and-order-in-washington-d-c", "date": "2025-08-26"}]}}, {"qid": "U9", "issue": "Sentencing and incarceration", "your_position": "Distinguish among offense categories; elsewhere you said it depends on the crime, age, and motive", "D": {"agreement": "partial", "note": "Democrats also separate offenses, easing sentences for nonviolent crime and keeping them strong for violent crime.", "summary": "The 2024 Democratic platform supports rehabilitation and reentry, says no one should be jailed for marijuana possession, highlights Biden's commutations for nonviolent drug offenses, and pledges to end private prisons. It also funds more police and prosecutors for violent crime.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans favor tougher penalties and wider use of the death penalty.", "summary": "The 2024 Republican platform promises to lock up violent offenders and crush gang violence. Executive Order 14164 (January 2025) directs the Attorney General to seek the death penalty in all appropriate federal cases and lifts the prior moratorium.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Executive Order 14164, Restoring the Death Penalty and Protecting Public Safety", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/restoring-the-death-penalty-and-protecting-public-safety/", "date": "2025-01-20"}]}}, {"qid": "U10", "issue": "Drugs and addiction", "your_position": "A differentiated system, such as mandatory treatment or substance-specific rules", "D": {"agreement": "partial", "note": "Democrats also treat substances differently, easing on marijuana while keeping penalties for trafficking.", "summary": "The 2024 Democratic platform says no one should be in jail for using or possessing marijuana and pledges to expunge federal marijuana convictions. It backs drug courts, diversion, and treatment for substance use disorders while fighting fentanyl trafficking.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans favor broad prohibition and enforcement, though the party is split on cannabis.", "summary": "The 2024 Republican platform focuses on enforcement: a naval blockade against fentanyl, dismantling cartels, and drug-free schools. In December 2025, however, President Trump ordered the Attorney General to speed the move of marijuana from Schedule I to Schedule III for medical research, while saying this does not legalize it.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Increasing Medical Marijuana and Cannabidiol Research (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/12/increasing-medical-marijuana-and-cannabidiol-research/", "date": "2025-12-18"}, {"title": "Deseret News: Trump moves to reschedule marijuana", "url": "https://www.deseret.com/politics/2025/12/18/trump-reschedules-marijuana-drug-medical-use", "date": "2025-12-18"}]}}, {"qid": "U11", "issue": "Energy and electricity", "your_position": "Another mix of technologies or policy tools", "D": {"agreement": "disagree", "note": "Democrats favor a rapid shift to clean energy, which you did not pick.", "summary": "The 2024 Democratic platform calls the Biden record the most aggressive climate agenda in history, backs net-zero emissions by 2050, and credits the Inflation Reduction Act's clean energy tax credits. It also points to record domestic energy production and pledges to cut oil and gas subsidies.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans favor fossil fuels and energy dominance, which you did not pick.", "summary": "The 2024 Republican platform promises to drill, end restrictions on oil, gas, and coal, and make America energy dominant, while unleashing all sources including nuclear. In 2025 the president declared a national energy emergency, and the reconciliation law ended wind and solar tax credits for most projects placed in service after 2027 while keeping nuclear and other credits.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Declaring a National Energy Emergency", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/declaring-a-national-energy-emergency/", "date": "2025-01-20"}, {"title": "White House: Unleashing American Energy (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/unleashing-american-energy/", "date": "2025-01-20"}, {"title": "Pierce Atwood: Congress phases out energy tax credits", "url": "https://www.pierceatwood.com/alerts/congress-phases-out-energy-tax-credits", "date": "2025-07"}, {"title": "White House: Reinvigorating the Nuclear Industrial Base (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/05/reinvigorating-the-nuclear-industrial-base/", "date": "2025-05-23"}]}}, {"qid": "U12", "issue": "Environmental review and permitting", "your_position": "Different standards for different types of projects", "D": {"agreement": "disagree", "note": "Democrats favor moderate streamlining for all projects while keeping legal challenges.", "summary": "The 2024 Democratic platform pledges to improve and speed up environmental review and clean energy permitting and to build more transmission. It does not propose limiting legal challenges.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "E&E News: House approves permitting bill after tumultuous week", "url": "https://www.eenews.net/articles/house-approves-permitting-bill-after-tumultuous-week/", "date": "2025-12-18"}]}, "R": {"agreement": "disagree", "note": "Republicans favor broad streamlining and limits on judicial review.", "summary": "The 2024 Republican platform promises to streamline permitting. In December 2025 House Republicans passed the SPEED Act, which sets tighter deadlines, exempts some projects from review, and restricts judicial review under the National Environmental Policy Act.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "E&E News: House approves permitting bill after tumultuous week", "url": "https://www.eenews.net/articles/house-approves-permitting-bill-after-tumultuous-week/", "date": "2025-12-18"}]}}, {"qid": "U13", "issue": "K-12 education and school choice", "your_position": "Improve traditional public schools, with charters in a limited role", "D": {"agreement": "agree", "note": "Democrats focus on public school funding and oppose private vouchers.", "summary": "The 2024 Democratic platform focuses on public schools: more Title I funding, community schools, tutoring, and universal preschool. It does not mention charter schools or vouchers. In April 2026 Senate Democrats introduced a bill to repeal the federal scholarship tax credit created by the 2025 reconciliation law.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Ballotpedia News: Senate Democrats introduce bill to repeal federal education tax credit scholarship", "url": "https://news.ballotpedia.org/2026/04/24/senate-democrats-introduce-bill-to-repeal-federal-education-tax-credit-scholarship/", "date": "2026-04-24"}]}, "R": {"agreement": "disagree", "note": "Republicans support universal school choice and closing the Education Department.", "summary": "The 2024 Republican platform supports universal school choice in every state, ending teacher tenure, and closing the federal Department of Education. The 2025 reconciliation law created the first federal tax credit, up to $1,700 per taxpayer, for donations to private school scholarship groups in states that opt in, and a March 2025 executive order directed steps to close the Education Department.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Ballotpedia News: Budget reconciliation bill enacts first federal private school choice program", "url": "https://news.ballotpedia.org/2025/07/10/budget-reconciliation-bill-enacts-first-federal-private-school-choice-program/", "date": "2025-07-10"}, {"title": "White House: Executive Order 14242, Improving Education Outcomes by Empowering Parents, States, and Communities", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/improving-education-outcomes-by-empowering-parents-states-and-communities/", "date": "2025-03-20"}]}}, {"qid": "U14", "issue": "College affordability", "your_position": "Another model, such as graduate-tax financing or vocational alternatives", "D": {"agreement": "disagree", "note": "Democrats want more Pell Grants, free community college, and debt relief.", "summary": "The 2024 Democratic platform pledges to double the maximum Pell Grant by 2029, expand free community college, and keep pursuing student debt relief through every available tool after the Supreme Court blocked broad cancellation.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans cut federal lending but also stress cheaper alternatives to four-year degrees.", "summary": "The 2024 Republican platform promises to drive down tuition and support cheaper alternatives to four-year degrees. The 2025 reconciliation law ends Grad PLUS loans for new borrowers, caps Parent PLUS loans, replaces income-driven plans with a new Repayment Assistance Plan, and a 2025 executive order began closing the Education Department.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "AACRAO: A complete overhaul to the federal financial aid system", "url": "https://www.aacrao.org/news/a-complete-overhaul-to-the-federal-financial-aid-system/", "date": "2025"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "White House: Executive Order 14242, Improving Education Outcomes by Empowering Parents, States, and Communities", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/improving-education-outcomes-by-empowering-parents-states-and-communities/", "date": "2025-03-20"}]}}, {"qid": "U15", "issue": "Industrial policy", "your_position": "Targeted subsidies for strategic sectors, with performance requirements", "D": {"agreement": "agree", "note": "Democrats back targeted programs like the CHIPS Act and targeted tariffs.", "summary": "The 2024 Democratic platform credits the CHIPS and Science Act and the Inflation Reduction Act with bringing home semiconductor and clean energy manufacturing and creating about 800,000 factory jobs. It favors targeted tariffs on Chinese goods over broad tariffs on allies.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "CBS News: Senate approves Democratic resolution to block Trump's tariffs on Canada", "url": "https://www.cbsnews.com/news/senate-trump-tariffs-canada", "date": "2025-10-29"}]}, "R": {"agreement": "partial", "note": "Republicans also back industrial policy but through broad tariffs, one step beyond your position.", "summary": "The 2024 Republican platform calls for baseline tariffs on foreign goods, Buy American rules, and making the US a manufacturing superpower. The administration imposed broad tariffs, took a 9.9 percent government stake in Intel in August 2025 by converting CHIPS Act grants, and after the Supreme Court struck down its emergency tariffs in February 2026 replaced them under other trade laws.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Al Jazeera: Trump says US to take 10 percent stake in Intel", "url": "https://www.aljazeera.com/economy/2025/8/22/trump-says-us-to-take-10-percent-stake-in-intel", "date": "2025-08-22"}, {"title": "Jones Day: United States Supreme Court invalidates IEEPA tariffs", "url": "https://www.jonesday.com/de/insights/2026/02/united-states-supreme-court-invalidates-ieepa-tariffs", "date": "2026-02"}, {"title": "Covington: IEEPA tariffs terminated, replacement Section 122 tariffs take effect", "url": "https://www.cov.com/en/news-and-insights/insights/2026/02/ieepa-tariffs-terminated-replacement-section-122-tariffs-take-effect", "date": "2026-02"}, {"title": "CBS News: Senate approves Democratic resolution to block Trump's tariffs on Canada", "url": "https://www.cbsnews.com/news/senate-trump-tariffs-canada", "date": "2025-10-29"}]}}, {"qid": "U16", "issue": "Abortion", "your_position": "Protect abortion access nationally throughout pregnancy, subject to medical regulation", "D": {"agreement": "partial", "note": "Democrats would protect access nationally through fetal viability, one step short of your position.", "summary": "The 2024 Democratic platform pledges that a Democratic Congress will pass national legislation to make Roe the law of the land again, which protected abortion until fetal viability. It also pledges to repeal the Hyde Amendment and protect IVF and contraception.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans leave abortion to the states and oppose late-term abortion.", "summary": "The 2024 Republican platform says the power to regulate abortion now rests with the states and a vote of the people. It opposes late-term abortion while supporting access to birth control and IVF. The 2025 reconciliation law cut Medicaid funding to certain abortion providers for one year.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}]}}, {"qid": "U17", "issue": "Transgender policy", "your_position": "Between protecting adults with evidence-based rules for minors and more restrictive rules for minors", "D": {"agreement": "partial", "note": "Democrats favor broad federal protections, one step beyond the less restrictive end of your range.", "summary": "The 2024 Democratic platform pledges to pass the Equality Act, oppose state and federal bans on gender-affirming care, and ensure transgender students are treated fairly at school. It defends Biden's Title IX protections for gender identity.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Rep. Steube: Protection of Women and Girls in Sports Act passes House in bipartisan vote", "url": "https://steube.house.gov/press-releases/steubes-protection-of-women-and-girls-in-sports-act-passes-u-s-house-in-bipartisan-vote", "date": "2025-01-14"}]}, "R": {"agreement": "partial", "note": "Republicans favor rolling back protections, one step beyond the more restrictive end of your range.", "summary": "The 2024 Republican platform promises to keep men out of women's sports, ban taxpayer funding for sex change surgery, and stop schools from promoting gender transition. In 2025 executive orders defined sex as binary for federal policy, barred transgender girls and women from female school sports, and moved to restrict gender transition care for people under 19.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Defending Women from Gender Ideology Extremism and Restoring Biological Truth to the Federal Government", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/defending-women-from-gender-ideology-extremism-and-restoring-biological-truth-to-the-federal-government/", "date": "2025-01-20"}, {"title": "White House: Keeping Men Out of Women's Sports (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/02/keeping-men-out-of-womens-sports/", "date": "2025-02-05"}, {"title": "White House: Protecting Children from Chemical and Surgical Mutilation (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/protecting-children-from-chemical-and-surgical-mutilation/", "date": "2025-01-28"}, {"title": "Rep. Steube: Protection of Women and Girls in Sports Act passes House in bipartisan vote", "url": "https://steube.house.gov/press-releases/steubes-protection-of-women-and-girls-in-sports-act-passes-u-s-house-in-bipartisan-vote", "date": "2025-01-14"}]}}, {"qid": "U18", "issue": "Voting and elections", "your_position": "Broadly accessible voting with standardized ID and safeguards", "D": {"agreement": "partial", "note": "Democrats share your focus on access but oppose new ID and citizenship proof rules.", "summary": "The 2024 Democratic platform pledges to pass the John Lewis Voting Rights Advancement Act and the Freedom to Vote Act to secure access to the ballot. Democrats opposed the 2025 SAVE Act, saying proof-of-citizenship rules would block eligible voters, and Senate leader Chuck Schumer called it dead on arrival.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "CBS News: SAVE Act passes House, with 4 Democrats backing bill", "url": "https://www.cbsnews.com/news/house-passes-save-act-proof-of-citizenship-voter-registration-federal-elections", "date": "2025-04-10"}]}, "R": {"agreement": "partial", "note": "Republicans share your support for ID but want stricter rules, including limits on mail voting.", "summary": "The 2024 Republican platform calls for voter ID, paper ballots, proof of citizenship, and voting on a single day. A March 2025 executive order sought documentary proof of citizenship to register, and the House passed the SAVE Act requiring it in April 2025.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Preserving and Protecting the Integrity of American Elections (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/preserving-and-protecting-the-integrity-of-american-elections/", "date": "2025-03-25"}, {"title": "CBS News: SAVE Act passes House, with 4 Democrats backing bill", "url": "https://www.cbsnews.com/news/house-passes-save-act-proof-of-citizenship-voter-registration-federal-elections", "date": "2025-04-10"}]}}, {"qid": "U19", "issue": "Civil service reform", "your_position": "Stronger performance management while keeping protections against politicization", "D": {"agreement": "partial", "note": "Democrats share your concern about politicization but focus on preserving protections.", "summary": "The 2024 Democratic platform warns against plans to fire nonpolitical civil servants and replace them with loyalists. It supports public sector bargaining rights through the Public Service Freedom to Negotiate Act.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans share your focus on performance but have removed firing protections for policy roles.", "summary": "The 2024 Republican platform promises to fire corrupt employees and end weaponized government. In 2025 an executive order created a new job category, now Schedule Policy/Career, that removes firing protections for policy roles, finalized by OPM in February 2026. About 317,000 employees left federal service in 2025 under the workforce reduction effort.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Restoring Accountability to Policy-Influencing Positions Within the Federal Workforce", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/restoring-accountability-to-policy-influencing-positions-within-the-federal-workforce/", "date": "2025-01-20"}, {"title": "OPM: OPM finalizes Schedule Policy/Career rule to strengthen accountability", "url": "https://www.opm.gov/news/news-releases/opm-finalizes-schedule-policycareer-rule-to-strengthen-accountability/", "date": "2026-02-05"}, {"title": "White House: Implementing the President's DOGE Workforce Optimization Initiative", "url": "https://www.whitehouse.gov/presidential-actions/2025/02/implementing-the-presidents-department-of-government-efficiency-workforce-optimization-initiative/", "date": "2025-02-11"}, {"title": "Transport Topics (AP): Federal workforce down 317,000", "url": "https://www.ttnews.com/article/federal-workforce-down-317000", "date": "2026-01"}]}}, {"qid": "U20", "issue": "Social Security and Medicare", "your_position": "Treat Social Security and Medicare separately or take another approach", "D": {"agreement": "disagree", "note": "Democrats want higher taxes on the wealthy to preserve and expand benefits.", "summary": "The 2024 Democratic platform rejects any cut to Social Security or Medicare benefits and any privatization. It pledges to expand Social Security benefits and keep Medicare solvent by having the wealthiest Americans pay more.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "The party file places Republicans on the same catch-all option because no listed option fits them, so the match may not reflect shared views.", "summary": "The 2024 Republican platform promises no cuts to Social Security or Medicare and no change to the retirement age. It says growth, lower inflation, and border security will keep the programs solvent. It does not propose new revenue.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}]}}, {"qid": "U21", "issue": "Defense spending", "your_position": "Maintain a large, globally capable military with selective reforms", "D": {"agreement": "agree", "note": "Democrats pledge continued investment without a large budget increase.", "summary": "The 2024 Democratic platform calls the US military the finest in history and pledges to keep investing in next-generation weapons, the submarine force, and the nuclear triad. It does not call for a large budget increase.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans want a large defense increase, one step beyond your position.", "summary": "The 2024 Republican platform promises to build a military bigger, better, and stronger than ever, including an Iron Dome missile shield. In 2026 President Trump requested about $1.5 trillion for defense in fiscal 2027, a rise of roughly 40 percent, partly through a planned reconciliation bill.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "DefenseScoop: Trump calls for $1.5 trillion defense budget in 2027", "url": "https://defensescoop.com/2026/01/07/trump-calls-for-1-5-trillion-defense-budget-2027/", "date": "2026-01-07"}, {"title": "Breaking Defense: Trump to propose $1.5 trillion defense budget, banking on $350 billion from reconciliation", "url": "https://breakingdefense.com/2026/04/trump-to-propose-1-5-trillion-defense-budget-banking-on-350-billion-from-reconciliation/", "date": "2026-04"}]}}, {"qid": "U22", "issue": "NATO and alliances", "your_position": "Treat each alliance and region differently", "D": {"agreement": "disagree", "note": "Democrats favor strong US commitments across alliances like NATO.", "summary": "The 2024 Democratic platform says NATO is stronger and more united than ever under Biden, welcomes Finland and Sweden, and treats the 2 percent of GDP spending goal as a floor.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans favor keeping alliances while demanding much higher allied spending across the board.", "summary": "The 2024 Republican platform says it will strengthen alliances by ensuring allies meet their obligations to invest in common defense. At the June 2025 Hague summit, under US pressure, NATO allies pledged to spend 5 percent of GDP on defense and security by 2035.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "NATO: The Hague Summit Declaration", "url": "https://www.nato.int/cps/en/natohq/official_texts_236705.htm", "date": "2025-06-25"}, {"title": "Defense News: NATO allies agree to boost defense spending to 5% at The Hague summit", "url": "https://www.defensenews.com/global/europe/2025/06/25/nato-allies-agree-to-boost-defense-spending-to-5-at-the-hague-summit/", "date": "2025-06-25"}]}}, {"qid": "U23", "issue": "China and trade", "your_position": "Strong limits on strategic technology, while keeping significant ordinary trade", "D": {"agreement": "agree", "note": "Democrats favor focused technology restrictions without decoupling.", "summary": "The 2024 Democratic platform says the US should de-risk and diversify its economic relationship with China, not decouple. It favors a small yard and high fence of focused technology restrictions, plus targeted tariffs on items like steel, chips, electric vehicles, and solar cells.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans lean toward decoupling, one step beyond your position, though they have traded tariff relief for concessions.", "summary": "The 2024 Republican platform calls for revoking China's most favored nation trade status, phasing out imports of essential goods, and blocking Chinese purchases of US real estate and industries. The administration raised tariffs on China sharply in 2025, then cut them in an October 2025 truce in exchange for Chinese action on fentanyl and rare earths.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Kitco (Reuters): Trump shaves China tariffs in deal with Xi on fentanyl, rare earths", "url": "https://www.kitco.com/news/off-the-wire/2025-10-30/trump-shaves-china-tariffs-deal-xi-fentanyl-rare-earths", "date": "2025-10-30"}, {"title": "Jones Day: United States Supreme Court invalidates IEEPA tariffs", "url": "https://www.jonesday.com/de/insights/2026/02/united-states-supreme-court-invalidates-ieepa-tariffs", "date": "2026-02"}]}}, {"qid": "U24", "issue": "Military aid in foreign conflicts", "your_position": "Decide based on the circumstances of each conflict", "D": {"agreement": "disagree", "note": "Democrats favor substantial aid to countries defending their sovereignty, such as Ukraine.", "summary": "The 2024 Democratic platform backs giving Ukraine the weapons and economic support it needs to defend its sovereignty. In June 2026 House Democrats, joined by 18 Republicans, used a discharge petition to pass a Ukraine aid and Russia sanctions bill led by Rep. Gregory Meeks.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Arab News (AP): US House passes bill to aid Ukraine and impose new sanctions on Russia", "url": "https://www.arabnews.pk/node/2646049/world", "date": "2026-06-05"}, {"title": "WTOP (AP): Senate passes sweeping Russia sanctions bill negotiated by the late Sen. Lindsey Graham", "url": "https://wtop.com/news/2026/08/senate-passes-sweeping-russia-sanctions-bill-negotiated-by-the-late-sen-lindsey-graham-2/", "date": "2026-08-07"}]}, "R": {"agreement": "disagree", "note": "Republicans are split between limited allied-funded aid and broader aid, both as general policies.", "summary": "The 2024 Republican platform promises to prevent World War III and restore peace in Europe, and says force should be used only where national interests are clearly threatened. Since 2025 the administration has not sought new Ukraine aid funding, and US weapons reach Ukraine mainly through sales paid for by NATO allies. A pro-Ukraine wing pushed aid and sanctions bills through Congress in 2026 over leadership objections.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Arab News (AP): US House passes bill to aid Ukraine and impose new sanctions on Russia", "url": "https://www.arabnews.pk/node/2646049/world", "date": "2026-06-05"}, {"title": "WTOP (AP): Senate passes sweeping Russia sanctions bill negotiated by the late Sen. Lindsey Graham", "url": "https://wtop.com/news/2026/08/senate-passes-sweeping-russia-sanctions-bill-negotiated-by-the-late-sen-lindsey-graham-2/", "date": "2026-08-07"}]}}, {"qid": "U25", "issue": "Domestic surveillance", "your_position": "Distinguish metadata, content, foreign intelligence, and domestic investigations", "D": {"agreement": "disagree", "note": "Democrats are split between renewing current authority and requiring warrants, neither of which draws your distinctions.", "summary": "The 2024 Democratic platform does not address foreign intelligence surveillance. In April 2026, 42 House Democrats voted for a three-year renewal of Section 702 without a warrant requirement, while most Democrats opposed it. Democrats then withheld votes for an extension in June 2026, partly over the choice of acting intelligence director, and the authority lapsed on June 12, 2026.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Nextgov: House readies vote to renew FISA 702 without a warrant amendment", "url": "https://www.nextgov.com/policy/2026/04/house-readies-vote-renew-fisa-702-without-a-warrant-amendment/412856/", "date": "2026-04"}, {"title": "NPR: A key U.S. spy tool has lapsed. Now what?", "url": "https://www.npr.org/2026/06/12/nx-s1-5856291/fisa-702-surveillance-expiration-bill-pulte", "date": "2026-06-12"}, {"title": "CRS Legal Sidebar LSB11444: The Impact of FISA Section 702's Repeal", "url": "https://www.everycrsreport.com/files/2026-06-22_LSB11444_d51e458f8ceedeadf0646bd8cf94b229944adbff.pdf", "date": "2026-06-22"}]}, "R": {"agreement": "disagree", "note": "Republicans are split between renewing current authority and requiring warrants, neither of which draws your distinctions.", "summary": "The 2024 Republican platform calls for banning government collusion to censor speech but does not address Section 702. House Republican leaders brought a three-year renewal without a warrant requirement to the floor in April 2026, and it passed 235 to 191 with 22 Republicans voting no. Congress did not renew it before it lapsed on June 12, 2026.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Nextgov: House readies vote to renew FISA 702 without a warrant amendment", "url": "https://www.nextgov.com/policy/2026/04/house-readies-vote-renew-fisa-702-without-a-warrant-amendment/412856/", "date": "2026-04"}, {"title": "NPR: A key U.S. spy tool has lapsed. Now what?", "url": "https://www.npr.org/2026/06/12/nx-s1-5856291/fisa-702-surveillance-expiration-bill-pulte", "date": "2026-06-12"}, {"title": "CRS Legal Sidebar LSB11444: The Impact of FISA Section 702's Repeal", "url": "https://www.everycrsreport.com/files/2026-06-22_LSB11444_d51e458f8ceedeadf0646bd8cf94b229944adbff.pdf", "date": "2026-06-22"}]}}], "party_as_of": "2026-10-30"}, "profile": {"material_note": "This profile rests mainly on your 60 multiple-choice picks and the options you passed over, plus six short explanations totaling 51 words, so it says little about your background.", "sections": [{"title": "Education and intellectual life", "strong": [{"claim": "Your written explanations use everyday language. They contain no references to authors, theories, studies, or technical terms.", "evidence": ["P34", "P35", "U4", "U5", "U7", "U17"], "quote": "Depends on what type of crime and criminal’s age and motive etc"}], "speculative": [{"claim": "Economics and regulatory law are probably not your field of study. You said so directly about antitrust policy.", "evidence": ["U4"]}]}, {"title": "Work and life stage", "strong": [], "speculative": [{"claim": "You probably live in the United States. You wrote about \"America  "evidence": ["U9", "U10", "U12", "U20", "U25"]}, {"claim": "You ask whether a policy will actually work before backing it. You support redistribution only if benefits are shown to outweigh costs, and you doubt foreign pressure or aid that lacks clear prospects of success.", "evidence": ["P6", "P25", "P35"]}, {"claim": "You hold two foundations for rights at once. You named natural rights, which exist independently of government, as the deepest basis for rights. Yet on secret surveillance you said consequences ultimately decide.", "evidence": ["P17", "P11"]}], "speculative": []}, {"title": "What you care about", "strong": [{"claim": "You want a guaranteed floor for people who are struggling. You back a decent public minimum, worry that excessive inequality threatens opportunity, and made the vulnerable your stated priority on healthcare.", "evidence": ["U5", "P23", "P2", "P5"], "quote": "Key on helping vulnerable populations"}, {"claim": "You want markets as the default, kept competitive. You favor private provision with government fixing specific failures, and you support stronger antitrust and limits on concentrated corporate power.", "evidence": ["P7", "P29", "P31", "U4", "P27"]}, {"claim": "You believe a government owes most to its own citizens. You put citizens first on immigration and foreign spending, and you value a shared national culture alongside civic principles.", "evidence": ["P15", "P20", "U6", "U7", "P22"]}, {"claim": "You protect personal and political freedom from majority pressure. You defend offensive speech, peaceful protest, minority ways of life, and abortion access, allowing only narrow limits.", "evidence": ["P28", "P30", "P13", "P19", "U16"]}], "speculative": []}], "summary_portrait": "You weigh each case on its own facts and are quick to say when none of the offered answers fits. You state what you do not know and where you are torn. You want competitive markets, a real safety net for the vulnerable, a government that puts its own citizens first, and strong protection for speech and personal choice. You ask whether a policy will actually work before you sign on."}, "evidence": {"P1": {"title": "What is the primary purpose of government?", "prompt": "What is the primary purpose of government?", "answer": "A combination or different principle", "explanation": "", "importance": 4}, "P2": {"title": "How do you view economic inequality?", "prompt": "How do you view economic inequality?", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "", "importance": null}, "P3": {"title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "prompt": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null}, "P4": {"title": "How should society approach longstanding traditions and institutions?", "prompt": "How should society approach longstanding traditions and institutions?", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "", "importance": null}, "P5": {"title": "Which statement best captures your conception of justice?", "prompt": "Which statement best captures your conception of justice?", "answer": "Everyone having genuinely equal opportunities to succeed", "explanation": "", "importance": null}, "P6": {"title": "Redistribution and taxation", "prompt": "Would you support significantly higher taxation and redistribution?", "answer": "Yes, provided benefits demonstrably outweigh economic costs", "explanation": "", "importance": null}, "P7": {"title": "Markets versus government", "prompt": "Which broad approach do you favor?", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "", "importance": null}, "P8": {"title": "Individual liberty and paternalism", "prompt": "Should the government restrict it?", "answer": "Generally no, but some narrowly tailored restrictions are acceptable", "explanation": "", "importance": null}, "P9": {"title": "Democracy versus expertise", "prompt": "What should happen?", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "", "importance": null}, "P10": {"title": "Equality of opportunity versus equality of outcomes", "prompt": "What does justice require next?", "answer": "Focus on protecting equal rights and fair rules; unequal outcomes aren't intrinsically unjust", "explanation": "", "importance": null}, "P11": {"title": "Are individual rights inviolable?", "prompt": "Would this be morally permissible?", "answer": "Possibly. Privacy is a powerful presumption, but the consequences ultimately determine permissibility.", "explanation": "", "importance": null}, "P12": {"title": "Whose welfare matters most?", "prompt": "Which would you choose?", "answer": "Probably B, depending on the relative welfare gains.", "explanation": "", "importance": null}, "P13": {"title": "Cultural liberalism and social norms", "prompt": "What should the state's position be?", "answer": "Protect legal freedom, but allow communities considerable latitude to preserve their norms through voluntary institutions.", "explanation": "", "importance": null}, "P14": {"title": "Group disadvantage and individual fairness", "prompt": "How do you view this trade-off?", "answer": "I would use another framework.", "explanation": "", "importance": null}, "P15": {"title": "Immigration, national obligations, and universal welfare", "prompt": "Which principle would guide your decision?", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "", "importance": null}, "P16": {"title": "Do you give special moral weight to the worst-off?", "prompt": "Does the disadvantaged person's improvement have greater moral value?", "answer": "I reject a premise or have a different interpretation.", "explanation": "", "importance": null}, "P17": {"title": "What makes a right fundamental?", "prompt": "What is the deepest justification for giving certain rights special protection?", "answer": "Natural or inherent rights that exist independently of government.", "explanation": "", "importance": null}, "P18": {"title": "Can economic liberty be restricted for social welfare?", "prompt": "Is there a fundamental rights-based objection to this policy, even if its welfare benefits exceed its costs?", "answer": "Another distinction is essential.", "explanation": "", "importance": null}, "P19": {"title": "Democratic legitimacy versus constitutional rights", "prompt": "Should the court strike it down?", "answer": "Yes, although courts should ordinarily exercise considerable institutional restraint.", "explanation": "", "importance": null}, "P20": {"title": "Universal moral worth versus obligations to citizens", "prompt": "Which would you favor?", "answer": "Probably A. Governments have special obligations to citizens, even when the global welfare gains elsewhere are larger.", "explanation": "", "importance": null}, "P21": {"title": "Judicial power and democratic accountability", "prompt": "What is your preferred balance between judicial authority and democratic government?", "answer": "Another model or distinction", "explanation": "", "importance": null}, "P22": {"title": "Nationalism, patriotism, and political identity", "prompt": "What should hold a political community together?", "answer": "A substantive national culture and historical identity are important alongside civic principles", "explanation": "", "importance": null}, "P23": {"title": "The welfare state and positive rights", "prompt": "Which approach best captures your view?", "answer": "There is a strong public obligation to guarantee a decent minimum, though not every service is an absolute right", "explanation": "", "importance":
