<style>
/* Layout: one reading column. A portrait sheet up top sized for a screenshot,
   then numbered report sections, each finding expandable to its evidence. */
:root {
  --paper: #EEF1F4;
  --sheet: #FBFCFD;
  --ink: #15233F;
  --muted: #5A6578;
  --rule: #CDD4DD;
  --mark: #0E6E5C;
  --mark-soft: #E2F1EC;
  --warn: #A1450E;
  --warn-soft: #F7E9DE;
  --agree: #0E6E5C;
  --partial: #8A6A10;
  --disagree: #A1450E;
  --font-q: "Newsreader", Georgia, "Times New Roman", serif;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
    --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
    --agree: #4FC1A4; --partial: #D9B65A; --disagree: #F0965A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
  --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
  --agree: #4FC1A4; --partial: #D9B65A; --disagree: #F0965A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.wrap > *, section.s > * { min-width: 0; max-width: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
  display: flex; flex-direction: column; gap: 44px;
}
h1, h2, h3 { font-family: var(--font-q); font-weight: 500; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.code { font-family: var(--font-code); font-size: 12.5px; letter-spacing: 0.03em; }

/* Portrait sheet */
.portrait { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: clamp(22px, 5vw, 40px); display: flex; flex-direction: column; gap: 22px; }
.portrait .eyebrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); }
.portrait h1 { font-size: clamp(34px, 7.5vw, 54px); line-height: 1.04; letter-spacing: -0.02em; }
.portrait .tagline { font-family: var(--font-q); font-size: clamp(19px, 3.4vw, 22px); line-height: 1.45; font-style: italic; max-width: 40ch; }
.portrait .summary { max-width: 64ch; }
.traits { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; border-top: 1px solid var(--rule); padding-top: 18px; }
.traits .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.traits .t b { font-size: 14.5px; }
.traits .t span { font-size: 14px; color: var(--muted); line-height: 1.5; }
.positions { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.positions div { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.positions b { display: block; font-size: 14.5px; }
.positions span { font-size: 13.5px; color: var(--muted); line-height: 1.45; display: block; }
.headline { background: var(--warn-soft); border-radius: 5px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.headline .k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); }
.headline b { font-size: 15.5px; }
.headline span { font-size: 14.5px; }

/* Sections */
section.s { display: flex; flex-direction: column; gap: 18px; }
.s-head { display: flex; gap: 14px; align-items: baseline; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; }
.s-head .n { font-family: var(--font-code); color: var(--mark); font-size: 14px; }
.s-head h2 { font-size: clamp(24px, 4.6vw, 30px); }
.intro { color: var(--muted); max-width: 64ch; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
nav.toc a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
nav.toc a:hover { color: var(--ink); border-color: var(--ink); }

/* Findings */
.finding { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.finding h3 { font-size: 21px; line-height: 1.3; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.chip.stands { color: var(--warn); border-color: var(--warn); background: transparent; }
.chip.reconciled { color: var(--mark); border-color: var(--mark); background: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
dl.fields { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 8px 16px; margin: 0; font-size: 14.5px; }
dl.fields dt { color: var(--muted); font-weight: 600; }
dl.fields dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { dl.fields { grid-template-columns: 1fr; gap: 2px; } dl.fields dd { margin-bottom: 8px; } }

/* Evidence */
details.ev { font-size: 14px; }
details.ev summary { cursor: pointer; color: var(--muted); list-style: none; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary::before { content: "+"; font-family: var(--font-code); width: 14px; }
details.ev[open] summary::before { content: "−"; }
details.ev summary .qid { font-family: var(--font-code); font-size: 12px; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink); }
.ev-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--rule); }
.ev-item { display: flex; flex-direction: column; gap: 2px; }
.ev-item .q { font-weight: 600; }
.ev-item .a { color: var(--mark); }
.ev-item .x { font-family: var(--font-q); font-size: 15.5px; color: var(--muted); font-style: italic; white-space: pre-line; }

/* Spectrum */
.axes { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.axis { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.axis:last-child { border-bottom: none; }
.axis .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.axis .top b { font-size: 15px; }
.axis .top span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { position: relative; height: 22px; }
.track .line { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule); }
.track .tick { position: absolute; top: 5px; width: 1px; height: 12px; background: var(--rule); }
.track .tick.mid { background: var(--muted); }
.track .dot { position: absolute; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--ink); border: 3px solid var(--sheet); box-shadow: 0 0 0 1.5px var(--ink); }
.ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); gap: 12px; }
.ends span:last-child { text-align: right; }

/* Party table */
.table-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
th { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td .ag { font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.ag.agree { color: var(--agree); } .ag.partial { color: var(--partial); } .ag.disagree { color: var(--disagree); } .ag.unclear { color: var(--muted); }
td .note { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; }
td details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
td details p { font-size: 13px; margin-top: 4px; }
td details a { color: var(--mark); font-size: 12.5px; word-break: break-word; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.profile-portrait { font-family: var(--font-q); font-size: 20px; line-height: 1.55; max-width: 60ch; }
.sublist { display: flex; flex-direction: column; gap: 14px; }
.obs { display: flex; flex-direction: column; gap: 4px; padding-left: 14px; border-left: 2px solid var(--mark); }
.obs.spec { border-left-style: dashed; border-left-color: var(--muted); }
.obs blockquote { margin: 0; font-family: var(--font-q); font-style: italic; color: var(--muted); }
.label-sm { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
ul.qs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-family: var(--font-q); font-size: 17px; }

/* Corrections */
.fix { align-self: flex-start; background: none; border: none; padding: 2px 0; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.fix-box { display: flex; flex-direction: column; gap: 8px; }
.fix-box textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px; min-height: 70px; resize: vertical; }
.tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--sheet);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 14.5px; z-index: 5; }
.tray button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--sheet); background: var(--sheet); color: var(--ink); cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
.portrait-top { display: flex; flex-direction: column; gap: 22px; }
.portrait-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.axis .bar-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
/* Wide screens: use the width for side-by-side layouts, keep text lines readable. */
.intro, .portrait .summary, .finding p, dl.fields dd { max-width: 70ch; }
.cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 900px) {
  .portrait { padding: 48px 56px; }
  .portrait-top { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: start; }
  .portrait-top .traits { grid-template-columns: 1fr; border-top: none; padding-top: 0; }
  .positions { grid-template-columns: repeat(4, 1fr); }
  .cards { grid-template-columns: 1fr 1fr; }
  .axis { display: grid; grid-template-columns: 210px 1fr; gap: 6px 28px; align-items: center; }
  .axis .top { flex-direction: column; gap: 0; }
  .axis .bar-wrap { display: flex; flex-direction: column; gap: 4px; }
  .axis details.ev { grid-column: 2; }
}

/* Collapsible cards: the summary is the headline, the body holds the reasoning */
details.x > summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
details.x > summary::-webkit-details-marker { display: none; }
details.x > summary .more { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
details.x > summary .more::before { content: "+"; font-family: var(--font-code); }
details.x[open] > summary .more::before { content: "−"; }
details.x[open] > summary .more span::after { content: "Hide details"; }
details.x:not([open]) > summary .more span::after { content: "Show details"; }
details.x > .body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; margin-top: 2px; border-top: 1px dashed var(--rule); }
.lead { font-size: 15px; }
.toolbar { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.thinkers { display: flex; flex-direction: column; gap: 8px; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
</style>

ce and your healthcare stance cannot both be fully funded by the tax policy you chose.", "what_would_resolve": "A financing plan for single-payer that shows how premiums convert to federal revenue without raising the deficit or requiring tax increases larger than you endorsed.", "status": "stands"}, {"id": "t4", "category": "unusual", "title": "Legal hard drugs with firm enforcement of public order", "detail": "You support legalizing most drugs, including hard drugs, which places you at the most permissive end on drug policy. You also chose to prioritize punishment and public order in P34 and to consistently enforce minor offenses like public drug use and transit disorder in U8, saying Democrats \"have been too soft on crime.\" These views are compatible, since legal products can still be banned in public, but they are rarely held together.", "evidence": ["U10", "P34", "U8"], "why_it_matters": "This combination separates you from both standard progressive and standard conservative positions on crime and drugs.", "what_would_resolve": "Spelling out which drug-related conduct stays punishable once drugs are legal, such as public use or impaired behavior.", "status": "stands"}, {"id": "t7", "category": "unusual", "title": "Single-payer healthcare with market-based college financing", "detail": "On healthcare you take the most state-led option, single-payer, citing market failure and the value of a single public buyer. On college you take the most market-led option, significantly reducing federal lending and subsidies and relying on institutional competition and private financing. These are compatible if you see healthcare as a market failure and college subsidies as a cause of rising tuition, but few people hold both.", "evidence": ["U5", "P31", "U14"], "why_it_matters": "It shows your economic views follow a case-by-case judgment about where markets fail rather than a general preference for state or market.", "what_would_resolve": "Naming the feature that makes healthcare a market failure but makes college a case where federal money does more harm than good.", "status": "stands"}, {"id": "t5", "category": "empirical", "title": "Doubts about government competence versus single-payer replacement", "detail": "Across several answers you warn that regulation is a blunt instrument, that \"often the gov messes it up\" (P29), and that sweeping redesigns invite the overconfidence James C. Scott describes in Seeing Like a State (P4). You say incrementalism is often more effective. On healthcare you chose the most sweeping option, single-payer replacing most private insurance, over a public option, a regulated multipayer system, or building on the Affordable Care Act (U5). You do allow exceptions for things that are badly broken (P4), and your P31 explanation makes the case that healthcare is one: consolidation and regulatory capture produce results \"incommensurate with the massive costs.\" That shows the current market fails. It does not show that a full federal replacement would avoid the government failures you describe elsewhere, or why an incremental path like a public option would not be enough.", "evidence": ["P4", "P27", "P29", "U5", "P31", "P23"], "why_it_matters": "Your healthcare position assumes the federal government can run a large, complex system well, which your general view of government capacity questions.", "what_would_resolve": "Evidence that a single federal payer in the US would be administered competently, or an explanation of why healthcare is an exception to your general caution.", "status": "reconciled"}], "blind_spots": [{"title": "Single-payer is not held to your evidence test", "evidence": ["P23", "P26", "P31", "U5", "P29"], "assumption": "You assume a single public insurer in the US would resist the regulatory capture you blame for high costs, and would outperform universal systems that keep private insurers.", "why_it_matters": "Your support for replacing most private insurance with single-payer rests on this assumption, not on an entitlement to healthcare.", "what_would_resolve": "Comparisons of cost, access, wait times, and health outcomes between single-payer systems and regulated multipayer systems such as those in Germany, the Netherlands, or Switzerland.", "detail": "You say public provision should depend mainly on evidence of welfare gains (P23), and that regulation should be judged on benefits and harms with no presumption either way (P26). On healthcare you do give a welfare argument. You call it \"a great example of market failure\" and point to consolidation and regulatory capture (P31). You chose universal insurance because \"access and risk pooling justify the institutional change,\" not the option that made it conditional on evidence of better performance. In U5 you chose single-payer over a public option and over a regulated multipayer system (a universal system run through several competing insurers). Your argument shows the current system fails. It does not show that a single government buyer beats the other universal designs. Elsewhere you say \"often the gov messes it up\" (P29) and that officials are poorly placed to foresee the effects of regulation (P27). A single buyer controlling most health spending is an obvious target for the capture you describe, and you have not said why it would avoid it."}, {"title": "Fear of backlash applied to some issues only", "evidence": ["P4", "P7", "P15", "U10", "U16", "U17", "P32"], "assumption": "You assume your caution about sudden change mainly applies to immigration and economic policy, not to other areas where you chose the most far-reaching option available.", "why_it_matters": "You use backlash to justify moderate immigration and caution about sudden change, so the same reasoning could weigh against several of your other positions.", "what_would_resolve": "Polling and historical evidence on whether legalizing hard drugs, abortion access throughout pregnancy, broad gender-identity policies, and large foreign-aid spending produce political backlash comparable to rapid immigration.", "detail": "In P4 you give a general reason for caution: \"people and societies as a whole can have a negative reaction to just upturning the way things work,\" and you add that incrementalism is often more effective. You apply this to immigration, where open borders are bad policy partly because \"people hate it\" (P15). In several other answers you picked the most sweeping option on offer. In U10 you chose legalizing most drugs including hard drugs, over decriminalizing possession only. In U16 you chose abortion access throughout pregnancy, over access through viability. In U17 you chose broad access for minors, over context-specific rules. In P32 you chose overriding local zoning even against homeowners. You may judge each of these on the merits. You have not said why the backlash and downstream risks you warn about in P4 weigh less in these cases than in immigration."}, {"title": "Fentanyl worries you, yet you would legalize it", "evidence": ["P8", "U10", "P34"], "assumption": "You assume legal, regulated sale of highly addictive drugs plus treatment would reduce harm more than the restrictions you said such drugs might justify.", "why_it_matters": "Your drug policy answer depends on this, and it sits in tension with your own example of where personal liberty may need limits.", "what_would_resolve": "Evidence from places that have decriminalized or legalized hard drugs, such as Portugal and Oregon, on overdose deaths, addiction rates, and public disorder.", "detail": "In P8 you hesitate to treat adult freedom as absolute, and you give fentanyl as the reason: \"consider how addictive fentanyl is and how many people it kills.\" In U10 you chose to legalize and regulate most drugs, including hard drugs. You passed over options that keep penalties for the most dangerous drugs or set special rules for particular substances. Your choice may leave room to exclude fentanyl, since it says \"most\" drugs. But you have not said which drugs would stay illegal or why. You also have not said why legal sale with regulation would reduce deaths from a drug as addictive as your own example."}, {"title": "Untested claims behind opposing affirmative action", "evidence": ["P14", "P10", "P5", "P2"], "assumption": "You assume that early education and economic redistribution can correct structural disadvantage well enough that admissions do not need to.", "why_it_matters": "Your strict equal-treatment answer on admissions rests on these two claims, while elsewhere you support actively correcting structural disadvantage.", "what_would_resolve": "Research on graduation rates and later earnings of students admitted under preferences, and evidence on how much early education and redistribution actually close preparation gaps.", "detail": "You oppose admissions preferences for three reasons. Admitting underqualified students \"seems like youre setting them up for failure in a lot of cases.\" Preferences may undermine faith in fair institutions. And it \"feels unfair to deny more qualified people spots at this stage\" (P14). You say the right fix for structural disadvantage is upstream, through \"economic redistribution and earlier childhood education.\" You also say structural disadvantage should be corrected (P5), and you support actively reducing outcome gaps (P10). Your position therefore depends on upstream programs closing preparation gaps. You have not said how much they close those gaps, or what you would support at the admissions stage if they fall short."}], "open_questions": ["You say the urgency of inequality depends on how large it is. What level or kind of inequality would you call excessive, and what would you measure to decide?", "You say some Social Security and Medicare benefits will have to be phased out, and you give extra moral weight to the worst-off. Which benefits would you cut first, and who would bear that cost?", "You say shared institutions should be enough to hold a country together, but that in practice people need shared traditions and symbols. Should the state do anything to build those, and if so what?"], "affiliations": {"traditions": [{"name": "Rawlsian liberalism", "definition": "The view, from philosopher John Rawls, that equal basic liberties come first and that inequalities are fair only when they also benefit the least advantaged.", "overlap": "You give equal basic rights priority over welfare gains. You reject secret surveillance of innocent people even when it maximizes welfare, and you want courts to strike down a popular ban on criticizing the government. You also give extra moral weight to gains for the worst off, and you accept inequality as a reward for effort while warning that excessive inequality threatens opportunity.", "differences": "Rawls rejects deciding policy by adding up total welfare. You often describe policy that way, saying the state should optimize for \"greatest cumulative welfare\" and calling outcome equality \"a sort of technocratic/optimization problem\". You also tie public services to evidence of welfare gains rather than to an entitlement.", "evidence": ["P2", "P6", "P10", "P11", "P16", "P19", "P23", "P28"]}, {"name": "The abundance agenda", "definition": "A recent US policy school that argues housing, energy, and infrastructure are scarce because rules make building slow, and that government should clear the way to build much more.", "overlap": "You would override local zoning to allow substantial construction and call yourself \"def a YIMBY\". You want energy from nuclear, renewables, and fossil fuels with broad permitting reform, and you want to limit procedural ways to block projects. You also back targeted public investment in strategic industries.", "differences": "Abundance writers often call for building up government capacity to deliver projects. You are more doubtful that government can act well. You call regulation \"often a blunt instrument\" and say \"often the gov messes it up\".", "evidence": ["P32", "U11", "U12", "U15", "P27", "P29"]}, {"name": "Burkean conservatism, as a method", "definition": "The approach, from Edmund Burke, that society should change existing institutions gradually because sweeping redesigns tend to cause harms their planners did not foresee.", "overlap": "You warn about \"the hubris of experts\" and the danger of people thinking they can remake everything in a more rational way. You favor incremental change because sudden upheaval provokes backlash. You call yourself \"on the side of being careful and circumspect\".", "differences": "Burke valued tradition for its own sake. You say \"I dont really care about tradition intrinsically\" and judge institutions on their merits. You treat national identity as only instrumentally useful, and you reject state enforcement of community norms that are not law.", "evidence": ["P4", "P9", "P13", "P22", "P27"]}, {"name": "Foreign policy realism", "definition": "The school that holds a country's foreign policy should be guided by its strategic interests and likely consequences, more than by moral ideals.", "overlap": "You support aiding a threatened democracy only when the strategic outlook justifies the risk, and you favor targeted measures over broad confrontation with authoritarian governments. You would narrow the military around key threats, require allies to contribute more, and aid foreign conflicts only where US interests and a credible chance of success exist.", "differences": "You do not set morality aside. You say supporting democracies is morally good and call your foreign policy view a case \"where what I think is morally good diverges from what I think is best policy\". You also treat China as the central threat and want strong technology restrictions on it.", "evidence": ["P25", "P35", "U21", "U22", "U23", "U24"]}], "thinkers": [{"name": "James C. Scott", "why": "You cite his book Seeing Like a State twice to warn that experts and planners who try to remake society from above often cause great harm.", "cited_by_you": true, "evidence": ["P4", "P9"]}, {"name": "Immanuel Kant", "why": "You mention a \"vague kantian idea\" of justice, and you ground rights in the Kantian principle that people must never be treated merely as instruments, even to maximize welfare.", "cited_by_you": true, "evidence": ["P5", "P11", "P17"]}, {"name": "Amartya Sen", "why": "Like Sen, you measure welfare as human flourishing rather than income, and you stress that the same gain matters more to someone worse off.", "cited_by_you": false, "evidence": ["P12", "P16", "P17"]}, {"name": "Ezra Klein", "why": "Klein argues that zoning and permitting rules block housing and energy construction, which matches your YIMBY stance and your support for permitting reform.", "cited_by_you": false, "evidence": ["P32", "U11", "U12"]}], "party_summary": "You agree with Democrats on legal status for established unauthorized residents, policing, sentencing, transgender policy, targeted industrial subsidies, and China trade (U7, U8, U9, U15, U17, U23). You agree with Republicans on streamlining permits, cutting federal student lending, and pressing NATO allies to spend more (U12, U14, U22). You break from both parties on the minimum wage, drug legalization, and Social Security and Medicare reform (U3, U10, U20), and your single-payer healthcare view matches only a Democratic faction (U5).", "party_rows": [{"qid": "U1", "issue": "Federal taxation", "your_position": "Moderately raise taxes on high earners and capital income while preserving investment incentives.", "D": {"agreement": "partial", "note": "Democrats go further, with substantial increases on billionaires, capital gains, and corporations.", "summary": "The 2024 Democratic platform calls for a 25 percent minimum income tax on billionaires, taxing capital gains of millionaires at the same rate as wages, ending the stepped-up basis and carried interest loopholes, and raising the corporate rate from 21 to 28 percent. It pledges no tax increase for anyone earning under $400,000 and uses the revenue for families, health care, and child care.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans made the 2017 tax cuts permanent and seek further cuts.", "summary": "The 2024 Republican platform pledges to make the 2017 Trump tax cuts permanent, end taxes on tips, and pursue additional tax cuts. The 2025 reconciliation law (Public Law 119-21) made the 2017 individual rates permanent and added new deductions, which the Congressional Budget Office scores as a $4.5 trillion revenue reduction over ten years.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "CBO: Effects on Deficits and the Debt of Public Law 119-21", "url": "https://www.cbo.gov/publication/61466", "date": "2025"}]}}, {"qid": "U2", "issue": "Federal spending and deficits", "your_position": "Make deficit reduction a central priority through spending reforms and some revenue.", "D": {"agreement": "partial", "note": "Democrats pair tax increases with spending restraint but do not treat deficit reduction as a central goal.", "summary": "The 2024 Democratic platform pairs new investment in families, health care, and climate with higher taxes on the wealthy and corporations, and says this will reduce the deficit. It opposes adding to the debt for tax cuts. It does not propose broad spending cuts.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans' main enacted law raised projected deficits by about $3.4 trillion and added no revenue.", "summary": "The 2024 Republican platform promises to rein in wasteful federal spending and restore fiscal sanity. In practice, the 2025 reconciliation law adds about $3.4 trillion to deficits over 2025 to 2034 by Congressional Budget Office estimates, while cutting Medicaid and other spending. Congress also passed a $9 billion rescissions package in July 2025.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "CBO: Effects on Deficits and the Debt of Public Law 119-21", "url": "https://www.cbo.gov/publication/61466", "date": "2025"}, {"title": "ICAEW: Chart of the week, One Big Beautiful Bill Act 2025 (summarizes CBO estimate)", "url": "https://www.icaew.com/insights/viewpoints-on-the-news/2025/jul-2025/chart-of-the-week-one-big-beautiful-bill-act-2025", "date": "2025-07"}, {"title": "Rep. Tokuda: vote against Rescissions Act cuts to public broadcasting and foreign aid", "url": "https://tokuda.house.gov/media/in-the-news/tokuda-and-case-vote-against-cuts-to-public-broadcasting-foreign-aid", "date": "2025-07-21"}]}}, {"qid": "U3", "issue": "Minimum wage and labor markets", "your_position": "Use wage subsidies or a larger earned-income tax credit instead of the minimum wage as the main tool.", "D": {"agreement": "disagree", "note": "Democrats back raising the federal minimum to $15 or $17 an hour.", "summary": "The 2024 Democratic platform pledges to raise the federal minimum wage to at least $15 an hour. In April 2025 congressional Democrats reintroduced the Raise the Wage Act, which would lift the federal minimum to $17 by 2030 and then index it, with more than 140 House Democratic cosponsors.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Pelosi joins House Democrats introducing Raise the Wage Act of 2025", "url": "https://pelosi.house.gov/news/press-releases/pelosi-joins-house-democrats-introducing-bill-raise-minimum-wage", "date": "2025-04"}, {"title": "House Education and Workforce Democrats: Labor leaders introduce bill to raise minimum wage", "url": "https://democrats-edworkforce.house.gov/media/press-releases/labor-leaders-introduce-bill-to-raise-minimum-wage", "date": "2025-04-08"}]}, "R": {"agreement": "partial", "note": "Republicans keep the federal floor low, as you would, but take no position on wage subsidies.", "summary": "The 2024 Republican platform does not address the minimum wage. The federal floor has stayed at $7.25 under Republican control of Congress and the White House. Senator Josh Hawley, a Republican, introduced a bipartisan bill in June 2025 to raise it to $15 and index it, but he is described as a rare Republican on this issue.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Sen. Hawley: Hawley, Welch introduce legislation to increase federal minimum wage to $15", "url": "https://www.hawley.senate.gov/hawley-welch-introduce-legislation-to-increase-federal-minimum-wage-to-15-per-hour", "date": "2025-06-10"}, {"title": "Pelosi joins House Democrats introducing Raise the Wage Act of 2025", "url": "https://pelosi.house.gov/news/press-releases/pelosi-joins-house-democrats-introducing-bill-raise-minimum-wage", "date": "2025-04"}]}}, {"qid": "U4", "issue": "Business regulation and competition", "your_position": "Strengthen antitrust enforcement while simplifying burdensome regulations.", "D": {"agreement": "partial", "note": "Democrats match you on stronger antitrust but do not stress cutting regulations.", "summary": "The 2024 Democratic platform praises the Biden administration's increased antitrust enforcement by the Justice Department and Federal Trade Commission, its Competition Council, a ban on non-compete agreements, and a crackdown on junk fees. It pledges to keep using antitrust law against hospital, insurance, drug, and media mergers.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans match you on cutting regulations but pair it with only selective antitrust cases.", "summary": "The 2024 Republican platform promises to slash regulations. Executive Order 14192 (January 2025) requires agencies to repeal ten rules for each new one. The administration has also continued the large antitrust cases against Google and Meta that began under prior administrations.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House fact sheet: 10-to-1 deregulation initiative (Executive Order 14192)", "url": "https://www.whitehouse.gov/fact-sheets/2025/01/fact-sheet-president-donald-j-trump-launches-massive-10-to-1-deregulation-initiative/", "date": "2025-01-31"}, {"title": "Technology Policy Institute: After Google and Meta, what comes next for antitrust policy", "url": "https://techpolicyinstitute.org/publications/antitrust-and-competition/after-google-and-meta-what-comes-next-for-antitrust-policy-with-jon-nuechterlein-and-bill-kovacic/", "date": "2025"}]}}, {"qid": "U5", "issue": "Healthcare system", "your_position": "Single-payer national insurance replacing most private primary insurance.", "D": {"agreement": "partial", "note": "The party builds on the Affordable Care Act, but over 100 House Democrats back Medicare for All.", "summary": "The 2024 Democratic platform says health care is a right and pledges to protect and build on the Affordable Care Act, keep the expanded premium tax credits, and extend drug price caps. In January 2026 House Democrats, joined by 17 Republicans, passed a three-year extension of the expanded credits, which expired at the end of 2025.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Ballotpedia News: House passes three-year extension of expanded ACA subsidies", "url": "https://news.ballotpedia.org/2026/01/12/house-passes-three-year-extension-of-expanded-aca-subsidies/", "date": "2026-01-12"}, {"title": "Rep. Jayapal: Jayapal, Sanders, Dingell introduce Medicare for All Act", "url": "https://jayapal.house.gov/2025/04/29/jayapal-sanders-dingell-hundreds-of-health-care-workers-introduce-medicare-for-all", "date": "2025-04-29"}]}, "R": {"agreement": "disagree", "note": "Republicans favor a market-led system and cut federal Medicaid spending.", "summary": "The 2024 Republican platform promises more transparency, choice, and competition in health care and to protect Medicare. The 2025 reconciliation law added Medicaid work requirements and cut federal Medicaid spending. In January 2026 President Trump proposed the Great Healthcare Plan, which would send subsidy money to individuals for health savings accounts instead of to insurers.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "Morgan Lewis: One Big Beautiful Bill Act key final Medicaid changes explained", "url": "https://www.morganlewis.com/pubs/2025/07/one-big-beautiful-bill-act-key-final-medicaid-changes-explained", "date": "2025-07"}, {"title": "White House: President Trump unveils the Great Healthcare Plan", "url": "https://www.whitehouse.gov/releases/2026/01/president-trump-unveils-the-great-healthcare-plan-to-lower-costs-and-deliver-money-directly-to-the-people", "date": "2026-01-15"}, {"title": "Ballotpedia News: House passes three-year extension of expanded ACA subsidies", "url": "https://news.ballotpedia.org/2026/01/12/house-passes-three-year-extension-of-expanded-aca-subsidies/", "date": "2026-01-12"}]}}, {"qid": "U6", "issue": "Legal immigration levels", "your_position": "Increase legal immigration moderately, mainly through employment-based visas.", "D": {"agreement": "partial", "note": "Democrats want increases across family, employment, and refugee categories.", "summary": "The 2024 Democratic platform calls on Congress to increase the number of family-sponsored and employment-based immigrant visas so people do not wait decades. It highlights rebuilding refugee admissions to over 100,000 a year.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans cut admissions across refugee, family, and employment channels.", "summary": "The 2024 Republican platform calls for merit-based immigration and an end to chain migration. In office, the administration set the fiscal 2026 refugee ceiling at a record-low 7,500 (later raised to 17,500), added a $100,000 fee to new H-1B worker visas, and in January 2026 paused immigrant visa issuance for nationals of 75 countries.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Presidential Determination on Refugee Admissions for Fiscal Year 2026 (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/presidential-determination-refugee-admissions-for-fiscal-year-2026", "date": "2025-09-30"}, {"title": "CRS: U.S. Refugee Admissions Program in FY2025 and FY2026", "url": "https://www.everycrsreport.com/reports/IF13277.html", "date": "2026-07-28"}, {"title": "White House proclamation: Restriction on Entry of Certain Nonimmigrant Workers ($100,000 H-1B fee)", "url": "https://www.whitehouse.gov/presidential-actions/2025/09/restriction-on-entry-of-certain-nonimmigrant-workers/", "date": "2025-09-19"}, {"title": "Mintz: State Department suspends immigrant visa processing for 75 countries", "url": "https://www.mintz.com/insights-center/viewpoints/2806/2026-01-29-state-department-suspends-immigrant-visa-processing-75", "date": "2026-01-29"}]}}, {"qid": "U7", "issue": "Unauthorized immigration and enforcement", "your_position": "A conditional path to legal status for established residents, with strong border enforcement.", "D": {"agreement": "agree", "note": "Democrats back the bipartisan border deal and a pathway to citizenship for long-term residents.", "summary": "The 2024 Democratic platform backs the 2024 bipartisan border deal, more border agents and immigration judges, and a pathway to citizenship for Dreamers, farmworkers, care workers, and other long-term undocumented residents. In February 2026 Democratic leaders Hakeem Jeffries and Chuck Schumer conditioned Homeland Security funding on limits for immigration agents, such as judicial warrants to enter homes, no masks, and body cameras.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "News4Jax (AP): What Democrats are demanding in the fight over ICE funding", "url": "https://www.news4jax.com/news/politics/2026/02/04/what-democrats-are-demanding-in-the-fight-over-immigration-and-customs-enforcement-funding/", "date": "2026-02-04"}]}, "R": {"agreement": "disagree", "note": "Republicans pursue the largest deportation program in US history.", "summary": "The 2024 Republican platform promises the largest deportation program in American history, to finish the border wall, and to invoke the Alien Enemies Act against suspected gang members. The 2025 reconciliation law funded large increases in immigration enforcement and detention.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "News4Jax (AP): What Democrats are demanding in the fight over ICE funding", "url": "https://www.news4jax.com/news/politics/2026/02/04/what-democrats-are-demanding-in-the-fight-over-immigration-and-customs-enforcement-funding/", "date": "2026-02-04"}]}}, {"qid": "U8", "issue": "Policing and public disorder", "your_position": "Consistently enforce minor and serious offenses, with accountable policing and diversion where effective.", "D": {"agreement": "agree", "note": "Democrats back more officers for accountable community policing and action on retail crime.", "summary": "The 2024 Democratic platform says to fund the police, not defund them. It backs 100,000 more officers for accountable community policing, $5 billion for community violence intervention, action against retail crime, and passage of the George Floyd Justice in Policing Act.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans favor a larger increase in police presence and penalties, with less on accountability.", "summary": "The 2024 Republican platform promises to replenish police departments, protect officers from lawsuits, and stand up to progressive prosecutors. In August 2025 President Trump declared a crime emergency in Washington, D.C., took control of its police, deployed the National Guard, and ordered moves against cashless bail nationwide.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Declaring a Crime Emergency in the District of Columbia", "url": "https://www.whitehouse.gov/presidential-actions/2025/08/declaring-a-crime-emergency-in-the-district-of-columbia/", "date": "2025-08-11"}, {"title": "NPR: Trump signs executive orders focused on law and order in Washington, D.C.", "url": "https://npr.org/2025/08/26/nx-s1-5515695/trump-signs-executive-orders-focused-on-law-and-order-in-washington-d-c", "date": "2025-08-26"}]}}, {"qid": "U9", "issue": "Criminal sentencing and incarceration", "your_position": "Reduce incarceration for nonviolent offenses while keeping strong penalties for violent crime.", "D": {"agreement": "agree", "note": "Democrats commute nonviolent drug sentences while funding prosecution of violent crime.", "summary": "The 2024 Democratic platform supports rehabilitation and reentry, says no one should be jailed for marijuana possession, highlights Biden's commutations for nonviolent drug offenses, and pledges to end private prisons. It also funds more police and prosecutors for violent crime.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans favor tougher penalties and expanded use of the federal death penalty.", "summary": "The 2024 Republican platform promises to lock up violent offenders and crush gang violence. Executive Order 14164 (January 2025) directs the Attorney General to seek the death penalty in all appropriate federal cases and lifts the prior moratorium.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Executive Order 14164, Restoring the Death Penalty and Protecting Public Safety", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/restoring-the-death-penalty-and-protecting-public-safety/", "date": "2025-01-20"}]}}, {"qid": "U10", "issue": "Drugs and addiction", "your_position": "Legalize and regulate most drugs, including hard drugs, with strong treatment services.", "D": {"agreement": "disagree", "note": "Democrats end jail for marijuana but keep penalties for the most dangerous drugs.", "summary": "The 2024 Democratic platform says no one should be in jail for using or possessing marijuana and pledges to expunge federal marijuana convictions. It backs drug courts, diversion, and treatment for substance use disorders while fighting fentanyl trafficking.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans favor broad prohibition and stronger enforcement.", "summary": "The 2024 Republican platform focuses on enforcement: a naval blockade against fentanyl, dismantling cartels, and drug-free schools. In December 2025, however, President Trump ordered the Attorney General to speed the move of marijuana from Schedule I to Schedule III for medical research, while saying this does not legalize it.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Increasing Medical Marijuana and Cannabidiol Research (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/12/increasing-medical-marijuana-and-cannabidiol-research/", "date": "2025-12-18"}, {"title": "Deseret News: Trump moves to reschedule marijuana", "url": "https://www.deseret.com/politics/2025/12/18/trump-reschedules-marijuana-drug-medical-use", "date": "2025-12-18"}]}}, {"qid": "U11", "issue": "Energy and electricity production", "your_position": "Energy abundance across nuclear, renewables, and fossil fuels, with broad permitting reform.", "D": {"agreement": "disagree", "note": "Democrats prioritize replacing fossil fuels quickly, though their record also includes record fossil output.", "summary": "The 2024 Democratic platform calls the Biden record the most aggressive climate agenda in history, backs net-zero emissions by 2050, and credits the Inflation Reduction Act's clean energy tax credits. It also points to record domestic energy production and pledges to cut oil and gas subsidies.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans back all sources including nuclear but favor fossil fuels and ended most wind and solar credits.", "summary": "The 2024 Republican platform promises to drill, end restrictions on oil, gas, and coal, and make America energy dominant, while unleashing all sources including nuclear. In 2025 the president declared a national energy emergency, and the reconciliation law ended wind and solar tax credits for most projects placed in service after 2027 while keeping nuclear and other credits.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Declaring a National Energy Emergency", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/declaring-a-national-energy-emergency/", "date": "2025-01-20"}, {"title": "White House: Unleashing American Energy (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/unleashing-american-energy/", "date": "2025-01-20"}, {"title": "Pierce Atwood: Congress phases out energy tax credits", "url": "https://www.pierceatwood.com/alerts/congress-phases-out-energy-tax-credits", "date": "2025-07"}, {"title": "White House: Reinvigorating the Nuclear Industrial Base (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/05/reinvigorating-the-nuclear-industrial-base/", "date": "2025-05-23"}]}}, {"qid": "U12", "issue": "Environmental review and permitting", "your_position": "Substantially streamline permitting and limit procedural ways to block projects.", "D": {"agreement": "partial", "note": "Democrats favor moderate streamlining, though 11 House Democrats voted for the SPEED Act.", "summary": "The 2024 Democratic platform pledges to improve and speed up environmental review and clean energy permitting and to build more transmission. It does not propose limiting legal challenges.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "E&E News: House approves permitting bill after tumultuous week", "url": "https://www.eenews.net/articles/house-approves-permitting-bill-after-tumultuous-week/", "date": "2025-12-18"}]}, "R": {"agreement": "agree", "note": "Republicans passed the SPEED Act, which sets deadlines and restricts judicial review.", "summary": "The 2024 Republican platform promises to streamline permitting. In December 2025 House Republicans passed the SPEED Act, which sets tighter deadlines, exempts some projects from review, and restricts judicial review under the National Environmental Policy Act.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "E&E News: House approves permitting bill after tumultuous week", "url": "https://www.eenews.net/articles/house-approves-permitting-bill-after-tumultuous-week/", "date": "2025-12-18"}]}}, {"qid": "U13", "issue": "K-12 education and school choice", "your_position": "No firm view on charters or vouchers; measure learning rigorously and reward or remove teachers based on results.", "D": {"agreement": "disagree", "note": "Democrats focus on more public school funding and do not address teacher accountability.", "summary": "The 2024 Democratic platform focuses on public schools: more Title I funding, community schools, tutoring, and universal preschool. It does not mention charter schools or vouchers. In April 2026 Senate Democrats introduced a bill to repeal the federal scholarship tax credit created by the 2025 reconciliation law.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Ballotpedia News: Senate Democrats introduce bill to repeal federal education tax credit scholarship", "url": "https://news.ballotpedia.org/2026/04/24/senate-democrats-introduce-bill-to-repeal-federal-education-tax-credit-scholarship/", "date": "2026-04-24"}]}, "R": {"agreement": "partial", "note": "Republicans propose ending teacher tenure, which fits your view, but center on school choice, where you hold no view.", "summary": "The 2024 Republican platform supports universal school choice in every state, ending teacher tenure, and closing the federal Department of Education. The 2025 reconciliation law created the first federal tax credit, up to $1,700 per taxpayer, for donations to private school scholarship groups in states that opt in, and a March 2025 executive order directed steps to close the Education Department.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Ballotpedia News: Budget reconciliation bill enacts first federal private school choice program", "url": "https://news.ballotpedia.org/2025/07/10/budget-reconciliation-bill-enacts-first-federal-private-school-choice-program/", "date": "2025-07-10"}, {"title": "White House: Executive Order 14242, Improving Education Outcomes by Empowering Parents, States, and Communities", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/improving-education-outcomes-by-empowering-parents-states-and-communities/", "date": "2025-03-20"}]}}, {"qid": "U14", "issue": "College affordability and student loans", "your_position": "Significantly reduce federal lending and subsidies, relying on institutional competition and private financing.", "D": {"agreement": "disagree", "note": "Democrats want to double Pell Grants and pursue student debt relief.", "summary": "The 2024 Democratic platform pledges to double the maximum Pell Grant by 2029, expand free community college, and keep pursuing student debt relief through every available tool after the Supreme Court blocked broad cancellation.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "Republicans ended Grad PLUS loans for new borrowers and capped Parent PLUS loans.", "summary": "The 2024 Republican platform promises to drive down tuition and support cheaper alternatives to four-year degrees. The 2025 reconciliation law ends Grad PLUS loans for new borrowers, caps Parent PLUS loans, replaces income-driven plans with a new Repayment Assistance Plan, and a 2025 executive order began closing the Education Department.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "AACRAO: A complete overhaul to the federal financial aid system", "url": "https://www.aacrao.org/news/a-complete-overhaul-to-the-federal-financial-aid-system/", "date": "2025"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "White House: Executive Order 14242, Improving Education Outcomes by Empowering Parents, States, and Communities", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/improving-education-outcomes-by-empowering-parents-states-and-communities/", "date": "2025-03-20"}]}}, {"qid": "U15", "issue": "Industrial policy and manufacturing", "your_position": "Targeted subsidies and public investment for strategic sectors, with performance requirements.", "D": {"agreement": "agree", "note": "Democrats back targeted programs such as the CHIPS Act.", "summary": "The 2024 Democratic platform credits the CHIPS and Science Act and the Inflation Reduction Act with bringing home semiconductor and clean energy manufacturing and creating about 800,000 factory jobs. It favors targeted tariffs on Chinese goods over broad tariffs on allies.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "CBS News: Senate approves Democratic resolution to block Trump's tariffs on Canada", "url": "https://www.cbsnews.com/news/senate-trump-tariffs-canada", "date": "2025-10-29"}]}, "R": {"agreement": "partial", "note": "Republicans pursue broader industrial policy, including baseline tariffs on most imports.", "summary": "The 2024 Republican platform calls for baseline tariffs on foreign goods, Buy American rules, and making the US a manufacturing superpower. The administration imposed broad tariffs, took a 9.9 percent government stake in Intel in August 2025 by converting CHIPS Act grants, and after the Supreme Court struck down its emergency tariffs in February 2026 replaced them under other trade laws.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Al Jazeera: Trump says US to take 10 percent stake in Intel", "url": "https://www.aljazeera.com/economy/2025/8/22/trump-says-us-to-take-10-percent-stake-in-intel", "date": "2025-08-22"}, {"title": "Jones Day: United States Supreme Court invalidates IEEPA tariffs", "url": "https://www.jonesday.com/de/insights/2026/02/united-states-supreme-court-invalidates-ieepa-tariffs", "date": "2026-02"}, {"title": "Covington: IEEPA tariffs terminated, replacement Section 122 tariffs take effect", "url": "https://www.cov.com/en/news-and-insights/insights/2026/02/ieepa-tariffs-terminated-replacement-section-122-tariffs-take-effect", "date": "2026-02"}, {"title": "CBS News: Senate approves Democratic resolution to block Trump's tariffs on Canada", "url": "https://www.cbsnews.com/news/senate-trump-tariffs-canada", "date": "2025-10-29"}]}}, {"qid": "U16", "issue": "Abortion policy", "your_position": "Protect abortion access nationally throughout pregnancy, subject to medical regulation.", "D": {"agreement": "partial", "note": "Democrats would protect access nationally through fetal viability.", "summary": "The 2024 Democratic platform pledges that a Democratic Congress will pass national legislation to make Roe the law of the land again, which protected abortion until fetal viability. It also pledges to repeal the Hyde Amendment and protect IVF and contraception.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans leave abortion to the states and oppose late-term abortion.", "summary": "The 2024 Republican platform says the power to regulate abortion now rests with the states and a vote of the people. It opposes late-term abortion while supporting access to birth control and IVF. The 2025 reconciliation law cut Medicaid funding to certain abortion providers for one year.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}]}}, {"qid": "U17", "issue": "Transgender rights and public policy", "your_position": "Strong federal protections for gender identity, with broad access and inclusion.", "D": {"agreement": "agree", "note": "Democrats back the Equality Act and oppose bans on gender-affirming care.", "summary": "The 2024 Democratic platform pledges to pass the Equality Act, oppose state and federal bans on gender-affirming care, and ensure transgender students are treated fairly at school. It defends Biden's Title IX protections for gender identity.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Rep. Steube: Protection of Women and Girls in Sports Act passes House in bipartisan vote", "url": "https://steube.house.gov/press-releases/steubes-protection-of-women-and-girls-in-sports-act-passes-u-s-house-in-bipartisan-vote", "date": "2025-01-14"}]}, "R": {"agreement": "disagree", "note": "Republicans define sex as binary in federal policy and restrict care for minors.", "summary": "The 2024 Republican platform promises to keep men out of women's sports, ban taxpayer funding for sex change surgery, and stop schools from promoting gender transition. In 2025 executive orders defined sex as binary for federal policy, barred transgender girls and women from female school sports, and moved to restrict gender transition care for people under 19.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Defending Women from Gender Ideology Extremism and Restoring Biological Truth to the Federal Government", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/defending-women-from-gender-ideology-extremism-and-restoring-biological-truth-to-the-federal-government/", "date": "2025-01-20"}, {"title": "White House: Keeping Men Out of Women's Sports (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/02/keeping-men-out-of-womens-sports/", "date": "2025-02-05"}, {"title": "White House: Protecting Children from Chemical and Surgical Mutilation (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/protecting-children-from-chemical-and-surgical-mutilation/", "date": "2025-01-28"}, {"title": "Rep. Steube: Protection of Women and Girls in Sports Act passes House in bipartisan vote", "url": "https://steube.house.gov/press-releases/steubes-protection-of-women-and-girls-in-sports-act-passes-u-s-house-in-bipartisan-vote", "date": "2025-01-14"}]}}, {"qid": "U18", "issue": "Voting and election administration", "your_position": "Broadly accessible voting with standardized identification and safeguards.", "D": {"agreement": "partial", "note": "Democrats stress access and oppose proof-of-citizenship rules, with less on identification.", "summary": "The 2024 Democratic platform pledges to pass the John Lewis Voting Rights Advancement Act and the Freedom to Vote Act to secure access to the ballot. Democrats opposed the 2025 SAVE Act, saying proof-of-citizenship rules would block eligible voters, and Senate leader Chuck Schumer called it dead on arrival.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "CBS News: SAVE Act passes House, with 4 Democrats backing bill", "url": "https://www.cbsnews.com/news/house-passes-save-act-proof-of-citizenship-voter-registration-federal-elections", "date": "2025-04-10"}]}, "R": {"agreement": "partial", "note": "Republicans stress voter ID and proof of citizenship and want limits on mail voting.", "summary": "The 2024 Republican platform calls for voter ID, paper ballots, proof of citizenship, and voting on a single day. A March 2025 executive order sought documentary proof of citizenship to register, and the House passed the SAVE Act requiring it in April 2025.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Preserving and Protecting the Integrity of American Elections (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/preserving-and-protecting-the-integrity-of-american-elections/", "date": "2025-03-25"}, {"title": "CBS News: SAVE Act passes House, with 4 Democrats backing bill", "url": "https://www.cbsnews.com/news/house-passes-save-act-proof-of-citizenship-voter-registration-federal-elections", "date": "2025-04-10"}]}}, {"qid": "U19", "issue": "Federal civil-service reform", "your_position": "Strengthen performance management while keeping protections against politicization.", "D": {"agreement": "partial", "note": "Democrats defend civil-service protections but do not stress performance management.", "summary": "The 2024 Democratic platform warns against plans to fire nonpolitical civil servants and replace them with loyalists. It supports public sector bargaining rights through the Public Service Freedom to Negotiate Act.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans made dismissal easier but removed firing protections for policy roles, which you would keep.", "summary": "The 2024 Republican platform promises to fire corrupt employees and end weaponized government. In 2025 an executive order created a new job category, now Schedule Policy/Career, that removes firing protections for policy roles, finalized by OPM in February 2026. About 317,000 employees left federal service in 2025 under the workforce reduction effort.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Restoring Accountability to Policy-Influencing Positions Within the Federal Workforce", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/restoring-accountability-to-policy-influencing-positions-within-the-federal-workforce/", "date": "2025-01-20"}, {"title": "OPM: OPM finalizes Schedule Policy/Career rule to strengthen accountability", "url": "https://www.opm.gov/news/news-releases/opm-finalizes-schedule-policycareer-rule-to-strengthen-accountability/", "date": "2026-02-05"}, {"title": "White House: Implementing the President's DOGE Workforce Optimization Initiative", "url": "https://www.whitehouse.gov/presidential-actions/2025/02/implementing-the-presidents-department-of-government-efficiency-workforce-optimization-initiative/", "date": "2025-02-11"}, {"title": "Transport Topics (AP): Federal workforce down 317,000", "url": "https://www.ttnews.com/article/federal-workforce-down-317000", "date": "2026-01"}]}}, {"qid": "U20", "issue": "Social Security and Medicare reform", "your_position": "Slow benefit growth, means-test, and adjust retirement age while protecting poorer recipients.", "D": {"agreement": "disagree", "note": "Democrats reject any benefit cuts and would expand Social Security through taxes on the wealthy.", "summary": "The 2024 Democratic platform rejects any cut to Social Security or Medicare benefits and any privatization. It pledges to expand Social Security benefits and keep Medicare solvent by having the wealthiest Americans pay more.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans promise no benefit cuts and no change to the retirement age.", "summary": "The 2024 Republican platform promises no cuts to Social Security or Medicare and no change to the retirement age. It says growth, lower inflation, and border security will keep the programs solvent. It does not propose new revenue.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}]}}, {"qid": "U21", "issue": "Defense spending and strategy", "your_position": "Restructure the military around fewer strategic threats and reduce less essential commitments.", "D": {"agreement": "partial", "note": "Democrats would keep a large global military with selective modernization.", "summary": "The 2024 Democratic platform calls the US military the finest in history and pledges to keep investing in next-generation weapons, the submarine force, and the nuclear triad. It does not call for a large budget increase.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans seek a roughly 40 percent defense budget increase to about $1.5 trillion.", "summary": "The 2024 Republican platform promises to build a military bigger, better, and stronger than ever, including an Iron Dome missile shield. In 2026 President Trump requested about $1.5 trillion for defense in fiscal 2027, a rise of roughly 40 percent, partly through a planned reconciliation bill.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "DefenseScoop: Trump calls for $1.5 trillion defense budget in 2027", "url": "https://defensescoop.com/2026/01/07/trump-calls-for-1-5-trillion-defense-budget-2027/", "date": "2026-01-07"}, {"title": "Breaking Defense: Trump to propose $1.5 trillion defense budget, banking on $350 billion from reconciliation", "url": "https://breakingdefense.com/2026/04/trump-to-propose-1-5-trillion-defense-budget-banking-on-350-billion-from-reconciliation/", "date": "2026-04"}]}}, {"qid": "U22", "issue": "NATO and alliances", "your_position": "Keep strong alliances while requiring much larger allied defense contributions.", "D": {"agreement": "partial", "note": "Democrats back NATO strongly and treat 2 percent of GDP as a floor.", "summary": "The 2024 Democratic platform says NATO is stronger and more united than ever under Biden, welcomes Finland and Sweden, and treats the 2 percent of GDP spending goal as a floor.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "Republicans pressed allies into a 5 percent of GDP pledge while keeping NATO.", "summary": "The 2024 Republican platform says it will strengthen alliances by ensuring allies meet their obligations to invest in common defense. At the June 2025 Hague summit, under US pressure, NATO allies pledged to spend 5 percent of GDP on defense and security by 2035.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "NATO: The Hague Summit Declaration", "url": "https://www.nato.int/cps/en/natohq/official_texts_236705.htm", "date": "2025-06-25"}, {"title": "Defense News: NATO allies agree to boost defense spending to 5% at The Hague summit", "url": "https://www.defensenews.com/global/europe/2025/06/25/nato-allies-agree-to-boost-defense-spending-to-5-at-the-hague-summit/", "date": "2025-06-25"}]}}, {"qid": "U23", "issue": "China, trade, and economic security", "your_position": "Strong restrictions on strategic technologies while preserving significant ordinary trade.", "D": {"agreement": "agree", "note": "Democrats favor focused technology restrictions and de-risking rather than decoupling.", "summary": "The 2024 Democratic platform says the US should de-risk and diversify its economic relationship with China, not decouple. It favors a small yard and high fence of focused technology restrictions, plus targeted tariffs on items like steel, chips, electric vehi
