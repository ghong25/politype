cles, and solar cells.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "The Republican platform aims close to decoupling, though the 2025 truce cut some tariffs.", "summary": "The 2024 Republican platform calls for revoking China's most favored nation trade status, phasing out imports of essential goods, and blocking Chinese purchases of US real estate and industries. The administration raised tariffs on China sharply in 2025, then cut them in an October 2025 truce in exchange for Chinese action on fentanyl and rare earths.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Kitco (Reuters): Trump shaves China tariffs in deal with Xi on fentanyl, rare earths", "url": "https://www.kitco.com/news/off-the-wire/2025-10-30/trump-shaves-china-tariffs-deal-xi-fentanyl-rare-earths", "date": "2025-10-30"}, {"title": "Jones Day: United States Supreme Court invalidates IEEPA tariffs", "url": "https://www.jonesday.com/de/insights/2026/02/united-states-supreme-court-invalidates-ieepa-tariffs", "date": "2026-02"}]}}, {"qid": "U24", "issue": "Military aid and foreign conflicts", "your_position": "Meaningful aid where it serves clear US interests and has a credible chance of success.", "D": {"agreement": "partial", "note": "Democrats back substantial aid to defend democratic sovereignty, even at high cost.", "summary": "The 2024 Democratic platform backs giving Ukraine the weapons and economic support it needs to defend its sovereignty. In June 2026 House Democrats, joined by 18 Republicans, used a discharge petition to pass a Ukraine aid and Russia sanctions bill led by Rep. Gregory Meeks.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Arab News (AP): US House passes bill to aid Ukraine and impose new sanctions on Russia", "url": "https://www.arabnews.pk/node/2646049/world", "date": "2026-06-05"}, {"title": "WTOP (AP): Senate passes sweeping Russia sanctions bill negotiated by the late Sen. Lindsey Graham", "url": "https://wtop.com/news/2026/08/senate-passes-sweeping-russia-sanctions-bill-negotiated-by-the-late-sen-lindsey-graham-2/", "date": "2026-08-07"}]}, "R": {"agreement": "partial", "note": "Leadership favors limited, ally-funded support, while a pro-Ukraine wing matches your view.", "summary": "The 2024 Republican platform promises to prevent World War III and restore peace in Europe, and says force should be used only where national interests are clearly threatened. Since 2025 the administration has not sought new Ukraine aid funding, and US weapons reach Ukraine mainly through sales paid for by NATO allies. A pro-Ukraine wing pushed aid and sanctions bills through Congress in 2026 over leadership objections.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Arab News (AP): US House passes bill to aid Ukraine and impose new sanctions on Russia", "url": "https://www.arabnews.pk/node/2646049/world", "date": "2026-06-05"}, {"title": "WTOP (AP): Senate passes sweeping Russia sanctions bill negotiated by the late Sen. Lindsey Graham", "url": "https://wtop.com/news/2026/08/senate-passes-sweeping-russia-sanctions-bill-negotiated-by-the-late-sen-lindsey-graham-2/", "date": "2026-08-07"}]}}, {"qid": "U25", "issue": "Domestic surveillance", "your_position": "Substantially restrict surveillance authorities and require individualized warrants.", "D": {"agreement": "partial", "note": "Democrats are split, and a civil liberties faction wants a warrant requirement.", "summary": "The 2024 Democratic platform does not address foreign intelligence surveillance. In April 2026, 42 House Democrats voted for a three-year renewal of Section 702 without a warrant requirement, while most Democrats opposed it. Democrats then withheld votes for an extension in June 2026, partly over the choice of acting intelligence director, and the authority lapsed on June 12, 2026.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Nextgov: House readies vote to renew FISA 702 without a warrant amendment", "url": "https://www.nextgov.com/policy/2026/04/house-readies-vote-renew-fisa-702-without-a-warrant-amendment/412856/", "date": "2026-04"}, {"title": "NPR: A key U.S. spy tool has lapsed. Now what?", "url": "https://www.npr.org/2026/06/12/nx-s1-5856291/fisa-702-surveillance-expiration-bill-pulte", "date": "2026-06-12"}, {"title": "CRS Legal Sidebar LSB11444: The Impact of FISA Section 702's Repeal", "url": "https://www.everycrsreport.com/files/2026-06-22_LSB11444_d51e458f8ceedeadf0646bd8cf94b229944adbff.pdf", "date": "2026-06-22"}]}, "R": {"agreement": "partial", "note": "Republicans are split, and a libertarian faction wants a warrant requirement.", "summary": "The 2024 Republican platform calls for banning government collusion to censor speech but does not address Section 702. House Republican leaders brought a three-year renewal without a warrant requirement to the floor in April 2026, and it passed 235 to 191 with 22 Republicans voting no. Congress did not renew it before it lapsed on June 12, 2026.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Nextgov: House readies vote to renew FISA 702 without a warrant amendment", "url": "https://www.nextgov.com/policy/2026/04/house-readies-vote-renew-fisa-702-without-a-warrant-amendment/412856/", "date": "2026-04"}, {"title": "NPR: A key U.S. spy tool has lapsed. Now what?", "url": "https://www.npr.org/2026/06/12/nx-s1-5856291/fisa-702-surveillance-expiration-bill-pulte", "date": "2026-06-12"}, {"title": "CRS Legal Sidebar LSB11444: The Impact of FISA Section 702's Repeal", "url": "https://www.everycrsreport.com/files/2026-06-22_LSB11444_d51e458f8ceedeadf0646bd8cf94b229944adbff.pdf", "date": "2026-06-22"}]}}], "party_as_of": "2026-10-30"}, "profile": {"material_note": "This profile rests on 26 written explanations totaling about 3,000 words, plus your 60 multiple-choice picks. You gave no importance ratings.", "sections": [{"title": "Education and intellectual life", "strong": [{"claim": "You have read political theory and use it as your starting point. You cite Hobbes and Weber on the state, Kant on justice, and James C. Scott's Seeing Like a State twice.", "evidence": ["P1", "P4", "P5", "P9"], "quote": "I start by thinking about it from a political theory lens."}, {"claim": "You are fluent in economics. You use terms like deadweight loss, price discovery, diminishing marginal returns, monopsony (a market with a single buyer), and regulatory capture correctly and without explanation.", "evidence": ["P6", "P7", "P12", "P31"], "quote": "Healthcare is a great example of market failure"}, {"claim": "You say plainly when you have not read enough to hold a strong view.", "evidence": ["U13", "P9"], "quote": "Im not sufficiently versed on the literature on charter school and voucher outcomes to have a strong view"}], "speculative": [{"claim": "You may have studied political science, philosophy, or economics at university. The named thinkers, the word \"reify\" used twice, and the habit of parsing a question's wording all point to formal training.", "evidence": ["P1", "P7", "P18", "P22"]}]}, {"title": "Work and life stage", "strong": [{"claim": "You write as a participant in US politics. You refer to Democrats, to \"an american life\", and to China as the biggest threat \"the us faces\".", "evidence": ["P15", "P34", "U23"]}], "speculative": [{"claim": "You may work in business, finance, or another analytical field. You describe healthcare consolidation \"in the value chain\" and frame policy as measuring and optimizing toward a target.", "evidence": ["P31", "P10", "U13"]}, {"claim": "You may be a younger adult. You write in a fast, casual register with texting shorthand such as \"tbh\", \"bc\", \"prob\", and \"oof\".", "evidence": ["P2", "P13", "P1", "U20"]}]}, {"title": "Temperament", "strong": [{"claim": "You are open about uncertainty on hard philosophical questions. You call several of them tricky and admit when you have no clean answer.", "evidence": ["P2", "P9", "U20"], "quote": "i dont really have a good answer ultimately bc I think these are 2 countervailing but both very real things"}, {"claim": "On concrete policy you state your view flatly, with no hedge.", "evidence": ["P32", "P34", "U23", "P15"], "quote": "Im def a YIMBY"}, {"claim": "You push back on how questions are framed. You reject premises, object to forced single choices, and parse words like \"should\" and \"can\".", "evidence": ["P5", "P11", "P12", "P22", "P2"], "quote": "I take issue with the premise behind these answers."}, {"claim": "You are blunt and willing to say unflattering things. You call much of the public poorly informed, call open borders \"terrible policy\", and call police \"hot beds of iniquity\".", "evidence": ["P9", "P15", "P34"]}], "speculative": []}, {"title": "How you reason", "strong": [{"claim": "You split almost every question into a moral question and a practical question, and you answer them separately. You notice and say when the two point in different directions.", "evidence": ["P6", "P14", "P15", "P18", "P35"], "quote": "A clear example of where what I think is morally good diverges from what I think is best policy"}, {"claim": "Your working framework is to maximize welfare inside fixed limits set by individual rights. When the two collide, rights win. You picked the absolute answers on secret surveillance and on banning criticism of the government, over the options that allowed exceptions.", "evidence": ["P6", "P10", "P11", "P19"], "quote": "I think we should generally maximize welfare but subject to the constraints of a rule based order and individual rights"}, {"claim": "You trust expertise but distrust anyone who thinks they can redesign a system from above. You back Fed independence and measurement-driven policy, yet you warn about the hubris of experts and call regulation a blunt instrument.", "evidence": ["P4", "P9", "P27", "P29", "U13"], "quote": "theres a huge danger in people thinking they know it all and can destroy and remake everything"}, {"claim": "You value things for what they do, not for what they are. You treat tradition, national identity, property, and markets as useful tools, and you object when any of them is treated as sacred in itself.", "evidence": ["P4", "P7", "P18", "P22"], "quote": "I also dont think there is some reified sanctity to the idea of owning stuff"}], "speculative": []}, {"title": "What you care about", "strong": [{"claim": "You care whether institutions stay legitimate and trusted. You often count public backlash and loss of faith in fairness as a real cost of a policy.", "evidence": ["P7", "P9", "P14", "P15", "P18", "P34"], "quote": "It’s a recipe for undermining social trust."}, {"claim": "You care about growth and building. You warn against \"killing the proverbial golden goose\", blame stalled growth for fueling populism, and back overriding local zoning and fast permitting.", "evidence": ["P6", "P7", "P32", "U11", "U12"]}, {"claim": "You treat individual dignity and autonomy as a floor the state must not break. This shows in your answers on property, on personal choices, on social norms, on speech, and on surveillance.", "evidence": ["P8", "P13", "P17", "P18", "P28", "U25"]}, {"claim": "You give extra weight to people who are worse off. You measure welfare as human flourishing, not money, and you note that the same gain means more to someone with less.", "evidence": ["P12", "P16", "P20", "P2"], "quote": "diminishing marginal returns is very real"}], "speculative": []}], "summary_portrait": "You read political theory and economics and reach for both when a question gets hard. You split problems into what is right and what will work, and you say so when they come apart. You aim to maximize human flourishing, but individual rights are a line you will not cross for it. You doubt grand redesigns, care about growth and public trust, and speak bluntly once you have made up your mind."}, "evidence": {"P1": {"title": "What is the primary purpose of government?", "prompt": "What is the primary purpose of government?", "answer": "A combination or different principle", "explanation": "This is a challenging question that I dont think necessarily has a very simple answer. I start by thinking about it from a political theory lens. why do you need a government? not to go all hobbsian but I do think there is a significant concern of anarchy without a state and without a monopoly on the legitimate use of violence (I guess not to go all weber either). after you've cleared that very basic threshold, I think it becomes a lot murkier bc a lot of things that sound good in principle need to be traded off against one another and I feel like it's a facile perspective to just choose a single thing and say that is the only thing to optimize for. I'd say it's prob some combination of promoting collective welfare through building and maintaining strong and stable institutions (e.g. rule of law) while ensuring that individual rights and freedoms are respected. might seem like a bit of a cop out to choose a combo of what youre saying but in my view, it feels arbitrary to just pick one and say thats the main thing", "importance": null}, "P2": {"title": "How do you view economic inequality?", "prompt": "How do you view economic inequality?", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "Oof. another tricky one. the one I choose is the closest I guess to what I think but that is itself kinda reductive bc then you have other questions like what is excessive and what do you then do about it? I'd say a few things:\n- I think some degree of inequality is structurally inherent if you want markets (given differences in natural endowments of ability and even things like desire to work hard)\n- I think some degree of inequality is even good as a means to reward and incentivize innovation and effort\n- however, there are 2 further issues that arrise: 1. what is the cause for the inequality in a society? 2. how much inequality are we seeing?\nto the former, I'd say that a lot of inequality we actually see is due to issues like inequality of opportunity, unequal access to resources, legacy of stuff like redlining. to the latter, I think this is a harder question. I take issue with some of the leftist views like all great wealth is inherently exploitative (I think thats absurd) and no billionaires should exist in a just society, however it does strike me as absurd that there are so many holes in the tax codes and structural inequalities through which the wealthy perpetuate their advantages. im not sure that you can necessarily say something like once you've hit X number you need to do Y thing (I think thats a clearly very blunt instrument) but I do think the urgency of the problem does depend on the extend of the inequality", "importance": null}, "P3": {"title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "prompt": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null}, "P4": {"title": "How should society approach longstanding traditions and institutions?", "prompt": "How should society approach longstanding traditions and institutions?", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "depends on why youre asking. are you asking if I value tradition as a thing in and of itself or more as a functional and practical matter. I dont really care about tradition intrinsically. I think if something is broken/doesnt make sense you should fix it/change it. im not precious about the past in that way. however, pragmatically I think there are 2 major concerns with that kind of approach: 1. like james c scott says in seeing like a state, theres a huge danger in people thinking they know it all and can destroy and remake everything in a more rational and superior way. that kind of myopic hubris can be way worse than leaving things as they are. supporting radical change presupposes that the change will be good and there wont be any massive downstream negative consequence which we've seem time and time again is not the case 2. even if you presuppose that it's gonna be good, people and societies as a whole can have a negative reaction to just upturning the way things work. incrementalism is often more effective to counteract this.\n\nnow I dont wanna make blanket statements. if you see something thats genuinely super fucked up like slavery, then yeah fix it sure but generally, Im on the side of being careful and circumspect", "importance": null}, "P5": {"title": "Which statement best captures your conception of justice?", "prompt": "Which statement best captures your conception of justice?", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "I take issue with the premise behind these answers. its a single choice multiple choice which positions these as competing things. the choice I made is the closest to what I think but do generally believe in some vague kantian idea of giving people what theyre due as well and that structural disadvantages and inequalities should be corrected as well for example.", "importance": null}, "P6": {"title": "Redistribution and taxation", "prompt": "Would you support significantly higher taxation and redistribution?", "answer": "Another approach or important distinction", "explanation": "so I think generally when theres a tradeoff at play with a policy decision, as there very much is, I think the state should optimize for greatest cumulative welfare (while still doing so within the constraints of the law and of respecting individual rights). so with the way that youre framing it, if it's a modest reduction in investment in growth, if we can quantify how modest and see that the improvement in collective welfare is great in relation to that, then yeah Im for it. however, i dont believe in redistribution at all costs and totally ignoring deadweight loss and inefficiency. there is a real danger of killing the proverbial golden goose.\n\nI think there are 2 concerns here: 1. practical administration of policy 2. moral framework\nmy answer above is largely in response to 1. I do think that huge inequality is problematic in itself both bc it presents big political concerns (money in politics, oligarchy, etc) and bc it's hard to think of a moral justification for why we should have trillionaires when so many people live in desperate poverty", "importance": null}, "P7": {"title": "Markets versus government", "prompt": "Which broad approach do you favor?", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Im a big believer in the power of markets. the power of competition, price discovery, and efficiency through the free market is very important and societally beneficial but I think it's a huge mistake to reify the market and treat it as a end onto itself. it should ultimately be constrained by the state where there are market failures and where there are dangers of distorting effects from monopolies\n\nI think Im sorta in between mixed economy and markets should be default. I think the chicago school and reagan types are too deferential towards the economy and insufficiently wary of the ways in which the market can fail but at the same time, I believe i the dynamism of markets - e.g. I think europe has too many stifling regulations which in turn have led to sclerotic growth and in turn have empowered populists and right wing movements who look for a scapegoat for this lack of growth. so I think theres not just a practical concern for recognizing how the market can be superior to the state but also a concern that a lack of growth and development can be very politically destabilizing too", "importance": null}, "P8": {"title": "Individual liberty and paternalism", "prompt": "Should the government restrict it?", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "hmmm well the reason I say possibly is bc in principle i think competent adults should be able to do whatever they want even if it's bad for them but I can imagine scenarios in which the activity is so harmful that just saying that as a blanket statement prob goes too far. e.g. consider how addictive fentanyl is and how many people it kills. I would lean on the side of letting people make choices that might be harmful to them but I also wouldnt treat this as a moral absolute", "importance": null}, "P9": {"title": "Democracy versus expertise", "prompt": "What should happen?", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "ugh this is another really tricky one. I think theres a lot of issues at play here.\n- the majority of the public is nowhere near educated, informed (or frankly intelligent) enough to be able to form meaningful opinions on complex issues. i think theres a very real concern of demagogues exploiting that - rail against the corrupt, unaccountable elites, push a bunch of stuff that sounds nice that will wreck the countries finances/long term well being\n- at the same time, I do think there is danger in an idea of a class of people who paternalistically treat the who country as a bunch of morons who dont know enough to make their own choices (and I think we saw aspects of this with stuff like the iraq war or GFC for example - theres a reason why there has been a big backlash to technocratic rule and the idea that theres a few experts who are smart enough to run everything). I worry about that from both a moral standpoint (feels deeply undemocratic to just override whatever the public wants) and from a practical standpoint (going back to the seeing like a state thing - danger of the hubris of experts).\n- i dont really have a good answer ultimately bc I think these are 2 countervailing but both very real things. I guess I'd just say that politically theres more danger in an unaccountable elite overriding the public will and then getting things wrong and delegitimizing the state as we've seen in recent times. but on the whole I def believe in expert knowledge and think things like fed independence is good - you need people like economists and domain experts who can act as stewards for the public good", "importance": null}, "P10": {"title": "Equality of opportunity versus equality of outcomes", "prompt": "What does justice require next?", "answer": "Actively reduce extreme disparities in outcomes through redistribution and structural reform", "explanation": "so I want to qualify what Im saying what Im saying here. I def dont believe in communism or state enforced mass equality but going back to one of my earlier points, inasmuch as the state should be concerned with collective welfare, I think its good to reduce disparities in outcome if it will raise collective welfare. I see it as a sort of technocratic/optimization problem: how do we ensure the greatest good for the greatest number", "importance": null}, "P11": {"title": "Are individual rights inviolable?", "prompt": "Would this be morally permissible?", "answer": "No. Certain rights should not be violated, even to maximize welfare.", "explanation": "yeah this is a good illustration of what I mean when I say that I think we should generally maximize welfare but subject to the constraints of a rule based order and individual rights. first I kind reject the premise that you can violate rights without creating an institutional precedent, but even if I grant you that, I think individual rights override a general util max framework", "importance": null}, "P12": {"title": "Whose welfare matters most?", "prompt": "Which would you choose?", "answer": "Probably A, depending on the size of the overall welfare loss.", "explanation": "what does welfare mean here? the construction of your question leads me to think youre measuring this in the form of wealth or whatever. for a problem like this I wouldnt think about welfare in those terms. I think about it in terms of human flourishing (which I know is kinda squishy but bear with me) and diminishing marginal returns is very real. if you have a policy that would take $10k from a middle class person but net Bezos $10B Im not sure thats a good idea bc the value of an incremental 10b to bezos is basically nothing, for example. so I kinda take issue with the way you frame the question. i feel like for such a scenario to even exist youre prob messing up your util calc", "importance": null}, "P13": {"title": "Cultural liberalism and social norms", "prompt": "What should the state's position be?", "answer": "Strongly protect the minority's freedom and reject state enforcement of conventional morality.", "explanation": "tbh if its not enshrined in laws I dont think the state should care about \"norms\". either youre violating the laws in which case yeah enforce them or youre not and leave them alone, or change the laws through democratic process and then enforce", "importance": null}, "P14": {"title": "Group disadvantage and individual fairness", "prompt": "How do you view this trade-off?", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "pretty clearly talking about affirmative action here. there are 2 dimensions of how to answer this:\n1. as a practical concern: pushing people in through a backdoor who are underqualified seems like youre setting them up for failure in a lot of cases and even if you arent, you undermine peoples faith in the fairness of institutions\n2. as a moral concern: I understand wanting to correct structural disadvantage but I think you do that upstream with other forms of economic redistribution and earlier childhood education. feels unfair to deny more qualified people spots at this stage", "importance": null}, "P15": {"title": "Immigration, national obligations, and universal welfare", "prompt": "Which principle would guide your decision?", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "as with most questions I think there is both a practical and moral dimension this:\n\nmorally: I dont think an american life is worth more than a life from another country. morally it feels kinda suspect to slam the doors shut. that said to the extent that the state exists in a social contract with its citizens, its primary obligations are to them. so I guess lean towards liberalization while being careful to optimize towards citizen wellbeing\n\npractically: letting the doors open to immigrants is terrible policy. people hate it and it opens up questions of fairness (why implicitly reward people for not following the proper processes) and can undermine social cohesion. immigration is good for the economy and society but should be done in a controlled and orderly way", "importance": null}, "P16": {"title": "Do you give special moral weight to the worst-off?", "prompt": "Does the disadvantaged person's improvement have greater moral value?", "answer": "Yes. An equal benefit matters morally more when it goes to someone worse off.", "explanation": "", "importance": null}, "P17": {"title": "What makes a right fundamental?", "prompt": "What is the deepest justification for giving certain rights special protection?", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": null}, "P18": {"title": "Can economic liberty be restricted for social welfare?", "prompt": "Is there a fundamental rights-based objection to this policy, even if its welfare benefits exceed its costs?", "answer": "There is a meaningful rights concern, but it can be outweighed by sufficiently strong public interests.", "explanation": "I guess I’ll start by saying I find the conventional account of property rights a little odd. That there exists objects in the world to which you and you alone are solely morally and therefore legally entitled. I dont like the idea of a state or some institution being able to reach in and take from people but I think philosophically that bothers me not bc I believe there is some sanctity to the ownership of stuff but rather I think there can be some violation of human dignity and autonomy. Like for example I find the idea that a person can buy a shit ton of land and kick everyone off of it kinda weird and not sure that there is a fully morally coherent justification, particularly when this land’s ownership is passed down through generations of inherited wealth.\n\nSo I care about property rights morally in as much as I think that a state that doesnt will overreach and shows that it does not respect the agency and autonomy of people. Practically too, if you can you arbitrarily take things from people, it undermines your political legitimacy and undermines peoples incentive to build and work.\n\nAll that said while I dont think the state should just arbitrarily take stuff from people, I also dont think there is some reified sanctity to the idea of owning stuff that intrinsically overrides the welfare of society as a whole", "importance": null}, "P19": {"title": "Democratic legitimacy versus constitutional rights", "prompt": "Should the court strike it down?", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "", "importance": null}, "P20": {"title": "Universal moral worth versus obligations to citizens", "prompt": "Which would you favor?", "answer": "Probably B, but governments may legitimately place some additional weight on citizens.", "explanation": "", "importance": null}, "P21": {"title": "Judicial power and democratic accountability", "prompt": "What is your preferred balance between judicial authority and democratic government?", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "principled objections and desires to preserve rights and liberties enshrined in the constitution im for strong judicial review. There is a real concern of tyranny of the masses. That said you cant just take principled objections for granted", "importance": null}, "P22": {"title": "Nationalism, patriotism, and political identity", "prompt": "What should hold a political community together?", "answer": "Shared constitutional principles, civic equality, and democratic institutions are sufficient", "explanation": "Your use of the word should implies a normative judgement. In that case yeah I think institutions and a belief in democratic and institutional values should be sufficient for national identity. Though I recognize in practice, shared traditions and symbols are also important for social cohesion. I also dont think national identity is itself a moral good but rather something of instrumental value for a functioning society. The reason I didnt go with the last option is the use of the word “can” which implies practical application. I dont think people in practice are willing to cooperate purely on the basis of abstract philosophical and political commitments", "importance": null}, "P23": {"title": "The welfare state and positive rights", "prompt": "Which approach best captures your view?", "answer": "Public provision should depend mainly on evidence of welfare gains, rather than an independent entitlement", "explanation": "", "importance": null}, "P24": {"title": "Religion, pluralism, and public institutions", "prompt": "How much accommodation should liberal society provide?", "answer": "Religious freedom deserves protection, but all public-facing institutions should meet robust secular equality standards", "explanation": "", "importance": null}, "P25": {"title": "Foreign policy: Liberal ideals versus strategic restraint", "prompt": "What principle should guide your country's response?", "answer": "Favor diplomatic engagement and targeted measures; avoid broad confrontations without clear prospects for improvement", "explanation": "", "importance": null}, "P26": {"title": "Markets, regulation, and the burden of proof", "prompt": "Where should the burden of proof lie?", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": null}, "P27": {"title": "Concentrated private power", "prompt": "How should government respond?", "answer": "Intervene selectively, including through competition policy and safeguards against arbitrary exclusion", "explanation": "Practically speaking government officials are poorly positioned to understand technology much less the 2nd order or other downstream effects of regulation which is often a blunt instrument. I think the gov needs to be willing to intervene in certain cases but should be circumspect when and how it chooses to do so, particularly when often times the changing nature of the market and technology solves the problem anyway (consider for example that many of the most powerful companies in the world in the 90s are shadows of themselves or defunct today)", "importance": null}, "P28": {"title": "Free speech and harmful expression", "prompt": "Would such suppression be morally legitimate?", "answer": "No; political expression should remain protected even when deeply harmful or offensive", "explanation": "", "importance": null}, "P29": {"title": "Capitalism and worker power", "prompt": "Which approach is closest to your preference?", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "I might be in favor of the 2nd one but it depends on what strengthening unions and bargaining rights and all of that actually entails. Like I said before I think regulation is often a blunt instrument and I think often the gov messes it up", "importance": null}, "P30": {"title": "Public order versus civil liberties", "prompt": "What should government prioritize?", "answer": "Protect protest rights while using narrow, content-neutral restrictions on severe disruption", "explanation": "", "importance": null}, "P31": {"title": "Healthcare and the welfare state", "prompt": "Which arrangement are you more inclined to support?", "answer": "Universal public insurance, because comprehensive access and risk pooling justify the institutional change", "explanation": "Healthcare is a great example of market failure - huge consolidations in the value chain has led to massive conglomerates and regulatory capture has led to results that are incommensurate with the massive costs. having a monopsony with a buyer that has the power to create more transparency and better pricing sounds like a way better move", "importance": null}, "P32": {"title": "Housing, local democracy, and property rights", "prompt": "How should government respond?", "answer": "Override restrictive local zoning and allow substantial construction, even against homeowners' preferences", "explanation": "Housing is a huge issue for the economy. Massively contributing to the affordability crisis. Just leaving things to local control is just ceding the issue to NIMBYs which is why we’re in this mess to begin with. Im def a YIMBY", "importance": null}, "P33": {"title": "Climate change and economic growth", "prompt": "What policy approach would you favor?", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "", "importance": null}, "P34": {"title": "Crime, punishment, and the rule of law", "prompt": "What should be the principal orientation of criminal-justice policy?", "answer": "Prioritize punishment and public order, accepting some additional restrictions to reduce crime", "explanation": "I think dems have been too soft on crime. At the very least you need to enforce the laws on the books and not tolerate public disorder and lawlessness. It’s a recipe for undermining social trust. Dont go the other way though and just blindly support the police and law enforcement. They have been hot beds of iniquity, corruption, and unaccountability. You need a competent and fair administration of justice. Reform law enforcement, dont be needlessly cruel but create law and order", "importance": null}, "P35": {"title": "International security and military intervention", "prompt": "What principle should guide the decision?", "answer": "Support the threatened democracy if the strategic outlook and expected consequences justify the risks", "explanation": "I think morally it’s good to support democracies against authoritarian aggression but practically foreign entanglements are a mess and have a ton of unintended consequences and just sap your political capital. It’s often the case that it’s just smarter to spend your chips elsewhere and avoid potential quagmires. A clear example of where what I think is morally good diverges from what I think is best policy", "importance": null}, "U1": {"title": "Federal taxation", "prompt": "Which general direction would you take federal tax policy over the next decade?", "answer": "Moderately increase taxes on high earners and capital income, while preserving incentives for investment", "explanation": "", "importance": null}, "U2": {"title": "Federal spending and deficits", "prompt": "The United States faces persistent fiscal deficits, rising debt-service costs, and pressure to finance healthcare, retirement benefits, defense, and other priorities. What would you prioritize?", "answer": "Make deficit reduction a central priority through meaningful spending reforms and some revenue measures", "explanation": "", "importance": null}, "U3": {"title": "Minimum wage and labor markets", "prompt": "What minimum-wage policy would you support?", "answer": "Use an alternative such as wage subsidies or expanded earned-income tax credits as the main instrument", "explanation": "", "importance": null}, "U4": {"title": "Business regulation and competition", "prompt": "How would you change US economic regulation, including antitrust enforcement?", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "", "importance": null}, "U5": {"title": "Healthcare system", "prompt": "Which healthcare arrangement would you favor for the United States?", "answer": "Single-payer national insurance replacing most private primary insurance", "explanation": "", "importance": null}, "U6": {"title": "Legal immigration levels", "prompt": "What would you do with the number of people admitted legally to the United States for permanent residence, including family-, employment-, and humanitarian-based categories?", "answer": "Increase moderately, particularly through employment-based immigration", "explanation": "", "importance": null}, "U7": {"title": "Unauthorized immigration and enforcement", "prompt": "What should US policy prioritize for people currently living in the country without legal immigration status?", "answer": "A conditional path to legal status for established residents, alongside strong border enforcement and immigration-system reform", "explanation": "", "importance": null}, "U8": {"title": "Policing and public disorder", "prompt": "Suppose a major American city experiences persistent shoplifting, public drug use, transit disorder, and other low-level offenses, alongside more serious violent crime. What would you do?", "answer": "Consistently enforce both minor and serious offenses, with proportionate sanctions, accountable policing, and diversion where effective", "explanation": "", "importance": null}, "U9": {"title": "Criminal sentencing and incarceration", "prompt": "Which broad change would you support to American sentencing policy?", "answer": "Reduce incarceration for nonviolent offenses while maintaining strong penalties for serious violent crime", "explanation": "", "importance": null}, "U10": {"title": "Drugs and addiction", "prompt": "Which approach would you support toward adult recreational drug use, including substances with high addiction and overdose risks?", "answer": "Legalize and regulate most drugs, including hard drugs, with strong treatment and harm-reduction services", "explanation": "", "importance": null}, "U11": {"title": "Energy and electricity production", "prompt": "US energy policy must balance electricity affordability, reliability, emissions, and rapidly growing demand. Which approach would you implement?", "answer": "Pursue energy abundance across nuclear, renewables, and fossil fuels, with broad permitting reform", "explanation": "", "importance": null}, "U12": {"title": "Environmental review and infrastructure permitting", "prompt": "Major housing, transit, energy, and transmission projects can face lengthy approval processes. Environmental reviews protect legitimate interests but may also delay construction and increase costs.", "answer": "Substantially streamline permitting and limit procedural opportunities to block projects", "explanation": "", "importance": null}, "U13": {"title": "K–12 education and school choice", "prompt": "Consider public-school funding, charter schools, private-school vouchers, teacher accountability, and family choice. What would be your main policy direction?", "answer": "Use another approach, particularly for funding or school governance", "explanation": "Im not sufficiently versed on the literature on charter school and voucher outcomes to have a strong view but generally I think all of education starts with determining how to quantify and measure leaning effectively and rigorously measuring and optimizing towards that and making corrections and adjustments accordingly (e.g. fire bad teachers quickly, pay and recognize good teachers more, etc)", "importance": null}, "U14": {"title": "College affordability and student loans", "prompt": "US policymakers must decide how to distribute higher-education costs among taxpayers, students, and institutions.", "answer": "Reduce federal lending and subsidies significantly, relying more on institutional competition and private financing", "explanation": "", "importance": null}, "U15": {"title": "Industrial policy and domestic manufacturing", "prompt": "Should the US government use subsidies, tax credits, tariffs, or public procurement to expand domestic manufacturing in strategically important industries such as semiconductors, batteries, and advanced technology?", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": null}, "U16": {"title": "Abortion policy", "prompt": "What federal policy would you favor regarding abortion access?", "answer": "Protect abortion access nationally throughout pregnancy, subject to medical regulation", "explanation": "", "importance": null}, "U17": {"title": "Transgender rights and public policy", "prompt": "Which policy approach would you favor regarding gender identity, particularly legal recognition, school policies, sports participation, and medical treatment for minors?", "answer": "Strong federal protections for gender identity, with generally broad access and inclusion", "explanation": "", "importance": null}, "U18": {"title": "Voting and election administration", "prompt": "Which general election-administration reforms would you support?", "answer": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "explanation": "", "importance": null}, "U19": {"title": "Federal bureaucracy and civil-service reform", "prompt": "How should the federal government change the way agencies recruit, evaluate, retain, and dismiss employees?", "answer": "Strengthen performance evaluation and management while preserving meaningful protections against politicization", "explanation": "", "importance": null}, "U20": {"title": "Social Security and Medicare fiscal reform", "prompt": "Assume long-run financing pressures require changes to major federal retirement and healthcare programs. Which direction would you prioritize?", "answer": "Prioritize slowing benefit growth, means-testing, and adjusting retirement eligibility while protecting poorer recipients", "explanation": "Tbh social security and medicare is a tricky one. I think it’s important to protect impoverished elderly people but the economics of this system are kinda out of whack. As society ages and birth rates decline, it’s gonna become increasingly uneconomical (you can see this in other countries with fights over fiscal austerity in relation to budgetary concerns). To the extent that I worry about the practical dimensions of this, I think pragmatically you gotta eventually phase out at least some of these benefits", "importance": null}, "U21": {"title": "Defense spending and military strategy", "prompt": "How would you change US defense spending and force structure over the coming decade?", "answer": "Restructure the military around a narrower set of strategic threats while reducing less essential global commitments", "explanation": "", "importance": null}, "U22": {"title": "NATO and American alliances", "prompt": "How should the United States approach NATO and other long-standing security alliances?", "answer": "Maintain strong alliances while requiring substantially greater allied defense contributions", "explanation": "", "importance": null}, "U23": {"title": "China, trade, and economic security", "prompt": "How should the US manage economic relations with China?", "answer": "Adopt strong restrictions in strategic technologies while preserving significant ordinary trade", "explanation": "China is by far the biggest geopolitical threat the us faces. It’s of paramount importance that we treat them accordingly in our alliances, military investments and economic investments and policies. But dont just start stupid trade wars. You dont need to totally suspend trade", "importance": null}, "U24": {"title": "Military aid and foreign conflicts", "prompt": "Consider countries resisting military aggression but lacking a formal American defense guarantee. What should US assistance policy generally be?", "answer": "Provide meaningful assistance where it supports identifiable strategic interests and has a credible prospect of success", "explanation": "", "importance": null}, "U25": {"title": "National security and domestic surveillance", "prompt": "Suppose intelligence agencies argue that expanded surveillance authorities would improve their capacity to detect terrorism, foreign espionage, and other national-security threats. The proposed measures involve broader collection of Americans' communications data, with judicial oversight and periodic review.", "answer": "Substantially restrict existing surveillance authorities and require individualized warrants for more activities", "explanation": "", "importance": null}}}</script>
<script>
(() => {
  const R = JSON.parse(document.getElementById("report-data").textContent);
  const app = document.getElementById("app");
  const FIX_KEY = "politype-fixes-" + R.slug;
  let fixes = {};
  try { fixes = JSON.parse(localStorage.getItem(FIX_KEY) || "{}"); } catch (e) {}

  // Tiny element builder. Text always goes through textContent.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }

  function evidence(ids) {
    if (!ids || !ids.length) return null;
    const d = h("details", { class: "ev" },
      h("summary", {}, "Based on", ...ids.map((id) => h("span", { class: "qid", text: id }))));
    const list = h("div", { class: "ev-list" });
    for (const id of ids) {
      const e = R.evidence[id]; if (!e) continue;
      const x = e.explanation ? (e.explanation.length > 420 ? e.explanation.slice(0, 420).trimEnd() + "…" : e.explanation) : null;
      list.append(h("div", { class: "ev-item" },
        h("span", { class: "q" }, h("span", { class: "code", text: id + "  " }), e.title),
        h("span", { class: "a", text: e.answer }),
        x && h("span", { class: "x", text: "“" + x + "”" })));
    }
    d.append(list);
    return d;
  }

  function fixControl(id, label) {
    const wrap = h("div", { class: "fix-box" });
    const btn = h("button", { class: "fix", type: "button", text: fixes[id] ? "Edit your correction" : "That's not what I meant" });
    btn.addEventListener("click", () => {
      if (wrap.querySelector("textarea")) return;
      const ta = h("textarea", { id: "fix-" + id, "aria-label": "Correction for " + label, placeholder: "What did you actually mean?" });
      ta.value = fixes[id]?.note || "";
      ta.addEventListener("input", () => {
        const note = ta.value.trim();
        if (note) fixes[id] = { finding: label, note }; else delete fixes[id];
        try { localStorage.setItem(FIX_KEY, JSON.stringify(fixes)); } catch (e) {}
        renderTray();
      });
      wrap.append(ta); ta.focus();
    });
    wrap.append(btn);
    return wrap;
  }

  function section(n, id, title, intro, ...body) {
    return h("section", { class: "s", id },
      h("div", { class: "s-head" }, h("span", { class: "n", text: n }), h("h2", { text: title })),
      intro && h("p", { class: "intro", text: intro }), ...body);
  }

  // First sentence as the visible gist; the rest goes behind "Show details".
  function split(text) {
    const m = (text || "").match(/^(.+?[.!?])(\s+[A-Z“"(].*)?$/s);
    return m ? [m[1], (m[2] || "").trim()] : [text || "", ""];
  }
  function card(cls, head, body) {
    return h("details", { class: "x " + cls }, h("summary", {}, ...head, h("span", { class: "more" }, h("span"))),
      h("div", { class: "body" }, ...body));
  }

  const P = R.portrait, S = R.stats;
  const name = R.respondent.name || "Anonymous";
  const head = R.tensions.find((t) => t.id === R.headline_tension);
  const CAT = { logical: "Logical contradiction", practical: "Practical tension", empirical: "Empirical vulnerability", unusual: "Unusual combination" };

  // 1. Portrait
  const portrait = h("div", { class: "portrait" },
    h("div", { class: "eyebrow code" }, h("span", { text: "POLITYPE · " + name.toUpperCase() }),
      h("span", { text: `${S.answered} ANSWERS · ${S.explained} EXPLAINED` })),
    h("div", { class: "portrait-top" },
      h("div", { class: "portrait-main" },
        h("h1", { text: P.archetype }),
        h("p", { class: "tagline", text: P.tagline }),
        h("p", { class: "summary", text: P.summary })),
      h("div", { class: "traits" }, P.traits.map((t) => h("div", { class: "t" }, h("b", { text: t.label }), h("span", { text: t.detail }))))),
    h("div", { class: "positions" }, P.signature_positions.map((p) => h("div", {}, h("b", { text: p.label }), h("span", { text: p.detail })))),
    head && h("div", { class: "headline" }, h("span", { class: "k", text: "Your sharpest tension" }), h("b", { text: head.title }), h("span", { text: split(head.detail)[0] }), h("a", { href: "#tensions", style: "font-size:13px;color:inherit", text: "See all tensions" })));

  const toc = h("nav", { class: "toc", "aria-label": "Report sections" },
    [["spectrum", "Spectrum"], ["affiliations", "Affiliations"], ["tensions", "Tensions"], ["blindspots", "Blind spots"], ["you", "Who you are"], ["evidence", "Why these findings"]]
      .map(([id, t]) => h("a", { href: "#" + id, text: t })));

  // Why-these-findings: portrait evidence, expandable
  const expandBtn = h("button", { class: "btn", type: "button", id: "expand-all", text: "Expand all" });
  expandBtn.addEventListener("click", () => {
    const open = expandBtn.textContent === "Expand all";
    document.querySelectorAll("details.x").forEach((d) => { d.open = open; });
    expandBtn.textContent = open ? "Collapse all" : "Expand all";
  });

  const why = section("07", "evidence", "Why these findings", "Each trait and position above comes from specific answers. Open one to see them.",
    h("div", { class: "cards" },
      ...P.traits.map((t, i) => card("finding", [h("h3", { text: t.label })], [h("p", { text: t.detail }), evidence(t.evidence), fixControl("trait-" + i, t.label)])),
      ...P.signature_positions.map((p, i) => card("finding", [h("h3", { text: p.label })], [h("p", { text: p.detail }), evidence(p.evidence), fixControl("position-" + i, p.label)]))));

  // 2. Spectrum
  const pct = (v) => ((v + 2) / 4) * 100;
  const axes = h("div", { class: "axes" }, R.axes.map((a) => {
    const track = h("div", { class: "track", role: "img", "aria-label": `${a.name}: ${a.score == null ? "not enough answers" : a.score.toFixed(2)} on a scale from -2 (${a.low}) to +2 (${a.high})` },
      h("div", { class: "line" }),
      ...[-2, -1, 0, 1, 2].map((v) => h("div", { class: "tick" + (v === 0 ? " mid" : ""), style: `left:${pct(v)}%` })),
      a.score != null && h("div", { class: "dot", style: `left:${pct(a.score)}%` }));
    return h("div", { class: "axis" },
      h("div", { class: "top" }, h("b", { text: a.name }), h("span", { text: a.score == null ? "Not enough answers" : `${a.score > 0 ? "+" : ""}${a.score.toFixed(2)} · ${a.n} answers` })),
      h("div", { class: "bar-wrap" }, track, h("div", { class: "ends" }, h("span", { text: a.low }), h("span", { text: a.high }))),
      evidence(a.evidence));
  }));
  const spectrum = section("02", "spectrum", "Your political spectrum",
    "Each axis runs from -2 to +2. Your position is the average of your answers that bear on it, scored with a fixed key, not by AI. Answers where you rejected the options do not count.", axes);

  // 3. Affiliations
  const A = R.affiliations;
  const AG = { agree: "Agree", partial: "Partial", disagree: "Disagree", unclear: "Unclear" };
  const partyCell = (c) => {
    if (!c) return h("td", {}, "");
    const srcs = (c.sources || []).map((s) => h("a", { href: s.url, target: "_blank", rel: "noopener", text: `${s.title}${s.date ? " (" + s.date + ")" : ""}` }));
    return h("td", {}, h("span", { class: "ag " + (c.agreement || "unclear"), text: AG[c.agreement] || "Unclear" }),
      (c.note || c.summary) && h("details", {}, h("summary", { text: "Why" }),
        c.note && h("span", { class: "note", text: c.note }),
        c.summary && h("p", {}, h("b", { text: "Documented position: " }), c.summary), ...srcs.map((a) => h("div", {}, a))));
  };
  const affil = section("03", "affiliations", "Your political and philosophical affiliations", null,
    h("div", { class: "cards" }, A.traditions.map((t, i) => card("finding",
      [h("h3", { text: t.name }), h("p", { class: "muted lead", text: t.definition })],
      [h("dl", { class: "fields" }, h("dt", { text: "Where you overlap" }), h("dd", { text: t.overlap }), h("dt", { text: "Where you differ" }), h("dd", { text: t.differences })),
       evidence(t.evidence), fixControl("tradition-" + i, t.name)]))),
    A.thinkers.length && h("div", { class: "finding" }, h("span", { class: "label-sm", text: "Thinkers you resemble" }),
      h("div", { class: "thinkers" }, A.thinkers.map((t) => card("", [h("b", { text: t.name + (t.cited_by_you ? " (you cite them)" : "") })], [h("p", { text: t.why })])))),
    A.party_rows.length && h("p", { class: "intro", text: A.party_summary }),
    A.party_rows.length && h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", { text: "Issue" }), h("th", { text: "You" }), h("th", { text: "Democrats" }), h("th", { text: "Republicans" }))),
      h("tbody", {}, A.party_rows.map((r) => h("tr", {}, h("td", {}, h("span", { class: "code", text: r.qid + " " }), r.issue), h("td", { text: r.your_position }), partyCell(r.D), partyCell(r.R)))))),
    A.party_as_of && h("p", { class: "muted", style: "font-size:13px", text: `Party positions are sourced and dated as of ${A.party_as_of}. They compare stated positions issue by issue. They are not a recommendation.` }));

  // 4. Tensions
  const tensions = section("04", "tensions", "Your internal tensions",
    "Each tension below was proposed, then checked against your own explanations by a second pass that tried to refute it. Where you had already reconciled two views, it says so.",
    h("div", { class: "cards" }, R.tensions.map((t) => { const [g, rest] = split(t.detail); return card("finding", [
      h("div", { class: "chips" }, h("span", { class: "chip", text: CAT[t.category] || t.category }),
        h("span", { class: "chip " + t.status, text: t.status === "stands" ? "Unresolved" : "You've reconciled this" })),
      h("h3", { text: t.title }), h("p", { class: "lead", text: g })], [
      rest && h("p", { text: rest }),
      t.status === "stands" && h("dl", { class: "fields" },
        h("dt", { text: "Why it matters" }), h("dd", { text: t.why_it_matters }),
        h("dt", { text: "What would resolve it" }), h("dd", { text: t.what_would_resolve })),
      evidence(t.evidence), fixControl("tension-" + t.id, t.title)]); })));

  // 5. Blind spots
  const blind = section("05", "blindspots", "Your potential blind spots",
    "Assumptions your answers rely on that deserve a second look. None of these say your position is wrong.",
    h("div", { class: "cards" }, R.blind_spots.map((b, i) => card("finding", [
      h("h3", { text: b.title }), h("p", { class: "lead", text: b.assumption })], [
      h("p", { text: b.detail }),
      h("dl", { class: "fields" },
        h("dt", { text: "Why it matters" }), h("dd", { text: b.why_it_matters }),
        h("dt", { text: "What would resolve it" }), h("dd", { text: b.what_would_resolve })),
      evidence(b.evidence), fixControl("blind-" + i, b.title)]))),
    R.open_questions.length && h("div", { class: "finding" }, h("span", { class: "label-sm", text: "Questions your answers leave open" }),
      h("ul", { class: "qs" }, R.open_questions.map((q) => h("li", { text: q })))));

  // 6. Who you are
  const Pr = R.profile;
  const you = section("06", "you", "What your answers suggest about you", Pr.material_note,
    h("p", { class: "profile-portrait", text: Pr.summary_portrait }),
    h("div", { class: "cards" }, Pr.sections.map((s, si) => h("div", { class: "finding" }, h("h3", { text: s.title }),
      h("div", { class: "sublist" },
        ...(s.strong || []).map((o, i) => { const [g, rest] = split(o.claim); return card("obs", [h("p", { text: g })],
          [rest && h("p", { text: rest }), o.quote && h("blockquote", { text: "“" + o.quote + "”" }), evidence(o.evidence), fixControl(`you-${si}-s${i}`, o.claim.slice(0, 80))]); }),
        (s.speculative || []).length && h("span", { class: "label-sm", text: "Speculative" }),
        ...(s.speculative || []).map((o, i) => { const [g, rest] = split(o.claim); return card("obs spec", [h("p", { text: g })],
          [rest && h("p", { text: rest }), evidence(o.evidence), fixControl(`you-${si}-p${i}`, o.claim.slice(0, 80))]); }))))));

  const footer = h("footer", {}, `Generated ${R.generated_at} from ${S.answered} answers and ${S.explained} written explanations. The spectrum is computed from a fixed scoring key. The written analysis is by Claude and cites the answers behind every finding. Use "That's not what I meant" on anything that misreads you, then send your corrections back.`);

  app.textContent = "";
  app.append(portrait, h("div", { class: "toolbar" }, toc, expandBtn), spectrum, affil, tensions, blind, you, why, footer);

  // Corrections tray
  function renderTray() {
    const n = Object.keys(fixes).length;
    document.getElementById("tray").hidden = !n;
    document.getElementById("trayText").textContent = `${n} correction${n === 1 ? "" : "s"} noted`;
  }
  document.getElementById("trayCopy").addEventListener("click", async (e) => {
    const text = JSON.stringify({ slug: R.slug, corrections: Object.entries(fixes).map(([id, f]) => ({ id, ...f })) });
    try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied. Send it back"; }
    catch (err) {
      const ta = document.getElementById("trayFallback");
      ta.value = text; ta.hidden = false; ta.select();
      e.target.textContent = "Select and copy the text";
    }
  });
  renderTray();
})();
</script>
</body></html>
