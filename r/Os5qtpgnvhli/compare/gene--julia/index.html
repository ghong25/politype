, "a": {"answer_id": "U15.b", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U15.b", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": 5, "tags": []}}, {"qid": "U16", "part": "U", "title": "Abortion policy", "level": "close", "a": {"answer_id": "U16.a", "answer": "Protect abortion access nationally throughout pregnancy, subject to medical regulation", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U16.b", "answer": "Protect abortion access nationally through viability, with later exceptions for serious medical circumstances", "explanation": "Abortion care is a healthcare right. The state should not infringe upon healthcare rights. However abortion should not be allowed after the fetus can live outside the womb.", "importance": 5, "tags": []}}, {"qid": "U17", "part": "U", "title": "Transgender rights and public policy", "level": "apart", "a": {"answer_id": "U17.a", "answer": "Strong federal protections for gender identity, with generally broad access and inclusion", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U17.c", "answer": "Protect adult private choices, but adopt relatively restrictive policies for minors, schools, and sex-separated settings", "explanation": "Adult choice should be respected", "importance": 3, "tags": []}}, {"qid": "U18", "part": "U", "title": "Voting and election administration", "level": "match", "a": {"answer_id": "U18.b", "answer": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U18.b", "answer": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "explanation": "ID should be required. Pro rank choice voting. However voting should be accessible.", "importance": 3, "tags": []}}, {"qid": "U19", "part": "U", "title": "Federal bureaucracy and civil-service reform", "level": "close", "a": {"answer_id": "U19.b", "answer": "Strengthen performance evaluation and management while preserving meaningful protections against politicization", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U19.c", "answer": "Make it substantially easier to dismiss underperforming federal employees, restructure agencies, and tie advancement to measurable results", "explanation": "", "importance": 3, "tags": []}}, {"qid": "U20", "part": "U", "title": "Social Security and Medicare fiscal reform", "level": "apart", "a": {"answer_id": "U20.c", "answer": "Prioritize slowing benefit growth, means-testing, and adjusting retirement eligibility while protecting poorer recipients", "explanation": "Tbh social security and medicare is a tricky one. I think it’s important to protect impoverished elderly people but the economics of this system are kinda out of whack. As society ages and birth rates decline, it’s gonna become increasingly uneconomical (you can see this in other countries with fights over fiscal austerity in relation to budgetary concerns). To the extent that I worry about the practical dimensions of this, I think pragmatically you gotta eventually phase out at least some of these benefits", "importance": null, "tags": []}, "b": {"answer_id": "U20.b", "answer": "Combine additional revenue with gradual adjustments to benefits, eligibility, or payment systems", "explanation": "Society should not be subsidizing old age programs at the expense of future generations. If necessary benefits should be reduced slowly to protect spending on the young. However if tax loopholes were closed this wouldn’t be an issue.", "importance": 4, "tags": []}}, {"qid": "U21", "part": "U", "title": "Defense spending and military strategy", "level": "apart", "a": {"answer_id": "U21.c", "answer": "Restructure the military around a narrower set of strategic threats while reducing less essential global commitments", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U21.b", "answer": "Maintain a large, globally capable military, with selective modernization and efficiency reforms", "explanation": "Maintaining a strong military is important but “strong” means innovation", "importance": 4, "tags": []}}, {"qid": "U22", "part": "U", "title": "NATO and American alliances", "level": "match", "a": {"answer_id": "U22.b", "answer": "Maintain strong alliances while requiring substantially greater allied defense contributions", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U22.b", "answer": "Maintain strong alliances while requiring substantially greater allied defense contributions", "explanation": "NATO and other alliances are vital to protecting the peace and democracy in our world. The US should be a leader but should not encourage freeloading from allies", "importance": 5, "tags": []}}, {"qid": "U23", "part": "U", "title": "China, trade, and economic security", "level": "match", "a": {"answer_id": "U23.b", "answer": "Adopt strong restrictions in strategic technologies while preserving significant ordinary trade", "explanation": "China is by far the biggest geopolitical threat the us faces. It’s of paramount importance that we treat them accordingly in our alliances, military investments and economic investments and policies. But dont just start stupid trade wars. You dont need to totally suspend trade", "importance": null, "tags": []}, "b": {"answer_id": "U23.b", "answer": "Adopt strong restrictions in strategic technologies while preserving significant ordinary trade", "explanation": "", "importance": 5, "tags": []}}, {"qid": "U24", "part": "U", "title": "Military aid and foreign conflicts", "level": "match", "a": {"answer_id": "U24.b", "answer": "Provide meaningful assistance where it supports identifiable strategic interests and has a credible prospect of success", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "U24.b", "answer": "Provide meaningful assistance where it supports identifiable strategic interests and has a credible prospect of success", "explanation": "Meaningful assistance should be given to democracies even if at decent cost if there is a threat to US strategic interests. US should not protect governments that are undemocratic unless there is a significant national security threat", "importance": 5, "tags": ["depends"]}}, {"qid": "U25", "part": "U", "title": "National security and domestic surveillance", "level": "apart", "a": {"answer_id": "U25.d", "answer": "Substantially restrict existing surveillance authorities and require individualized warrants for more activities", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U25.b", "answer": "Permit narrowly targeted expansions where agencies can demonstrate specific operational needs", "explanation": "Important to protect individual rights while also protecting society as a whole. Distinction between surveillance on native citizens and immigrants or naturalized immigrants.  Judicial review should play an important role.", "importance": 4, "tags": []}}], "evidence": {"gene:P1": {"title": "What is the primary purpose of government?", "answer": "A combination or different principle", "explanation": "This is a challenging question that I dont think necessarily has a very simple answer. I start by thinking about it from a political theory lens. why do you need a government? not to go all hobbsian but I do think there is a significant concern of anarchy without a state and without a monopoly on the legitimate use of violence (I guess not to go all weber either). after you've cleared that very basic threshold, I think it becomes a lot murkier bc a lot of things that sound good in principle need to be traded off against one another and I feel like it's a facile perspective to just choose a single thing and say that is the only thing to optimize for. I'd say it's prob some combination of promoting collective welfare through building and maintaining strong and stable institutions (e.g. rule of law) while ensuring that individual rights and freedoms are respected. might seem like a bit of a cop out to choose a combo of what youre saying but in my view, it feels arbitrary to just pick one and say thats the main thing", "importance": null}, "julia:P1": {"title": "What is the primary purpose of government?", "answer": "A combination or different principle", "explanation": "Gov purposes is to both protect individual rights and freedoms but balance that responsibility with protecting society overall from external and internal threats of those who seek to suppress individual rights/liberties.", "importance": 5}, "gene:P2": {"title": "How do you view economic inequality?", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "Oof. another tricky one. the one I choose is the closest I guess to what I think but that is itself kinda reductive bc then you have other questions like what is excessive and what do you then do about it? I'd say a few things:\n- I think some degree of inequality is structurally inherent if you want markets (given differences in natural endowments of ability and even things like desire to work hard)\n- I think some degree of inequality is even good as a means to reward and incentivize innovation and effort\n- however, there are 2 further issues that arrise: 1. what is the cause for the inequality in a society? 2. how much inequality are we seeing?\nto the former, I'd say that a lot of inequality we actually see is due to issues like inequality of opportunity, unequal access to resources, legacy of stuff like redlining. to the latter, I think this is a harder question. I take issue with some of the leftist views like all great wealth is inherently exploitative (I think thats absurd) and no billionaires should exist in a just society, however it does strike me as absurd that there are so many holes in the tax codes and structural inequalities through which the wealthy perpetuate their advantages. im not sure that you can necessarily say something like once you've hit X number you need to do Y thing (I think thats a clearly very blunt instrument) but I do think the urgency of the problem does depend on the extend of the inequality", "importance": null}, "julia:P2": {"title": "How do you view economic inequality?", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "I think several of these things are true. Income inequality is acceptable but if it becomes extremely skewed such that the lower end cannot afford basics such as food and healthcare, this threatens societal stability which is not acceptable. Income equality should not be the goal of the state; however, opportunities should exist for children of lower income families to improve their lot in life. Similarity, death tax burdens should be sufficiently high that the children of the high income are also motivated to contribute to society.", "importance": 3}, "gene:P3": {"title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null}, "julia:P3": {"title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "answer": "Individual freedom, but with reasonable public-interest restrictions", "explanation": "It depends on which individual freedoms and what the impact to collective welfare is but generally individual freedom should be protected as long as your individual freedom doesn’t encroach upon another’s individual freedom or create at large issues for public welfare.", "importance": 4}, "gene:P4": {"title": "How should society approach longstanding traditions and institutions?", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "depends on why youre asking. are you asking if I value tradition as a thing in and of itself or more as a functional and practical matter. I dont really care about tradition intrinsically. I think if something is broken/doesnt make sense you should fix it/change it. im not precious about the past in that way. however, pragmatically I think there are 2 major concerns with that kind of approach: 1. like james c scott says in seeing like a state, theres a huge danger in people thinking they know it all and can destroy and remake everything in a more rational and superior way. that kind of myopic hubris can be way worse than leaving things as they are. supporting radical change presupposes that the change will be good and there wont be any massive downstream negative consequence which we've seem time and time again is not the case 2. even if you presuppose that it's gonna be good, people and societies as a whole can have a negative reaction to just upturning the way things work. incrementalism is often more effective to counteract this.\n\nnow I dont wanna make blanket statements. if you see something thats genuinely super fucked up like slavery, then yeah fix it sure but generally, Im on the side of being careful and circumspect", "importance": null}, "julia:P4": {"title": "How should society approach longstanding traditions and institutions?", "answer": "Reform them gradually, respecting accumulated experience", "explanation": "Longstanding traditions shouldn’t be able to be changed on whims, significant collective approval over time should be the prerequisite to avoid the tyranny of the majority.", "importance": 4}, "gene:P5": {"title": "Which statement best captures your conception of justice?", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "I take issue with the premise behind these answers. its a single choice multiple choice which positions these as competing things. the choice I made is the closest to what I think but do generally believe in some vague kantian idea of giving people what theyre due as well and that structural disadvantages and inequalities should be corrected as well for example.", "importance": null}, "julia:P5": {"title": "Which statement best captures your conception of justice?", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "", "importance": 5}, "gene:P6": {"title": "Redistribution and taxation", "answer": "Another approach or important distinction", "explanation": "so I think generally when theres a tradeoff at play with a policy decision, as there very much is, I think the state should optimize for greatest cumulative welfare (while still doing so within the constraints of the law and of respecting individual rights). so with the way that youre framing it, if it's a modest reduction in investment in growth, if we can quantify how modest and see that the improvement in collective welfare is great in relation to that, then yeah Im for it. however, i dont believe in redistribution at all costs and totally ignoring deadweight loss and inefficiency. there is a real danger of killing the proverbial golden goose.\n\nI think there are 2 concerns here: 1. practical administration of policy 2. moral framework\nmy answer above is largely in response to 1. I do think that huge inequality is problematic in itself both bc it presents big political concerns (money in politics, oligarchy, etc) and bc it's hard to think of a moral justification for why we should have trillionaires when so many people live in desperate poverty", "importance": null}, "julia:P6": {"title": "Redistribution and taxation", "answer": "Only modestly; growth, incentives, and property rights deserve greater weight", "explanation": "Modest support. Instead of much higher income taxes, death tax burdens should be higher to still incentivize high innovation of productive citizens during their life. Tax law should be reformed to prevent underhanded tax avoidance schemes.", "importance": 4}, "gene:P7": {"title": "Markets versus government", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Im a big believer in the power of markets. the power of competition, price discovery, and efficiency through the free market is very important and societally beneficial but I think it's a huge mistake to reify the market and treat it as a end onto itself. it should ultimately be constrained by the state where there are market failures and where there are dangers of distorting effects from monopolies\n\nI think Im sorta in between mixed economy and markets should be default. I think the chicago school and reagan types are too deferential towards the economy and insufficiently wary of the ways in which the market can fail but at the same time, I believe i the dynamism of markets - e.g. I think europe has too many stifling regulations which in turn have led to sclerotic growth and in turn have empowered populists and right wing movements who look for a scapegoat for this lack of growth. so I think theres not just a practical concern for recognizing how the market can be superior to the state but also a concern that a lack of growth and development can be very politically destabilizing too", "importance": null}, "julia:P7": {"title": "Markets versus government", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Gov should have some regulations to prevent unfair/exploitative markets. But market forces should generally be allowed to prevail.", "importance": 4}, "gene:P8": {"title": "Individual liberty and paternalism", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "hmmm well the reason I say possibly is bc in principle i think competent adults should be able to do whatever they want even if it's bad for them but I can imagine scenarios in which the activity is so harmful that just saying that as a blanket statement prob goes too far. e.g. consider how addictive fentanyl is and how many people it kills. I would lean on the side of letting people make choices that might be harmful to them but I also wouldnt treat this as a moral absolute", "importance": null}, "julia:P8": {"title": "Individual liberty and paternalism", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "Depends on the activity and harm. Regulations should be tailored. IE gambling: if it is allowed, should be limited to 5% of one’s annual income. Someone who has been arrested for a drinking/drug related violent offense should be banned from legally consuming those items, but not every adult. Most hard drugs should be completely banned.", "importance": 4}, "gene:P9": {"title": "Democracy versus expertise", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "ugh this is another really tricky one. I think theres a lot of issues at play here.\n- the majority of the public is nowhere near educated, informed (or frankly intelligent) enough to be able to form meaningful opinions on complex issues. i think theres a very real concern of demagogues exploiting that - rail against the corrupt, unaccountable elites, push a bunch of stuff that sounds nice that will wreck the countries finances/long term well being\n- at the same time, I do think there is danger in an idea of a class of people who paternalistically treat the who country as a bunch of morons who dont know enough to make their own choices (and I think we saw aspects of this with stuff like the iraq war or GFC for example - theres a reason why there has been a big backlash to technocratic rule and the idea that theres a few experts who are smart enough to run everything). I worry about that from both a moral standpoint (feels deeply undemocratic to just override whatever the public wants) and from a practical standpoint (going back to the seeing like a state thing - danger of the hubris of experts).\n- i dont really have a good answer ultimately bc I think these are 2 countervailing but both very real things. I guess I'd just say that politically theres more danger in an unaccountable elite overriding the public will and then getting things wrong and delegitimizing the state as we've seen in recent times. but on the whole I def believe in expert knowledge and think things like fed independence is good - you need people like economists and domain experts who can act as stewards for the public good", "importance": null}, "julia:P9": {"title": "Democracy versus expertise", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "Tough. Ideally would have an independent body always acting on true science to only prevent disaster. However the implementation of this would be extremely difficult.", "importance": 5}, "gene:P10": {"title": "Equality of opportunity versus equality of outcomes", "answer": "Actively reduce extreme disparities in outcomes through redistribution and structural reform", "explanation": "so I want to qualify what Im saying what Im saying here. I def dont believe in communism or state enforced mass equality but going back to one of my earlier points, inasmuch as the state should be concerned with collective welfare, I think its good to reduce disparities in outcome if it will raise collective welfare. I see it as a sort of technocratic/optimization problem: how do we ensure the greatest good for the greatest number", "importance": null}, "julia:P10": {"title": "Equality of opportunity versus equality of outcomes", "answer": "Focus on protecting equal rights and fair rules; unequal outcomes aren't intrinsically unjust", "explanation": "Groups should not be given less opportunity because they belong to an historically advantaged group of historically disadvantaged groups have access to quality institutions", "importance": 5}, "gene:P11": {"title": "Are individual rights inviolable?", "answer": "No. Certain rights should not be violated, even to maximize welfare.", "explanation": "yeah this is a good illustration of what I mean when I say that I think we should generally maximize welfare but subject to the constraints of a rule based order and individual rights. first I kind reject the premise that you can violate rights without creating an institutional precedent, but even if I grant you that, I think individual rights override a general util max framework", "importance": null}, "julia:P11": {"title": "Are individual rights inviolable?", "answer": "I reject the framing or would answer differently.", "explanation": "I don’t see a situation where a small group of totally innocent people would be in possession of such dangerous information, and how this would be known before implementing surveillance. With this background cannot guarantee it wouldn’t be an institutional precedent.", "importance": 3}, "gene:P12": {"title": "Whose welfare matters most?", "answer": "Probably A, depending on the size of the overall welfare loss.", "explanation": "what does welfare mean here? the construction of your question leads me to think youre measuring this in the form of wealth or whatever. for a problem like this I wouldnt think about welfare in those terms. I think about it in terms of human flourishing (which I know is kinda squishy but bear with me) and diminishing marginal returns is very real. if you have a policy that would take $10k from a middle class person but net Bezos $10B Im not sure thats a good idea bc the value of an incremental 10b to bezos is basically nothing, for example. so I kinda take issue with the way you frame the question. i feel like for such a scenario to even exist youre prob messing up your util calc", "importance": null}, "julia:P12": {"title": "Whose welfare matters most?", "answer": "Policy B. Higher aggregate welfare is the decisive consideration here.", "explanation": "Policy B, but it also depends on the impact of policy A. Is the welfare loss substantial to a subgroup of the better off? If so, no to policy A. If welfare loss is essentially unnoticeable, then I would pick policy A. But generally in a society overall welfare loss should be avoided.", "importance": 4}, "gene:P13": {"title": "Cultural liberalism and social norms", "answer": "Strongly protect the minority's freedom and reject state enforcement of conventional morality.", "explanation": "tbh if its not enshrined in laws I dont think the state should care about \"norms\". either youre violating the laws in which case yeah enforce them or youre not and leave them alone, or change the laws through democratic process and then enforce", "importance": null}, "julia:P13": {"title": "Cultural liberalism and social norms", "answer": "Balance personal autonomy and social cohesion, potentially permitting some legal restrictions.", "explanation": "Laws should always apply uniformly. If the minority’s way of life runs afoul of the law, it is not to be permitted. State should promote social cohesion to majority culture.", "importance": 5}, "gene:P14": {"title": "Group disadvantage and individual fairness", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "pretty clearly talking about affirmative action here. there are 2 dimensions of how to answer this:\n1. as a practical concern: pushing people in through a backdoor who are underqualified seems like youre setting them up for failure in a lot of cases and even if you arent, you undermine peoples faith in the fairness of institutions\n2. as a moral concern: I understand wanting to correct structural disadvantage but I think you do that upstream with other forms of economic redistribution and earlier childhood education. feels unfair to deny more qualified people spots at this stage", "importance": null}, "julia:P14": {"title": "Group disadvantage and individual fairness", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "No individual should be given less opportunity because of their individual birth circumstances.", "importance": 5}, "gene:P15": {"title": "Immigration, national obligations, and universal welfare", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "as with most questions I think there is both a practical and moral dimension this:\n\nmorally: I dont think an american life is worth more than a life from another country. morally it feels kinda suspect to slam the doors shut. that said to the extent that the state exists in a social contract with its citizens, its primary obligations are to them. so I guess lean towards liberalization while being careful to optimize towards citizen wellbeing\n\npractically: letting the doors open to immigrants is terrible policy. people hate it and it opens up questions of fairness (why implicitly reward people for not following the proper processes) and can undermine social cohesion. immigration is good for the economy and society but should be done in a controlled and orderly way", "importance": null}, "julia:P15": {"title": "Immigration, national obligations, and universal welfare", "answer": "National governments have a primary obligation to their own citizens, even at substantial cost to global welfare.", "explanation": "A government has the obligation to their citizen welfare only. Global welfare only matters in so far as it threatens the government’s citizens.", "importance": 5}, "gene:P16": {"title": "Do you give special moral weight to the worst-off?", "answer": "Yes. An equal benefit matters morally more when it goes to someone worse off.", "explanation": "", "importance": null}, "julia:P16": {"title": "Do you give special moral weight to the worst-off?", "answer": "No. Equal gains in actual well-being have equal moral value, regardless of who receives them.", "explanation": "Honestly depends more on the circumstances. Why is this person disadvantaged? But generally I’d say equal moral value.", "importance": 2}, "gene:P17": {"title": "What makes a right fundamental?", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": null}, "julia:P17": {"title": "What makes a right fundamental?", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": 4}, "gene:P18": {"title": "Can economic liberty be restricted for social welfare?", "answer": "There is a meaningful rights concern, but it can be outweighed by sufficiently strong public interests.", "explanation": "I guess I’ll start by saying I find the conventional account of property rights a little odd. That there exists objects in the world to which you and you alone are solely morally and therefore legally entitled. I dont like the idea of a state or some institution being able to reach in and take from people but I think philosophically that bothers me not bc I believe there is some sanctity to the ownership of stuff but rather I think there can be some violation of human dignity and autonomy. Like for example I find the idea that a person can buy a shit ton of land and kick everyone off of it kinda weird and not sure that there is a fully morally coherent justification, particularly when this land’s ownership is passed down through generations of inherited wealth.\n\nSo I care about property rights morally in as much as I think that a state that doesnt will overreach and shows that it does not respect the agency and autonomy of people. Practically too, if you can you arbitrarily take things from people, it undermines your political legitimacy and undermines peoples incentive to build and work.\n\nAll that said while I dont think the state should just arbitrarily take stuff from people, I also dont think there is some reified sanctity to the idea of owning stuff that intrinsically overrides the welfare of society as a whole", "importance": null}, "julia:P18": {"title": "Can economic liberty be restricted for social welfare?", "answer": "No. Property rights matter, but ordinary taxation is not comparable to violating fundamental civil liberties.", "explanation": "", "importance": 4}, "gene:P19": {"title": "Democratic legitimacy versus constitutional rights", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "", "importance": null}, "julia:P19": {"title": "Democratic legitimacy versus constitutional rights", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "Must prevent tyranny of the majority.", "importance": 5}, "gene:P20": {"title": "Universal moral worth versus obligations to citizens", "answer": "Probably B, but governments may legitimately place some additional weight on citizens.", "explanation": "", "importance": null}, "julia:P20": {"title": "Universal moral worth versus obligations to citizens", "answer": "A. The public resources of a country should primarily benefit its own citizens.", "explanation": "Government takes money from its citizens to function. The spending of those funds should prioritize helping the citizens of that country. I think citizens of a country can be helped by giving aid to others if part of a larger policy prescription", "importance": 5}, "gene:P21": {"title": "Judicial power and democratic accountability", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "principled objections and desires to preserve rights and liberties enshrined in the constitution im for strong judicial review. There is a real concern of tyranny of the masses. That said you cant just take principled objections for granted", "importance": null}, "julia:P21": {"title": "Judicial power and democratic accountability", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "Judicial review should ensure protect of rights of individuals", "importance": 4}, "gene:P22": {"title": "Nationalism, patriotism, and political identity", "answer": "Shared constitutional principles, civic equality, and democratic institutions are sufficient", "explanation": "Your use of the word should implies a normative judgement. In that case yeah I think institutions and a belief in democratic and institutional values should be sufficient for national identity. Though I recognize in practice, shared traditions and symbols are also important for social cohesion. I also dont think national identity is itself a moral good but rather something of instrumental value for a functioning society. The reason I didnt go with the last option is the use of the word “can” which implies practical application. I dont think people in practice are willing to cooperate purely on the basis of abstract philosophical and political commitments", "importance": null}, "julia:P22": {"title": "Nationalism, patriotism, and political identity", "answer": "A substantive national culture and historical identity are important alongside civic principles", "explanation": "Shared civic principals are a requirement of a functioning democratic society. Strong national culture is important as well for social trust and cohesion. State should cultivate and preserve national identity via reasonable assimilation requirements and immigration regulations.", "importance": 5}, "gene:P23": {"title": "The welfare state and positive rights", "answer": "Public provision should depend mainly on evidence of welfare gains, rather than an independent entitlement", "explanation": "", "importance": null}, "julia:P23": {"title": "The welfare state and positive rights", "answer": "There is a strong public obligation to guarantee a decent minimum, though not every service is an absolute right", "explanation": "", "importance": 4}, "gene:P24": {"title": "Religion, pluralism, and public institutions", "answer": "Religious freedom deserves protection, but all public-facing institutions should meet robust secular equality standards", "explanation": "", "importance": null}, "julia:P24": {"title": "Religion, pluralism, and public institutions", "answer": "Broad accommodation for adults, but stronger common standards for institutions educating children", "explanation": "", "importance": 3}, "gene:P25": {"title": "Foreign policy: Liberal ideals versus strategic restraint", "answer": "Favor diplomatic engagement and targeted measures; avoid broad confrontations without clear prospects for improvement", "explanation": "", "importance": null}, "julia:P25": {"title": "Foreign policy: Liberal ideals versus strategic restraint", "answer": "Apply meaningful pressure, but balance it with security interests and the likely effectiveness of sanctions", "explanation": "", "importance": 5}, "gene:P26": {"title": "Markets, regulation, and the burden of proof", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": null}, "julia:P26": {"title": "Markets, regulation, and the burden of proof", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": 2}, "gene:P27": {"title": "Concentrated private power", "answer": "Intervene selectively, including through competition policy and safeguards against arbitrary exclusion", "explanation": "Practically speaking government officials are poorly positioned to understand technology much less the 2nd order or other downstream effects of regulation which is often a blunt instrument. I think the gov needs to be willing to intervene in certain cases but should be circumspect when and how it chooses to do so, particularly when often times the changing nature of the market and technology solves the problem anyway (consider for example that many of the most powerful companies in the world in the 90s are shadows of themselves or defunct today)", "importance": null}, "julia:P27": {"title": "Concentrated private power", "answer": "Intervene only where demonstrable consumer harm or identifiable market failures exist", "explanation": "", "importance": 4}, "gene:P28": {"title": "Free speech and harmful expression", "answer": "No; political expression should remain protected even when deeply harmful or offensive", "explanation": "", "importance": null}, "julia:P28": {"title": "Free speech and harmful expression", "answer": "Possibly, if sufficiently compelling evidence establishes substantial societal harm", "explanation": "", "importance": 4}, "gene:P29": {"title": "Capitalism and worker power", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "I might be in favor of the 2nd one but it depends on what strengthening unions and bargaining rights and all of that actually entails. Like I said before I think regulation is often a blunt instrument and I think often the gov messes it up", "importance": null}, "julia:P29": {"title": "Capitalism and worker power", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "", "importance": 3}, "gene:P30": {"title": "Public order versus civil liberties", "answer": "Protect protest rights while using narrow, content-neutral restrictions on severe disruption", "explanation": "", "importance": null}, "julia:P30": {"title": "Public order versus civil liberties", "answer": "Give public order and residents' ordinary freedom of movement comparable weight to protest rights", "explanation": "Protest rights shouldn’t significant infringe on individual liberties.", "importance": null}, "gene:P31": {"title": "Healthcare and the welfare state", "answer": "Universal public insurance, because comprehensive access and risk pooling justify the institutional change", "explanation": "Healthcare is a great example of market failure - huge consolidations in the value chain has led to massive conglomerates and regulatory capture has led to results that are incommensurate with the massive costs. having a monopsony with a buyer that has the power to create more transparency and better pricing sounds like a way better move", "importance": null}, "julia:P31": {"title": "Healthcare and the welfare state", "answer": "Universal public insurance if evidence shows it performs better, but without an intrinsic preference for public provision", "explanation": "Healthcare for lower income citizens is an important issue and I believe everyone deserves access to a basic minimum of care. Implementation and costs significantly matter here", "importance": 3}, "gene:P32": {"title": "Housing, local democracy, and property rights", "answer": "Override restrictive local zoning and allow substantial construction, even against homeowners' preferences", "explanation": "Housing is a huge issue for the economy. Massively contributing to the affordability crisis. Just leaving things to local control is just ceding the issue to NIMBYs which is why we’re in this mess to begin with. Im def a YIMBY", "importance": null}, "julia:P32": {"title": "Housing, local democracy, and property rights", "answer": "Substantially liberalize construction while retaining limited local safeguards", "explanation": "Original homeowners should have some say in policy. However severe housing shortages are a threat to societal stability and government has an obligation for its citizens to be housed", "importance": 3}, "gene:P33": {"title": "Climate change and economic growth", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "", "importance": null}, "julia:P33": {"title": "Climate change and economic growth", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "Climate change is an existential threat to society today and in the future. Gov has an obligation to prevent this harm. Government should regulate and use market forces such as carbon taxes and subsidies for energy alternatives to promote investment.", "importance": 5}, "gene:P34": {"title": "Crime, punishment, and the rule of law", "answer": "Prioritize punishment and public order, accepting some additional restrictions to reduce crime", "explanation": "I think dems have been too soft on crime. At the very least you need to enforce the laws on the books and not tolerate public disorder and lawlessness. It’s a recipe for undermining social trust. Dont go the other way though and just blindly support the police and law enforcement. They have been hot beds of iniquity, corruption, and unaccountability. You need a competent and fair administration of justice. Reform law enforcement, dont be needlessly cruel but create law and order", "importance": null}, "julia:P34": {"title": "Crime, punishment, and the rule of law", "answer": "Combine credible enforcement and accountability with substantial rehabilitation and prevention", "explanation": "", "importance": 4}, "gene:P35": {"title": "International security and military intervention", "answer": "Support the threatened democracy if the strategic outlook and expected consequences justify the risks", "explanation": "I think morally it’s good to support democracies against authoritarian aggression but practically foreign entanglements are a mess and have a ton of unintended consequences and just sap your political capital. It’s often the case that it’s just smarter to spend your chips elsewhere and avoid potential quagmires. A clear example of where what I think is morally good diverges from what I think is best policy", "importance": null}, "julia:P35": {"title": "International security and military intervention", "answer": "Support the threatened democracy if the strategic outlook and expected consequences justify the risks", "explanation": "", "importance": 4}, "gene:U1": {"title": "Federal taxation", "answer": "Moderately increase taxes on high earners and capital income, while preserving incentives for investment", "explanation": "", "importance": null}, "julia:U1": {"title": "Federal taxation", "answer": "Keep the overall tax burden broadly similar, but simplify the code and close loopholes", "explanation": "Death tax should be higher. Majority of loopholes must be closed. Tax burden should be relatively the same except for a society where there richest are richest by a wide margin. In that circumstance, more tax burden should be levied.", "importance": 5}, "gene:U2": {"title": "Federal spending and deficits", "answer": "Make deficit reduction a central priority through meaningful spending reforms and some revenue measures", "explanation": "", "importance": null}, "julia:U2": {"title": "Federal spending and deficits", "answer": "Make deficit reduction a central priority through meaningful spending reforms and some revenue measures", "explanation": "Dangerous deficit spending is an existential threat to society. Gov has an obligation to prevent this.", "importance": 5}, "gene:U3": {"title": "Minimum wage and labor markets", "answer": "Use an alternative such as wage subsidies or expanded earned-income tax credits as the main instrument", "explanation": "", "importance": null}, "julia:U3": {"title": "Minimum wage and labor markets", "answer": "Keep the federal floor relatively modest and leave most increases to states and cities", "explanation": "Market forces should be allowed to guide minimum wage.", "importance": 2}, "gene:U4": {"title": "Business regulation and competition", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "", "importance": null}, "julia:U4": {"title": "Business regulation and competition", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "", "importance": 3}, "gene:U5": {"title": "Healthcare system", "answer": "Single-payer national insurance replacing most private primary insurance", "explanation": "", "importance": null}, "julia:U5": {"title": "Healthcare system", "answer": "A universal public option with automatic or near-universal coverage while retaining private insurers", "explanation": "Private market should be highly regulated. Universal public option should be quality enough to compete with private insurance. Universal coverage should be a requirement", "importance": 4}, "gene:U6": {"title": "Legal immigration levels", "answer": "Increase moderately, particularly through employment-based immigration", "explanation": "", "importance": null}, "julia:U6": {"title": "Legal immigration levels", "answer": "Reduce overall legal immigration, prioritizing applicants with high economic contributions", "explanation": "US is at a high polarization point with a lack of unifying culture which significantly threatens the country’s cohesion. However low birth rates make immigration vital to future growth. We should prioritize high value skilled English speaking immigrants with democratic values while allowing traditional legal refugees (not economic migrants) into the country to help fill some of the low value jobs citizens usually are too qualified for. Illegal immigration should be quashed and violators deported. Birthright citizenship should be abolished for illegal immigrant parents but for legal immigrants should be upheld.", "importance": 5}, "gene:U7": {"title": "Unauthorized immigration and enforcement", "answer": "A conditional path to legal status for established residents, alongside strong border enforcement and immigration-system reform", "explanation": "", "importance": null}, "julia:U7": {"title": "Unauthorized immigration and enforcement", "answer": "Enforce borders rigorously and increase removals, with legalization confined to narrowly defined groups", "explanation": "New illegal immigration must be aggressively stopped as top priority. Immediate deportation for any illegal immigrants who are convicted of a crime. Birthright citizenship should be ended if both parents do not have legal status. Deportations of existing residents who consume public benefits. No path to legal residency for those who entered illegally with exceptions for children under age 18.", "importance": 5}, "gene:U8": {"title": "Policing and public disorder", "answer": "Consistently enforce both minor and serious offenses, with proportionate sanctions, accountable policing, and diversion where effective", "explanation": "", "importance": null}, "julia:U8": {"title": "Policing and public disorder", "answer": "Substantially increase police presence, arrests, prosecution, and penalties to restore order", "explanation": "This public disorder is a governmental failure and encroaches on the ability of law abiding citizens to live freely & peacefully. Gov should crackdown and enforce laws even if it means conviction increases substantially. However jail time should ultimately guide ppl to rehabilitation", "importance": 5}, "gene:U9": {"title": "Criminal sentencing and incarceration", "answer": "Reduce incarceration for nonviolent offenses while maintaining strong penalties for serious violent crime", "explanation": "", "importance": null}, "julia:U9": {"title": "Criminal sentencing and incarceration", "answer": "Increase penalties and use incarceration more extensively, especially for repeat offenders", "explanation": "Time between arrest and jail should be cut down significantly. Laws should be aggressively enforced and penalties should increase for repeat offenders. However incarceration should provide genuine opportunities for rehabilitation and integration back into society for nonviolent criminals.", "importance": 5}, "gene:U10": {"title": "Drugs and addiction", "answer": "Legalize and regulate most drugs, including hard drugs, with strong treatment and harm-reduction services", "explanation": "", "importance": null}, "julia:U10": {"title": "Drugs and addiction", "answer": "Legalize cannabis, expand treatment and harm reduction, but retain criminal penalties for possession of the most dangerous drugs", "explanation": "", "importance": 3}, "gene:U11": {"title": "Energy and electricity production", "answer": "Pursue energy abundance across nuclear, renewables, and fossil fuels, with broad permitting reform", "explanation": "", "importance": null}, "julia:U11": {"title": "Energy and electricity production", "answer": "Rapidly prioritize clean energy, including regulation and subsidies that accelerate replacing fossil fuels", "explanation": "", "importance": 4}, "gene:U12": {"title": "Environmental review and infrastructure permitting", "answer": "Substantially streamline permitting and limit procedural opportunities to block projects", "explanation": "", "importance": null}, "julia:U12": {"title": "Environmental review and infrastructure permitting", "answer": "Maintain existing safeguards but improve agency staffing and processing speed", "explanation": "Burden of proof rests on those seeking to impact the environment. Environmental protections are extremely important even if it means reduced growth", "importance": 5}, "gene:U13": {"title": "K–12 education and school choice", "answer": "Use another approach, particularly for funding or school governance", "explanation": "Im not sufficiently versed on the literature on charter school and voucher outcomes to have a strong view but generally I think all of education starts with determining how to quantify and measure leaning effectively and rigorously measuring and optimizing towards that and making corrections and adjustments accordingly (e.g. fire bad teachers quickly, pay and recognize good teachers more, etc)", "importance": null}, "julia:U13": {"title": "K–12 education and school choice", "answer": "Restrict private vouchers and charter expansion, concentrating resources in district public schools", "explanation": "Public schools suffer from increasing lack of funds. Parents should have choice between public schools but there should not be charter schools or private vouchers. If parents are unhappy with public options they can send their child to an accredited private institution", "importance": 5}, "gene:U14": {"title": "College affordability and student loans", "answer": "Reduce federal lending and subsidies significantly, relying more on institutional competition and private financing", "explanation": "", "importance": null}, "julia:U14": {"title": "College affordability and student loans", "answer": "I reject the framing of this question", "explanation": "Do not love the options. State gov has an obligation to provide public higher education with the means to access it via scholarships, merit aid, and loans without excessive interest or quick repayment expectation. Student loan debt should not be forgiven but before students are allowed to take on debt there should be multiple meetings and disclosures of the loan and future earning expectations.", "importance": 4}, "gene:U15": {"title": "Industrial policy and domestic manufacturing", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": null}, "julia:U15": {"title": "Industrial policy and domestic manufacturing", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": 5}, "gene:U16": {"title": "Abortion policy <script>

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v;

  }

  const Q = Object.fromEntries(R.questions.map((q) => [q.qid, q]));
  const ISSUE = Object.fromEntries(R.issues.map((i) => [i.qid, i]));
  const pct = (v) => Math.round(v * 100) + "%";

  function evidence(ids) {
    if (!ids || !ids.length) return null;
    const d = h("details", { class: "ev" },
      h("summary", {}, "Based on", ...ids.map((ref) => {
        const [slug, qid] = ref.split(":");
        return h("span", { class: "qid " + (TAG[slug] || ""), title: NAME[slug], text: qid });
      })));
    const list = h("div", { class: "ev-list" });
    for (const ref of ids) {
      const e = R.evidence[ref]; if (!e) continue;
      const [slug, qid] = ref.split(":");

      list.append(h("div", { class: "ev-item" },

  function fixControl(id, label) {

      if (wrap.querySelector("textarea")) return;

  let n = 0;

    h("div", { class: "issues" }, byQuad(q).map((i) => issueLink(i.qid))));
  const unplaced = byQuad("unplaced");
  const map = section("map", "The issue map",

    h("div", { class: "map" },
      h("span", { class: "corner" }), h("span", { class: "colh", text: "Same policy" }), h("span", { class: "colh", text: "Different policy" }),
      h("span", { class: "rowh", text: "Same principles" }), cell("allies", "Same policy · same principles"), cell("applied", "Different policy · same principles"),
      h("span", { class: "rowh", text: "Different principles" }), cell("coalition", "Same policy · different principles"), cell("deep", "Different policy · different principles")),
    unplaced.length && h("div", { class: "chips" }, h("span", { class: "chip", text: "Not placed" }), unplaced.map((i) => issueLink(i.qid))));

  // Who they are

    h("div", { class: "bg" },

        const line = (g, t, p) => g.gap == null
          ? h("div", { class: "gline" }, h("span", { class: "lbl", text: p.name }), h("span", { class: "muted", style: "font-size:13px", text: "Not enough answers on this axis" }))
          : h("div", { class: "gline" }, h("span", { class: "lbl", text: p.name }), dumbbell(t, g.philosophy, g.policy, "philosophy", "policy", p.name));
        return h("div", { class: "gaxis" }, h("span", { class: "name", text: ga.name }),
          line(ga, "a", PA), line(gb, "b", PB),
          h("div", { class: "ends" }, h("span", { text: ga.low }), h("span", { text: ga.high })));
      })),
    R.gap_note && card("finding", [h("h3", { text: "What this shows" })],
      [h("p", { text: R.gap_note }), fixControl("cmp-gap", "From principle to policy")]));

  // Reasoning
  const reasoning = section("reasoning", "How they reason",
    "How each person thinks a question through, separate from what they conclude.",
    h("div", { class: "cards" }, R.style_contrasts.map((c) => card("finding", [h("h3", { text: c.label }), c.a_short && duo(c.a_short, c.b_short)], [
      h("dl", { class: "fields" }, h("dt", {}, h("span", { class: "sw a" }), PA.name), h("dd", { text: c.a }),
        h("dt", {}, h("span", { class: "sw b" }), PB.name), h("dd", { text: c.b })),
      evidence(c.evidence), fixControl("cmp-" + c.id, c.label)]))),
    R.shared_lineage.length && h("div", { class: "group" }, h("h3", {}, "Shared intellectual lineage"),
      h("div", { class: "cards" }, R.shared_lineage.map((l) => card("finding", [h("h3", { text: l.name })], [
        h("dl", { class: "fields" }, h("dt", {}, h("span", { class: "sw a" }), PA.name), h("dd", { text: l.a_use }),
          h("dt", {}, h("span", { class: "sw b" }), PB.name), h("dd", { text: l.b_use })),
        evidence(l.evidence), fixControl("cmp-" + l.id, l.name)])))));

  // Coverage
  const coverage = section("coverage", "What each sees that the other doesn't",
    "Places where one person's answers speak to a tension or blind spot from the other person's own report.",
    R.coverage.length ? h("div", { class: "cards" }, R.coverage.map((c) => {
      const [src] = c.source_finding.split(":");
      return card("finding", [
        h("div", { class: "chips" }, h("span", { class: "chip", text: `From ${NAME[src]}'s report` })),
        h("h3", { text: R.findings_index[c.source_finding] || c.source_finding }),
        c.title && h("div", { class: "duo" }, h("div", {}, h("span", { class: "sw " + TAG[c.covered_by] }), h("b", { text: NAME[c.covered_by] }), h("span", { text: c.title })))], [
        h("p", { text: c.detail }), evidence(c.evidence), fixControl("cmp-" + c.id, R.findings_index[c.source_finding] || c.id)]);
    })) : h("p", { class: "muted", text: "Neither person's answers spoke directly to the other's tensions or blind spots." }));

  // Predictions
  const PROJ = {
    assumed_similar: (g, t) => `${g} assumed more agreement than there is. ${g}'s guesses sat closer to ${g}'s own answers than ${t}'s real answers do.`,
    assumed_different: (g, t) => `${g} assumed more disagreement than there is. ${g}'s guesses sat further from ${g}'s own answers than ${t}'s real answers do.`,
    accurate: (g, t) => `${g} judged the distance between them accurately.`,
  };
  const predictions = hasPred && section("predictions", "How well they predicted each other",
    "Before seeing the answers, one person guessed how the other would answer every question.",
    ...R.predictions.map((p) => {
      const g = NAME[p.guesser], t = NAME[p.target];
      const b = p.axis_bias[0];
      const rows = Object.fromEntries(p.rows.map((r) => [r.qid, r]));
      return card("finding", [
        h("h3", {}, who(p.guesser), ` guessing ${t}`),
        h("div", { class: "stats" },
          h("div", {}, h("span", { class: "v", text: `${p.exact.matched} of ${p.exact.of}` }), h("span", { class: "k", text: "exact answers" })),
          h("div", {}, h("span", { class: "v", text: `${p.exact_philosophy.matched} of ${p.exact_philosophy.of}` }), h("span", { class: "k", text: "philosophy" })),
          h("div", {}, h("span", { class: "v", text: `${p.exact_policy.matched} of ${p.exact_policy.of}` }), h("span", { class: "k", text: "policy" }))),
        p.projection.direction && h("p", { text: PROJ[p.projection.direction](g, t) })], [
        b && h("p", { text: `The biggest miss by axis was ${b.name.toLowerCase()}. ${g} placed ${t} at ${fmt(b.guessed)}, and ${t} is at ${fmt(b.actual)}, further toward "${b.error < 0 ? b.high : b.low}" than expected.` }),
        b && h("div", { class: "gline" }, h("span", { class: "lbl", text: b.name.split(" ")[0] }), dumbbell(TAG[p.target], b.guessed, b.actual, "guessed", "actual", t)),
        b && h("div", { class: "ends" }, h("span", { text: b.low }), h("span", { text: b.high })),
        b && h("p", { class: "muted", style: "font-size:13px", text: "Open circle: the guess. Filled circle: the real answers." }),
        p.top_misses.length && h("span", { class: "label-sm chip", style: "align-self:flex-start", text: "Biggest misses" }),
        h("dl", { class: "miss" }, p.top_misses.flatMap((qid) => [
          h("dt", {}, h("a", { class: "code", href: "#q-" + qid, onclick: () => openQ(qid), text: qid + " " }), rows[qid].title),
          h("dd", {}, h("span", { class: "muted", text: "Guessed: " }), rows[qid].guess, h("br"), h("span", { class: "muted", text: "Actual: " }), rows[qid].actual)]))]);
    }));

  // Starters
  const starters = section("starters", "Conversations worth having",
    "Three issues where talking it through could move one of them, each with a question evidence could answer.",
    h("div", { class: "cards" }, R.starters.map((s) => card("finding", [
      h("div", { class: "chips" }, issueLink(s.issue)), s.title && h("h3", { text: s.title }),
      h("p", { class: "ask", text: s.settling_question })], [
      h("p", { class: "muted", text: s.why_this_one }), evidence(s.evidence), fixControl("cmp-" + s.id, s.title || s.settling_question)]))));

  // Appendix
  const LEVEL = { match: "Same answer", close: "Close", apart: "Apart", unscored: "Not scored" };
  const filt = { part: "all", level: "all" };
  const qlist = h("div", { class: "qlist" });
  const side = (s, p) => h("div", { class: "qside " + TAG[p.slug] }, who(p.slug),
    s ? [h("span", { class: "ans", text: s.answer }), s.importance && h("span", { class: "imp", text: `Importance ${s.importance}/5` }),
         s.explanation && h("span", { class: "x", text: s.explanation })] : h("span", { class: "muted", text: "No answer" }));
  const qEls = R.questions.map((q) => {
    const i = ISSUE[q.qid];
    const el = h("details", { class: "q", id: "q-" + q.qid, "data-part": q.part, "data-level": q.level },
      h("summary", {}, h("span", { class: "code", text: q.qid }), h("span", { class: "ttl", text: q.title }),
        h("span", { class: "chips" }, h("span", { class: "chip " + q.level, text: LEVEL[q.level] }), i && h("span", { class: "chip", text: QUAD[i.quadrant].name }))),
      h("div", { class: "qbody" }, side(q.a, PA), side(q.b, PB),
        i && h("p", { class: "qlinks", text: "Philosophy behind this issue: " + i.linked.map((l) => `${l.qid} ${Q[l.qid].title} (${LEVEL[l.level].toLowerCase()})`).join(" · ") })));
    qlist.append(el);
    return el;
  });
  function applyFilter() { for (const el of qEls) el.hidden = (filt.part !== "all" && el.dataset.part !== filt.part) || (filt.level !== "all" && el.dataset.level !== filt.level); }
  const seg = (key, opts, label) => h("div", { class: "seg-ctl", role: "group", "aria-label": label }, opts.map(([v, t]) => {
    const b = h("button", { type: "button", id: `f-${key}-${v}`, "aria-pressed": String(filt[key] === v), text: t });
    b.addEventListener("click", () => { filt[key] = v; b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); applyFilter(); });
    return b;
  }));
  function openQ(qid) {
    filt.part = "all"; filt.level = "all";
    document.querySelectorAll(".seg-ctl button").forEach((b) => b.setAttribute("aria-pressed", String(b.id.endsWith("-all"))));
    applyFilter();
    const el = document.getElementById("q-" + qid);
    if (el) { el.open = true; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
  }
  const answers = section("answers", "All answers, side by side", "Open any question to see both answers and explanations.",
    h("div", { class: "filters" },
      seg("part", [["all", "All"], ["P", "Philosophy"], ["U", "Policy"]], "Filter by part"),
      seg("level", [["all", "Any"], ["match", "Same"], ["close", "Close"], ["apart", "Apart"], ["unscored", "Not scored"]], "Filter by agreement")),
    qlist);

  const footer = h("footer", {}, `Generated ${R.generated_at}. Agreement levels, the issue map, the principle-to-policy chart, and prediction scores come from a fixed scoring key, not from AI. The written analysis is by Claude, was checked by a second pass that tried to refute it, and cites the answers behind every finding. Either of you can use "That's not what I meant" on anything that misreads you, then send the corrections back.`);

  app.textContent = "";
  const expandBtn = h("button", { class: "btn", type: "button", id: "expand-all", text: "Expand all" });
  expandBtn.addEventListener("click", () => {
    const open = expandBtn.textContent === "Expand all";
    document.querySelectorAll("details.x").forEach((d) => { d.open = open; });
    expandBtn.textContent = open ? "Collapse all" : "Expand all";
  });
  app.append(hero, h("div", { class: "toolbar" }, toc, expandBtn), who_ || "", map, coalition, applied, disagree, gaps, reasoning, coverage, predictions || "", starters, answers, footer);
  app.querySelectorAll("section.s .s-head .n").forEach((el, i) => { el.textContent = String(i + 1).padStart(2, "0"); });
  if (location.hash.startsWith("#q-")) openQ(location.hash.slice(3));

  const from = document.getElementById("trayFrom");
  for (const p of [PA, PB]) from.append(h("option", { value: p.slug, text: p.name }));
  function renderTray() {
    const k = Object.keys(fixes).length;
    document.getElementById("tray").hidden = !k;
    document.getElementById("trayText").textContent = `${k} correction${k === 1 ? "" : "s"} noted`;
  }
  document.getElementById("trayCopy").addEventListener("click", async (e) => {
    const text = JSON.stringify({ pair: R.pair, from: from.value, corrections: Object.entries(fixes).map(([id, f]) => ({ id, ...f })) });
    try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied. Send it back"; }
    catch (err) {
      const ta = document.getElementById("trayFallback");
      ta.value = text; ta.hidden = false; ta.select();
      e.target.textContent = "Select and copy the text";
    }
  });
  renderTray();
})();
</script>
</body></html>
