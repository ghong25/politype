<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0;padding:0}</style></head><body><title>Gene and Julia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same paper-and-sheet system as the single-person report. One column of sections; the issue map is a 2x2 grid that stacks on phones. Person A is blue, person B is gold, everywhere. */
:root {
  --paper: #EEF1F4;
  --sheet: #FBFCFD;
  --ink: #15233F;
  --muted: #5A6578;
  --rule: #CDD4DD;
  --mark: #0E6E5C;
  --mark-soft: #E2F1EC;
  --warn: #A1450E;
  --warn-soft: #F7E9DE;
  --pa: #2F5DA6;
  --pb: #B8801A;
  --pa-soft: #E3EAF6;
  --pb-soft: #F5ECDB;
  --font-q: "Newsreader", Georgia, "Times New Roman", serif;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
    --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
    --pa: #5F87CC; --pb: #B88A2E; --pa-soft: #1B2638; --pb-soft: #2E2616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
  --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
  --pa: #5F87CC; --pb: #B88A2E; --pa-soft: #1B2638; --pb-soft: #2E2616;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
  display: flex; flex-direction: column; gap: 44px;
}
.wrap > *, section.s > * { min-width: 0; max-width: 100%; }
h1, h2, h3 { font-family: var(--font-q); font-weight: 500; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.code { font-family: var(--font-code); font-size: 12.5px; letter-spacing: 0.03em; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sw.a { background: var(--pa); } .sw.b { background: var(--pb); }
.who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }

.hero { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: clamp(22px, 5vw, 48px); display: flex; flex-direction: column; gap: 24px; }
.hero .eyebrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); }
.hero h1 { font-size: clamp(34px, 7.5vw, 54px); line-height: 1.04; letter-spacing: -0.02em; }
.hero .summary { font-family: var(--font-q); font-size: clamp(19px, 3.4vw, 22px); line-height: 1.45; font-style: italic; max-width: 52ch; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.person { border-radius: 5px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.person.a { background: var(--pa-soft); } .person.b { background: var(--pb-soft); }
.person h2 { font-size: 23px; line-height: 1.2; }
.person p { font-size: 14.5px; }
.person .meta { font-size: 12.5px; color: var(--muted); }
.verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.verdict div { padding: 14px 12px 4px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.verdict .k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.verdict .v { font-family: var(--font-q); font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.verdict .d { font-size: 13.5px; color: var(--muted); line-height: 1.45; }

nav.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
nav.toc a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
nav.toc a:hover { color: var(--ink); border-color: var(--ink); }
section.s { display: flex; flex-direction: column; gap: 18px; }
.s-head { display: flex; gap: 14px; align-items: baseline; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; }
.s-head .n { font-family: var(--font-code); color: var(--mark); font-size: 14px; }
.s-head h2 { font-size: clamp(24px, 4.6vw, 30px); }
.intro { color: var(--muted); max-width: 68ch; }

/* Issue map */
.map { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; }
.map .colh, .map .rowh { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: flex-end; }
.map .rowh { writing-mode: vertical-rl; transform: rotate(180deg); align-items: center; justify-content: center; padding: 0 2px; }
.cell { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cell.here { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cell .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cell h3 { font-size: 20px; }
.cell .count { font-family: var(--font-code); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .desc { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.issues { display: flex; flex-wrap: wrap; gap: 6px; }
.issue { font-size: 13px; padding: 3px 9px; border-radius: 3px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); text-decoration: none; }
.issue:hover { border-color: var(--ink); }
.issue .code { font-size: 11px; color: var(--muted); margin-right: 4px; }
@media (max-width: 640px) {
  .map { grid-template-columns: 1fr; }
  .map .colh, .map .rowh, .map .corner { display: none; }
  .cell .desc::before { content: attr(data-axes); display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
}

/* Findings */
.cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }
.finding { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.finding h3 { font-size: 21px; line-height: 1.3; }
.finding p, dl.fields dd { max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.chip.fault { color: var(--warn); border-color: var(--warn); background: transparent; }
.chip.match { color: var(--mark); border-color: var(--mark); background: transparent; }
.chip.close { color: var(--ink); }
.chip.apart { color: var(--warn); border-color: var(--warn); background: transparent; }
dl.fields { display: grid; grid-template-columns: minmax(110px, 170px) 1fr; gap: 8px 16px; margin: 0; font-size: 14.5px; }
dl.fields dt { color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
dl.fields dt .sw { transform: translateY(1px); }
dl.fields dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { dl.fields { grid-template-columns: 1fr; gap: 2px; } dl.fields dd { margin-bottom: 8px; } }

.group { display: flex; flex-direction: column; gap: 10px; }
.group > h3 { font-size: 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.group > h3 span { font-family: var(--font-ui); font-size: 14px; color: var(--muted); }
.rows { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
details.row > summary { gap: 6px; }
.row { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
.row:last-child { border-bottom: none; }
.row .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.row .t .code { color: var(--muted); font-weight: 400; }
.row p { font-size: 14.5px; max-width: 72ch; }

details.ev { font-size: 14px; }
details.ev summary { cursor: pointer; color: var(--muted); list-style: none; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary::before { content: "+"; font-family: var(--font-code); width: 14px; }
details.ev[open] summary::before { content: "−"; }
details.ev summary .qid { font-family: var(--font-code); font-size: 12px; padding: 1px 6px; border-radius: 3px; color: var(--ink); border: 1px solid var(--rule); }
details.ev summary .qid.a { border-color: var(--pa); } details.ev summary .qid.b { border-color: var(--pb); }
.ev-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--rule); }
.ev-item { display: flex; flex-direction: column; gap: 2px; }
.ev-item .q { font-weight: 600; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.ev-item .x { font-family: var(--font-q); font-size: 15.5px; color: var(--muted); font-style: italic; white-space: pre-line; }

/* Principle-to-policy gaps */
.gaps { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 20px 14px; display: flex; flex-direction: column; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 10px 0 4px; align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); background: var(--sheet); display: inline-block; }
.fill { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); display: inline-block; }
.gaxis { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.gaxis:last-child { border-bottom: none; }
.gaxis .name { font-weight: 600; font-size: 15px; }
.gline { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
.gline .lbl { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 22px; cursor: default; }
.track .line { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule); }
.track .tick { position: absolute; top: 5px; width: 1px; height: 12px; background: var(--rule); }
.track .tick.mid { background: var(--muted); }
.track .seg { position: absolute; top: 9px; height: 4px; border-radius: 2px; }
.track .dot { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid; box-shadow: 0 0 0 2px var(--sheet); }
.track.a .seg, .track.a .dot.pol { background: var(--pa); } .track.a .dot { border-color: var(--pa); }
.track.b .seg, .track.b .dot.pol { background: var(--pb); } .track.b .dot { border-color: var(--pb); }
.track .dot.phil { background: var(--sheet); }
.ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); gap: 12px; padding-left: 74px; }
.ends span:last-child { text-align: right; }
.gval { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 74px; }
.tip { position: fixed; z-index: 6; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 13px; padding: 6px 9px; border-radius: 4px; max-width: 260px; line-height: 1.4; font-variant-numeric: tabular-nums; }

/* Predictions */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.stats div { padding: 12px 12px 4px 0; display: flex; flex-direction: column; gap: 2px; }
.stats .v { font-family: var(--font-q); font-size: 26px; font-variant-numeric: tabular-nums; }
.stats .k { font-size: 13px; color: var(--muted); }
.miss { display: grid; grid-template-columns: minmax(110px, 170px) 1fr; gap: 4px 16px; font-size: 14.5px; }
@media (max-width: 520px) { .miss { grid-template-columns: 1fr; gap: 0; } }
.miss dt { color: var(--muted); font-weight: 600; }
.miss dd { margin: 0; }

.ask { font-family: var(--font-q); font-size: 18px; line-height: 1.45; font-style: italic; max-width: 60ch; }

/* Appendix */
.filters { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; flex-wrap: wrap; }
.seg-ctl button { font: inherit; font-size: 13.5px; padding: 6px 12px; background: var(--sheet); color: var(--muted); border: none; border-right: 1px solid var(--rule); cursor: pointer; }
.seg-ctl button:last-child { border-right: none; }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.qlist { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
details.q { border-bottom: 1px solid var(--rule); }
details.q:last-child { border-bottom: none; }
details.q > summary { cursor: pointer; padding: 12px 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
details.q > summary::-webkit-details-marker { display: none; }
details.q > summary .code { color: var(--muted); width: 34px; flex: none; }
details.q > summary .ttl { flex: 1 1 220px; min-width: 0; font-weight: 500; }
details.q:target > summary, details.q.flash > summary { background: var(--mark-soft); }
.qbody { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 0 18px 16px; }
.qside { border-radius: 5px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.qside.a { background: var(--pa-soft); } .qside.b { background: var(--pb-soft); }
.qside .ans { font-weight: 600; font-size: 14.5px; }
.qside .imp { font-size: 12.5px; color: var(--muted); }
.qside .x { font-family: var(--font-q); font-size: 15.5px; font-style: italic; white-space: pre-line; overflow-wrap: anywhere; }
.qlinks { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

.fix { align-self: flex-start; background: none; border: none; padding: 2px 0; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.fix-box { display: flex; flex-direction: column; gap: 8px; }
.fix-box textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px; min-height: 70px; resize: vertical; }
.tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--sheet);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 14.5px; z-index: 5; }
.tray button, .tray select { font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--sheet); background: var(--sheet); color: var(--ink); cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

/* Collapsible cards: the summary is the headline, the body is the reasoning */
details.x > summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
details.x > summary::-webkit-details-marker { display: none; }
details.x > summary .more { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
details.x > summary .more::before { content: "+"; font-family: var(--font-code); }
details.x[open] > summary .more::before { content: "−"; }
details.x[open] > summary .more span::after { content: "Hide details"; }
details.x:not([open]) > summary .more span::after { content: "Show details"; }
details.x > .body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; margin-top: 10px; border-top: 1px dashed var(--rule); }
.duo { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.duo div { display: flex; gap: 8px; align-items: baseline; }
.duo .sw { transform: translateY(1px); }
.duo b { font-weight: 600; flex: none; }
.crux { font-size: 14px; color: var(--muted); }
.toolbar { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--ink); }

/* Who they are */
.portraits { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.portraits .person p { font-family: var(--font-q); font-size: 17px; line-height: 1.5; }
.bg { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.bg-row { display: grid; grid-template-columns: 150px 1fr 1fr; gap: 0 16px; padding: 12px 18px; border-bottom: 1px solid var(--rule); align-items: start; }
.bg-row:last-child { border-bottom: none; }
.bg-row .cat { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.bg-row .head { display: contents; }
.bg-head { padding-block: 8px; }
.bg-cell { min-width: 0; }
.bg-cell > summary { gap: 4px; }
.bg-cell .g { font-weight: 600; font-size: 15px; line-height: 1.4; }
.bg-cell .nm { display: none; }
.conf { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.conf::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); }
.conf.strong { color: var(--mark); } .conf.strong::before { background: var(--mark); border-color: var(--mark); }
.conf.none::before { border-style: dotted; }
@media (max-width: 640px) {
  .bg-row { grid-template-columns: 1fr; gap: 10px; }
  .bg-head { display: none; }
  .bg-cell .nm { display: inline-flex; }
}
.traits2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.tlist { display: flex; flex-direction: column; gap: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.tlist > .hd { padding: 10px 18px; border-bottom: 1px solid var(--rule); }
.tlist details.x { padding: 12px 18px; border-bottom: 1px solid var(--rule); }
.tlist details.x:last-child { border-bottom: none; }
.tlist .tr { font-weight: 600; font-size: 15px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chip.click { color: var(--mark); border-color: var(--mark); background: transparent; }
.chip.friction { color: var(--warn); border-color: var(--warn); background: transparent; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap" id="app">
  <div class="hero"><p class="muted">Loading comparison…</p></div>
</div>
<div class="tray" id="tray" hidden>
  <span id="trayText"></span>
  <label for="trayFrom" class="code" style="color:inherit">From</label>
  <select id="trayFrom"></select>
  <button type="button" id="trayCopy">Copy corrections</button>
  <textarea id="trayFallback" aria-label="Your corrections" readonly hidden style="width:100%;font:12px var(--font-code);min-height:60px"></textarea>

strictions", "actual": "Individual freedom, but with reasonable public-interest restrictions", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "P4", "title": "How should society approach longstanding traditions and institutions?", "guess": "Preserve them unless there is a compelling reason to change", "actual": "Reform them gradually, respecting accumulated experience", "level": "close", "diff": 1.0, "target_importance": 4}, {"qid": "P5", "title": "Which statement best captures your conception of justice?", "guess": "Protecting equal rights and impartial treatment under the law", "actual": "Protecting equal rights and impartial treatment under the law", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "P6", "title": "Redistribution and taxation", "guess": "Only modestly; growth, incentives, and property rights deserve greater weight", "actual": "Only modestly; growth, incentives, and property rights deserve greater weight", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "P7", "title": "Markets versus government", "guess": "Markets should be the default, with government correcting identifiable failures", "actual": "Markets should be the default, with government correcting identifiable failures", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "P8", "title": "Individual liberty and paternalism", "guess": "Possibly; the magnitude of the benefits and costs determines the answer", "actual": "Possibly; the magnitude of the benefits and costs determines the answer", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "P9", "title": "Democracy versus expertise", "guess": "The independent institution should block the policy if the evidence is sufficiently strong", "actual": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "level": "apart", "diff": 2.0, "target_importance": 5}, {"qid": "P10", "title": "Equality of opportunity versus equality of outcomes", "guess": "Continue improving opportunities and social mobility, without targeting outcome parity", "actual": "Focus on protecting equal rights and fair rules; unequal outcomes aren't intrinsically unjust", "level": "close", "diff": 1.0, "target_importance": 5}, {"qid": "P11", "title": "Are individual rights inviolable?", "guess": "No. Certain rights should not be violated, even to maximize welfare.", "actual": "I reject the framing or would answer differently.", "level": "unscored", "diff": null, "target_importance": 3}, {"qid": "P12", "title": "Whose welfare matters most?", "guess": "Probably B, depending on the relative welfare gains.", "actual": "Policy B. Higher aggregate welfare is the decisive consideration here.", "level": "close", "diff": 1.0, "target_importance": 4}, {"qid": "P13", "title": "Cultural liberalism and social norms", "guess": "Balance personal autonomy and social cohesion, potentially permitting some legal restrictions.", "actual": "Balance personal autonomy and social cohesion, potentially permitting some legal restrictions.", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "P14", "title": "Group disadvantage and individual fairness", "guess": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "actual": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "P15", "title": "Immigration, national obligations, and universal welfare", "guess": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "actual": "National governments have a primary obligation to their own citizens, even at substantial cost to global welfare.", "level": "close", "diff": 1.0, "target_importance": 5}, {"qid": "P16", "title": "Do you give special moral weight to the worst-off?", "guess": "No. Equal gains in actual well-being have equal moral value, regardless of who receives them.", "actual": "No. Equal gains in actual well-being have equal moral value, regardless of who receives them.", "level": "match", "diff": 0.0, "target_importance": 2}, {"qid": "P17", "title": "What makes a right fundamental?", "guess": "Human dignity and autonomy: people must not be treated merely as instruments.", "actual": "Human dignity and autonomy: people must not be treated merely as instruments.", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "P18", "title": "Can economic liberty be restricted for social welfare?", "guess": "No. Property rights matter, but ordinary taxation is not comparable to violating fundamental civil liberties.", "actual": "No. Property rights matter, but ordinary taxation is not comparable to violating fundamental civil liberties.", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "P19", "title": "Democratic legitimacy versus constitutional rights", "guess": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "actual": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "P20", "title": "Universal moral worth versus obligations to citizens", "guess": "Probably B, but governments may legitimately place some additional weight on citizens.", "actual": "A. The public resources of a country should primarily benefit its own citizens.", "level": "apart", "diff": 3.0, "target_importance": 5}, {"qid": "P21", "title": "Judicial power and democratic accountability", "guess": "Strong judicial review, including robust protection of rights against majorities", "actual": "Strong judicial review, including robust protection of rights against majorities", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "P22", "title": "Nationalism, patriotism, and political identity", "guess": "A substantive national culture and historical identity are important alongside civi on with automatic or near-universal coverage while retaining private insurers", "actual": "A universal public option with automatic or near-universal coverage while retaining private insurers", "level": "match", "diff": 0.0, "target_importance": 4}, {"qid": "U6", "title": "Legal immigration levels", "guess": "Increase moderately, particularly through employment-based immigration", "actual": "Reduce overall legal immigration, prioritizing applicants with high economic contributions", "level": "apart", "diff": 2.0, "target_importance": 5}, {"qid": "U7", "title": "Unauthorized immigration and enforcement", "guess": "A conditional path to legal status for established residents, alongside strong border enforcement and immigration-system reform", "actual": "Enforce borders rigorously and increase removals, with legalization confined to narrowly defined groups", "level": "apart", "diff": 1.5, "target_importance": 5}, {"qid": "U8", "title": "Policing and public disorder", "guess": "Substantially increase police presence, arrests, prosecution, and penalties to restore order", "actual": "Substantially increase police presence, arrests, prosecution, and penalties to restore order", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "U9", "title": "Criminal sentencing and incarceration", "guess": "Increase penalties and use incarceration more extensively, especially for repeat offenders", "actual": "Increase penalties and use incarceration more extensively, especially for repeat offenders", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "U10", "title": "Drugs and addiction", "guess": "Retain broad prohibitions and strengthen enforcement against possession and distribution of dangerous drugs", "actual": "Legalize cannabis, expand treatment and harm reduction, but retain criminal penalties for possession of the most dangerous drugs", "level": "apart", "diff": 2.25, "target_importance": 3}, {"qid": "U11", "title": "Energy and electricity production", nsgender rights and public policy", "guess": "Protect adult private choices, but adopt relatively restrictive policies for minors, schools, and sex-separated settings", "actual": "Protect adult private choices, but adopt relatively restrictive policies for minors, schools, and sex-separated settings", "level": "match", "diff": 0.0, "target_importance": 3}, {"qid": "U18", "title": "Voting and election administration", "guess": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "actual": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "level": "match", "diff": 0.0, "target_importance": 3}, {"qid": "U19", "title": "Federal bureaucracy and civil-service reform", "guess": "Preserve strong civil-service protections and expand agency capacity and expertise", "actual": "Make it substantially easier to dismiss underperforming federal employees, restructure agencies, and tie advancement to measurable results", "level": "apart", "diff": 2.0, "target_importance": 3}, {"qid": "U20", "title": "Social Security and Medicare fiscal reform", "guess": "Prioritize slowing benefit growth, means-testing, and adjusting retirement eligibility while protecting poorer recipients", "actual": "Combine additional revenue with gradual adjustments to benefits, eligibility, or payment systems", "level": "apart", "diff": 1.25, "target_importance": 4}, {"qid": "U21", "title": "Defense spending and military strategy", "guess": "Substantially reduce defense spending and the US military presence overseas", "actual": "Maintain a large, globally capable military, with selective modernization and efficiency reforms", "level": "apart", "diff": 3.0, "target_importance": 4}, {"qid": "U22", "title": "NATO and American alliances", "guess": "Maintain strong alliances while requiring substantially greater allied defense contributions", "actual": "Maintain strong alliances while requiring substantially greater allied defense contributions", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "U23", "title": "China, trade, and economic security", "guess": "Pursue extensive economic decoupling, tariffs, and restrictions to reduce dependence", "actual": "Adopt strong restrictions in strategic technologies while preserving significant ordinary trade", "level": "close", "diff": 1.0, "target_importance": 5}, {"qid": "U24", "title": "Military aid and foreign conflicts", "guess": "Provide meaningful assistance where it supports identifiable strategic interests and has a credible prospect of success", "actual": "Provide meaningful assistance where it supports identifiable strategic interests and has a credible prospect of success", "level": "match", "diff": 0.0, "target_importance": 5}, {"qid": "U25", "title": "National security and domestic surveillance", "guess": "Permit narrowly targeted expansions where agencies can demonstrate specific operational needs", "actual": "Permit narrowly targeted expansions where agencies can demonstrate specific operational needs", "level": "match", "diff": 0.0, "target_importance": 4}]}], "questions": [{"qid": "P1", "part": "P", "title": "What is the primary purpose of government?", "level": "unscored", "a": {"answer_id": "P1.e", "answer": "A combination or different principle", "explanation": "This is a challenging question that I dont think necessarily has a very simple answer. I start by thinking about it from a political theory lens. why do you need a government? not to go all hobbsian but I do think there is a significant concern of anarchy without a state and without a monopoly on the legitimate use of violence (I guess not to go all weber either). after you've cleared that very basic threshold, I think it becomes a lot murkier bc a lot of things that sound good in principle need to be traded off against one another and I feel like it's a facile perspective to just choose a single thing and say that is the only thing to optimize for. I'd say it's prob some combination of promoting collective welfare through building and maintaining strong and stable institutions (e.g. rule of law) while ensuring that individual rights and freedoms are respected. might seem like a bit of a cop out to choose a combo of what youre saying but in my view, it feels arbitrary to just pick one and say thats the main thing", "importance": null, "tags": ["catch_all"]}, "b": {"answer_id": "P1.e", "answer": "A combination or different principle", "explanation": "Gov purposes is to both protect individual rights and freedoms but balance that responsibility with protecting society overall from external and internal threats of those who seek to suppress individual rights/liberties.", "importance": 5, "tags": ["catch_all"]}}, {"qid": "P2", "part": "P", "title": "How do you view economic inequality?", "level": "match", "a": {"answer_id": "P2.b", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "Oof. another tricky one. the one I choose is the closest I guess to what I think but that is itself kinda reductive bc then you have other questions like what is excessive and what do you then do about it? I'd say a few things:\n- I think some degree of inequality is structurally inherent if you want markets (given differences in natural endowments of ability and even things like desire to work hard)\n- I think some degree of inequality is even good as a means to reward and incentivize innovation and effort\n- however, there are 2 further issues that arrise: 1. what is the cause for the inequality in a society? 2. how much inequality are we seeing?\nto the former, I'd say that a lot of inequality we actually see is due to issues like inequality of opportunity, unequal access to resources, legacy of stuff like redlining. to the latter, I think this is a harder question. I take issue with some of the leftist views like all great wealth is inherently exploitative (I think thats absurd) and no billionaires should exist in a just society, however it does strike me as absurd that there are so many holes in the tax codes and structural inequalities through which the wealthy perpetuate their advantages. im not sure that you can necessarily say something like once you've hit X number you need to do Y thing (I think thats a clearly very blunt instrument) but I do think the urgency of the problem does depend on the extend of the inequality", "importance": null, "tags": []}, "b": {"answer_id": "P2.b", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "I think several of these things are true. Income inequality is acceptable but if it becomes extremely skewed such that the lower end cannot afford basics such as food and healthcare, this threatens societal stability which is not acceptable. Income equality should not be the goal of the state; however, opportunities should exist for children of lower income families to improve their lot in life. Similarity, death tax burdens should be sufficiently high that the children of the high income are also motivated to contribute to society.", "importance": 3, "tags": []}}, {"qid": "P3", "part": "P", "title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "level": "unscored", "a": {"answer_id": "P3.c", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P3.b", "answer": "Individual freedom, but with reasonable public-interest restrictions", "explanation": "It depends on which individual freedoms and what the impact to collective welfare is but generally individual freedom should be protected as long as your individual freedom doesn’t encroach upon another’s individual freedom or create at large issues for public welfare.", "importance": 4, "tags": []}}, {"qid": "P4", "part": "P", "title": "How should society approach longstanding traditions and institutions?", "level": "close", "a": {"answer_id": "P4.c", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "depends on why youre asking. are you asking if I value tradition as a thing in and of itself or more as a functional and practical matter. I dont really care about tradition intrinsically. I think if something is broken/doesnt make sense you should fix it/change it. im not precious about the past in that way. however, pragmatically I think there are 2 major concerns with that kind of approach: 1. like james c scott says in seeing like a state, theres a huge danger in people thinking they know it all and can destroy and remake everything in a more rational and superior way. that kind of myopic hubris can be way worse than leaving things as they are. supporting radical change presupposes that the change will be good and there wont be any massive downstream negative consequence which we've seem time and time again is not the case 2. even if you presuppose that it's gonna be good, people and societies as a whole can have a negative reaction to just upturning the way things work. incrementalism is often more effective to counteract this.\n\nnow I dont wanna make blanket statements. if you see something thats genuinely super fucked up like slavery, then yeah fix it sure but generally, Im on the side of being careful and circumspect", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P4.b", "answer": "Reform them gradually, respecting accumulated experience", "explanation": "Longstanding traditions shouldn’t be able to be changed on whims, significant collective approval over time should be the prerequisite to avoid the tyranny of the majority.", "importance": 4, "tags": []}}, {"qid": "P5", "part": "P", "title": "Which statement best captures your conception of justice?", "level": "match", "a": {"answer_id": "P5.d", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "I take issue with the premise behind these answers. its a single choice multiple choice which positions these as competing things. the choice I made is the closest to what I think but do generally believe in some vague kantian idea of giving people what theyre due as well and that structural disadvantages and inequalities should be corrected as well for example.", "importance": null, "tags": []}, "b": {"answer_id": "P5.d", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "", "importance": 5, "tags": []}}, {"qid": "P6", "part": "P", "title": "Redistribution and taxation", "level": "unscored", "a": {"answer_id": "P6.e", "answer": "Another approach or important distinction", "explanation": "so I think generally when theres a tradeoff at play with a policy decision, as there very much is, I think the state should optimize for greatest cumulative welfare (while still doing so within the constraints of the law and of respecting individual rights). so with the way that youre framing it, if it's a modest reduction in investment in growth, if we can quantify how modest and see that the improvement in collective welfare is great in relation to that, then yeah Im for it. however, i dont believe in redistribution at all costs and totally ignoring deadweight loss and inefficiency. there is a real danger of killing the proverbial golden goose.\n\nI think there are 2 concerns here: 1. practical administration of policy 2. moral framework\nmy answer above is largely in response to 1. I do think that huge inequality is problematic in itself both bc it presents big political concerns (money in politics, oligarchy, etc) and bc it's hard to think of a moral justification for why we should have trillionaires when so many people live in desperate poverty", "importance": null, "tags": ["catch_all"]}, "b": {"answer_id": "P6.c", "answer": "Only modestly; growth, incentives, and property rights deserve greater weight", "explanation": "Modest support. Instead of much higher income taxes, death tax burdens should be higher to still incentivize high innovation of productive citizens during their life. Tax law should be reformed to prevent underhanded tax avoidance schemes.", "importance": 4, "tags": []}}, {"qid": "P7", "part": "P", "title": "Markets versus government", "level": "match", "a": {"answer_id": "P7.a", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Im a big believer in the power of markets. the power of competition, price discovery, and efficiency through the free market is very important and societally beneficial but I think it's a huge mistake to reify the market and treat it as a end onto itself. it should ultimately be constrained by the state where there are market failures and where there are dangers of distorting effects from monopolies\n\nI think Im sorta in between mixed economy and markets should be default. I think the chicago school and reagan types are too deferential towards the economy and insufficiently wary of the ways in which the market can fail but at the same time, I believe i the dynamism of markets - e.g. I think europe has too many stifling regulations which in turn have led to sclerotic growth and in turn have empowered populists and right wing movements who look for a scapegoat for this lack of growth. so I think theres not just a practical concern for recognizing how the market can be superior to the state but also a concern that a lack of growth and development can be very politically destabilizing too", "importance": null, "tags": []}, "b": {"answer_id": "P7.a", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Gov should have some regulations to prevent unfair/exploitative markets. But market forces should generally be allowed to prevail.", "importance": 4, "tags": []}}, {"qid": "P8", "part": "P", "title": "Individual liberty and paternalism", "level": "match", "a": {"answer_id": "P8.c", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "hmmm well the reason I say possibly is bc in principle i think competent adults should be able to do whatever they want even if it's bad for them but I can imagine scenarios in which the activity is so harmful that just saying that as a blanket statement prob goes too far. e.g. consider how addictive fentanyl is and how many people it kills. I would lean on the side of letting people make choices that might be harmful to them but I also wouldnt treat this as a moral absolute", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P8.c", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "Depends on the activity and harm. Regulations should be tailored. IE gambling: if it is allowed, should be limited to 5% of one’s annual income. Someone who has been arrested for a drinking/drug related violent offense should be banned from legally consuming those items, but not every adult. Most hard drugs should be completely banned.", "importance": 4, "tags": ["depends"]}}, {"qid": "P9", "part": "P", "title": "Democracy versus expertise", "level": "match", "a": {"answer_id": "P9.c", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "ugh this is another really tricky one. I think theres a lot of issues at play here.\n- the majority of the public is nowhere near educated, informed (or frankly intelligent) enough to be able to form meaningful opinions on complex issues. i think theres a very real concern of demagogues exploiting that - rail against the corrupt, unaccountable elites, push a bunch of stuff that sounds nice that will wreck the countries finances/long term well being\n- at the same time, I do think there is danger in an idea of a class of people who paternalistically treat the who country as a bunch of morons who dont know enough to make their own choices (and I think we saw aspects of this with stuff like the iraq war or GFC for example - theres a reason why there has been a big backlash to technocratic rule and the idea that theres a few experts who are smart enough to run everything). I worry about that from both a moral standpoint (feels deeply undemocratic to just override whatever the public wants) and from a practical standpoint (going back to the seeing like a state thing - danger of the hubris of experts).\n- i dont really have a good answer ultimately bc I think these are 2 countervailing but both very real things. I guess I'd just say that politically theres more danger in an unaccountable elite overriding the public will and then getting things wrong and delegitimizing the state as we've seen in recent times. but on the whole I def believe in expert knowledge and think things like fed independence is good - you need people like economists and domain experts who can act as stewards for the public good", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P9.c", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "Tough. Ideally would have an independent body always acting on true science to only prevent disaster. However the implementation of this would be extremely difficult.", "importance": 5, "tags": ["depends"]}}, {"qid": "P10", "part": "P", "title": "Equality of opportunity versus equality of outcomes", "level": "apart", "a": {"answer_id": "P10.c", "answer": "Actively reduce extreme disparities in outcomes through redistribution and structural reform", "explanation": "so I want to qualify what Im saying what Im saying here. I def dont believe in communism or state enforced mass equality but going back to one of my earlier points, inasmuch as the state should be concerned with collective welfare, I think its good to reduce disparities in outcome if it will raise collective welfare. I see it as a sort of technocratic/optimization problem: how do we ensure the greatest good for the greatest number", "importance": null, "tags": []}, "b": {"answer_id": "P10.a", "answer": "Focus on protecting equal rights and fair rules; unequal outcomes aren't intrinsically unjust", "explanation": "Groups should not be given less opportunity because they belong to an historically advantaged group of historically disadvantaged groups have access to quality institutions", "importance": 5, "tags": []}}, {"qid": "P11", "part": "P", "title": "Are individual rights inviolable?", "level": "unscored", "a": {"answer_id": "P11.a", "answer": "No. Certain rights should not be violated, even to maximize welfare.", "explanation": "yeah this is a good illustration of what I mean when I say that I think we should generally maximize welfare but subject to the constraints of a rule based order and individual rights. first I kind reject the premise that you can violate rights without creating an institutional precedent, but even if I grant you that, I think individual rights override a general util max framework", "importance": null, "tags": []}, "b": {"answer_id": "P11.e", "answer": "I reject the framing or would answer differently.", "explanation": "I don’t see a situation where a small group of totally innocent people would be in possession of such dangerous information, and how this would be known before implementing surveillance. With this background cannot guarantee it wouldn’t be an institutional precedent.", "importance": 3, "tags": ["catch_all"]}}, {"qid": "P12", "part": "P", "title": "Whose welfare matters most?", "level": "apart", "a": {"answer_id": "P12.b", "answer": "Probably A, depending on the size of the overall welfare loss.", "explanation": "what does welfare mean here? the construction of your question leads me to think youre measuring this in the form of wealth or whatever. for a problem like this I wouldnt think about welfare in those terms. I think about it in terms of human flourishing (which I know is kinda squishy but bear with me) and diminishing marginal returns is very real. if you have a policy that would take $10k from a middle class person but net Bezos $10B Im not sure thats a good idea bc the value of an incremental 10b to bezos is basically nothing, for example. so I kinda take issue with the way you frame the question. i feel like for such a scenario to even exist youre prob messing up your util calc", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P12.d", "answer": "Policy B. Higher aggregate welfare is the decisive consideration here.", "explanation": "Policy B, but it also depends on the impact of policy A. Is the welfare loss substantial to a subgroup of the better off? If so, no to policy A. If welfare loss is essentially unnoticeable, then I would pick policy A. But generally in a society overall welfare loss should be avoided.", "importance": 4, "tags": []}}, {"qid": "P13", "part": "P", "title": "Cultural liberalism and social norms", "level": "apart", "a": {"answer_id": "P13.a", "answer": "Strongly protect the minority's freedom and reject state enforcement of conventional morality.", "explanation": "tbh if its not enshrined in laws I dont think the state should care about \"norms\". either youre violating the laws in which case yeah enforce them or youre not and leave them alone, or change the laws through democratic process and then enforce", "importance": null, "tags": []}, "b": {"answer_id": "P13.c", "answer": "Balance personal autonomy and social cohesion, potentially permitting some legal restrictions.", "explanation": "Laws should always apply uniformly. If the minority’s way of life runs afoul of the law, it is not to be permitted. State should promote social cohesion to majority culture.", "importance": 5, "tags": []}}, {"qid": "P14", "part": "P", "title": "Group disadvantage and individual fairness", "level": "match", "a": {"answer_id": "P14.d", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "pretty clearly talking about affirmative action here. there are 2 dimensions of how to answer this:\n1. as a practical concern: pushing people in through a backdoor who are underqualified seems like youre setting them up for failure in a lot of cases and even if you arent, you undermine peoples faith in the fairness of institutions\n2. as a moral concern: I understand wanting to correct structural disadvantage but I think you do that upstream with other forms of economic redistribution and earlier childhood education. feels unfair to deny more qualified people spots at this stage", "importance": null, "tags": []}, "b": {"answer_id": "P14.d", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "No individual should be given less opportunity because of their individual birth circumstances.", "importance": 5, "tags": []}}, {"qid": "P15", "part": "P", "title": "Immigration, national obligations, and universal welfare", "level": "close", "a": {"answer_id": "P15.c", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "as with most questions I think there is both a practical and moral dimension this:\n\nmorally: I dont think an american life is worth more than a life from another country. morally it feels kinda suspect to slam the doors shut. that said to the extent that the state exists in a social contract with its citizens, its primary obligations are to them. so I guess lean towards liberalization while being careful to optimize towards citizen wellbeing\n\npractically: letting the doors open to immigrants is terrible policy. people hate it and it opens up questions of fairness (why implicitly reward people for not following the proper processes) and can undermine social cohesion. immigration is good for the economy and society but should be done in a controlled and orderly way", "importance": null, "tags": []}, "b": {"answer_id": "P15.d", "answer": "National governments have a primary obligation to their own citizens, even at substantial cost to global welfare.", "explanation": "A government has the obligation to their citizen welfare only. Global welfare only matters in so far as it threatens the government’s citizens.", "importance": 5, "tags": []}}, {"qid": "P16", "part": "P", "title": "Do you give special moral weight to the worst-off?", "level": "apart", "a": {"answer_id": "P16.a", "answer": "Yes. An equal benefit matters morally more when it goes to someone worse off.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P16.c", "answer": "No. Equal gains in actual well-being have equal moral value, regardless of who receives them.", "explanation": "Honestly depends more on the circumstances. Why is this person disadvantaged? But generally I’d say equal moral value.", "importance": 2, "tags": []}}, {"qid": "P17", "part": "P", "title": "What makes a right fundamental?", "level": "match", "a": {"answer_id": "P17.a", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P17.a", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": 4, "tags": []}}, {"qid": "P18", "part": "P", "title": "Can economic liberty be restricted for social welfare?", "level": "close", "a": {"answer_id": "P18.b", "answer": "There is a meaningful rights concern, but it can be outweighed by sufficiently strong public interests.", "explanation": "I guess I’ll start by saying I find the conventional account of property rights a little odd. That there exists objects in the world to which you and you alone are solely morally and therefore legally entitled. I dont like the idea of a state or some institution being able to reach in and take from people but I think philosophically that bothers me not bc I believe there is some sanctity to the ownership of stuff but rather I think there can be some violation of human dignity and autonomy. Like for example I find the idea that a person can buy a shit ton of land and kick everyone off of it kinda weird and not sure that there is a fully morally coherent justification, particularly when this land’s ownership is passed down through generations of inherited wealth.\n\nSo I care about property rights morally in as much as I think that a state that doesnt will overreach and shows that it does not respect the agency and autonomy of people. Practically too, if you can you arbitrarily take things from people, it undermines your political legitimacy and undermines peoples incentive to build and work.\n\nAll that said while I dont think the state should just arbitrarily take stuff from people, I also dont think there is some reified sanctity to the idea of owning stuff that intrinsically overrides the welfare of society as a whole", "importance": null, "tags": []}, "b": {"answer_id": "P18.a", "answer": "No. Property rights matter, but ordinary taxation is not comparable to violating fundamental civil liberties.", "explanation": "", "importance": 4, "tags": []}}, {"qid": "P19", "part": "P", "title": "Democratic legitimacy versus constitutional rights", "level": "match", "a": {"answer_id": "P19.a", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P19.a", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "Must prevent tyranny of the majority.", "importance": 5, "tags": []}}, {"qid": "P20", "part": "P", "title": "Universal moral worth versus obligations to citizens", "level": "apart", "a": {"answer_id": "P20.b", "answer": "Probably B, but governments may legitimately place some additional weight on citizens.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P20.d", "answer": "A. The public resources of a country should primarily benefit its own citizens.", "explanation": "Government takes money from its citizens to function. The spending of those funds should prioritize helping the citizens of that country. I think citizens of a country can be helped by giving aid to others if part of a larger policy prescription", "importance": 5, "tags": []}}, {"qid": "P21", "part": "P", "title": "Judicial power and democratic accountability", "level": "match", "a": {"answer_id": "P21.a", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "principled objections and desires to preserve rights and liberties enshrined in the constitution im for strong judicial review. There is a real concern of tyranny of the masses. That said you cant just take principled objections for granted", "importance": null, "tags": []}, "b": {"answer_id": "P21.a", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "Judicial review should ensure protect of rights of individuals", "importance": 4, "tags": []}}, {"qid": "P22", "part": "P", "title": "Nationalism, patriotism, and political identity", "level": "apart", "a": {"answer_id": "P22.a", "answer": "Shared constitutional principles, civic equality, and democratic institutions are sufficient", "explanation": "Your use of the word should implies a normative judgement. In that case yeah I think institutions and a belief in democratic and institutional values should be sufficient for national identity. Though I recognize in practice, shared traditions and symbols are also important for social cohesion. I also dont think national identity is itself a moral good but rather something of instrumental value for a functioning society. The reason I didnt go with the last option is the use of the word “can” which implies practical application. I dont think people in practice are willing to cooperate purely on the basis of abstract philosophical and political commitments", "importance": null, "tags": []}, "b": {"answer_id": "P22.c", "answer": "A substantive national culture and historical identity are important alongside civic principles", "explanation": "Shared civic principals are a requirement of a functioning democratic society. Strong national culture is important as well for social trust and cohesion. State should cultivate and preserve national identity via reasonable assimilation requirements and immigration regulations.", "importance": 5, "tags": []}}, {"qid": "P23", "part": "P", "title": "The welfare state and positive rights", "level": "unscored", "a": {"answer_id": "P23.d", "answer": "Public provision should depend mainly on evidence of welfare gains, rather than an independent entitlement", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P23.b", "answer": "There is a strong public obligation to guarantee a decent minimum, though not every service is an absolute right", "explanation": "", "importance": 4, "tags": []}}, {"qid": "P24", "part": "P", "title": "Religion, pluralism, and public institutions", "level": "close", "a": {"answer_id": "P24.c", "answer": "Religious freedom deserves protection, but all public-facing institutions should meet robust secular equality standards", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P24.b", "answer": "Broad accommodation for adults, but stronger common standards for institutions educating children", "explanation": "", "importance": 3, "tags": []}}, {"qid": "P25", "part": "P", "title": "Foreign policy: Liberal ideals versus strategic restraint", "level": "apart", "a": {"answer_id": "P25.c", "answer": "Favor diplomatic engagement and targeted measures; avoid broad confrontations without clear prospects for improvement", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P25.b", "answer": "Apply meaningful pressure, but balance it with security interests and the likely effectiveness of sanctions", "explanation": "", "importance": 5, "tags": []}}, {"qid": "P26", "part": "P", "title": "Markets, regulation, and the burden of proof", "level": "match", "a": {"answer_id": "P26.c", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P26.c", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": 2, "tags": ["depends"]}}, {"qid": "P27", "part": "P", "title": "Concentrated private power", "level": "apart", "a": {"answer_id": "P27.b", "answer": "Intervene selectively, including through competition policy and safeguards against arbitrary exclusion", "explanation": "Practically speaking government officials are poorly positioned to understand technology much less the 2nd order or other downstream effects of regulation which is often a blunt instrument. I think the gov needs to be willing to intervene in certain cases but should be circumspect when and how it chooses to do so, particularly when often times the changing nature of the market and technology solves the problem anyway (consider for example that many of the most powerful companies in the world in the 90s are shadows of themselves or defunct today)", "importance": null, "tags": []}, "b": {"answer_id": "P27.c", "answer": "Intervene only where demonstrable consumer harm or identifiable market failures exist", "explanation": "", "importance": 4, "tags": []}}, {"qid": "P28", "part": "P", "title": "Free speech and harmful expression", "level": "apart", "a": {"answer_id": "P28.a", "answer": "No; political expression should remain protected even when deeply harmful or offensive", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P28.c", "answer": "Possibly, if sufficiently compelling evidence establishes substantial societal harm", "explanation": "", "importance": 4, "tags": ["depends"]}}, {"qid": "P29", "part": "P", "title": "Capitalism and worker power", "level": "match", "a": {"answer_id": "P29.a", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "I might be in favor of the 2nd one but it depends on what strengthening unions and bargaining rights and all of that actually entails. Like I said before I think regulation is often a blunt instrument and I think often the gov messes it up", "importance": null, "tags": []}, "b": {"answer_id": "P29.a", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "", "importance": 3, "tags": []}}, {"qid": "P30", "part": "P", "title": "Public order versus civil liberties", "level": "apart", "a": {"answer_id": "P30.b", "answer": "Protect protest rights while using narrow, content-neutral restrictions on severe disruption", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P30.c", "answer": "Give public order and residents' ordinary freedom of movement comparable weight to protest rights", "explanation": "Protest rights shouldn’t significant infringe on individual liberties.", "importance": null, "tags": []}}, {"qid": "P31", "part": "P", "title": "Healthcare and the welfare state", "level": "close", "a": {"answer_id": "P31.a", "answer": "Universal public insurance, because comprehensive access and risk pooling justify the institutional change", "explanation": "Healthcare is a great example of market failure - huge consolidations in the value chain has led to massive conglomerates and regulatory capture has led to results that are incommensurate with the massive costs. having a monopsony with a buyer that has the power to create more transparency and better pricing sounds like a way better move", "importance": null, "tags": []}, "b": {"answer_id": "P31.b", "answer": "Universal public insurance if evidence shows it performs better, but without an intrinsic preference for public provision", "explanation": "Healthcare for lower income citizens is an important issue and I believe everyone deserves access to a basic minimum of care. Implementation and costs significantly matter here", "importance": 3, "tags": ["depends"]}}, {"qid": "P32", "part": "P", "title": "Housing, local democracy, and property rights", "level": "close", "a": {"answer_id": "P32.a", "answer": "Override restrictive local zoning and allow substantial construction, even against homeowners' preferences", "explanation": "Housing is a huge issue for the economy. Massively contributing to the affordability crisis. Just leaving things to local control is just ceding the issue to NIMBYs which is why we’re in this mess to begin with. Im def a YIMBY", "importance": null, "tags": ["build"]}, "b": {"answer_id": "P32.b", "answer": "Substantially liberalize construction while retaining limited local safeguards", "explanation": "Original homeowners should have some say in policy. However severe housing shortages are a threat to societal stability and government has an obligation for its citizens to be housed", "importance": 3, "tags": ["build"]}}, {"qid": "P33", "part": "P", "title": "Climate change and economic growth", "level": "match", "a": {"answer_id": "P33.b", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P33.b", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "Climate change is an existential threat to society today and in the future. Gov has an obligation to prevent this harm. Government should regulate and use market forces such as carbon taxes and subsidies for energy alternatives to promote investment.", "importance": 5, "tags": []}}, {"qid": "P34", "part": "P", "title": "Crime, punishment, and the rule of law", "level": "apart", "a": {"answer_id": "P34.d", "answer": "Prioritize punishment and public order, accepting some additional restrictions to reduce crime", "explanation": "I think dems have been too soft on crime. At the very least you need to enforce the laws on the books and not tolerate public disorder and lawlessness. It’s a recipe for undermining social trust. Dont go the other way though and just blindly support the police and law enforcement. They have been hot beds of iniquity, corruption, and unaccountability. You need a competent and fair administration of justice. Reform law enforcement, dont be needlessly cruel but create law and order", "importance": null, "tags": []}, "b": {"answer_id": "P34.b", "answer": "Combine credible enforcement and accountability with substantial rehabilitation and prevention", "explanation": "", "importance": 4, "tags": []}}, {"qid": "P35", "part": "P", "title": "International security and military intervention", "level": "match", "a": {"answer_id": "P35.b", "answer": "Support the threatened democracy if the strategic outlook and expected consequences justify the risks", "explanation": "I think morally it’s good to support democracies against authoritarian aggression but practically foreign entanglements are a mess and have a ton of unintended consequences and just sap your political capital. It’s often the case that it’s just smarter to spend your chips elsewhere and avoid potential quagmires. A clear example of where what I think is morally good diverges from what I think is best policy", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P35.b", "answer": "Support the threatened democracy if the strategic outlook and expected consequences justify the risks", "explanation": "", "importance": 4, "tags": ["depends"]}}, {"qid": "U1", "part": "U", "title": "Federal taxation", "level": "apart", "a": {"answer_id": "U1.b", "answer": "Moderately increase taxes on high earners and capital income, while preserving incentives for investment", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U1.c", "answer": "Keep the overall tax burden broadly similar, but simplify the code and close loopholes", "explanation": "Death tax should be higher. Majority of loopholes must be closed. Tax burden should be relatively the same except for a society where there richest are richest by a wide margin. In that circumstance, more tax burden should be levied.", "importance": 5, "tags": []}}, {"qid": "U2", "part": "U", "title": "Federal spending and deficits", "level": "match", "a": {"answer_id": "U2.c", "answer": "Make deficit reduction a central priority through meaningful spending reforms and some revenue measures", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U2.c", "answer": "Make deficit reduction a central priority through meaningful spending reforms and some revenue measures", "explanation": "Dangerous deficit spending is an existential threat to society. Gov has an obligation to prevent this.", "importance": 5, "tags": []}}, {"qid": "U3", "part": "U", "title": "Minimum wage and labor markets", "level": "close", "a": {"answer_id": "U3.e", "answer": "Use an alternative such as wage subsidies or expanded earned-income tax credits as the main instrument", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U3.c", "answer": "Keep the federal floor relatively modest and leave most increases to states and cities", "explanation": "Market forces should be allowed to guide minimum wage.", "importance": 2, "tags": []}}, {"qid": "U4", "part": "U", "title": "Business regulation and competition", "level": "match", "a": {"answer_id": "U4.b", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U4.b", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "", "importance": 3, "tags": []}}, {"qid": "U5", "part": "U", "title": "Healthcare system", "level": "close", "a": {"answer_id": "U5.a", "answer": "Single-payer national insurance replacing most private primary insurance", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U5.b", "answer": "A universal public option with automatic or near-universal coverage while retaining private insurers", "explanation": "Private market should be highly regulated. Universal public option should be quality enough to compete with private insurance. Universal coverage should be a requirement", "importance": 4, "tags": []}}, {"qid": "U6", "part": "U", "title": "Legal immigration levels", "level": "apart", "a": {"answer_id": "U6.b", "answer": "Increase moderately, particularly through employment-based immigration", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U6.d", "answer": "Reduce overall legal immigration, prioritizing applicants with high economic contributions", "explanation": "US is at a high polarization point with a lack of unifying culture which significantly threatens the country’s cohesion. However low birth rates make immigration vital to future growth. We should prioritize high value skilled English speaking immigrants with democratic values while allowing traditional legal refugees (not economic migrants) into the country to help fill some of the low value jobs citizens usually are too qualified for. Illegal immigration should be quashed and violators deported. Birthright citizenship should be abolished for illegal immigrant parents but for legal immigrants should be upheld.", "importance": 5, "tags": []}}, {"qid": "U7", "part": "U", "title": "Unauthorized immigration and enforcement", "level": "apart", "a": {"answer_id": "U7.b", "answer": "A conditional path to legal status for established residents, alongside strong border enforcement and immigration-system reform", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U7.c", "answer": "Enforce borders rigorously and increase removals, with legalization confined to narrowly defined groups", "explanation": "New illegal immigration must be aggressively stopped as top priority. Immediate deportation for any illegal immigrants who are convicted of a crime. Birthright citizenship should be ended if both parents do not have legal status. Deportations of existing residents who consume public benefits. No path to legal residency for those who entered illegally with exceptions for children under age 18.", "importance": 5, "tags": []}}, {"qid": "U8", "part": "U", "title": "Policing and public disorder", "level": "close", "a": {"answer_id": "U8.c", "answer": "Consistently enforce both minor and serious offenses, with proportionate sanctions, accountable policing, and diversion where effective", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U8.d", "answer": "Substantially increase police presence, arrests, prosecution, and penalties to restore order", "explanation": "This public disorder is a governmental failure and encroaches on the ability of law abiding citizens to live freely & peacefully. Gov should crackdown and enforce laws even if it means conviction increases substantially. However jail time should ultimately guide ppl to rehabilitation", "importance": 5, "tags": []}}, {"qid": "U9", "part": "U", "title": "Criminal sentencing and incarceration", "level": "apart", "a": {"answer_id": "U9.b", "answer": "Reduce incarceration for nonviolent offenses while maintaining strong penalties for serious violent crime", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U9.d", "answer": "Increase penalties and use incarceration more extensively, especially for repeat offenders", "explanation": "Time between arrest and jail should be cut down significantly. Laws should be aggressively enforced and penalties should increase for repeat offenders. However incarceration should provide genuine opportunities for rehabilitation and integration back into society for nonviolent criminals.", "importance": 5, "tags": []}}, {"qid": "U10", "part": "U", "title": "Drugs and addiction", "level": "apart", "a": {"answer_id": "U10.a", "answer": "Legalize and regulate most drugs, including hard drugs, with strong treatment and harm-reduction services", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U10.c", "answer": "Legalize cannabis, expand treatment and harm reduction, but retain criminal penalties for possession of the most dangerous drugs", "explanation": "", "importance": 3, "tags": []}}, {"qid": "U11", "part": "U", "title": "Energy and electricity production", "level": "apart", "a": {"answer_id": "U11.c", "answer": "Pursue energy abundance across nuclear, renewables, and fossil fuels, with broad permitting reform", "explanation": "", "importance": null, "tags": ["build"]}, "b": {"answer_id": "U11.a", "answer": "Rapidly prioritize clean energy, including regulation and subsidies that accelerate replacing fossil fuels", "explanation": "", "importance": 4, "tags": []}}, {"qid": "U12", "part": "U", "title": "Environmental review and infrastructure permitting", "level": "apart", "a": {"answer_id": "U12.a", "answer": "Substantially streamline permitting and limit procedural opportunities to block projects", "explanation": "", "importance": null, "tags": ["build"]}, "b": {"answer_id": "U12.c", "answer": "Maintain existing safeguards but improve agency staffing and processing speed", "explanation": "Burden of proof rests on those seeking to impact the environment. Environmental protections are extremely important even if it means reduced growth", "importance": 5, "tags": []}}, {"qid": "U13", "part": "U", "title": "K–12 education and school choice", "level": "unscored", "a": {"answer_id": "U13.e", "answer": "Use another approach, particularly for funding or school governance", "explanation": "Im not sufficiently versed on the literature on charter school and voucher outcomes to have a strong view but generally I think all of education starts with determining how to quantify and measure leaning effectively and rigorously measuring and optimizing towards that and making corrections and adjustments accordingly (e.g. fire bad teachers quickly, pay and recognize good teachers more, etc)", "importance": null, "tags": ["catch_all"]}, "b": {"answer_id": "U13.d", "answer": "Restrict private vouchers and charter expansion, concentrating resources in district public schools", "explanation": "Public schools suffer from increasing lack of funds. Parents should have choice between public schools but there should not be charter schools or private vouchers. If parents are unhappy with public options they can send their child to an accredited private institution", "importance": 5, "tags": []}}, {"qid": "U14", "part": "U", "title": "College affordability and student loans", "level": "unscored", "a": {"answer_id": "U14.d", "answer": "Reduce federal lending and subsidies significantly, relying more on institutional competition and private financing", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U14.x", "answer": "I reject the framing of this question", "explanation": "Do not love the options. State gov has an obligation to provide public higher education with the means to access it via scholarships, merit aid, and loans without excessive interest or quick repayment expectation. Student loan debt should not be forgiven but before students are allowed to take on debt there should be multiple meetings and disclosures of the loan and future earning expectations.", "importance": 4, "tags": ["catch_all"]}}, {"qid": "U15", "part": "U", "title": "Industrial policy and domestic manufacturing", "level": "match"
