<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0;padding:0}</style></head><body><title>Gene and Rachel Hong</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same paper-and-sheet system as the single-person report. One column of sections; the issue map is a 2x2 grid that stacks on phones. Person A is blue, person B is gold, everywhere. */
:root {
  --paper: #EEF1F4;
  --sheet: #FBFCFD;
  --ink: #15233F;
  --muted: #5A6578;
  --rule: #CDD4DD;
  --mark: #0E6E5C;
  --mark-soft: #E2F1EC;
  --warn: #A1450E;
  --warn-soft: #F7E9DE;
  --pa: #2F5DA6;
  --pb: #B8801A;
  --pa-soft: #E3EAF6;
  --pb-soft: #F5ECDB;
  --font-q: "Newsreader", Georgia, "Times New Roman", serif;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
    --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
    --pa: #5F87CC; --pb: #B88A2E; --pa-soft: #1B2638; --pb-soft: #2E2616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
  --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
  --pa: #5F87CC; --pb: #B88A2E; --pa-soft: #1B2638; --pb-soft: #2E2616;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
  display: flex; flex-direction: column; gap: 44px;
}
.wrap > *, section.s > * { min-width: 0; max-width: 100%; }
h1, h2, h3 { font-family: var(--font-q); font-weight: 500; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.code { font-family: var(--font-code); font-size: 12.5px; letter-spacing: 0.03em; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sw.a { background: var(--pa); } .sw.b { background: var(--pb); }
.who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }

.hero { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: clamp(22px, 5vw, 48px); display: flex; flex-direction: column; gap: 24px; }
.hero .eyebrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); }
.hero h1 { font-size: clamp(34px, 7.5vw, 54px); line-height: 1.04; letter-spacing: -0.02em; }
.hero .summary { font-family: var(--font-q); font-size: clamp(19px, 3.4vw, 22px); line-height: 1.45; font-style: italic; max-width: 52ch; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.person { border-radius: 5px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.person.a { background: var(--pa-soft); } .person.b { background: var(--pb-soft); }
.person h2 { font-size: 23px; line-height: 1.2; }
.person p { font-size: 14.5px; }
.person .meta { font-size: 12.5px; color: var(--muted); }
.verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.verdict div { padding: 14px 12px 4px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.verdict .k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.verdict .v { font-family: var(--font-q); font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.verdict .d { font-size: 13.5px; color: var(--muted); line-height: 1.45; }

nav.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
nav.toc a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
nav.toc a:hover { color: var(--ink); border-color: var(--ink); }
section.s { display: flex; flex-direction: column; gap: 18px; }
.s-head { display: flex; gap: 14px; align-items: baseline; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; }
.s-head .n { font-family: var(--font-code); color: var(--mark); font-size: 14px; }
.s-head h2 { font-size: clamp(24px, 4.6vw, 30px); }
.intro { color: var(--muted); max-width: 68ch; }

/* Issue map */
.map { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; }
.map .colh, .map .rowh { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: flex-end; }
.map .rowh { writing-mode: vertical-rl; transform: rotate(180deg); align-items: center; justify-content: center; padding: 0 2px; }
.cell { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cell.here { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cell .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.cell h3 { font-size: 20px; }
.cell .count { font-family: var(--font-code); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .desc { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.issues { display: flex; flex-wrap: wrap; gap: 6px; }
.issue { font-size: 13px; padding: 3px 9px; border-radius: 3px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); text-decoration: none; }
.issue:hover { border-color: var(--ink); }
.issue .code { font-size: 11px; color: var(--muted); margin-right: 4px; }
@media (max-width: 640px) {
  .map { grid-template-columns: 1fr; }
  .map .colh, .map .rowh, .map .corner { display: none; }
  .cell .desc::before { content: attr(data-axes); display: block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
}

/* Findings */
.cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }
.finding { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.finding h3 { font-size: 21px; line-height: 1.3; }
.finding p, dl.fields dd { max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.chip.fault { color: var(--warn); border-color: var(--warn); background: transparent; }
.chip.match { color: var(--mark); border-color: var(--mark); background: transparent; }
.chip.close { color: var(--ink); }
.chip.apart { color: var(--warn); border-color: var(--warn); background: transparent; }
dl.fields { display: grid; grid-template-columns: minmax(110px, 170px) 1fr; gap: 8px 16px; margin: 0; font-size: 14.5px; }
dl.fields dt { color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
dl.fields dt .sw { transform: translateY(1px); }
dl.fields dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { dl.fields { grid-template-columns: 1fr; gap: 2px; } dl.fields dd { margin-bottom: 8px; } }

.group { display: flex; flex-direction: column; gap: 10px; }
.group > h3 { font-size: 20px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.group > h3 span { font-family: var(--font-ui); font-size: 14px; color: var(--muted); }
.rows { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
details.row > summary { gap: 6px; }
.row { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 6px; }
.row:last-child { border-bottom: none; }
.row .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; }
.row .t .code { color: var(--muted); font-weight: 400; }
.row p { font-size: 14.5px; max-width: 72ch; }

details.ev { font-size: 14px; }
details.ev summary { cursor: pointer; color: var(--muted); list-style: none; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary::before { content: "+"; font-family: var(--font-code); width: 14px; }
details.ev[open] summary::before { content: "−"; }
details.ev summary .qid { font-family: var(--font-code); font-size: 12px; padding: 1px 6px; border-radius: 3px; color: var(--ink); border: 1px solid var(--rule); }
details.ev summary .qid.a { border-color: var(--pa); } details.ev summary .qid.b { border-color: var(--pb); }
.ev-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--rule); }
.ev-item { display: flex; flex-direction: column; gap: 2px; }
.ev-item .q { font-weight: 600; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.ev-item .x { font-family: var(--font-q); font-size: 15.5px; color: var(--muted); font-style: italic; white-space: pre-line; }

/* Principle-to-policy gaps */
.gaps { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 20px 14px; display: flex; flex-direction: column; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 10px 0 4px; align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); background: var(--sheet); display: inline-block; }
.fill { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); display: inline-block; }
.gaxis { display: flex; flex-direction: column; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.gaxis:last-child { border-bottom: none; }
.gaxis .name { font-weight: 600; font-size: 15px; }
.gline { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; }
.gline .lbl { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 22px; cursor: default; }
.track .line { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule); }
.track .tick { position: absolute; top: 5px; width: 1px; height: 12px; background: var(--rule); }
.track .tick.mid { background: var(--muted); }
.track .seg { position: absolute; top: 9px; height: 4px; border-radius: 2px; }
.track .dot { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid; box-shadow: 0 0 0 2px var(--sheet); }
.track.a .seg, .track.a .dot.pol { background: var(--pa); } .track.a .dot { border-color: var(--pa); }
.track.b .seg, .track.b .dot.pol { background: var(--pb); } .track.b .dot { border-color: var(--pb); }
.track .dot.phil { background: var(--sheet); }
.ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); gap: 12px; padding-left: 74px; }
.ends span:last-child { text-align: right; }
.gval { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 74px; }
.tip { position: fixed; z-index: 6; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 13px; padding: 6px 9px; border-radius: 4px; max-width: 260px; line-height: 1.4; font-variant-numeric: tabular-nums; }

/* Predictions */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.stats div { padding: 12px 12px 4px 0; display: flex; flex-direction: column; gap: 2px; }
.stats .v { font-family: var(--font-q); font-size: 26px; font-variant-numeric: tabular-nums; }
.stats .k { font-size: 13px; color: var(--muted); }
.miss { display: grid; grid-template-columns: minmax(110px, 170px) 1fr; gap: 4px 16px; font-size: 14.5px; }
@media (max-width: 520px) { .miss { grid-template-columns: 1fr; gap: 0; } }
.miss dt { color: var(--muted); font-weight: 600; }
.miss dd { margin: 0; }

.ask { font-family: var(--font-q); font-size: 18px; line-height: 1.45; font-style: italic; max-width: 60ch; }

/* Appendix */
.filters { display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; flex-wrap: wrap; }
.seg-ctl button { font: inherit; font-size: 13.5px; padding: 6px 12px; background: var(--sheet); color: var(--muted); border: none; border-right: 1px solid var(--rule); cursor: pointer; }
.seg-ctl button:last-child { border-right: none; }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.qlist { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
details.q { border-bottom: 1px solid var(--rule); }
details.q:last-child { border-bottom: none; }
details.q > summary { cursor: pointer; padding: 12px 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
details.q > summary::-webkit-details-marker { display: none; }
details.q > summary .code { color: var(--muted); width: 34px; flex: none; }
details.q > summary .ttl { flex: 1 1 220px; min-width: 0; font-weight: 500; }
details.q:target > summary, details.q.flash > summary { background: var(--mark-soft); }
.qbody { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; padding: 0 18px 16px; }
.qside { border-radius: 5px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.qside.a { background: var(--pa-soft); } .qside.b { background: var(--pb-soft); }
.qside .ans { font-weight: 600; font-size: 14.5px; }
.qside .imp { font-size: 12.5px; color: var(--muted); }
.qside .x { font-family: var(--font-q); font-size: 15.5px; font-style: italic; white-space: pre-line; overflow-wrap: anywhere; }
.qlinks { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }

.fix { align-self: flex-start; background: none; border: none; padding: 2px 0; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.fix-box { display: flex; flex-direction: column; gap: 8px; }
.fix-box textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px; min-height: 70px; resize: vertical; }
.tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--sheet);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 14.5px; z-index: 5; }
.tray button, .tray select { font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 4px; border: 1px solid var(--sheet); background: var(--sheet); color: var(--ink); cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

/* Collapsible cards: the summary is the headline, the body is the reasoning */
details.x > summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
details.x > summary::-webkit-details-marker { display: none; }
details.x > summary .more { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
details.x > summary .more::before { content: "+"; font-family: var(--font-code); }
details.x[open] > summary .more::before { content: "−"; }
details.x[open] > summary .more span::after { content: "Hide details"; }
details.x:not([open]) > summary .more span::after { content: "Show details"; }
details.x > .body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; margin-top: 10px; border-top: 1px dashed var(--rule); }
.duo { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.duo div { display: flex; gap: 8px; align-items: baseline; }
.duo .sw { transform: translateY(1px); }
.duo b { font-weight: 600; flex: none; }
.crux { font-size: 14px; color: var(--muted); }
.toolbar { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--ink); }

/* Who they are */
.portraits { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.portraits .person p { font-family: var(--font-q); font-size: 17px; line-height: 1.5; }
.bg { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.bg-row { display: grid; grid-template-columns: 150px 1fr 1fr; gap: 0 16px; padding: 12px 18px; border-bottom: 1px solid var(--rule); align-items: start; }
.bg-row:last-child { border-bottom: none; }
.bg-row .cat { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.bg-row .head { display: contents; }
.bg-head { padding-block: 8px; }
.bg-cell { min-width: 0; }
.bg-cell > summary { gap: 4px; }
.bg-cell .g { font-weight: 600; font-size: 15px; line-height: 1.4; }
.bg-cell .nm { display: none; }
.conf { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.conf::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); }
.conf.strong { color: var(--mark); } .conf.strong::before { background: var(--mark); border-color: var(--mark); }
.conf.none::before { border-style: dotted; }
@media (max-width: 640px) {
  .bg-row { grid-template-columns: 1fr; gap: 10px; }
  .bg-head { display: none; }
  .bg-cell .nm { display: inline-flex; }
}
.traits2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.tlist { display: flex; flex-direction: column; gap: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.tlist > .hd { padding: 10px 18px; border-bottom: 1px solid var(--rule); }
.tlist details.x { padding: 12px 18px; border-bottom: 1px solid var(--rule); }
.tlist details.x:last-child { border-bottom: none; }
.tlist .tr { font-weight: 600; font-size: 15px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chip.click { color: var(--mark); border-color: var(--mark); background: transparent; }
.chip.friction { color: var(--warn); border-color: var(--warn); background: transparent; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap" id="app">
  <div class="hero"><p class="muted">Loading comparison…</p></div>
</div>
<div class="tray" id="tray" hidden>
  <span id="trayText"></span>
  <label for="trayFrom" class="code" style="color:inherit">From</label>
  <select id="trayFrom"></select>
  <button type="button" id="trayCopy">Copy corrections</button>
  <textarea id="trayFallback" aria-label="Your corrections" readonly hidden style="width:100%;font:12px var(--font-code);min-height:60px"></textarea>

ger gains for people abroad", "detail": "Gene would probably fund the larger gains for poorer foreigners, writing \"I dont think an american life is worth more than a life from another country.\" Rachel Hong would probably fund the smaller domestic benefit, and their answers on national culture and immigration levels also put citizens first.", "evidence": ["gene:P20", "gene:P15", "rachel-hong:P20", "rachel-hong:P22", "rachel-hong:U6"], "checked": "keep"}, {"id": "d6", "qid": "P22", "type": "values", "crux": "Whether national culture matters beyond its practical use", "detail": "Gene holds that civic principles and democratic institutions should be enough, and sees national identity as having only practical value, though they grant that traditions help social cohesion in practice. Rachel Hong chose a substantive national culture and historical identity as important alongside civic principles.", "evidence": ["gene:P22", "rachel-hong:P22"], "checked": "keep"}, {"id": "d7", "qid": "P31", "type": "facts", "crux": "Whether healthcare is a market failure public insurance would fix", "detail": "Both start from markets as the default, but Gene calls healthcare \"a great example of market failure\" and expects a single public buyer to bring better pricing. Rachel Hong prefers competitive private insurance with substantial subsidies and regulatory safeguards.", "evidence": ["gene:P31", "gene:P7", "rachel-hong:P31", "rachel-hong:P7"], "checked": "keep"}, {"id": "d8", "qid": "P32", "type": "priorities", "crux": "How much local democratic say should weigh against new housing", "detail": "Gene would override restrictive local zoning, writing that local control means \"ceding the issue to NIMBYs\" (opponents of new building nearby). Rachel Hong prefers gradual negotiated reforms that give meaningful weight to local democratic preferences.", "evidence": ["gene:P32", "rachel-hong:P32"], "checked": "keep"}, {"id": "d9", "qid": "P35", "type": "priorities", "crux": "Whether the moral case for helping a democracy justifies more than limited aid", "detail": "Gene writes that supporting democracies is morally good but that \"foreign entanglements are a mess,\" and would still give support when the strategic outlook justifies the risk. Rachel Hong prefers limited aid and diplomacy to minimize escalation, writing \"I wonder if America has ever been truly successful\" at protecting another country's democracy.", "evidence": ["gene:P35", "rachel-hong:P35"], "checked": "reframe"}, {"id": "d10", "qid": "U1", "type": "values", "crux": "Whether large inequality is a reason to tax top earners more", "detail": "Both said they would support more redistribution when the benefits outweigh the economic costs, and Gene adds that huge inequality is \"problematic in itself.\" Gene would moderately raise taxes on high earners and capital income, while Rachel Hong would keep the overall burden similar and close loopholes, without explaining that choice.", "evidence": ["gene:U1", "gene:P6", "rachel-hong:U1", "rachel-hong:P6"], "checked": "reframe"}, {"id": "d11", "qid": "U5", "type": "facts", "crux": "Whether a single public payer would serve Americans better", "detail": "Gene favors single-payer national insurance, expecting a single public buyer to fix pricing in a consolidated industry. Rachel Hong favors a market-led system with targeted public support, writing \"Key on helping vulnerable populations.\"", "evidence": ["gene:U5", "gene:P31", "rachel-hong:U5", "rachel-hong:P31"], "checked": "keep"}, {"id": "d12", "qid": "U6", "type": "values", "crux": "How much weight migrants' interests get against citizens'", "detail": "Gene would moderately increase legal immigration, mainly through employment, and wrote that an American life is not worth more than a foreign one. Rachel Hong would reduce legal immigration toward high economic contributors, and their answers on foreign aid and national culture consistently put citizens first.", "evidence": ["gene:U6", "gene:P15", "rachel-hong:U6", "rachel-hong:P20", "rachel-hong:P22"], "checked": "keep"}, {"id": "d13", "qid": "U7", "type": "values", "crux": "How much weight unauthorized residents' interests get against citizens'", "detail": "Gene supports a conditional path to legal status for established residents alongside strong border enforcement. Rachel Hong placed themselves between rigorous enforcement with narrow legalization and substantially expanded deportations, in line with their citizen-first answers on foreign aid, national culture, and immigration levels.", "evidence": ["gene:U7", "gene:P15", "rachel-hong:U7", "rachel-hong:P20", "rachel-hong:P22", "rachel-hong:U6"], "checked": "keep"}, {"id": "d14", "qid": "U10", "type": "unexplained", "crux": "Neither explained", "detail": "Gene chose to legalize and regulate most drugs, including hard drugs, with strong treatment and harm reduction, while Rachel Hong chose a differentiated system such as mandatory treatment or special rules for particular substances.", "evidence": ["gene:U10", "gene:P8", "rachel-hong:U10", "rachel-hong:P8"], "checked": "reframe"}, {"id": "d15", "qid": "U17", "type": "unexplained", "crux": "Neither explained", "detail": "Gene chose strong federal protections for gender identity with broad access, while Rachel Hong chose a mix of adult protections with context-specific or relatively restrictive rules for minors, schools, and sex-separated settings.", "evidence": ["gene:U17", "rachel-hong:U17"], "checked": "keep"}, {"id": "d16", "qid": "U21", "type": "unexplained", "crux": "Neither explained", "detail": "Gene chose to restructure the military around fewer strategic threats and cut less essential commitments, while Rachel Hong chose to maintain a large, globally capable military with selective modernization.", "evidence": ["gene:U21", "rachel-hong:U21"], "checked": "keep"}], "starters": [{"id": "s1", "issue": "U1", "title": "Should the US tax top earners more?", "why_this_one": "Both said they would back higher taxes when the benefits clearly outweigh the economic costs, so evidence on those costs bears on the test each of them set.", "settling_question": "After the 1993 increase in the top federal income tax rate, did US business investment and growth slow enough to outweigh the revenue it raised?", "evidence": ["gene:U1", "gene:P6", "rachel-hong:U1", "rachel-hong:P6"], "checked": "reframe"}, {"id": "s2", "issue": "U10", "title": "Legalizing hard drugs versus mandatory treatment", "why_this_one": "Both lean toward letting adults make harmful choices with limits for severe harm, and Gene says the size of the harm decides, so evidence on overdose deaths could move either one.", "settling_question": "Where people addicted to hard drugs get a legal, regulated supply, as in Switzerland's prescribed heroin program, do overdose deaths fall more than where treatment is required by law?", "evidence": ["gene:U10", "gene:P8", "rachel-hong:U10", "rachel-hong:P8"], "checked": "reframe"}, {"id": "s3", "issue": "U5", "title": "Single-payer or market healthcare", "why_this_one": "Both make markets the default, and Gene argues healthcare is the exception, which is a factual claim Rachel Hong can test against their own goal of helping vulnerable people.", "settling_question": "Do single-payer countries such as Canada spend less per person than the US while leaving fewer low-income people without needed care?", "evidence": ["gene:U5", "gene:P31", "gene:P7", "rachel-hong:U5", "rachel-hong:P31", "rachel-hong:P7"], "checked": "keep"}], "gap_note": "Gene's largest gap is on social policy, where Gene's policy answers sit further toward the Progressive end than Gene's philosophy answers; Rachel's largest gap is on civil liberties, where Rachel's policy answers sit further toward Order and security first than Rachel's philosophy answers. Gene's explanations start from a stated rule, maximizing welfare within the limits of individual rights, and then weigh the practical risks of each policy. Rachel's few explanations judge policies case by case, as in the crime answer that it \"Depends on what type of crime and criminal’s age and motive etc\".", "style_contrasts": [{"id": "r1", "label": "Rights as hard limits or strong presumptions", "a": "Gene treats some rights as limits that no welfare gain can override, writing that \"individual rights override a general util max framework\".", "b": "Rachel treats rights as strong presumptions with narrow exceptions, saying on secret surveillance that consequences ultimately decide.", "a_short": "Some rights cannot be traded for welfare", "b_short": "Rights are strong presumptions with narrow exceptions", "evidence": ["gene:P11", "gene:P19", "gene:P28", "rachel-hong:P11", "rachel-hong:P19", "rachel-hong:P28"]}, {"id": "r2", "label": "Moral case stated, then set against practice", "a": "Gene states the moral case and the practical case separately, and says so when they point different ways, as on defending democracies abroad.", "b": "Rachel's written doubt on defending democracies abroad is about the track record alone: \"I wonder if America has ever been truly successful\".", "a_short": "Separates what is right from what works", "b_short": "Asks whether past efforts actually worked", "evidence": ["gene:P35", "gene:P15", "gene:P14", "rachel-hong:P35", "rachel-hong:P6"]}, {"id": "r3", "label": "Arguing with the options or stepping outside them", "a": "Gene picks a listed option on almost every question and then argues with the question's framing in writing.", "b": "Rachel chose a catch-all answer such as another approach on 13 questions and often asked to split an issue into categories, such as types of crime, projects, or surveillance.", "a_short": "Picks an option, then disputes the framing", "b_short": "Rejects the options and splits issues into categories", "evidence": ["gene:P5", "gene:P12", "gene:P22", "rachel-hong:P14", "rachel-hong:U9", "rachel-hong:U12", "rachel-hong:U25"]}], "shared_lineage": [{"id": "l1", "name": "Foreign policy realism (foreign policy guided by national interest and likely consequences more than ideals)", "a_use": "Gene backs aid to a threatened democracy only when the strategic outlook justifies the risk, and calls this a case where what is morally good and what is best policy diverge. From that, Gene would narrow the military around key threats.", "b_use": "Rachel favors limited aid and diplomacy, doubting that America has succeeded at defending other democracies. Rachel draws a different conclusion on force: keep a large, globally capable military.", "evidence": ["gene:P25", "gene:P35", "gene:U21", "gene:U24", "rachel-hong:P25", "rachel-hong:P35", "rachel-hong:U21", "rachel-hong:U24"]}, {"id": "l2", "name": "Ordoliberalism, or the social market economy (markets inside firm state rules, especially competition law, plus a safety net)", "a_use": "Gene's answers echo this school. Gene makes markets the default, wants stronger antitrust with simpler regulation, and backs targeted subsidies for strategic sectors, but treats healthcare as a market failure that calls for single-payer.", "b_use": "Rachel's report places Rachel in this school. Rachel picks the same market, antitrust, and strategic subsidy answers as Gene, but keeps healthcare private with subsidies and targeted public support.", "evidence": ["gene:P7", "gene:P27", "gene:U4", "gene:U15", "gene:P31", "gene:U5", "rachel-hong:P7", "rachel-hong:P27", "rachel-hong:U4", "rachel-hong:U15", "rachel-hong:P31", "rachel-hong:U5"]}, {"id": "l3", "name": "John Stuart Mill's harm principle (the state may limit a person's choices only to prevent harm to others)", "a_use": "Gene states the principle directly, \"competent adults should be able to do whatever they want even if it's bad for them\", and goes on to legalize most drugs, including hard drugs.", "b_use": "Rachel's report links Rachel to Mill. Rachel generally opposes restricting risky adult choices but, on drugs, prefers mandatory treatment or special rules for particular substances.", "evidence": ["gene:P8", "gene:U10", "gene:P28", "rachel-hong:P8", "rachel-hong:U10", "rachel-hong:P28"]}], "coverage": [{"id": "v1", "source_finding": "gene:blind-2", "covered_by": "rachel-hong", "title": "Rachel sets special rules for particular drugs", "detail": "Gene's report notes that Gene worries about fentanyl's deadliness yet would legalize most hard drugs without saying which stay illegal. On the same drug question, Rachel chose a differentiated system with mandatory treatment or special rules for particular substances.", "evidence": ["gene:P8", "gene:U10", "rachel-hong:U10", "rachel-hong:P8"]}, {"id": "v2", "source_finding": "gene:blind-0", "covered_by": "rachel-hong", "title": "Rachel picks a competing-insurer design over a single buyer", "detail": "Gene's report notes that Gene has not shown why one public buyer beats universal designs that keep private insurers. On the same healthcare question, Rachel chose competitive private insurance with substantial subsidies and regulatory safeguards, which is one of those alternative designs.", "evidence": ["gene:P31", "gene:U5", "rachel-hong:P31", "rachel-hong:U5"]}, {"id": "v3", "source_finding": "rachel-hong:blind-1", "covered_by": "gene", "title": "Gene grounds rights in dignity and holds them firm", "detail": "Rachel's report notes that Rachel grounds rights in natural rights yet lets consequences override privacy. On the same surveillance question, Gene grounds rights in human dignity and writes that \"individual rights override a general util max framework\".", "evidence": ["rachel-hong:P17", "rachel-hong:P11", "gene:P17", "gene:P11"]}, {"id": "v4", "source_finding": "rachel-hong:blind-2", "covered_by": "gene", "title": "Gene traces unequal outcomes to unequal opportunity", "detail": "Rachel's report notes that Rachel defines justice as genuinely equal opportunity but treats persistent inequality as compatible with fair rules. Gene writes that much inequality comes from \"inequality of opportunity, unequal access to resources, legacy of stuff like redlining\" and favors fixing it upstream through redistribution and early education.", "evidence": ["rachel-hong:P5", "rachel-hong:P10", "gene:P2", "gene:P10", "gene:P14"]}], "findings_index": {"gene:tension-t2": "Maximizing total welfare versus extra weight for the worst-off", "gene:tension-t1": "Single-payer healthcare alongside deficit reduction as central priority", "gene:tension-t4": "Legal hard drugs with firm enforcement of public order", "gene:tension-t7": "Single-payer healthcare with market-based college financing", "gene:tension-t5": "Doubts about government competence versus single-payer replacement", "gene:blind-0": "Single-payer is not held to your evidence test", "gene:blind-1": "Fear of backlash applied to some issues only", "gene:blind-2": "Fentanyl worries you, yet you would legalize it", "gene:blind-3": "Untested claims behind opposing affirmative action", "rachel-hong:tension-t2": "Support for higher taxes in principle, not in policy", "rachel-hong:tension-t4": "A guaranteed minimum delivered by targeted support", "rachel-hong:tension-t7": "Broad abortion access with restrictive immigration", "rachel-hong:tension-t3": "Moderate immigration in principle, reductions in practice", "rachel-hong:tension-t6": "Natural rights with a consequence-based override", "rachel-hong:blind-0": "Immigration answers pull against your stated principle", "rachel-hong:blind-1": "Natural rights that consequences can override", "rachel-hong:blind-2": "Fair rules may not deliver genuinely equal opportunity"}, "predictions": [], "questions": [{"qid": "P1", "part": "P", "title": "What is the primary purpose of government?", "level": "unscored", "a": {"answer_id": "P1.e", "answer": "A combination or different principle", "explanation": "This is a challenging question that I dont think necessarily has a very simple answer. I start by thinking about it from a political theory lens. why do you need a government? not to go all hobbsian but I do think there is a significant concern of anarchy without a state and without a monopoly on the legitimate use of violence (I guess not to go all weber either). after you've cleared that very basic threshold, I think it becomes a lot murkier bc a lot of things that sound good in principle need to be traded off against one another and I feel like it's a facile perspective to just choose a single thing and say that is the only thing to optimize for. I'd say it's prob some combination of promoting collective welfare through building and maintaining strong and stable institutions (e.g. rule of law) while ensuring that individual rights and freedoms are respected. might seem like a bit of a cop out to choose a combo of what youre saying but in my view, it feels arbitrary to just pick one and say thats the main thing", "importance": null, "tags": ["catch_all"]}, "b": {"answer_id": "P1.e", "answer": "A combination or different principle", "explanation": "", "importance": 4, "tags": ["catch_all"]}}, {"qid": "P2", "part": "P", "title": "How do you view economic inequality?", "level": "match", "a": {"answer_id": "P2.b", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "Oof. another tricky one. the one I choose is the closest I guess to what I think but that is itself kinda reductive bc then you have other questions like what is excessive and what do you then do about it? I'd say a few things:\n- I think some degree of inequality is structurally inherent if you want markets (given differences in natural endowments of ability and even things like desire to work hard)\n- I think some degree of inequality is even good as a means to reward and incentivize innovation and effort\n- however, there are 2 further issues that arrise: 1. what is the cause for the inequality in a society? 2. how much inequality are we seeing?\nto the former, I'd say that a lot of inequality we actually see is due to issues like inequality of opportunity, unequal access to resources, legacy of stuff like redlining. to the latter, I think this is a harder question. I take issue with some of the leftist views like all great wealth is inherently exploitative (I think thats absurd) and no billionaires should exist in a just society, however it does strike me as absurd that there are so many holes in the tax codes and structural inequalities through which the wealthy perpetuate their advantages. im not sure that you can necessarily say something like once you've hit X number you need to do Y thing (I think thats a clearly very blunt instrument) but I do think the urgency of the problem does depend on the extend of the inequality", "importance": null, "tags": []}, "b": {"answer_id": "P2.b", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "", "importance": null, "tags": []}}, {"qid": "P3", "part": "P", "title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "level": "match", "a": {"answer_id": "P3.c", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P3.c", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "P4", "part": "P", "title": "How should society approach longstanding traditions and institutions?", "level": "match", "a": {"answer_id": "P4.c", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "depends on why youre asking. are you asking if I value tradition as a thing in and of itself or more as a functional and practical matter. I dont really care about tradition intrinsically. I think if something is broken/doesnt make sense you should fix it/change it. im not precious about the past in that way. however, pragmatically I think there are 2 major concerns with that kind of approach: 1. like james c scott says in seeing like a state, theres a huge danger in people thinking they know it all and can destroy and remake everything in a more rational and superior way. that kind of myopic hubris can be way worse than leaving things as they are. supporting radical change presupposes that the change will be good and there wont be any massive downstream negative consequence which we've seem time and time again is not the case 2. even if you presuppose that it's gonna be good, people and societies as a whole can have a negative reaction to just upturning the way things work. incrementalism is often more effective to counteract this.\n\nnow I dont wanna make blanket statements. if you see something thats genuinely super fucked up like slavery, then yeah fix it sure but generally, Im on the side of being careful and circumspect", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P4.c", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "P5", "part": "P", "title": "Which statement best captures your conception of justice?", "level": "apart", "a": {"answer_id": "P5.d", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "I take issue with the premise behind these answers. its a single choice multiple choice which positions these as competing things. the choice I made is the closest to what I think but do generally believe in some vague kantian idea of giving people what theyre due as well and that structural disadvantages and inequalities should be corrected as well for example.", "importance": null, "tags": []}, "b": {"answer_id": "P5.b", "answer": "Everyone having genuinely equal opportunities to succeed", "explanation": "", "importance": null, "tags": []}}, {"qid": "P6", "part": "P", "title": "Redistribution and taxation", "level": "unscored", "a": {"answer_id": "P6.e", "answer": "Another approach or important distinction", "explanation": "so I think generally when theres a tradeoff at play with a policy decision, as there very much is, I think the state should optimize for greatest cumulative welfare (while still doing so within the constraints of the law and of respecting individual rights). so with the way that youre framing it, if it's a modest reduction in investment in growth, if we can quantify how modest and see that the improvement in collective welfare is great in relation to that, then yeah Im for it. however, i dont believe in redistribution at all costs and totally ignoring deadweight loss and inefficiency. there is a real danger of killing the proverbial golden goose.\n\nI think there are 2 concerns here: 1. practical administration of policy 2. moral framework\nmy answer above is largely in response to 1. I do think that huge inequality is problematic in itself both bc it presents big political concerns (money in politics, oligarchy, etc) and bc it's hard to think of a moral justification for why we should have trillionaires when so many people live in desperate poverty", "importance": null, "tags": ["catch_all"]}, "b": {"answer_id": "P6.b", "answer": "Yes, provided benefits demonstrably outweigh economic costs", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "P7", "part": "P", "title": "Markets versus government", "level": "match", "a": {"answer_id": "P7.a", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Im a big believer in the power of markets. the power of competition, price discovery, and efficiency through the free market is very important and societally beneficial but I think it's a huge mistake to reify the market and treat it as a end onto itself. it should ultimately be constrained by the state where there are market failures and where there are dangers of distorting effects from monopolies\n\nI think Im sorta in between mixed economy and markets should be default. I think the chicago school and reagan types are too deferential towards the economy and insufficiently wary of the ways in which the market can fail but at the same time, I believe i the dynamism of markets - e.g. I think europe has too many stifling regulations which in turn have led to sclerotic growth and in turn have empowered populists and right wing movements who look for a scapegoat for this lack of growth. so I think theres not just a practical concern for recognizing how the market can be superior to the state but also a concern that a lack of growth and development can be very politically destabilizing too", "importance": null, "tags": []}, "b": {"answer_id": "P7.a", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "", "importance": null, "tags": []}}, {"qid": "P8", "part": "P", "title": "Individual liberty and paternalism", "level": "close", "a": {"answer_id": "P8.c", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "hmmm well the reason I say possibly is bc in principle i think competent adults should be able to do whatever they want even if it's bad for them but I can imagine scenarios in which the activity is so harmful that just saying that as a blanket statement prob goes too far. e.g. consider how addictive fentanyl is and how many people it kills. I would lean on the side of letting people make choices that might be harmful to them but I also wouldnt treat this as a moral absolute", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P8.b", "answer": "Generally no, but some narrowly tailored restrictions are acceptable", "explanation": "", "importance": null, "tags": []}}, {"qid": "P9", "part": "P", "title": "Democracy versus expertise", "level": "match", "a": {"answer_id": "P9.c", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "ugh this is another really tricky one. I think theres a lot of issues at play here.\n- the majority of the public is nowhere near educated, informed (or frankly intelligent) enough to be able to form meaningful opinions on complex issues. i think theres a very real concern of demagogues exploiting that - rail against the corrupt, unaccountable elites, push a bunch of stuff that sounds nice that will wreck the countries finances/long term well being\n- at the same time, I do think there is danger in an idea of a class of people who paternalistically treat the who country as a bunch of morons who dont know enough to make their own choices (and I think we saw aspects of this with stuff like the iraq war or GFC for example - theres a reason why there has been a big backlash to technocratic rule and the idea that theres a few experts who are smart enough to run everything). I worry about that from both a moral standpoint (feels deeply undemocratic to just override whatever the public wants) and from a practical standpoint (going back to the seeing like a state thing - danger of the hubris of experts).\n- i dont really have a good answer ultimately bc I think these are 2 countervailing but both very real things. I guess I'd just say that politically theres more danger in an unaccountable elite overriding the public will and then getting things wrong and delegitimizing the state as we've seen in recent times. but on the whole I def believe in expert knowledge and think things like fed independence is good - you need people like economists and domain experts who can act as stewards for the public good", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P9.c", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "P10", "part": "P", "title": "Equality of opportunity versus equality of outcomes", "level": "apart", "a": {"answer_id": "P10.c", "answer": "Actively reduce extreme disparities in outcomes through redistribution and structural reform", "explanation": "so I want to qualify what Im saying what Im saying here. I def dont believe in communism or state enforced mass equality but going back to one of my earlier points, inasmuch as the state should be concerned with collective welfare, I think its good to reduce disparities in outcome if it will raise collective welfare. I see it as a sort of technocratic/optimization problem: how do we ensure the greatest good for the greatest number", "importance": null, "tags": []}, "b": {"answer_id": "P10.a", "answer": "Focus on protecting equal rights and fair rules; unequal outcomes aren't intrinsically unjust", "explanation": "", "importance": null, "tags": []}}, {"qid": "P11", "part": "P", "title": "Are individual rights inviolable?", "level": "apart", "a": {"answer_id": "P11.a", "answer": "No. Certain rights should not be violated, even to maximize welfare.", "explanation": "yeah this is a good illustration of what I mean when I say that I think we should generally maximize welfare but subject to the constraints of a rule based order and individual rights. first I kind reject the premise that you can violate rights without creating an institutional precedent, but even if I grant you that, I think individual rights override a general util max framework", "importance": null, "tags": []}, "b": {"answer_id": "P11.c", "answer": "Possibly. Privacy is a powerful presumption, but the consequences ultimately determine permissibility.", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "P12", "part": "P", "title": "Whose welfare matters most?", "level": "apart", "a": {"answer_id": "P12.b", "answer": "Probably A, depending on the size of the overall welfare loss.", "explanation": "what does welfare mean here? the construction of your question leads me to think youre measuring this in the form of wealth or whatever. for a problem like this I wouldnt think about welfare in those terms. I think about it in terms of human flourishing (which I know is kinda squishy but bear with me) and diminishing marginal returns is very real. if you have a policy that would take $10k from a middle class person but net Bezos $10B Im not sure thats a good idea bc the value of an incremental 10b to bezos is basically nothing, for example. so I kinda take issue with the way you frame the question. i feel like for such a scenario to even exist youre prob messing up your util calc", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P12.c", "answer": "Probably B, depending on the relative welfare gains.", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "P13", "part": "P", "title": "Cultural liberalism and social norms", "level": "close", "a": {"answer_id": "P13.a", "answer": "Strongly protect the minority's freedom and reject state enforcement of conventional morality.", "explanation": "tbh if its not enshrined in laws I dont think the state should care about \"norms\". either youre violating the laws in which case yeah enforce them or youre not and leave them alone, or change the laws through democratic process and then enforce", "importance": null, "tags": []}, "b": {"answer_id": "P13.b", "answer": "Protect legal freedom, but allow communities considerable latitude to preserve their norms through voluntary institutions.", "explanation": "", "importance": null, "tags": []}}, {"qid": "P14", "part": "P", "title": "Group disadvantage and individual fairness", "level": "unscored", "a": {"answer_id": "P14.d", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "pretty clearly talking about affirmative action here. there are 2 dimensions of how to answer this:\n1. as a practical concern: pushing people in through a backdoor who are underqualified seems like youre setting them up for failure in a lot of cases and even if you arent, you undermine peoples faith in the fairness of institutions\n2. as a moral concern: I understand wanting to correct structural disadvantage but I think you do that upstream with other forms of economic redistribution and earlier childhood education. feels unfair to deny more qualified people spots at this stage", "importance": null, "tags": []}, "b": {"answer_id": "P14.e", "answer": "I would use another framework.", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "P15", "part": "P", "title": "Immigration, national obligations, and universal welfare", "level": "match", "a": {"answer_id": "P15.c", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "as with most questions I think there is both a practical and moral dimension this:\n\nmorally: I dont think an american life is worth more than a life from another country. morally it feels kinda suspect to slam the doors shut. that said to the extent that the state exists in a social contract with its citizens, its primary obligations are to them. so I guess lean towards liberalization while being careful to optimize towards citizen wellbeing\n\npractically: letting the doors open to immigrants is terrible policy. people hate it and it opens up questions of fairness (why implicitly reward people for not following the proper processes) and can undermine social cohesion. immigration is good for the economy and society but should be done in a controlled and orderly way", "importance": null, "tags": []}, "b": {"answer_id": "P15.c", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "", "importance": null, "tags": []}}, {"qid": "P16", "part": "P", "title": "Do you give special moral weight to the worst-off?", "level": "unscored", "a": {"answer_id": "P16.a", "answer": "Yes. An equal benefit matters morally more when it goes to someone worse off.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P16.e", "answer": "I reject a premise or have a different interpretation.", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "P17", "part": "P", "title": "What makes a right fundamental?", "level": "unscored", "a": {"answer_id": "P17.a", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P17.b", "answer": "Natural or inherent rights that exist independently of government.", "explanation": "", "importance": null, "tags": []}}, {"qid": "P18", "part": "P", "title": "Can economic liberty be restricted for social welfare?", "level": "unscored", "a": {"answer_id": "P18.b", "answer": "There is a meaningful rights concern, but it can be outweighed by sufficiently strong public interests.", "explanation": "I guess I’ll start by saying I find the conventional account of property rights a little odd. That there exists objects in the world to which you and you alone are solely morally and therefore legally entitled. I dont like the idea of a state or some institution being able to reach in and take from people but I think philosophically that bothers me not bc I believe there is some sanctity to the ownership of stuff but rather I think there can be some violation of human dignity and autonomy. Like for example I find the idea that a person can buy a shit ton of land and kick everyone off of it kinda weird and not sure that there is a fully morally coherent justification, particularly when this land’s ownership is passed down through generations of inherited wealth.\n\nSo I care about property rights morally in as much as I think that a state that doesnt will overreach and shows that it does not respect the agency and autonomy of people. Practically too, if you can you arbitrarily take things from people, it undermines your political legitimacy and undermines peoples incentive to build and work.\n\nAll that said while I dont think the state should just arbitrarily take stuff from people, I also dont think there is some reified sanctity to the idea of owning stuff that intrinsically overrides the welfare of society as a whole", "importance": null, "tags": []}, "b": {"answer_id": "P18.e", "answer": "Another distinction is essential.", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "P19", "part": "P", "title": "Democratic legitimacy versus constitutional rights", "level": "close", "a": {"answer_id": "P19.a", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P19.b", "answer": "Yes, although courts should ordinarily exercise considerable institutional restraint.", "explanation": "", "importance": null, "tags": []}}, {"qid": "P20", "part": "P", "title": "Universal moral worth versus obligations to citizens", "level": "apart", "a": {"answer_id": "P20.b", "answer": "Probably B, but governments may legitimately place some additional weight on citizens.", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P20.c", "answer": "Probably A. Governments have special obligations to citizens, even when the global welfare gains elsewhere are larger.", "explanation": "", "importance": null, "tags": []}}, {"qid": "P21", "part": "P", "title": "Judicial power and democratic accountability", "level": "unscored", "a": {"answer_id": "P21.a", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "principled objections and desires to preserve rights and liberties enshrined in the constitution im for strong judicial review. There is a real concern of tyranny of the masses. That said you cant just take principled objections for granted", "importance": null, "tags": []}, "b": {"answer_id": "P21.e", "answer": "Another model or distinction", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "P22", "part": "P", "title": "Nationalism, patriotism, and political identity", "level": "apart", "a": {"answer_id": "P22.a", "answer": "Shared constitutional principles, civic equality, and democratic institutions are sufficient", "explanation": "Your use of the word should implies a normative judgement. In that case yeah I think institutions and a belief in democratic and institutional values should be sufficient for national identity. Though I recognize in practice, shared traditions and symbols are also important for social cohesion. I also dont think national identity is itself a moral good but rather something of instrumental value for a functioning society. The reason I didnt go with the last option is the use of the word “can” which implies practical application. I dont think people in practice are willing to cooperate purely on the basis of abstract philosophical and political commitments", "importance": null, "tags": []}, "b": {"answer_id": "P22.c", "answer": "A substantive national culture and historical identity are important alongside civic principles", "explanation": "", "importance": null, "tags": []}}, {"qid": "P23", "part": "P", "title": "The welfare state and positive rights", "level": "unscored", "a": {"answer_id": "P23.d", "answer": "Public provision should depend mainly on evidence of welfare gains, rather than an independent entitlement", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P23.b", "answer": "There is a strong public obligation to guarantee a decent minimum, though not every service is an absolute right", "explanation": "", "importance": null, "tags": []}}, {"qid": "P24", "part": "P", "title": "Religion, pluralism, and public institutions", "level": "match", "a": {"answer_id": "P24.c", "answer": "Religious freedom deserves protection, but all public-facing institutions should meet robust secular equality standards", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P24.c", "answer": "Religious freedom deserves protection, but all public-facing institutions should meet robust secular equality standards", "explanation": "", "importance": null, "tags": []}}, {"qid": "P25", "part": "P", "title": "Foreign policy: Liberal ideals versus strategic restraint", "level": "match", "a": {"answer_id": "P25.c", "answer": "Favor diplomatic engagement and targeted measures; avoid broad confrontations without clear prospects for improvement", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P25.c", "answer": "Favor diplomatic engagement and targeted measures; avoid broad confrontations without clear prospects for improvement", "explanation": "", "importance": null, "tags": []}}, {"qid": "P26", "part": "P", "title": "Markets, regulation, and the burden of proof", "level": "unscored", "a": {"answer_id": "P26.c", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P26.e", "answer": "Another framework", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "P27", "part": "P", "title": "Concentrated private power", "level": "match", "a": {"answer_id": "P27.b", "answer": "Intervene selectively, including through competition policy and safeguards against arbitrary exclusion", "explanation": "Practically speaking government officials are poorly positioned to understand technology much less the 2nd order or other downstream effects of regulation which is often a blunt instrument. I think the gov needs to be willing to intervene in certain cases but should be circumspect when and how it chooses to do so, particularly when often times the changing nature of the market and technology solves the problem anyway (consider for example that many of the most powerful companies in the world in the 90s are shadows of themselves or defunct today)", "importance": null, "tags": []}, "b": {"answer_id": "P27.b", "answer": "Intervene selectively, including through competition policy and safeguards against arbitrary exclusion", "explanation": "", "importance": null, "tags": []}}, {"qid": "P28", "part": "P", "title": "Free speech and harmful expression", "level": "close", "a": {"answer_id": "P28.a", "answer": "No; political expression should remain protected even when deeply harmful or offensive", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P28.b", "answer": "Almost never, but exceptional serious threats could justify narrow restrictions", "explanation": "", "importance": null, "tags": []}}, {"qid": "P29", "part": "P", "title": "Capitalism and worker power", "level": "match", "a": {"answer_id": "P29.a", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "I might be in favor of the 2nd one but it depends on what strengthening unions and bargaining rights and all of that actually entails. Like I said before I think regulation is often a blunt instrument and I think often the gov messes it up", "importance": null, "tags": []}, "b": {"answer_id": "P29.a", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "", "importance": null, "tags": []}}, {"qid": "P30", "part": "P", "title": "Public order versus civil liberties", "level": "match", "a": {"answer_id": "P30.b", "answer": "Protect protest rights while using narrow, content-neutral restrictions on severe disruption", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P30.b", "answer": "Protect protest rights while using narrow, content-neutral restrictions on severe disruption", "explanation": "", "importance": null, "tags": []}}, {"qid": "P31", "part": "P", "title": "Healthcare and the welfare state", "level": "apart", "a": {"answer_id": "P31.a", "answer": "Universal public insurance, because comprehensive access and risk pooling justify the institutional change", "explanation": "Healthcare is a great example of market failure - huge consolidations in the value chain has led to massive conglomerates and regulatory capture has led to results that are incommensurate with the massive costs. having a monopsony with a buyer that has the power to create more transparency and better pricing sounds like a way better move", "importance": null, "tags": []}, "b": {"answer_id": "P31.c", "answer": "Competitive private insurance with substantial subsidies and regulatory safeguards", "explanation": "", "importance": null, "tags": []}}, {"qid": "P32", "part": "P", "title": "Housing, local democracy, and property rights", "level": "apart", "a": {"answer_id": "P32.a", "answer": "Override restrictive local zoning and allow substantial construction, even against homeowners' preferences", "explanation": "Housing is a huge issue for the economy. Massively contributing to the affordability crisis. Just leaving things to local control is just ceding the issue to NIMBYs which is why we’re in this mess to begin with. Im def a YIMBY", "importance": null, "tags": ["build"]}, "b": {"answer_id": "P32.c", "answer": "Pursue gradual negotiated reforms, giving meaningful weight to local democratic preferences", "explanation": "", "importance": null, "tags": []}}, {"qid": "P33", "part": "P", "title": "Climate change and economic growth", "level": "match", "a": {"answer_id": "P33.b", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "P33.b", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "", "importance": null, "tags": []}}, {"qid": "P34", "part": "P", "title": "Crime, punishment, and the rule of law", "level": "unscored", "a": {"answer_id": "P34.d", "answer": "Prioritize punishment and public order, accepting some additional restrictions to reduce crime", "explanation": "I think dems have been too soft on crime. At the very least you need to enforce the laws on the books and not tolerate public disorder and lawlessness. It’s a recipe for undermining social trust. Dont go the other way though and just blindly support the police and law enforcement. They have been hot beds of iniquity, corruption, and unaccountability. You need a competent and fair administration of justice. Reform law enforcement, dont be needlessly cruel but create law and order", "importance": null, "tags": []}, "b": {"answer_id": "P34.e", "answer": "Another approach", "explanation": "Depends on what type of crime and criminal’s age and motive etc", "importance": null, "tags": ["catch_all"]}}, {"qid": "P35", "part": "P", "title": "International security and military intervention", "level": "apart", "a": {"answer_id": "P35.b", "answer": "Support the threatened democracy if the strategic outlook and expected consequences justify the risks", "explanation": "I think morally it’s good to support democracies against authoritarian aggression but practically foreign entanglements are a mess and have a ton of unintended consequences and just sap your political capital. It’s often the case that it’s just smarter to spend your chips elsewhere and avoid potential quagmires. A clear example of where what I think is morally good diverges from what I think is best policy", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "P35.c", "answer": "Provide limited assistance and prioritize diplomacy to minimize escalation", "explanation": "I wonder if America has ever been truly successful when attempting to protect another country’s threatened democracy", "importance": null, "tags": []}}, {"qid": "U1", "part": "U", "title": "Federal taxation", "level": "apart", "a": {"answer_id": "U1.b", "answer": "Moderately increase taxes on high earners and capital income, while preserving incentives for investment", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U1.c", "answer": "Keep the overall tax burden broadly similar, but simplify the code and close loopholes", "explanation": "", "importance": null, "tags": []}}, {"qid": "U2", "part": "U", "title": "Federal spending and deficits", "level": "close", "a": {"answer_id": "U2.c", "answer": "Make deficit reduction a central priority through meaningful spending reforms and some revenue measures", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U2.b", "answer": "Maintain core services while combining targeted tax increases and spending restraint to stabilize debt", "explanation": "", "importance": null, "tags": []}}, {"qid": "U3", "part": "U", "title": "Minimum wage and labor markets", "level": "close", "a": {"answer_id": "U3.e", "answer": "Use an alternative such as wage subsidies or expanded earned-income tax credits as the main instrument", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U3.c", "answer": "Keep the federal floor relatively modest and leave most increases to states and cities", "explanation": "", "importance": null, "tags": []}}, {"qid": "U4", "part": "U", "title": "Business regulation and competition", "level": "match", "a": {"answer_id": "U4.b", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U4.b", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "Honestly don’t know too much on this", "importance": null, "tags": []}}, {"qid": "U5", "part": "U", "title": "Healthcare system", "level": "apart", "a": {"answer_id": "U5.a", "answer": "Single-payer national insurance replacing most private primary insurance", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U5.e", "answer": "A market-led system with targeted public support for vulnerable populations", "explanation": "Key on helping vulnerable populations", "importance": null, "tags": []}}, {"qid": "U6", "part": "U", "title": "Legal immigration levels", "level": "apart", "a": {"answer_id": "U6.b", "answer": "Increase moderately, particularly through employment-based immigration", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U6.d", "answer": "Reduce overall legal immigration, prioritizing applicants with high economic contributions", "explanation": "", "importance": null, "tags": []}}, {"qid": "U7", "part": "U", "title": "Unauthorized immigration and enforcement", "level": "apart", "a": {"answer_id": "U7.b", "answer": "A conditional path to legal status for established residents, alongside strong border enforcement and immigration-system reform", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U7.d", "answer": "Expand deportations substantially, including established unauthorized residents without serious criminal convictions", "explanation": "I’m between C and D", "importance": null, "tags": []}}, {"qid": "U8", "part": "U", "title": "Policing and public disorder", "level": "match", "a": {"answer_id": "U8.c", "answer": "Consistently enforce both minor and serious offenses, with proportionate sanctions, accountable policing, and diversion where effective", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U8.c", "answer": "Consistently enforce both minor and serious offenses, with proportionate sanctions, accountable policing, and diversion where effective", "explanation": "", "importance": null, "tags": []}}, {"qid": "U9", "part": "U", "title": "Criminal sentencing and incarceration", "level": "unscored", "a": {"answer_id": "U9.b", "answer": "Reduce incarceration for nonviolent offenses while maintaining strong penalties for serious violent crime", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U9.e", "answer": "Pursue a different approach or distinguish among offense categories", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "U10", "part": "U", "title": "Drugs and addiction", "level": "apart", "a": {"answer_id": "U10.a", "answer": "Legalize and regulate most drugs, including hard drugs, with strong treatment and harm-reduction services", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U10.e", "answer": "Use a more differentiated system, such as mandatory treatment or special rules for particular substances", "explanation": "", "importance": null, "tags": []}}, {"qid": "U11", "part": "U", "title": "Energy and electricity production", "level": "unscored", "a": {"answer_id": "U11.c", "answer": "Pursue energy abundance across nuclear, renewables, and fossil fuels, with broad permitting reform", "explanation": "", "importance": null, "tags": ["build"]}, "b": {"answer_id": "U11.e", "answer": "Use another mix of technologies or policy instruments", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "U12", "part": "U", "title": "Environmental review and infrastructure permitting", "level": "unscored", "a": {"answer_id": "U12.a", "answer": "Substantially streamline permitting and limit procedural opportunities to block projects", "explanation": "", "importance": null, "tags": ["build"]}, "b": {"answer_id": "U12.e", "answer": "Use different standards for different types of projects", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "U13", "part": "U", "title": "K–12 education and school choice", "level": "unscored", "a": {"answer_id": "U13.e", "answer": "Use another approach, particularly for funding or school governance", "explanation": "Im not sufficiently versed on the literature on charter school and voucher outcomes to have a strong view but generally I think all of education starts with determining how to quantify and measure leaning effectively and rigorously measuring and optimizing towards that and making corrections and adjustments accordingly (e.g. fire bad teachers quickly, pay and recognize good teachers more, etc)", "importance": null, "tags": ["catch_all"]}, "b": {"answer_id": "U13.c", "answer": "Prioritize improving traditional public schools, with charters serving a limited supplementary role", "explanation": "", "importance": null, "tags": []}}, {"qid": "U14", "part": "U", "title": "College affordability and student loans", "level": "unscored", "a": {"answer_id": "U14.d", "answer": "Reduce federal lending and subsidies significantly, relying more on institutional competition and private financing", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U14.e", "answer": "Pursue another model, such as graduate-tax financing or major vocational alternatives", "explanation": "", "importance": null, "tags": []}}, {"qid": "U15", "part": "U", "title": "Industrial policy and domestic manufacturing", "level": "match", "a": {"answer_id": "U15.b", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U15.b", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": null, "tags": []}}, {"qid": "U16", "part": "U", "title": "Abortion policy", "level": "match", "a": {"answer_id": "U16.a", "answer": "Protect abortion access nationally throughout pregnancy, subject to medical regulation", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U16.a", "answer": "Protect abortion access nationally throughout pregnancy, subject to medical regulation", "explanation": "", "importance": null, "tags": []}}, {"qid": "U17", "part": "U", "title": "Transgender rights and public policy", "level": "unscored", "a": {"answer_id": "U17.a", "answer": "Strong federal protections for gender identity, with generally broad access and inclusion", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U17.e", "answer": "A different combination of policies; specify distinctions in your explanation", "explanation": "Mix of B and C", "importance": null, "tags": ["catch_all"]}}, {"qid": "U18", "part": "U", "title": "Voting and election administration", "level": "match", "a": {"answer_id": "U18.b", "answer": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U18.b", "answer": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "explanation": "", "importance": null, "tags": []}}, {"qid": "U19", "part": "U", "title": "Federal bureaucracy and civil-service reform", "level": "match", "a": {"answer_id": "U19.b", "answer": "Strengthen performance evaluation and management while preserving meaningful protections against politicization", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U19.b", "answer": "Strengthen performance evaluation and management while preserving meaningful protections against politicization", "explanation": "", "importance": null, "tags": []}}, {"qid": "U20", "part": "U", "title": "Social Security and Medicare fiscal reform", "level": "unscored", "a": {"answer_id": "U20.c", "answer": "Prioritize slowing benefit growth, means-testing, and adjusting retirement eligibility while protecting poorer recipients", "explanation": "Tbh social security and medicare is a tricky one. I think it’s important to protect impoverished elderly people but the economics of this system are kinda out of whack. As society ages and birth rates decline, it’s gonna become increasingly uneconomical (you can see this in other countries with fights over fiscal austerity in relation to budgetary concerns). To the extent that I wor
