ry about the practical dimensions of this, I think pragmatically you gotta eventually phase out at least some of these benefits", "importance": null, "tags": []}, "b": {"answer_id": "U20.e", "answer": "I would distinguish sharply between Social Security and Medicare or pursue another approach", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "U21", "part": "U", "title": "Defense spending and military strategy", "level": "apart", "a": {"answer_id": "U21.c", "answer": "Restructure the military around a narrower set of strategic threats while reducing less essential global commitments", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U21.b", "answer": "Maintain a large, globally capable military, with selective modernization and efficiency reforms", "explanation": "", "importance": null, "tags": []}}, {"qid": "U22", "part": "U", "title": "NATO and American alliances", "level": "unscored", "a": {"answer_id": "U22.b", "answer": "Maintain strong alliances while requiring substantially greater allied defense contributions", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U22.e", "answer": "Differentiate among alliances and regions", "explanation": "", "importance": null, "tags": ["depends"]}}, {"qid": "U23", "part": "U", "title": "China, trade, and economic security", "level": "match", "a": {"answer_id": "U23.b", "answer": "Adopt strong restrictions in strategic technologies while preserving significant ordinary trade", "explanation": "China is by far the biggest geopolitical threat the us faces. It’s of paramount importance that we treat them accordingly in our alliances, military investments and economic investments and policies. But dont just start stupid trade wars. You dont need to totally suspend trade", "importance": null, "tags": []}, "b": {"answer_id": "U23.b", "answer": "Adopt strong restrictions in strategic technologies while preserving significant ordinary trade", "explanation": "", "importance": null, "tags": []}}, {"qid": "U24", "part": "U", "title": "Military aid and foreign conflicts", "level": "unscored", "a": {"answer_id": "U24.b", "answer": "Provide meaningful assistance where it supports identifiable strategic interests and has a credible prospect of success", "explanation": "", "importance": null, "tags": ["depends"]}, "b": {"answer_id": "U24.e", "answer": "Use a different approach based on the circumstances of individual conflicts", "explanation": "", "importance": null, "tags": ["catch_all"]}}, {"qid": "U25", "part": "U", "title": "National security and domestic surveillance", "level": "unscored", "a": {"answer_id": "U25.d", "answer": "Substantially restrict existing surveillance authorities and require individualized warrants for more activities", "explanation": "", "importance": null, "tags": []}, "b": {"answer_id": "U25.e", "answer": "Use another framework, distinguishing metadata, content, foreign intelligence, and domestic investigations", "explanation": "", "importance": null, "tags": ["catch_all"]}}], "evidence": {"gene:P1": {"title": "What is the primary purpose of government?", "answer": "A combination or different principle", "explanation": "This is a challenging question that I dont think necessarily has a very simple answer. I start by thinking about it from a political theory lens. why do you need a government? not to go all hobbsian but I do think there is a significant concern of anarchy without a state and without a monopoly on the legitimate use of violence (I guess not to go all weber either). after you've cleared that very basic threshold, I think it becomes a lot murkier bc a lot of things that sound good in principle need to be traded off against one another and I feel like it's a facile perspective to just choose a single thing and say that is the only thing to optimize for. I'd say it's prob some combination of promoting collective welfare through building and maintaining strong and stable institutions (e.g. rule of law) while ensuring that individual rights and freedoms are respected. might seem like a bit of a cop out to choose a combo of what youre saying but in my view, it feels arbitrary to just pick one and say thats the main thing", "importance": null}, "rachel-hong:P1": {"title": "What is the primary purpose of government?", "answer": "A combination or different principle", "explanation": "", "importance": 4}, "gene:P2": {"title": "How do you view economic inequality?", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "Oof. another tricky one. the one I choose is the closest I guess to what I think but that is itself kinda reductive bc then you have other questions like what is excessive and what do you then do about it? I'd say a few things:\n- I think some degree of inequality is structurally inherent if you want markets (given differences in natural endowments of ability and even things like desire to work hard)\n- I think some degree of inequality is even good as a means to reward and incentivize innovation and effort\n- however, there are 2 further issues that arrise: 1. what is the cause for the inequality in a society? 2. how much inequality are we seeing?\nto the former, I'd say that a lot of inequality we actually see is due to issues like inequality of opportunity, unequal access to resources, legacy of stuff like redlining. to the latter, I think this is a harder question. I take issue with some of the leftist views like all great wealth is inherently exploitative (I think thats absurd) and no billionaires should exist in a just society, however it does strike me as absurd that there are so many holes in the tax codes and structural inequalities through which the wealthy perpetuate their advantages. im not sure that you can necessarily say something like once you've hit X number you need to do Y thing (I think thats a clearly very blunt instrument) but I do think the urgency of the problem does depend on the extend of the inequality", "importance": null}, "rachel-hong:P2": {"title": "How do you view economic inequality?", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "", "importance": null}, "gene:P3": {"title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null}, "rachel-hong:P3": {"title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "answer": "Neither automatically; the circumstances determine the answer", "explanation": "", "importance": null}, "gene:P4": {"title": "How should society approach longstanding traditions and institutions?", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "depends on why youre asking. are you asking if I value tradition as a thing in and of itself or more as a functional and practical matter. I dont really care about tradition intrinsically. I think if something is broken/doesnt make sense you should fix it/change it. im not precious about the past in that way. however, pragmatically I think there are 2 major concerns with that kind of approach: 1. like james c scott says in seeing like a state, theres a huge danger in people thinking they know it all and can destroy and remake everything in a more rational and superior way. that kind of myopic hubris can be way worse than leaving things as they are. supporting radical change presupposes that the change will be good and there wont be any massive downstream negative consequence which we've seem time and time again is not the case 2. even if you presuppose that it's gonna be good, people and societies as a whole can have a negative reaction to just upturning the way things work. incrementalism is often more effective to counteract this.\n\nnow I dont wanna make blanket statements. if you see something thats genuinely super fucked up like slavery, then yeah fix it sure but generally, Im on the side of being careful and circumspect", "importance": null}, "rachel-hong:P4": {"title": "How should society approach longstanding traditions and institutions?", "answer": "Judge them on their merits, without presuming preservation or change", "explanation": "", "importance": null}, "gene:P5": {"title": "Which statement best captures your conception of justice?", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "I take issue with the premise behind these answers. its a single choice multiple choice which positions these as competing things. the choice I made is the closest to what I think but do generally believe in some vague kantian idea of giving people what theyre due as well and that structural disadvantages and inequalities should be corrected as well for example.", "importance": null}, "rachel-hong:P5": {"title": "Which statement best captures your conception of justice?", "answer": "Everyone having genuinely equal opportunities to succeed", "explanation": "", "importance": null}, "gene:P6": {"title": "Redistribution and taxation", "answer": "Another approach or important distinction", "explanation": "so I think generally when theres a tradeoff at play with a policy decision, as there very much is, I think the state should optimize for greatest cumulative welfare (while still doing so within the constraints of the law and of respecting individual rights). so with the way that youre framing it, if it's a modest reduction in investment in growth, if we can quantify how modest and see that the improvement in collective welfare is great in relation to that, then yeah Im for it. however, i dont believe in redistribution at all costs and totally ignoring deadweight loss and inefficiency. there is a real danger of killing the proverbial golden goose.\n\nI think there are 2 concerns here: 1. practical administration of policy 2. moral framework\nmy answer above is largely in response to 1. I do think that huge inequality is problematic in itself both bc it presents big political concerns (money in politics, oligarchy, etc) and bc it's hard to think of a moral justification for why we should have trillionaires when so many people live in desperate poverty", "importance": null}, "rachel-hong:P6": {"title": "Redistribution and taxation", "answer": "Yes, provided benefits demonstrably outweigh economic costs", "explanation": "", "importance": null}, "gene:P7": {"title": "Markets versus government", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Im a big believer in the power of markets. the power of competition, price discovery, and efficiency through the free market is very important and societally beneficial but I think it's a huge mistake to reify the market and treat it as a end onto itself. it should ultimately be constrained by the state where there are market failures and where there are dangers of distorting effects from monopolies\n\nI think Im sorta in between mixed economy and markets should be default. I think the chicago school and reagan types are too deferential towards the economy and insufficiently wary of the ways in which the market can fail but at the same time, I believe i the dynamism of markets - e.g. I think europe has too many stifling regulations which in turn have led to sclerotic growth and in turn have empowered populists and right wing movements who look for a scapegoat for this lack of growth. so I think theres not just a practical concern for recognizing how the market can be superior to the state but also a concern that a lack of growth and development can be very politically destabilizing too", "importance": null}, "rachel-hong:P7": {"title": "Markets versus government", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "", "importance": null}, "gene:P8": {"title": "Individual liberty and paternalism", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "hmmm well the reason I say possibly is bc in principle i think competent adults should be able to do whatever they want even if it's bad for them but I can imagine scenarios in which the activity is so harmful that just saying that as a blanket statement prob goes too far. e.g. consider how addictive fentanyl is and how many people it kills. I would lean on the side of letting people make choices that might be harmful to them but I also wouldnt treat this as a moral absolute", "importance": null}, "rachel-hong:P8": {"title": "Individual liberty and paternalism", "answer": "Generally no, but some narrowly tailored restrictions are acceptable", "explanation": "", "importance": null}, "gene:P9": {"title": "Democracy versus expertise", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "ugh this is another really tricky one. I think theres a lot of issues at play here.\n- the majority of the public is nowhere near educated, informed (or frankly intelligent) enough to be able to form meaningful opinions on complex issues. i think theres a very real concern of demagogues exploiting that - rail against the corrupt, unaccountable elites, push a bunch of stuff that sounds nice that will wreck the countries finances/long term well being\n- at the same time, I do think there is danger in an idea of a class of people who paternalistically treat the who country as a bunch of morons who dont know enough to make their own choices (and I think we saw aspects of this with stuff like the iraq war or GFC for example - theres a reason why there has been a big backlash to technocratic rule and the idea that theres a few experts who are smart enough to run everything). I worry about that from both a moral standpoint (feels deeply undemocratic to just override whatever the public wants) and from a practical standpoint (going back to the seeing like a state thing - danger of the hubris of experts).\n- i dont really have a good answer ultimately bc I think these are 2 countervailing but both very real things. I guess I'd just say that politically theres more danger in an unaccountable elite overriding the public will and then getting things wrong and delegitimizing the state as we've seen in recent times. but on the whole I def believe in expert knowledge and think things like fed independence is good - you need people like economists and domain experts who can act as stewards for the public good", "importance": null}, "rachel-hong:P9": {"title": "Democracy versus expertise", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "", "importance": null}, "gene:P10": {"title": "Equality of opportunity versus equality of outcomes", "answer": "Actively reduce extreme disparities in outcomes through redistribution and structural reform", "explanation": "so I want to qualify what Im saying what Im saying here. I def dont believe in communism or state enforced mass equality but going back to one of my earlier points, inasmuch as the state should be concerned with collective welfare, I think its good to reduce disparities in outcome if it will raise collective welfare. I see it as a sort of technocratic/optimization problem: how do we ensure the greatest good for the greatest number", "importance": null}, "rachel-hong:P10": {"title": "Equality of opportunity versus equality of outcomes", "answer": "Focus on protecting equal rights and fair rules; unequal outcomes aren't intrinsically unjust", "explanation": "", "importance": null}, "gene:P11": {"title": "Are individual rights inviolable?", "answer": "No. Certain rights should not be violated, even to maximize welfare.", "explanation": "yeah this is a good illustration of what I mean when I say that I think we should generally maximize welfare but subject to the constraints of a rule based order and individual rights. first I kind reject the premise that you can violate rights without creating an institutional precedent, but even if I grant you that, I think individual rights override a general util max framework", "importance": null}, "rachel-hong:P11": {"title": "Are individual rights inviolable?", "answer": "Possibly. Privacy is a powerful presumption, but the consequences ultimately determine permissibility.", "explanation": "", "importance": null}, "gene:P12": {"title": "Whose welfare matters most?", "answer": "Probably A, depending on the size of the overall welfare loss.", "explanation": "what does welfare mean here? the construction of your question leads me to think youre measuring this in the form of wealth or whatever. for a problem like this I wouldnt think about welfare in those terms. I think about it in terms of human flourishing (which I know is kinda squishy but bear with me) and diminishing marginal returns is very real. if you have a policy that would take $10k from a middle class person but net Bezos $10B Im not sure thats a good idea bc the value of an incremental 10b to bezos is basically nothing, for example. so I kinda take issue with the way you frame the question. i feel like for such a scenario to even exist youre prob messing up your util calc", "importance": null}, "rachel-hong:P12": {"title": "Whose welfare matters most?", "answer": "Probably B, depending on the relative welfare gains.", "explanation": "", "importance": null}, "gene:P13": {"title": "Cultural liberalism and social norms", "answer": "Strongly protect the minority's freedom and reject state enforcement of conventional morality.", "explanation": "tbh if its not enshrined in laws I dont think the state should care about \"norms\". either youre violating the laws in which case yeah enforce them or youre not and leave them alone, or change the laws through democratic process and then enforce", "importance": null}, "rachel-hong:P13": {"title": "Cultural liberalism and social norms", "answer": "Protect legal freedom, but allow communities considerable latitude to preserve their norms through voluntary institutions.", "explanation": "", "importance": null}, "gene:P14": {"title": "Group disadvantage and individual fairness", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "pretty clearly talking about affirmative action here. there are 2 dimensions of how to answer this:\n1. as a practical concern: pushing people in through a backdoor who are underqualified seems like youre setting them up for failure in a lot of cases and even if you arent, you undermine peoples faith in the fairness of institutions\n2. as a moral concern: I understand wanting to correct structural disadvantage but I think you do that upstream with other forms of economic redistribution and earlier childhood education. feels unfair to deny more qualified people spots at this stage", "importance": null}, "rachel-hong:P14": {"title": "Group disadvantage and individual fairness", "answer": "I would use another framework.", "explanation": "", "importance": null}, "gene:P15": {"title": "Immigration, national obligations, and universal welfare", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "as with most questions I think there is both a practical and moral dimension this:\n\nmorally: I dont think an american life is worth more than a life from another country. morally it feels kinda suspect to slam the doors shut. that said to the extent that the state exists in a social contract with its citizens, its primary obligations are to them. so I guess lean towards liberalization while being careful to optimize towards citizen wellbeing\n\npractically: letting the doors open to immigrants is terrible policy. people hate it and it opens up questions of fairness (why implicitly reward people for not following the proper processes) and can undermine social cohesion. immigration is good for the economy and society but should be done in a controlled and orderly way", "importance": null}, "rachel-hong:P15": {"title": "Immigration, national obligations, and universal welfare", "answer": "Favor moderate immigration, prioritizing citizens' interests while recognizing benefits to migrants.", "explanation": "", "importance": null}, "gene:P16": {"title": "Do you give special moral weight to the worst-off?", "answer": "Yes. An equal benefit matters morally more when it goes to someone worse off.", "explanation": "", "importance": null}, "rachel-hong:P16": {"title": "Do you give special moral weight to the worst-off?", "answer": "I reject a premise or have a different interpretation.", "explanation": "", "importance": null}, "gene:P17": {"title": "What makes a right fundamental?", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": null}, "rachel-hong:P17": {"title": "What makes a right fundamental?", "answer": "Natural or inherent rights that exist independently of government.", "explanation": "", "importance": null}, "gene:P18": {"title": "Can economic liberty be restricted for social welfare?", "answer": "There is a meaningful rights concern, but it can be outweighed by sufficiently strong public interests.", "explanation": "I guess I’ll start by saying I find the conventional account of property rights a little odd. That there exists objects in the world to which you and you alone are solely morally and therefore legally entitled. I dont like the idea of a state or some institution being able to reach in and take from people but I think philosophically that bothers me not bc I believe there is some sanctity to the ownership of stuff but rather I think there can be some violation of human dignity and autonomy. Like for example I find the idea that a person can buy a shit ton of land and kick everyone off of it kinda weird and not sure that there is a fully morally coherent justification, particularly when this land’s ownership is passed down through generations of inherited wealth.\n\nSo I care about property rights morally in as much as I think that a state that doesnt will overreach and shows that it does not respect the agency and autonomy of people. Practically too, if you can you arbitrarily take things from people, it undermines your political legitimacy and undermines peoples incentive to build and work.\n\nAll that said while I dont think the state should just arbitrarily take stuff from people, I also dont think there is some reified sanctity to the idea of owning stuff that intrinsically overrides the welfare of society as a whole", "importance": null}, "rachel-hong:P18": {"title": "Can economic liberty be restricted for social welfare?", "answer": "Another distinction is essential.", "explanation": "", "importance": null}, "gene:P19": {"title": "Democratic legitimacy versus constitutional rights", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "", "importance": null}, "rachel-hong:P19": {"title": "Democratic legitimacy versus constitutional rights", "answer": "Yes, although courts should ordinarily exercise considerable institutional restraint.", "explanation": "", "importance": null}, "gene:P20": {"title": "Universal moral worth versus obligations to citizens", "answer": "Probably B, but governments may legitimately place some additional weight on citizens.", "explanation": "", "importance": null}, "rachel-hong:P20": {"title": "Universal moral worth versus obligations to citizens", "answer": "Probably A. Governments have special obligations to citizens, even when the global welfare gains elsewhere are larger.", "explanation": "", "importance": null}, "gene:P21": {"title": "Judicial power and democratic accountability", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "principled objections and desires to preserve rights and liberties enshrined in the constitution im for strong judicial review. There is a real concern of tyranny of the masses. That said you cant just take principled objections for granted", "importance": null}, "rachel-hong:P21": {"title": "Judicial power and democratic accountability", "answer": "Another model or distinction", "explanation": "", "importance": null}, "gene:P22": {"title": "Nationalism, patriotism, and political identity", "answer": "Shared constitutional principles, civic equality, and democratic institutions are sufficient", "explanation": "Your use of the word should implies a normative judgement. In that case yeah I think institutions and a belief in democratic and institutional values should be sufficient for national identity. Though I recognize in practice, shared traditions and symbols are also important for social cohesion. I also dont think national identity is itself a moral good but rather something of instrumental value for a functioning society. The reason I didnt go with the last option is the use of the word “can” which implies practical application. I dont think people in practice are willing to cooperate purely on the basis of abstract philosophical and political commitments", "importance": null}, "rachel-hong:P22": {"title": "Nationalism, patriotism, and political identity", "answer": "A substantive national culture and historical identity are important alongside civic principles", "explanation": "", "importance": null}, "gene:P23": {"title": "The welfare state and positive rights", "answer": "Public provision should depend mainly on evidence of welfare gains, rather than an independent entitlement", "explanation": "", "importance": null}, "rachel-hong:P23": {"title": "The welfare state and positive rights", "answer": "There is a strong public obligation to guarantee a decent minimum, though not every service is an absolute right", "explanation": "", "importance": null}, "gene:P24": {"title": "Religion, pluralism, and public institutions", "answer": "Religious freedom deserves protection, but all public-facing institutions should meet robust secular equality standards", "explanation": "", "importance": null}, "rachel-hong:P24": {"title": "Religion, pluralism, and public institutions", "answer": "Religious freedom deserves protection, but all public-facing institutions should meet robust secular equality standards", "explanation": "", "importance": null}, "gene:P25": {"title": "Foreign policy: Liberal ideals versus strategic restraint", "answer": "Favor diplomatic engagement and targeted measures; avoid broad confrontations without clear prospects for improvement", "explanation": "", "importance": null}, "rachel-hong:P25": {"title": "Foreign policy: Liberal ideals versus strategic restraint", "answer": "Favor diplomatic engagement and targeted measures; avoid broad confrontations without clear prospects for improvement", "explanation": "", "importance": null}, "gene:P26": {"title": "Markets, regulation, and the burden of proof", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": null}, "rachel-hong:P26": {"title": "Markets, regulation, and the burden of proof", "answer": "Another framework", "explanation": "", "importance": null}, "gene:P27": {"title": "Concentrated private power", "answer": "Intervene selectively, including through competition policy and safeguards against arbitrary exclusion", "explanation": "Practically speaking government officials are poorly positioned to understand technology much less the 2nd order or other downstream effects of regulation which is often a blunt instrument. I think the gov needs to be willing to intervene in certain cases but should be circumspect when and how it chooses to do so, particularly when <script>
(() => {
  const R = JSON.parse(document.getElementById("report-data").textContent);

  const PA = R.people.a, PB = R.people.b;
  const TAG = { [PA.slug]: "a", [PB.slug]: "b" };

  const FIX_KEY = "politype-fixes-compare-" + R.pair;
  let fixes = {};
  try { fixes = JSON.parse(localStorage.getItem(FIX_KEY) || "{}"); } catch (e) {}

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }
  const who = (slug) => h("span", { class: "who" }, h("span", { class: "sw " + TAG[slug] }), NAME[slug]);
  const Q = Object.fromEntries(R.questions.map((q) => [q.qid, q]));
  const ISSUE = Object.fromEntries(R.issues.map((i) => [i.qid, i]));
  const pct = (v) => Math.round(v * 100) + "%";

  function evidence(ids) {

      h("summary", {}, "Based on", ...ids.map((ref) => {
        const [slug, qid] = ref.split(":");
        return h("span", { class: "qid " + (TAG[slug] || ""), title: NAME[slug], text: qid });
      })));
    const list = h("div", { class: "ev-list" });
    for (const ref of ids) {
      const e = R.evidence[ref]; if (!e) continue;
      const [slug, qid] = ref.split(":");
      const x = e.explanation ? (e.explanation.length > 420 ? e.explanation.slice(0, 420).trimEnd() + "…" : e.explanation) : null;
      list.append(h("div", { class: "ev-item" },
        h("span", { class: "q" }, who(slug), h("span", { class: "code", text: qid }), e.title),
        h("span", { text: e.answer + (e.importance ? `  (importance ${e.importance}/5)` : "") }),
        x && h("span", { class: "x", text: "“" + x + "”" })));
    }
    d.append(list);
    return d;
  }

  function fixControl(id, label) {
    const wrap = h("div", { class: "fix-box" });
    const btn = h("button", { class: "fix", type: "button", text: fixes[id] ? "Edit your correction" : "That's not what I meant" });
    btn.addEventListener("click", () => {
      if (wrap.querySelector("textarea")) return;
      const ta = h("textarea", { id: "fix-" + id, "aria-label": "Correction for " + label, placeholder: "What did you actually mean?" });
      ta.value = fixes[id]?.note || "";
      ta.addEventListener("input", () => {
        const note = ta.value.trim();
        if (note) fixes[id] = { finding: label, note }; else delete fixes[id];
        try { localStorage.setItem(FIX_KEY, JSON.stringify(fixes)); } catch (e) {}
        renderTray();
      });
      wrap.append(ta); ta.focus();
    });
    wrap.append(btn);
    return wrap;
  }

  let n = 0;
  function section(id, title, intro, ...body) {
    n += 1;
    return h("section", { class: "s", id },
      h("div", { class: "s-head" }, h("span", { class: "n", text: String(n).padStart(2, "0") }), h("h2", { text: title })),
      intro && h("p", { class: "intro", text: intro }), ...body);
  }
  const issueLink = (qid) => h("a", { class: "issue", href: "#q-" + qid, onclick: () => openQ(qid) },
    h("span", { class: "code", text: qid }), Q[qid].title);

  const QUAD = {
    allies: { name: "Allies", desc: "Same policy, built on the same principles." },
    coalition: { name: "Coalition", desc: "Same policy, reached from different principles." },
    applied: { name: "Same principles, different policy", desc: "They share the principles behind the issue and still choose different policies." },
    deep: { name: "Deep disagreement", desc: "Different policy and different principles behind it." },
    unplaced: { name: "Not placed", desc: "One side could not be scored, usually because someone rejected the listed options." },
  };
  const O = R.overall;

  // Hero
  const hero = h("div", { class: "hero" },
    h("div", { class: "eyebrow code" }, h("span", { text: "POLITYPE · SIDE BY SIDE" }), h("span", { text: `${R.questions.length} QUESTIONS EACH` })),
    h("h1", { text: `${PA.name} and ${PB.name}` }),
    R.pair_summary && h("p", { class: "summary", text: R.pair_summary }),
    h("div", { class: "pair" }, [PA, PB].map((p) => h("div", { class: "person " + TAG[p.slug] },
      who(p.slug), h("h2", { text: p.archetype }), h("p", { text: p.tagline }),
      h("span", { class: "meta", text: `${p.explained} of ${p.answered} answers explained${p.rated ? "" : " · no importance ratings"}` })))),
    h("div", { class: "verdict" },
      h("div", {}, h("span", { class: "k", text: "Principles" }), h("span", { class: "v", text: pct(O.philosophy_rate) }),
        h("span", { class: "d", text: "agreement on the 35 philosophy questions, weighted by importance" })),
      h("div", {}, h("span", { class: "k", text: "Policy" }), h("span", { class: "v", text: pct(O.policy_rate) }),
        h("span", { class: "d", text: "agreement on the 25 policy questions, weighted by importance" })),
      h("div", {}, h("span", { class: "k", text: "Overall" }), h("span", { class: "v", text: QUAD[O.quadrant].name }),
        h("span", { class: "d", text: QUAD[O.quadrant].desc }))));

  const hasPred = R.predictions.length > 0;
  const toc = h("nav", { class: "toc", "aria-label": "Report sections" },
    [R.who && ["who", "Who they are"], ["map", "Issue map"], ["coalition", "Same policy, different reasons"], ["applied", "Same principles, different policy"],
     ["disagree", "Disagreements"], ["gaps", "Principle to policy"], ["reasoning", "How they reason"], ["coverage", "What each sees"],
     hasPred && ["predictions", "Predictions"], ["starters", "Conversations"], ["answers", "All answers"]]
      .filter(Boolean).map(([id, t]) => h("a", { href: "#" + id, text: t })));

  // A finding card: the summary is what everyone sees, the body is the reasoning behind it.
  function card(cls, head, body) {
    return h("details", { class: "x " + cls }, h("summary", {}, ...head, h("span", { class: "more" }, h("span"))),
      h("div", { class: "body" }, ...body));
  }
  const duo = (a, b) => h("div", { class: "duo" },
    h("div", {}, h("span", { class: "sw a" }), h("b", { text: PA.name }), h("span", { text: a })),
    h("div", {}, h("span", { class: "sw b" }), h("b", { text: PB.name }), h("span", { text: b })));

  // Map
  const byQuad = (q) => R.issues.filter((i) => i.quadrant === q);
  const cell = (q, axes) => h("div", { class: "cell" + (O.quadrant === q ? " here" : "") },

    h("p", { class: "desc", "data-axes": axes, text: QUAD[q].desc }),

  const unplaced = byQuad("unplaced");
  const map = section("map", "The issue map",
    "Each policy issue is placed by whether they chose the same policy and whether they agree on the philosophy behind it. The outlined box is where they fall overall.",
    h("div", { class: "map" },
      h("span", { class: "corner" }), h("span", { class: "colh", text: "Same policy" }), h("span", { class: "colh", text: "Different policy" }),
      h("span", { class: "rowh", text: "Same principles" }), cell("allies", "Same policy · same principles"), cell("applied", "Different policy · same principles"),
      h("span", { class: "rowh", text: "Different principles" }), cell("coalition", "Same policy · different principles"), cell("deep", "Different policy · different principles")),
    unplaced.length && h("div", { class: "chips" }, h("span", { class: "chip", text: "Not placed" }), unplaced.map((i) => issueLink(i.qid))));

  // Who they are
  const W = R.who;
  const CAT = { education: "Education", work: "Work", life_stage: "Life stage", media: "What they follow", style: "In an argument" };
  const CONF = { strong: "Well supported", guess: "A guess", none: "No signal" };
  const conf = (c) => h("span", { class: "conf " + c, text: CONF[c] || c });
  const who_ = W && section("who", "Who they are",
    "Inferences from how each person writes and reasons, not only from their positions. Each one says how well supported it is. Open any item to see why.",
    h("div", { class: "portraits" }, [PA, PB].map((p) => h("div", { class: "person " + TAG[p.slug] }, who(p.slug), h("p", { text: W.people[p.slug]?.portrait })))),
    h("div", { class: "bg" },
      h("div", { class: "bg-row bg-head" }, h("span"), who(PA.slug), who(PB.slug)),
      ...Object.keys(CAT).map((c) => h("div", { class: "bg-row" }, h("span", { class: "cat", text: CAT[c] }),
        ...[PA, PB].map((p) => {
          const b = (W.people[p.slug]?.background || []).find((x) => x.category === c);
          if (!b) return h("span", { class: "muted", text: "No signal" });
          return card("bg-cell", [h("span", { class: "nm" }, who(p.slug)), h("span", { class: "g", text: b.guess }), conf(b.confidence)],
            [h("p", { style: "font-size:14.5px", text: b.why }), evidence(b.evidence), fixControl(`cmp-who-${p.slug}-${c}`, `${p.name}: ${b.guess}`)]);
        })))),
    h("div", { class: "group" }, h("h3", {}, "Personality"),
      h("div", { class: "traits2" }, [PA, PB].map((p) => h("div", { class: "tlist" }, h("div", { class: "hd" }, who(p.slug)),
        ...(W.people[p.slug]?.personality || []).map((t, i) => card("", [h("span", { class: "tr" }, t.trait, conf(t.confidence))],
          [h("p", { style: "font-size:14.5px", text: t.detail }), evidence(t.evidence), fixControl(`cmp-trait-${p.slug}-${i}`, `${p.name}: ${t.trait}`)])))))),
    (W.dynamics || []).length && h("div", { class: "group" }, h("h3", {}, "How they would get along"),
      h("div", { class: "rows" }, W.dynamics.map((d) => card("row", [
        h("div", { class: "t" }, h("span", { class: "chip " + d.kind, text: d.kind === "click" ? "Easy ground" : "Friction" }), d.title)],
        [h("p", { text: d.detail }), evidence(d.evidence), fixControl("cmp-" + d.id, d.title)])))));

  // Coalition and applied
  const coalition = section("coalition", "Same policy, different reasons",
    "They land in the same place for different reasons. Agreements like these can break when circumstances change.",
    R.coalition.length ? h("div", { class: "cards" }, R.coalition.map((c) => card("finding", [
      h("div", { class: "chips" }, issueLink(c.issue)), h("h3", { text: c.title || c.shared_position }),
      c.a_short && duo(c.a_short, c.b_short)], [
      h("p", { text: c.shared_position }),
      h("dl", { class: "fields" },
        h("dt", {}, h("span", { class: "sw a" }), PA.name + "'s reason"), h("dd", { text: c.a_foundation }),
        h("dt", {}, h("span", { class: "sw b" }), PB.name + "'s reason"), h("dd", { text: c.b_foundation }),
        h("dt", { text: "What would split them" }), h("dd", { text: c.what_would_split })),
      evidence(c.evidence), fixControl("cmp-" + c.id, c.title || c.shared_position)])))
      : h("p", { class: "muted", text: "No issue in this quadrant had enough written reasoning to explain." }));

  const PART = { facts: "Different facts", application: "Different application", priorities: "Different priorities" };
  const applied = section("applied", "Same principles, different policy",
    "They share the principles behind the issue but choose different policies. These are usually the easiest disagreements to work through.",
    R.applied.length ? h("div", { class: "cards" }, R.applied.map((c) => card("finding", [
      h("div", { class: "chips" }, issueLink(c.issue), h("span", { class: "chip", text: PART[c.where_they_part] || c.where_they_part })),
      h("h3", { text: c.title || c.shared_principle })], [
      h("dl", { class: "fields" }, h("dt", { text: "Shared principle" }), h("dd", { text: c.shared_principle }),
        h("dt", { text: "Where they part" }), h("dd", { text: c.detail })),
      evidence(c.evidence), fixControl("cmp-" + c.id, c.title || c.shared_principle)])))
      : h("p", { class: "muted", text: "No issue in this quadrant had enough written reasoning to explain." }));

  // Disagreements
  const bothRated = PA.rated && PB.rated;
  const imp = (qid, t) => Q[qid]?.[t]?.importance;
  const weightOf = (qid) => ((imp(qid, "a") || 3) + (imp(qid, "b") || 3)) / 2;
  const TYPE = {
    values: ["Different values", "They care about different things."],
    facts: ["Different facts", "Same value, different expected outcomes. Evidence could settle these."],
    priorities: ["Different priorities", "Same values, ranked differently."],
    unexplained: ["Not explained", "Neither person explained these answers."],
  };
  const disagree = section("disagree", "Where they disagree",
    "Every question where their answers are clearly apart, grouped by what drives it. The issues they care about most come first." +
      (bothRated ? " A fault line is an issue both rated 4 or 5." : ""),
    ...Object.keys(TYPE).map((t) => {
      const items = R.disagreements.filter((d) => d.type === t).sort((x, y) => weightOf(y.qid) - weightOf(x.qid));
      if (!items.length) return null;
      const head = (d) => [h("div", { class: "t" }, h("span", { class: "code", text: d.qid }), Q[d.qid]?.title,
          bothRated && imp(d.qid, "a") >= 4 && imp(d.qid, "b") >= 4 && h("span", { class: "chip fault", text: "Fault line" })),
        d.crux && t !== "unexplained" && h("span", { class: "crux", text: d.crux })];
      return h("div", { class: "group" },
        h("h3", {}, TYPE[t][0], h("span", { text: `${items.length} · ${TYPE[t][1]}` })),
        h("div", { class: "rows" }, items.map((d) => card("row", head(d), [
          h("p", { text: d.detail }),
          t !== "unexplained" && evidence(d.evidence),
          h("a", { class: "code", href: "#q-" + d.qid, onclick: () => openQ(d.qid), text: "See both answers" }),
          t !== "unexplained" && fixControl("cmp-" + d.id, Q[d.qid]?.title || d.qid)]))));
    }));

  // Gaps
  const tip = document.getElementById("tip");
  const showTip = (e, text) => { tip.textContent = text; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 14) + "px"; };
  const hideTip = () => { tip.hidden = true; };
  const pos = (v) => ((v + 2) / 4) * 100;
  const fmt = (v) => (v > 0 ? "+" : "") + v.toFixed(2);
  function dumbbell(t, from, to, fromLabel, toLabel, name) {
    const lo = Math.min(from, to), hi = Math.max(from, to);
    const label = `${name}: ${fromLabel} ${fmt(from)}, ${toLabel} ${fmt(to)}`;
    const tr = h("div", { class: "track " + t, role: "img", "aria-label": label },
      h("div", { class: "line" }), ...[-2, -1, 0, 1, 2].map((v) => h("div", { class: "tick" + (v === 0 ? " mid" : ""), style: `left:${pos(v)}%` })),
      h("div", { class: "seg", style: `left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%` }),
      h("div", { class: "dot phil", style: `left:${pos(from)}%` }), h("div", { class: "dot pol", style: `left:${pos(to)}%` }));
    tr.addEventListener("pointermove", (e) => showTip(e, label));
    tr.addEventListener("pointerleave", hideTip);
    return tr;
  }
  const axisIds = R.gaps.a.map((x) => x.axis).filter((id, i) => R.gaps.a[i].gap != null || R.gaps.b[i].gap != null);
  const gaps = section("gaps", "From principle to policy",
    "Open circle: where a person's philosophy answers place them. Filled circle: where their policy answers place them. A short line means their policies follow their principles on that axis.",
    h("div", { class: "gaps" },
      h("div", { class: "legend" }, h("span", {}, h("i", { class: "ring" }), "Philosophy answers"), h("span", {}, h("i", { class: "fill" }), "Policy answers"),
        h("span", {}, h("span", { class: "sw a" }), PA.name), h("span", {}, h("span", { class: "sw b" }), PB.name)),
      ...axisIds.map((id) => {
        const ga = R.gaps.a.find((x) => x.axis === id), gb = R.gaps.b.find((x) => x.axis === id);
        const line = (g, t, p) => g.gap == null
          ? h("div", { class: "gline" }, h("span", { class: "lbl", text: p.name }), h("span", { class: "muted", style: "font-size:13px", text: "Not enough answers on this axis" }))
          : h("div", { class: "gline" }, h("span", { class: "lbl", text: p.name }), dumbbell(t, g.philosophy, g.policy, "philosophy", "policy", p.name));
        return h("div", { class: "gaxis" }, h("span", { class: "name", text: ga.name }),
          line(ga, "a", PA), line(gb, "b", PB),
          h("div", { class: "ends" }, h("span", { text: ga.low }), h("span", { text: ga.high })));
      })),
    R.gap_note && card("finding", [h("h3", { text: "What this shows" })],
      [h("p", { text: R.gap_note }), fixControl("cmp-gap", "From principle to policy")]));

  // Reasoning
  const reasoning = section("reasoning", "How they reason",
    "How each person thinks a question through, separate from what they conclude.",
    h("div", { class: "cards" }, R.style_contrasts.map((c) => card("finding", [h("h3", { text: c.label }), c.a_short && duo(c.a_short, c.b_short)], [
      h("dl", { class: "fields" }, h("dt", {}, h("span", { class: "sw a" }), PA.name), h("dd", { text: c.a }),
        h("dt", {}, h("span", { class: "sw b" }), PB.name), h("dd", { text: c.b })),
      evidence(c.evidence), fixControl("cmp-" + c.id, c.label)]))),
    R.shared_lineage.length && h("div", { class: "group" }, h("h3", {}, "Shared intellectual lineage"),
      h("div", { class: "cards" }, R.shared_lineage.map((l) => card("finding", [h("h3", { text: l.name })], [
        h("dl", { class: "fields" }, h("dt", {}, h("span", { class: "sw a" }), PA.name), h("dd", { text: l.a_use }),
          h("dt", {}, h("span", { class: "sw b" }), PB.name), h("dd", { text: l.b_use })),
        evidence(l.evidence), fixControl("cmp-" + l.id, l.name)])))));

  // Coverage
  const coverage = section("coverage", "What each sees that the other doesn't",
    "Places where one person's answers speak to a tension or blind spot from the other person's own report.",
    R.coverage.length ? h("div", { class: "cards" }, R.coverage.map((c) => {
      const [src] = c.source_finding.split(":");
      return card("finding", [
        h("div", { class: "chips" }, h("span", { class: "chip", text: `From ${NAME[src]}'s report` })),
        h("h3", { text: R.findings_index[c.source_finding] || c.source_finding }),
        c.title && h("div", { class: "duo" }, h("div", {}, h("span", { class: "sw " + TAG[c.covered_by] }), h("b", { text: NAME[c.covered_by] }), h("span", { text: c.title })))], [
        h("p", { text: c.detail }), evidence(c.evidence), fixControl("cmp-" + c.id, R.findings_index[c.source_finding] || c.id)]);
    })) : h("p", { class: "muted", text: "Neither person's answers spoke directly to the other's tensions or blind spots." }));

  // Predictions
  const PROJ = {
    assumed_similar: (g, t) => `${g} assumed more agreement than there is. ${g}'s guesses sat closer to ${g}'s own answers than ${t}'s real answers do.`,
    assumed_different: (g, t) => `${g} assumed more disagreement than there is. ${g}'s guesses sat further from ${g}'s own answers than ${t}'s real answers do.`,
    accurate: (g, t) => `${g} judged the distance between them accurately.`,
  };
  const predictions = hasPred && section("predictions", "How well they predicted each other",
    "Before seeing the answers, one person guessed how the other would answer every question.",
    ...R.predictions.map((p) => {
      const g = NAME[p.guesser], t = NAME[p.target];
      const b = p.axis_bias[0];
      const rows = Object.fromEntries(p.rows.map((r) => [r.qid, r]));
      return card("finding", [
        h("h3", {}, who(p.guesser), ` guessing ${t}`),
        h("div", { class: "stats" },
          h("div", {}, h("span", { class: "v", text: `${p.exact.matched} of ${p.exact.of}` }), h("span", { class: "k", text: "exact answers" })),
          h("div", {}, h("span", { class: "v", text: `${p.exact_philosophy.matched} of ${p.exact_philosophy.of}` }), h("span", { class: "k", text: "philosophy" })),
          h("div", {}, h("span", { class: "v", text: `${p.exact_policy.matched} of ${p.exact_policy.of}` }), h("span", { class: "k", text: "policy" }))),
        p.projection.direction && h("p", { text: PROJ[p.projection.direction](g, t) })], [
        b && h("p", { text: `The biggest miss by axis was ${b.name.toLowerCase()}. ${g} placed ${t} at ${fmt(b.guessed)}, and ${t} is at ${fmt(b.actual)}, further toward "${b.error < 0 ? b.high : b.low}" than expected.` }),
        b && h("div", { class: "gline" }, h("span", { class: "lbl", text: b.name.split(" ")[0] }), dumbbell(TAG[p.target], b.guessed, b.actual, "guessed", "actual", t)),
        b && h("div", { class: "ends" }, h("span", { text: b.low }), h("span", { text: b.high })),
        b && h("p", { class: "muted", style: "font-size:13px", text: "Open circle: the guess. Filled circle: the real answers." }),
        p.top_misses.length && h("span", { class: "label-sm chip", style: "align-self:flex-start", text: "Biggest misses" }),
        h("dl", { class: "miss" }, p.top_misses.flatMap((qid) => [
          h("dt", {}, h("a", { class: "code", href: "#q-" + qid, onclick: () => openQ(qid), text: qid + " " }), rows[qid].title),
          h("dd", {}, h("span", { class: "muted", text: "Guessed: " }), rows[qid].guess, h("br"), h("span", { class: "muted", text: "Actual: " }), rows[qid].actual)]))]);
    }));

  // Starters
  const starters = section("starters", "Conversations worth having",
    "Three issues where talking it through could move one of them, each with a question evidence could answer.",
    h("div", { class: "cards" }, R.starters.map((s) => card("finding", [
      h("div", { class: "chips" }, issueLink(s.issue)), s.title && h("h3", { text: s.title }),
      h("p", { class: "ask", text: s.settling_question })], [
      h("p", { class: "muted", text: s.why_this_one }), evidence(s.evidence), fixControl("cmp-" + s.id, s.title || s.settling_question)]))));

  // Appendix
  const LEVEL = { match: "Same answer", close: "Close", apart: "Apart", unscored: "Not scored" };
  const filt = { part: "all", level: "all" };
  const qlist = h("div", { class: "qlist" });
  const side = (s, p) => h("div", { class: "qside " + TAG[p.slug] }, who(p.slug),
    s ? [h("span", { class: "ans", text: s.answer }), s.importance && h("span", { class: "imp", text: `Importance ${s.importance}/5` }),
         s.explanation && h("span", { class: "x", text: s.explanation })] : h("span", { class: "muted", text: "No answer" }));
  const qEls = R.questions.map((q) => {
    const i = ISSUE[q.qid];
    const el = h("details", { class: "q", id: "q-" + q.qid, "data-part": q.part, "data-level": q.level },
      h("summary", {}, h("span", { class: "code", text: q.qid }), h("span", { class: "ttl", text: q.title }),
        h("span", { class: "chips" }, h("span", { class: "chip " + q.level, text: LEVEL[q.level] }), i && h("span", { class: "chip", text: QUAD[i.quadrant].name }))),
      h("div", { class: "qbody" }, side(q.a, PA), side(q.b, PB),
        i && h("p", { class: "qlinks", text: "Philosophy behind this issue: " + i.linked.map((l) => `${l.qid} ${Q[l.qid].title} (${LEVEL[l.level].toLowerCase()})`).join(" · ") })));
    qlist.append(el);
    return el;
  });
  function applyFilter() { for (const el of qEls) el.hidden = (filt.part !== "all" && el.dataset.part !== filt.part) || (filt.level !== "all" && el.dataset.level !== filt.level); }
  const seg = (key, opts, label) => h("div", { class: "seg-ctl", role: "group", "aria-label": label }, opts.map(([v, t]) => {
    const b = h("button", { type: "button", id: `f-${key}-${v}`, "aria-pressed": String(filt[key] === v), text: t });
    b.addEventListener("click", () => { filt[key] = v; b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); applyFilter(); });
    return b;
  }));
  function openQ(qid) {
    filt.part = "all"; filt.level = "all";
    document.querySelectorAll(".seg-ctl button").forEach((b) => b.setAttribute("aria-pressed", String(b.id.endsWith("-all"))));
    applyFilter();
    const el = document.getElementById("q-" + qid);
    if (el) { el.open = true; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
  }
  const answers = section("answers", "All answers, side by side", "Open any question to see both answers and explanations.",
    h("div", { class: "filters" },
      seg("part", [["all", "All"], ["P", "Philosophy"], ["U", "Policy"]], "Filter by part"),
      seg("level", [["all", "Any"], ["match", "Same"], ["close", "Close"], ["apart", "Apart"], ["unscored", "Not scored"]], "Filter by agreement")),
    qlist);

  const footer = h("footer", {}, `Generated ${R.generated_at}. Agreement levels, the issue map, the principle-to-policy chart, and prediction scores come from a fixed scoring key, not from AI. The written analysis is by Claude, was checked by a second pass that tried to refute it, and cites the answers behind every finding. Either of you can use "That's not what I meant" on anything that misreads you, then send the corrections back.`);

  app.textContent = "";
  const expandBtn = h("button", { class: "btn", type: "button", id: "expand-all", text: "Expand all" });
  expandBtn.addEventListener("click", () => {
    const open = expandBtn.textContent === "Expand all";
    document.querySelectorAll("details.x").forEach((d) => { d.open = open; });
    expandBtn.textContent = open ? "Collapse all" : "Expand all";
  });
  app.append(hero, h("div", { class: "toolbar" }, toc, expandBtn), who_ || "", map, coalition, applied, disagree, gaps, reasoning, coverage, predictions || "", starters, answers, footer);
  app.querySelectorAll("section.s .s-head .n").forEach((el, i) => { el.textContent = String(i + 1).padStart(2, "0"); });
  if (location.hash.startsWith("#q-")) openQ(location.hash.slice(3));

  const from = document.getElementById("trayFrom");
  for (const p of [PA, PB]) from.append(h("option", { value: p.slug, text: p.name }));
  function renderTray() {
    const k = Object.keys(fixes).length;
    document.getElementById("tray").hidden = !k;
    document.getElementById("trayText").textContent = `${k} correction${k === 1 ? "" : "s"} noted`;
  }
  document.getElementById("trayCopy").addEventListener("click", async (e) => {
    const text = JSON.stringify({ pair: R.pair, from: from.value, corrections: Object.entries(fixes).map(([id, f]) => ({ id, ...f })) });
    try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied. Send it back"; }
    catch (err) {
      const ta = document.getElementById("trayFallback");
      ta.value = text; ta.hidden = false; ta.select();
      e.target.textContent = "Select and copy the text";
    }
  });
  renderTray();
})();
</script>
