-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans rule out both benefit changes and new taxes.", "summary": "The 2024 Republican platform promises no cuts to Social Security or Medicare and no change to the retirement age. It says growth, lower inflation, and border security will keep the programs solvent. It does not propose new revenue.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}]}}, {"qid": "U21", "issue": "Defense spending", "your_position": "Maintain a large, global military, with modernization and efficiency reforms.", "D": {"agreement": "agree", "note": "Democrats back continued investment without a large budget increase.", "summary": "The 2024 Democratic platform calls the US military the finest in history and pledges to keep investing in next-generation weapons, the submarine force, and the nuclear triad. It does not call for a large budget increase.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans seek a roughly 40 percent budget increase, one step beyond your position.", "summary": "The 2024 Republican platform promises to build a military bigger, better, and stronger than ever, including an Iron Dome missile shield. In 2026 President Trump requested about $1.5 trillion for defense in fiscal 2027, a rise of roughly 40 percent, partly through a planned reconciliation bill.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "DefenseScoop: Trump calls for $1.5 trillion defense budget in 2027", "url": "https://defensescoop.com/2026/01/07/trump-calls-for-1-5-trillion-defense-budget-2027/", "date": "2026-01-07"}, {"title": "Breaking Defense: Trump to propose $1.5 trillion defense budget, banking on $350 billion from reconciliation", "url": "https://breakingdefense.com/2026/04/trump-to-propose-1-5-trillion-defense-budget-banking-on-350-billion-from-reconciliation/", "date": "2026-04"}]}}, {"qid": "U22", "issue": "NATO and alliances", "your_position": "Maintain strong alliances while requiring much larger allied contributions.", "D": {"agreement": "partial", "note": "Democrats strengthen commitments but treat the 2 percent of GDP goal as a floor, without pressing for much more.", "summary": "The 2024 Democratic platform says NATO is stronger and more united than ever under Biden, welcomes Finland and Sweden, and treats the 2 percent of GDP spending goal as a floor.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "Republicans pushed allies to pledge 5 percent of GDP, which matches your option.", "summary": "The 2024 Republican platform says it will strengthen alliances by ensuring allies meet their obligations to invest in common defense. At the June 2025 Hague summit, under US pressure, NATO allies pledged to spend 5 percent of GDP on defense and security by 2035.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "NATO: The Hague Summit Declaration", "url": "https://www.nato.int/cps/en/natohq/official_texts_236705.htm", "date": "2025-06-25"}, {"title": "Defense News: NATO allies agree to boost defense spending to 5% at The Hague summit", "url": "https://www.defensenews.com/global/europe/2025/06/25/nato-allies-agree-to-boost-defense-spending-to-5-at-the-hague-summit/", "date": "2025-06-25"}]}}, {"qid": "U23", "issue": "China and trade", "your_position": "Strong restrictions on strategic technology while keeping significant ordinary trade.", "D": {"agreement": "agree", "note": "Democrats favor focused technology limits without decoupling.", "summary": "The 2024 Democratic platform says the US should de-risk and diversify its economic relationship with China, not decouple. It favors a small yard and high fence of focused technology restrictions, plus targeted tariffs on items like steel, chips, electric vehicles, and solar cells.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "The platform aims close to decoupling, though the 2025 truce cut tariffs.", "summary": "The 2024 Republican platform calls for revoking China's most favored nation trade status, phasing out imports of essential goods, and blocking Chinese purchases of US real estate and industries. The administration raised tariffs on China sharply in 2025, then cut them in an October 2025 truce in exchange for Chinese action on fentanyl and rare earths.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Kitco (Reuters): Trump shaves China tariffs in deal with Xi on fentanyl, rare earths", "url": "https://www.kitco.com/news/off-the-wire/2025-10-30/trump-shaves-china-tariffs-deal-xi-fentanyl-rare-earths", "date": "2025-10-30"}, {"title": "Jones Day: United States Supreme Court invalidates IEEPA tariffs", "url": "https://www.jonesday.com/de/insights/2026/02/united-states-supreme-court-invalidates-ieepa-tariffs", "date": "2026-02"}]}}, {"qid": "U24", "issue": "Military aid abroad", "your_position": "Meaningful aid where US strategic interests are at stake, mainly for democracies.", "D": {"agreement": "partial", "note": "Democrats back substantial aid to defend democratic sovereignty even at high cost, one step beyond your option.", "summary": "The 2024 Democratic platform backs giving Ukraine the weapons and economic support it needs to defend its sovereignty. In June 2026 House Democrats, joined by 18 Republicans, used a discharge petition to pass a Ukraine aid and Russia sanctions bill led by Rep. Gregory Meeks.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Arab News (AP): US House passes bill to aid Ukraine and impose new sanctions on Russia", "url": "https://www.arabnews.pk/node/2646049/world", "date": "2026-06-05"}, {"title": "WTOP (AP): Senate passes sweeping Russia sanctions bill negotiated by the late Sen. Lindsey Graham", "url": "https://wtop.com/news/2026/08/senate-passes-sweeping-russia-sanctions-bill-negotiated-by-the-late-sen-lindsey-graham-2/", "date": "2026-08-07"}]}, "R": {"agreement": "partial", "note": "The party is split, and its pro-Ukraine wing matches your option while leadership favors limited support.", "summary": "The 2024 Republican platform promises to prevent World War III and restore peace in Europe, and says force should be used only where national interests are clearly threatened. Since 2025 the administration has not sought new Ukraine aid funding, and US weapons reach Ukraine mainly through sales paid for by NATO allies. A pro-Ukraine wing pushed aid and sanctions bills through Congress in 2026 over leadership objections.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Arab News (AP): US House passes bill to aid Ukraine and impose new sanctions on Russia", "url": "https://www.arabnews.pk/node/2646049/world", "date": "2026-06-05"}, {"title": "WTOP (AP): Senate passes sweeping Russia sanctions bill negotiated by the late Sen. Lindsey Graham", "url": "https://wtop.com/news/2026/08/senate-passes-sweeping-russia-sanctions-bill-negotiated-by-the-late-sen-lindsey-graham-2/", "date": "2026-08-07"}]}}, {"qid": "U25", "issue": "Domestic surveillance", "your_position": "Allow narrow expansions where agencies show specific need, with judicial review.", "D": {"agreement": "partial", "note": "Democrats are split, and their security-minded faction wants to renew current authority, next to your option.", "summary": "The 2024 Democratic platform does not address foreign intelligence surveillance. In April 2026, 42 House Democrats voted for a three-year renewal of Section 702 without a warrant requirement, while most Democrats opposed it. Democrats then withheld votes for an extension in June 2026, partly over the choice of acting intelligence director, and the authority lapsed on June 12, 2026.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Nextgov: House readies vote to renew FISA 702 without a warrant amendment", "url": "https://www.nextgov.com/policy/2026/04/house-readies-vote-renew-fisa-702-without-a-warrant-amendment/412856/", "date": "2026-04"}, {"title": "NPR: A key U.S. spy tool has lapsed. Now what?", "url": "https://www.npr.org/2026/06/12/nx-s1-5856291/fisa-702-surveillance-expiration-bill-pulte", "date": "2026-06-12"}, {"title": "CRS Legal Sidebar LSB11444: The Impact of FISA Section 702's Repeal", "url": "https://www.everycrsreport.com/files/2026-06-22_LSB11444_d51e458f8ceedeadf0646bd8cf94b229944adbff.pdf", "date": "2026-06-22"}]}, "R": {"agreement": "partial", "note": "Republicans are split, and leadership wants to renew current authority, next to your option.", "summary": "The 2024 Republican platform calls for banning government collusion to censor speech but does not address Section 702. House Republican leaders brought a three-year renewal without a warrant requirement to the floor in April 2026, and it passed 235 to 191 with 22 Republicans voting no. Congress did not renew it before it lapsed on June 12, 2026.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Nextgov: House readies vote to renew FISA 702 without a warrant amendment", "url": "https://www.nextgov.com/policy/2026/04/house-readies-vote-renew-fisa-702-without-a-warrant-amendment/412856/", "date": "2026-04"}, {"title": "NPR: A key U.S. spy tool has lapsed. Now what?", "url": "https://www.npr.org/2026/06/12/nx-s1-5856291/fisa-702-surveillance-expiration-bill-pulte", "date": "2026-06-12"}, {"title": "CRS Legal Sidebar LSB11444: The Impact of FISA Section 702's Repeal", "url": "https://www.everycrsreport.com/files/2026-06-22_LSB11444_d51e458f8ceedeadf0646bd8cf94b229944adbff.pdf", "date": "2026-06-22"}]}}], "party_as_of": "2026-10-30"}, "profile": {"material_note": "This profile rests on 42 written explanations across all 60 answers, about 1,350 words in total, plus your importance ratings.", "sections": [{"title": "Education and intellectual life", "strong": [{"claim": "You know a core idea from classical liberal thought: the tyranny of the majority, meaning the risk that a majority uses its power to override the rights of individuals or minorities. You use the phrase twice and back it with support for strong courts.", "evidence": ["P4", "P19", "P21"], "quote": "significant collective approval over time should be the prerequisite to avoid the tyranny of the majority"}, {"claim": "You know the working parts of current policy debates, not only the big principles. You bring up ranked choice voting, birthright citizenship rules, estate taxes, merit aid, loan disclosures, and carbon taxes paired with energy subsidies.", "evidence": ["U18", "U6", "U7", "U1", "U14", "P33"]}], "speculative": [{"claim": "You call the estate tax the \"death tax\" three times. That term is common in right-of-center commentary, so you may read or hear that media. You use it to argue for raising the tax, not cutting it.", "evidence": ["P2", "P6", "U1"]}, {"claim": "You may have some background in economics or business. You reach for words like incentives, market forces, innovation, and high value versus low value work.", "evidence": ["P6", "P7", "U3", "U6", "U21"]}]}, {"title": "Work and life stage", "strong": [], "speculative": [{"claim": "You may be a student or early in your career. Your most detailed proposal is about student loan counseling, and you push for protecting spending on the young over old age programs.", "evidence": ["U14", "U20"]}, {"claim": "You seem to follow current US politics closely. You describe the country as highly polarized and engage with live debates such as birthright citizenship and ranked choice voting.", "evidence": ["U6", "U7", "U18"]}]}, {"title": "Temperament", "strong": [{"claim": "You admit openly when a question is hard or the options do not fit. You do not force a confident answer on abstract dilemmas.", "evidence": ["P9", "P16", "U14"], "quote": "Honestly depends more on the circumstances."}, {"claim": "You are tentative on philosophical thought experiments but blunt on concrete policy. On immigration, crime, taxes, and deficits you write in terms of what must happen.", "evidence": ["U7", "U6", "U1", "U8", "U2"], "quote": "New illegal immigration must be aggressively stopped as top priority."}, {"claim": "You describe the problems you care about most as threats to the survival or stability of society. You call both climate change and deficit spending an existential threat.", "evidence": ["P33", "U2", "P32", "U6"]}], "speculative": []}, {"title": "How you reason", "strong": [{"claim": "You state a general rule and then name the exception. This pattern runs through your answers on freedom, welfare, policing, and sentencing. In one case your explanation reverses your pick when a condition changes.", "evidence": ["P3", "P12", "P16", "U8", "U9"], "quote": "If welfare loss is essentially unnoticeable, then I would pick policy A."}, {"claim": "You prefer rules targeted at what a specific person has done over blanket rules for everyone. You would ban alcohol or drugs for people with related violent offenses, deport immigrants convicted of crimes, and exempt children.", "evidence": ["P8", "U7", "U9"], "quote": "Someone who has been arrested for a drinking/drug related violent offense should be banned from legally consuming those items, but not every adult."}, {"claim": "You separate what would be ideal from what could actually work. You test hypotheticals against how they would be carried out, and you reject one because its premises could not be known in practice.", "evidence": ["P9", "P11", "P31", "P8"], "quote": "I don’t see a situation where a small group of totally innocent people would be in possession of such dangerous information"}, {"claim": "You reason from what government owes its own citizens. You repeat that government has an obligation, and you tie spending to the fact that citizens fund it.", "evidence": ["P15", "P20", "P32", "P33", "U2", "U14"], "quote": "A government has the obligation to their citizen welfare only."}], "speculative": [{"claim": "You draw a line between legal equality and cultural accommodation. Courts should protect every individual from the majority, but the state may favor the majority culture as long as laws apply the same way to all.", "evidence": ["P13", "P19", "P22", "P5"]}]}, {"title": "What you care about", "strong": [{"claim": "Social stability and cohesion come up across many topics: inequality, housing, immigration, national identity, and public order.", "evidence": ["P2", "P32", "U6", "P22", "U8"], "quote": "lack of unifying culture which significantly threatens the country’s cohesion"}, {"claim": "You want every individual treated the same under the law, regardless of group membership or birth circumstances. You rate these answers 5 out of 5.", "evidence": ["P5", "P10", "P14", "P13"], "quote": "Laws should always apply uniformly."}, {"claim": "You care about fairness to the young and to future generations. This shows up in your views on retirement programs, deficits, climate, and inherited wealth.", "evidence": ["U20", "U2", "P33", "P2"], "quote": "Society should not be subsidizing old age programs at the expense of future generations."}, {"claim": "You expect people to contribute to society. You want heirs of the wealthy to stay motivated, you reward productive citizens, and you would deport some residents who use public benefits.", "evidence": ["P2", "P6", "U7"], "quote": "the children of the high income are also motivated to contribute to society"}], "speculative": []}], "summary_portrait": "You think like someone drafting rules: a clear default, then the exceptions, often keyed to what a specific person has done. You admit when an abstract dilemma is hard, but you speak bluntly about crime, immigration, and deficits, which you see as threats to a stable society. You hold that government's first duty is to its own citizens. Across topics you want the law to treat every individual the same, the young protected from costs passed down to them, and everyone pulling their weight."}, "evidence": {"P1": {"title": "What is the primary purpose of government?", "prompt": "What is the primary purpose of government?", "answer": "A combination or different principle", "explanation": "Gov purposes is to both protect individual rights and freedoms but balance that responsibility with protecting society overall from external and internal threats of those who seek to suppress individual rights/liberties.", "importance": 5}, "P2": {"title": "How do you view economic inequality?", "prompt": "How do you view economic inequality?", "answer": "Acceptable, but excessive inequality threatens opportunity and society", "explanation": "I think several of these things are true. Income inequality is acceptable but if it becomes extremely skewed such that the lower end cannot afford basics such as food and healthcare, this threatens societal stability which is not acceptable. Income equality should not be the goal of the state; however, opportunities should exist for children of lower income families to improve their lot in life. Similarity, death tax burdens should be sufficiently high that the children of the high income are also motivated to contribute to society.", "importance": 3}, "P3": {"title": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "prompt": "When individual freedom conflicts with collective welfare, which should generally take precedence?", "answer": "Individual freedom, but with reasonable public-interest restrictions", "explanation": "It depends on which individual freedoms and what the impact to collective welfare is but generally individual freedom should be protected as long as your individual freedom doesn’t encroach upon another’s individual freedom or create at large issues for public welfare.", "importance": 4}, "P4": {"title": "How should society approach longstanding traditions and institutions?", "prompt": "How should society approach longstanding traditions and institutions?", "answer": "Reform them gradually, respecting accumulated experience", "explanation": "Longstanding traditions shouldn’t be able to be changed on whims, significant collective approval over time should be the prerequisite to avoid the tyranny of the majority.", "importance": 4}, "P5": {"title": "Which statement best captures your conception of justice?", "prompt": "Which statement best captures your conception of justice?", "answer": "Protecting equal rights and impartial treatment under the law", "explanation": "", "importance": 5}, "P6": {"title": "Redistribution and taxation", "prompt": "Would you support significantly higher taxation and redistribution?", "answer": "Only modestly; growth, incentives, and property rights deserve greater weight", "explanation": "Modest support. Instead of much higher income taxes, death tax burdens should be higher to still incentivize high innovation of productive citizens during their life. Tax law should be reformed to prevent underhanded tax avoidance schemes.", "importance": 4}, "P7": {"title": "Markets versus government", "prompt": "Which broad approach do you favor?", "answer": "Markets should be the default, with government correcting identifiable failures", "explanation": "Gov should have some regulations to prevent unfair/exploitative markets. But market forces should generally be allowed to prevail.", "importance": 4}, "P8": {"title": "Individual liberty and paternalism", "prompt": "Should the government restrict it?", "answer": "Possibly; the magnitude of the benefits and costs determines the answer", "explanation": "Depends on the activity and harm. Regulations should be tailored. IE gambling: if it is allowed, should be limited to 5% of one’s annual income. Someone who has been arrested for a drinking/drug related violent offense should be banned from legally consuming those items, but not every adult. Most hard drugs should be completely banned.", "importance": 4}, "P9": {"title": "Democracy versus expertise", "prompt": "What should happen?", "answer": "It depends on the institution's mandate, the evidence, and the seriousness of the harm", "explanation": "Tough. Ideally would have an independent body always acting on true science to only prevent disaster. However the implementation of this would be extremely difficult.", "importance": 5}, "P10": {"title": "Equality of opportunity versus equality of outcomes", "prompt": "What does justice require next?", "answer": "Focus on protecting equal rights and fair rules; unequal outcomes aren't intrinsically unjust", "explanation": "Groups should not be given less opportunity because they belong to an historically advantaged group of historically disadvantaged groups have access to quality institutions", "importance": 5}, "P11": {"title": "Are individual rights inviolable?", "prompt": "Would this be morally permissible?", "answer": "I reject the framing or would answer differently.", "explanation": "I don’t see a situation where a small group of totally innocent people would be in possession of such dangerous information, and how this would be known before implementing surveillance. With this background cannot guarantee it wouldn’t be an institutional precedent.", "importance": 3}, "P12": {"title": "Whose welfare matters most?", "prompt": "Which would you choose?", "answer": "Policy B. Higher aggregate welfare is the decisive consideration here.", "explanation": "Policy B, but it also depends on the impact of policy A. Is the welfare loss substantial to a subgroup of the better off? If so, no to policy A. If welfare loss is essentially unnoticeable, then I would pick policy A. But generally in a society overall welfare loss should be avoided.", "importance": 4}, "P13": {"title": "Cultural liberalism and social norms", "prompt": "What should the state's position be?", "answer": "Balance personal autonomy and social cohesion, potentially permitting some legal restrictions.", "explanation": "Laws should always apply uniformly. If the minority’s way of life runs afoul of the law, it is not to be permitted. State should promote social cohesion to majority culture.", "importance": 5}, "P14": {"title": "Group disadvantage and individual fairness", "prompt": "How do you view this trade-off?", "answer": "Oppose differential treatment based on group identity; equal individual treatment is paramount.", "explanation": "No individual should be given less opportunity because of their individual birth circumstances.", "importance": 5}, "P15": {"title": "Immigration, national obligations, and universal welfare", "prompt": "Which principle would guide your decision?", "answer": "National governments have a primary obligation to their own citizens, even at substantial cost to global welfare.", "explanation": "A government has the obligation to their citizen welfare only. Global welfare only matters in so far as it threatens the government’s citizens.", "importance": 5}, "P16": {"title": "Do you give special moral weight to the worst-off?", "prompt": "Does the disadvantaged person's improvement have greater moral value?", "answer": "No. Equal gains in actual well-being have equal moral value, regardless of who receives them.", "explanation": "Honestly depends more on the circumstances. Why is this person disadvantaged? But generally I’d say equal moral value.", "importance": 2}, "P17": {"title": "What makes a right fundamental?", "prompt": "What is the deepest justification for giving certain rights special protection?", "answer": "Human dignity and autonomy: people must not be treated merely as instruments.", "explanation": "", "importance": 4}, "P18": {"title": "Can economic liberty be restricted for social welfare?", "prompt": "Is there a fundamental rights-based objection to this policy, even if its welfare benefits exceed its costs?", "answer": "No. Property rights matter, but ordinary taxation is not comparable to violating fundamental civil liberties.", "explanation": "", "importance": 4}, "P19": {"title": "Democratic legitimacy versus constitutional rights", "prompt": "Should the court strike it down?", "answer": "Absolutely. Fundamental rights constrain even overwhelming democratic majorities.", "explanation": "Must prevent tyranny of the majority.", "importance": 5}, "P20": {"title": "Universal moral worth versus obligations to citizens", "prompt": "Which would you favor?", "answer": "A. The public resources of a country should primarily benefit its own citizens.", "explanation": "Government takes money from its citizens to function. The spending of those funds should prioritize helping the citizens of that country. I think citizens of a country can be helped by giving aid to others if part of a larger policy prescription", "importance": 5}, "P21": {"title": "Judicial power and democratic accountability", "prompt": "What is your preferred balance between judicial authority and democratic government?", "answer": "Strong judicial review, including robust protection of rights against majorities", "explanation": "Judicial review should ensure protect of rights of individuals", "importance": 4}, "P22": {"title": "Nationalism, patriotism, and political identity", "prompt": "What should hold a political community together?", "answer": "A substantive national culture and historical identity are important alongside civic principles", "explanation": "Shared civic principals are a requirement of a functioning democratic society. Strong national culture is important as well for social trust and cohesion. State should cultivate and preserve national identity via reasonable assimilation requirements and immigration regulations.", "importance": 5}, "P23": {"title": "The welfare state and positive rights", "prompt": "Which approach best captures your view?", "answer": "There is a strong public obligation to guarantee a decent minimum, though not every service is an absolute right", "explanation": "", "importance": 4}, "P24": {"title": "Religion, pluralism, and public institutions", "prompt": "How much accommodation should liberal society provide?", "answer": "Broad accommodation for adults, but stronger common standards for institutions educating children", "explanation": "", "importance": 3}, "P25": {"title": "Foreign policy: Liberal ideals versus strategic restraint", "prompt": "What principle should guide your country's response?", "answer": "Apply meaningful pressure, but balance it with security interests and the likely effectiveness of sanctions", "explanation": "", "importance": 5}, "P26": {"title": "Markets, regulation, and the burden of proof", "prompt": "Where should the burden of proof lie?", "answer": "Neither side deserves a presumption; assess expected benefits, harms, and uncertainty symmetrically", "explanation": "", "importance": 2}, "P27": {"title": "Concentrated private power", "prompt": "How should government respond?", "answer": "Intervene only where demonstrable consumer harm or identifiable market failures exist", "explanation": "", "importance": 4}, "P28": {"title": "Free speech and harmful expression", "prompt": "Would such suppression be morally legitimate?", "answer": "Possibly, if sufficiently compelling evidence establishes substantial societal harm", "explanation": "", "importance": 4}, "P29": {"title": "Capitalism and worker power", "prompt": "Which approach is closest to your preference?", "answer": "Maintain private enterprise, with targeted measures promoting competition and worker mobility", "explanation": "", "importance": 3}, "P30": {"title": "Public order versus civil liberties", "prompt": "What should government prioritize?", "answer": "Give public order and residents' ordinary freedom of movement comparable weight to protest rights", "explanation": "Protest rights shouldn’t significant infringe on individual liberties.", "importance": null}, "P31": {"title": "Healthcare and the welfare state", "prompt": "Which arrangement are you more inclined to support?", "answer": "Universal public insurance if evidence shows it performs better, but without an intrinsic preference for public provision", "explanation": "Healthcare for lower income citizens is an important issue and I believe everyone deserves access to a basic minimum of care. Implementation and costs significantly matter here", "importance": 3}, "P32": {"title": "Housing, local democracy, and property rights", "prompt": "How should government respond?", "answer": "Substantially liberalize construction while retaining limited local safeguards", "explanation": "Original homeowners should have some say in policy. However severe housing shortages are a threat to societal stability and government has an obligation for its citizens to be housed", "importance": 3}, "P33": {"title": "Climate change and economic growth", "prompt": "What policy approach would you favor?", "answer": "A strong carbon-pricing framework combined with targeted public investment and carefully justified regulation", "explanation": "Climate change is an existential threat to society today and in the future. Gov has an obligation to prevent this harm. Government should regulate and use market forces such as carbon taxes and subsidies for energy alternatives to promote investment.", "importance": 5}, "P34": {"title": "Crime, punishment, and the rule of law", "prompt": "What should be the principal orientation of criminal-justice policy?", "answer": "Combine credible enforcement and accountability with substantial rehabilitation and prevention", "explanation": "", "importance": 4}, "P35": {"title": "International security and military intervention", "prompt": "What principle should guide the decision?", "answer": "Support the threatened democracy if the strategic outlook and expected consequences justify the risks", "explanation": "", "importance": 4}, "U1": {"title": "Federal taxation", "prompt": "Which general direction would you take federal tax policy over the next decade?", "answer": "Keep the overall tax burden broadly similar, but simplify the code and close loopholes", "explanation": "Death tax should be higher. Majority of loopholes must be closed. Tax burden should be relatively the same except for a society where there richest are richest by a wide margin. In that circumstance, more tax burden should be levied.", "importance": 5}, "U2": {"title": "Federal spending and deficits", "prompt": "The United States faces persistent fiscal deficits, rising debt-service costs, and pressure to finance healthcare, retirement benefits, defense, and other priorities. What would you prioritize?", "answer": "Make deficit reduction a central priority through meaningful spending reforms and some revenue measures", "explanation": "Dangerous deficit spending is an existential threat to society. Gov has an obligation to prevent this.", "importance": 5}, "U3": {"title": "Minimum wage and labor markets", "prompt": "What minimum-wage policy would you support?", "answer": "Keep the federal floor relatively modest and leave most increases to states and cities", "explanation": "Market forces should be allowed to guide minimum wage.", "importance": 2}, "U4": {"title": "Business regulation and competition", "prompt": "How would you change US economic regulation, including antitrust enforcement?", "answer": "Strengthen antitrust enforcement while simplifying unnecessarily burdensome regulations", "explanation": "", "importance": 3}, "U5": {"title": "Healthcare system", "prompt": "Which healthcare arrangement would you favor for the United States?", "answer": "A universal public option with automatic or near-universal coverage while retaining private insurers", "explanation": "Private market should be highly regulated. Universal public option should be quality enough to compete with private insurance. Universal coverage should be a requirement", "importance": 4}, "U6": {"title": "Legal immigration levels", "prompt": "What would you do with the number of people admitted legally to the United States for permanent residence, including family-, employment-, and humanitarian-based categories?", "answer": "Reduce overall legal immigration, prioritizing applicants with high economic contributions", "explanation": "US is at a high polarization point with a lack of unifying culture which significantly threatens the country’s cohesion. However low birth rates make immigration vital to future growth. We should prioritize high value skilled English speaking immigrants with democratic values while allowing traditional legal refugees (not economic migrants) into the country to help fill some of the low value jobs citizens usually are too qualified for. Illegal immigration should be quashed and violators deported. Birthright citizenship should be abolished for illegal immigrant parents but for legal immigrants should be upheld.", "importance": 5}, "U7": {"title": "Unauthorized immigration and enforcement", "prompt": "What should US policy prioritize for people currently living in the country without legal immigration status?", "answer": "Enforce borders rigorously and increase removals, with legalization confined to narrowly defined groups", "explanation": "New illegal immigration must be aggressively stopped as top priority. Immediate deportation for any illegal immigrants who are convicted of a crime. Birthright citizenship should be ended if both parents do not have legal status. Deportations of existing residents who consume public benefits. No path to legal residency for those who entered illegally with exceptions for children under age 18.", "importance": 5}, "U8": {"title": "Policing and public disorder", "prompt": "Suppose a major American city experiences persistent shoplifting, public drug use, transit disorder, and other low-level offenses, alongside more serious violent crime. What would you do?", "answer": "Substantially increase police presence, arrests, prosecution, and penalties to restore order", "explanation": "This public disorder is a governmental failure and encroaches on the ability of law abiding citizens to live freely & peacefully. Gov should crackdown and enforce laws even if it means conviction increases substantially. However jail time should ultimately guide ppl to rehabilitation", "importance": 5}, "U9": {"title": "Criminal sentencing and incarceration", "prompt": "Which broad change would you support to American sentencing policy?", "answer": "Increase penalties and use incarceration more extensively, especially for repeat offenders", "explanation": "Time between arrest and jail should be cut down significantly. Laws should be aggressively enforced and penalties should increase for repeat offenders. However incarceration should provide genuine opportunities for rehabilitation and integration back into society for nonviolent criminals.", "importance": 5}, "U10": {"title": "Drugs and addiction", "prompt": "Which approach would you support toward adult recreational drug use, including substances with high addiction and overdose risks?", "answer": "Legalize cannabis, expand treatment and harm reduction, but retain criminal penalties for possession of the most dangerous drugs", "explanation": "", "importance": 3}, "U11": {"title": "Energy and electricity production", "prompt": "US energy policy must balance electricity affordability, reliability, emissions, and rapidly growing demand. Which approach would you implement?", "answer": "Rapidly prioritize clean energy, including regulation and subsidies that accelerate replacing fossil fuels", "explanation": "", "importance": 4}, "U12": {"title": "Environmental review and infrastructure permitting", "prompt": "Major housing, transit, energy, and transmission projects can face lengthy approval processes. Environmental reviews protect legitimate interests but may also delay construction and increase costs.", "answer": "Maintain existing safeguards but improve agency staffing and processing speed", "explanation": "Burden of proof rests on those seeking to impact the environment. Environmental protections are extremely important even if it means reduced growth", "importance": 5}, "U13": {"title": "K–12 education and school choice", "prompt": "Consider public-school funding, charter schools, private-school vouchers, teacher accountability, and family choice. What would be your main policy direction?", "answer": "Restrict private vouchers and charter expansion, concentrating resources in district public schools", "explanation": "Public schools suffer from increasing lack of funds. Parents should have choice between public schools but there should not be charter schools or private vouchers. If parents are unhappy with public options they can send their child to an accredited private institution", "importance": 5}, "U14": {"title": "College affordability and student loans", "prompt": "US policymakers must decide how to distribute higher-education costs among taxpayers, students, and institutions.", "answer": "I reject the framing of this question", "explanation": "Do not love the options. State gov has an obligation to provide public higher education with the means to access it via scholarships, merit aid, and loans without excessive interest or quick repayment expectation. Student loan debt should not be forgiven but before students are allowed to take on debt there should be multiple meetings and disclosures of the loan and future earning expectations.", "importance": 4}, "U15": {"title": "Industrial policy and domestic manufacturing", "prompt": "Should the US government use subsidies, tax credits, tariffs, or public procurement to expand domestic manufacturing in strategically important industries such as semiconductors, batteries, and advanced technology?", "answer": "Use targeted subsidies and public investment for genuinely strategic sectors, with performance requirements", "explanation": "", "importance": 5}, "U16": {"title": "Abortion policy", "prompt": "What federal policy would you favor regarding abortion access?", "answer": "Protect abortion access nationally through viability, with later exceptions for serious medical circumstances", "explanation": "Abortion care is a healthcare right. The state should not infringe upon healthcare rights. However abortion should not be allowed after the fetus can live outside the womb.", "importance": 5}, "U17": {"title": "Transgender rights and public policy", "prompt": "Which policy approach would you favor regarding gender identity, particularly legal recognition, school policies, sports participation, and medical treatment for minors?", "answer": "Protect adult private choices, but adopt relatively restrictive policies for minors, schools, and sex-separated settings", "explanation": "Adult choice should be respected", "importance": 3}, "U18": {"title": "Voting and election administration", "prompt": "Which general election-administration reforms would you support?", "answer": "Make voting broadly accessible, with standardized identification and safeguards against administrative error", "explanation": "ID should be required. Pro rank choice voting. However voting should be accessible.", "importance": 3}, "U19": {"title": "Federal bureaucracy and civil-service reform", "prompt": "How should the federal government change the way agencies recruit, evaluate, retain, and dismiss employees?", "answer": "Make it substantially easier to dismiss underperforming federal employees, restructure agencies, and tie advancement to measurable results", "explanation": "", "importance": 3}, "U20": {"title": "Social Security and Medicare fiscal reform", "prompt": "Assume long-run financing pressures require changes to major federal retirement and healthcare programs. Which direction would you prioritize?", "answer": "Combine additional revenue with gradual adjustments to benefits, eligibility, or payment systems", "explanation": "Society should not be subsidizing old age programs at the expense of future generations. If necessary benefits should be reduced slowly to protect spending on the young. However if tax loopholes were closed this wouldn’t be an issue.", "importance": 4}, "U21": {"title": "Defense spending and military strategy", "prompt": "How would you change US defense spending and force structure over the coming decade?", "answer": "Maintain a large, globally capable military, with selective modernization and efficiency reforms", "explanation": "Maintaining a strong military is important but “strong” means innovation", "importance": 4}, "U22": {"title": "NATO and American alliances", "prompt": "How should the United States approach NATO and other long-standing security alliances?", "answer": "Maintain strong alliances while requiring substantially greater allied defense contributions", "explanation": "NATO and other alliances are vital to protecting the peace and democracy in our world. The US should be a leader but should not encourage freeloading from allies", "importance": 5}, "U23": {"title": "China, trade, and economic security", "prompt": "How should the US manage economic relations with China?", "answer": "Adopt strong restrictions in strategic technologies while preserving significant ordinary trade", "explanation": "", "importance": 5}, "U24": {"title": "Military aid and foreign conflicts", "prompt": "Consider countries resisting military aggression but lacking a formal American defense guarantee. What should US assistance policy generally be?", "answer": "Provide meaningful assistance where it supports identifiable strategic interests and has a credible prospect of success", "explanation": "Meaningful assistance should be given to democracies even if at decent cost if there is a threat to US strategic interests. US should not protect governments that are undemocratic unless there is a significant national security threat", "importance": 5}, "U25": {"title": "National security and domestic surveillance", "prompt": "Suppose intelligence agencies argue that expanded surveillance authorities would improve their capacity to detect terrorism, foreign espionage, and other national-security threats. The proposed measures involve broader collection of Americans' communications data, with judicial oversight and periodic review.", "answer": "Permit narrowly targeted expansions where agencies can demonstrate specific operational needs", "explanation": "Important to protect individual rights while also protecting society as a whole. Distinction between surveillance on native citizens and immigrants or naturalized immigrants.  Judicial review should play an important role.", "importance": 4}}}</script>
<script>
(() => {
  const R = JSON.parse(document.getElementById("report-data").textContent);
  const app = document.getElementById("app");
  const FIX_KEY = "politype-fixes-" + R.slug;
  let fixes = {};
  try { fixes = JSON.parse(localStorage.getItem(FIX_KEY) || "{}"); } catch (e) {}

  // Tiny element builder. Text always goes through textContent.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }

  function evidence(ids) {
    if (!ids || !ids.length) return null;
    const d = h("details", { class: "ev" },
      h("summary", {}, "Based on", ...ids.map((id) => h("span", { class: "qid", text: id }))));
    const list = h("div", { class: "ev-list" });
    for (const id of ids) {
      const e = R.evidence[id]; if (!e) continue;
      const x = e.explanation ? (e.explanation.length > 420 ? e.explanation.slice(0, 420).trimEnd() + "…" : e.explanation) : null;
      list.append(h("div", { class: "ev-item" },
        h("span", { class: "q" }, h("span", { class: "code", text: id + "  " }), e.title),
        h("span", { class: "a", text: e.answer }),
        x && h("span", { class: "x", text: "“" + x + "”" })));
    }
    d.append(list);
    return d;
  }

  function fixControl(id, label) {
    const wrap = h("div", { class: "fix-box" });
    const btn = h("button", { class: "fix", type: "button", text: fixes[id] ? "Edit your correction" : "That's not what I meant" });
    btn.addEventListener("click", () => {
      if (wrap.querySelector("textarea")) return;
      const ta = h("textarea", { id: "fix-" + id, "aria-label": "Correction for " + label, placeholder: "What did you actually mean?" });
      ta.value = fixes[id]?.note || "";
      ta.addEventListener("input", () => {
        const note = ta.value.trim();
        if (note) fixes[id] = { finding: label, note }; else delete fixes[id];
        try { localStorage.setItem(FIX_KEY, JSON.stringify(fixes)); } catch (e) {}
        renderTray();
      });
      wrap.append(ta); ta.focus();
    });
    wrap.append(btn);
    return wrap;
  }

  function section(n, id, title, intro, ...body) {
    return h("section", { class: "s", id },
      h("div", { class: "s-head" }, h("span", { class: "n", text: n }), h("h2", { text: title })),
      intro && h("p", { class: "intro", text: intro }), ...body);
  }

  // First sentence as the visible gist; the rest goes behind "Show details".
  function split(text) {
    const m = (text || "").match(/^(.+?[.!?])(\s+[A-Z“"(].*)?$/s);
    return m ? [m[1], (m[2] || "").trim()] : [text || "", ""];
  }
  function card(cls, head, body) {
    return h("details", { class: "x " + cls }, h("summary", {}, ...head, h("span", { class: "more" }, h("span"))),
      h("div", { class: "body" }, ...body));
  }

  const P = R.portrait, S = R.stats;
  const name = R.respondent.name || "Anonymous";
  const head = R.tensions.find((t) => t.id === R.headline_tension);
  const CAT = { logical: "Logical contradiction", practical: "Practical tension", empirical: "Empirical vulnerability", unusual: "Unusual combination" };

  // 1. Portrait
  const portrait = h("div", { class: "portrait" },
    h("div", { class: "eyebrow code" }, h("span", { text: "POLITYPE · " + name.toUpperCase() }),
      h("span", { text: `${S.answered} ANSWERS · ${S.explained} EXPLAINED` })),
    h("div", { class: "portrait-top" },
      h("div", { class: "portrait-main" },
        h("h1", { text: P.archetype }),
        h("p", { class: "tagline", text: P.tagline }),
        h("p", { class: "summary", text: P.summary })),
      h("div", { class: "traits" }, P.traits.map((t) => h("div", { class: "t" }, h("b", { text: t.label }), h("span", { text: t.detail }))))),
    h("div", { class: "positions" }, P.signature_positions.map((p) => h("div", {}, h("b", { text: p.label }), h("span", { text: p.detail })))),
    head && h("div", { class: "headline" }, h("span", { class: "k", text: "Your sharpest tension" }), h("b", { text: head.title }), h("span", { text: split(head.detail)[0] }), h("a", { href: "#tensions", style: "font-size:13px;color:inherit", text: "See all tensions" })));

  const toc = h("nav", { class: "toc", "aria-label": "Report sections" },
    [["spectrum", "Spectrum"], ["affiliations", "Affiliations"], ["tensions", "Tensions"], ["blindspots", "Blind spots"], ["you", "Who you are"], ["evidence", "Why these findings"]]
      .map(([id, t]) => h("a", { href: "#" + id, text: t })));

  // Why-these-findings: portrait evidence, expandable
  const expandBtn = h("button", { class: "btn", type: "button", id: "expand-all", text: "Expand all" });
  expandBtn.addEventListener("click", () => {
    const open = expandBtn.textContent === "Expand all";
    document.querySelectorAll("details.x").forEach((d) => { d.open = open; });
    expandBtn.textContent = open ? "Collapse all" : "Expand all";
  });

  const why = section("07", "evidence", "Why these findings", "Each trait and position above comes from specific answers. Open one to see them.",
    h("div", { class: "cards" },
      ...P.traits.map((t, i) => card("finding", [h("h3", { text: t.label })], [h("p", { text: t.detail }), evidence(t.evidence), fixControl("trait-" + i, t.label)])),
      ...P.signature_positions.map((p, i) => card("finding", [h("h3", { text: p.label })], [h("p", { text: p.detail }), evidence(p.evidence), fixControl("position-" + i, p.label)]))));

  // 2. Spectrum
  const pct = (v) => ((v + 2) / 4) * 100;
  const axes = h("div", { class: "axes" }, R.axes.map((a) => {
    const track = h("div", { class: "track", role: "img", "aria-label": `${a.name}: ${a.score == null ? "not enough answers" : a.score.toFixed(2)} on a scale from -2 (${a.low}) to +2 (${a.high})` },
      h("div", { class: "line" }),
      ...[-2, -1, 0, 1, 2].map((v) => h("div", { class: "tick" + (v === 0 ? " mid" : ""), style: `left:${pct(v)}%` })),
      a.score != null && h("div", { class: "dot", style: `left:${pct(a.score)}%` }));
    return h("div", { class: "axis" },
      h("div", { class: "top" }, h("b", { text: a.name }), h("span", { text: a.score == null ? "Not enough answers" : `${a.score > 0 ? "+" : ""}${a.score.toFixed(2)} · ${a.n} answers` })),
      h("div", { class: "bar-wrap" }, track, h("div", { class: "ends" }, h("span", { text: a.low }), h("span", { text: a.high }))),
      evidence(a.evidence));
  }));
  const spectrum = section("02", "spectrum", "Your political spectrum",
    "Each axis runs from -2 to +2. Your position is the average of your answers that bear on it, scored with a fixed key, not by AI. Answers where you rejected the options do not count.", axes);

  // 3. Affiliations
  const A = R.affiliations;
  const AG = { agree: "Agree", partial: "Partial", disagree: "Disagree", unclear: "Unclear" };
  const partyCell = (c) => {
    if (!c) return h("td", {}, "");
    const srcs = (c.sources || []).map((s) => h("a", { href: s.url, target: "_blank", rel: "noopener", text: `${s.title}${s.date ? " (" + s.date + ")" : ""}` }));
    return h("td", {}, h("span", { class: "ag " + (c.agreement || "unclear"), text: AG[c.agreement] || "Unclear" }),
      (c.note || c.summary) && h("details", {}, h("summary", { text: "Why" }),
        c.note && h("span", { class: "note", text: c.note }),
        c.summary && h("p", {}, h("b", { text: "Documented position: " }), c.summary), ...srcs.map((a) => h("div", {}, a))));
  };
  const affil = section("03", "affiliations", "Your political and philosophical affiliations", null,
    h("div", { class: "cards" }, A.traditions.map((t, i) => card("finding",
      [h("h3", { text: t.name }), h("p", { class: "muted lead", text: t.definition })],
      [h("dl", { class: "fields" }, h("dt", { text: "Where you overlap" }), h("dd", { text: t.overlap }), h("dt", { text: "Where you differ" }), h("dd", { text: t.differences })),
       evidence(t.evidence), fixControl("tradition-" + i, t.name)]))),
    A.thinkers.length && h("div", { class: "finding" }, h("span", { class: "label-sm", text: "Thinkers you resemble" }),
      h("div", { class: "thinkers" }, A.thinkers.map((t) => card("", [h("b", { text: t.name + (t.cited_by_you ? " (you cite them)" : "") })], [h("p", { text: t.why })])))),
    A.party_rows.length && h("p", { class: "intro", text: A.party_summary }),
    A.party_rows.length && h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", { text: "Issue" }), h("th", { text: "You" }), h("th", { text: "Democrats" }), h("th", { text: "Republicans" }))),
      h("tbody", {}, A.party_rows.map((r) => h("tr", {}, h("td", {}, h("span", { class: "code", text: r.qid + " " }), r.issue), h("td", { text: r.your_position }), partyCell(r.D), partyCell(r.R)))))),
    A.party_as_of && h("p", { class: "muted", style: "font-size:13px", text: `Party positions are sourced and dated as of ${A.party_as_of}. They compare stated positions issue by issue. They are not a recommendation.` }));

  // 4. Tensions
  const tensions = section("04", "tensions", "Your internal tensions",
    "Each tension below was proposed, then checked against your own explanations by a second pass that tried to refute it. Where you had already reconciled two views, it says so.",
    h("div", { class: "cards" }, R.tensions.map((t) => { const [g, rest] = split(t.detail); return card("finding", [
      h("div", { class: "chips" }, h("span", { class: "chip", text: CAT[t.category] || t.category }),
        h("span", { class: "chip " + t.status, text: t.status === "stands" ? "Unresolved" : "You've reconciled this" })),
      h("h3", { text: t.title }), h("p", { class: "lead", text: g })], [
      rest && h("p", { text: rest }),
      t.status === "stands" && h("dl", { class: "fields" },
        h("dt", { text: "Why it matters" }), h("dd", { text: t.why_it_matters }),
        h("dt", { text: "What would resolve it" }), h("dd", { text: t.what_would_resolve })),
      evidence(t.evidence), fixControl("tension-" + t.id, t.title)]); })));

  // 5. Blind spots
  const blind = section("05", "blindspots", "Your potential blind spots",
    "Assumptions your answers rely on that deserve a second look. None of these say your position is wrong.",
    h("div", { class: "cards" }, R.blind_spots.map((b, i) => card("finding", [
      h("h3", { text: b.title }), h("p", { class: "lead", text: b.assumption })], [
      h("p", { text: b.detail }),
      h("dl", { class: "fields" },
        h("dt", { text: "Why it matters" }), h("dd", { text: b.why_it_matters }),
        h("dt", { text: "What would resolve it" }), h("dd", { text: b.what_would_resolve })),
      evidence(b.evidence), fixControl("blind-" + i, b.title)]))),
    R.open_questions.length && h("div", { class: "finding" }, h("span", { class: "label-sm", text: "Questions your answers leave open" }),
      h("ul", { class: "qs" }, R.open_questions.map((q) => h("li", { text: q })))));

  // 6. Who you are
  const Pr = R.profile;
  const you = section("06", "you", "What your answers suggest about you", Pr.material_note,
    h("p", { class: "profile-portrait", text: Pr.summary_portrait }),
    h("div", { class: "cards" }, Pr.sections.map((s, si) => h("div", { class: "finding" }, h("h3", { text: s.title }),
      h("div", { class: "sublist" },
        ...(s.strong || []).map((o, i) => { const [g, rest] = split(o.claim); return card("obs", [h("p", { text: g })],
          [rest && h("p", { text: rest }), o.quote && h("blockquote", { text: "“" + o.quote + "”" }), evidence(o.evidence), fixControl(`you-${si}-s${i}`, o.claim.slice(0, 80))]); }),
        (s.speculative || []).length && h("span", { class: "label-sm", text: "Speculative" }),
        ...(s.speculative || []).map((o, i) => { const [g, rest] = split(o.claim); return card("obs spec", [h("p", { text: g })],
          [rest && h("p", { text: rest }), evidence(o.evidence), fixControl(`you-${si}-p${i}`, o.claim.slice(0, 80))]); }))))));

  const footer = h("footer", {}, `Generated ${R.generated_at} from ${S.answered} answers and ${S.explained} written explanations. The spectrum is computed from a fixed scoring key. The written analysis is by Claude and cites the answers behind every finding. Use "That's not what I meant" on anything that misreads you, then send your corrections back.`);

  app.textContent = "";
  app.append(portrait, h("div", { class: "toolbar" }, toc, expandBtn), spectrum, affil, tensions, blind, you, why, footer);

  // Corrections tray
  function renderTray() {
    const n = Object.keys(fixes).length;
    document.getElementById("tray").hidden = !n;
    document.getElementById("trayText").textContent = `${n} correction${n === 1 ? "" : "s"} noted`;
  }
  document.getElementById("trayCopy").addEventListener("click", async (e) => {
    const text = JSON.stringify({ slug: R.slug, corrections: Object.entries(fixes).map(([id, f]) => ({ id, ...f })) });
    try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied. Send it back"; }
    catch (err) {
      const ta = document.getElementById("trayFallback");
      ta.value = text; ta.hidden = false; ta.select();
      e.target.textContent = "Select and copy the text";
    }
  });
  renderTray();
})();
</script>
</body></html>
