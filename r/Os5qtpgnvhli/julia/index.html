<style>
/* Layout: one reading column. A portrait sheet up top sized for a screenshot,
   then numbered report sections, each finding expandable to its evidence. */
:root {
  --paper: #EEF1F4;
  --sheet: #FBFCFD;
  --ink: #15233F;
  --muted: #5A6578;
  --rule: #CDD4DD;
  --mark: #0E6E5C;
  --mark-soft: #E2F1EC;
  --warn: #A1450E;
  --warn-soft: #F7E9DE;
  --agree: #0E6E5C;
  --partial: #8A6A10;
  --disagree: #A1450E;
  --font-q: "Newsreader", Georgia, "Times New Roman", serif;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
    --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
    --agree: #4FC1A4; --partial: #D9B65A; --disagree: #F0965A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1318; --sheet: #151C23; --ink: #E4E9EF; --muted: #98A3B3; --rule: #2B3540;
  --mark: #4FC1A4; --mark-soft: #16302A; --warn: #F0965A; --warn-soft: #3A2417;
  --agree: #4FC1A4; --partial: #D9B65A; --disagree: #F0965A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.wrap > *, section.s > * { min-width: 0; max-width: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6; }
.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 96px;
  display: flex; flex-direction: column; gap: 44px;
}
h1, h2, h3 { font-family: var(--font-q); font-weight: 500; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.code { font-family: var(--font-code); font-size: 12.5px; letter-spacing: 0.03em; }

/* Portrait sheet */
.portrait { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: clamp(22px, 5vw, 40px); display: flex; flex-direction: column; gap: 22px; }
.portrait .eyebrow { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); }
.portrait h1 { font-size: clamp(34px, 7.5vw, 54px); line-height: 1.04; letter-spacing: -0.02em; }
.portrait .tagline { font-family: var(--font-q); font-size: clamp(19px, 3.4vw, 22px); line-height: 1.45; font-style: italic; max-width: 40ch; }
.portrait .summary { max-width: 64ch; }
.traits { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; border-top: 1px solid var(--rule); padding-top: 18px; }
.traits .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.traits .t b { font-size: 14.5px; }
.traits .t span { font-size: 14px; color: var(--muted); line-height: 1.5; }
.positions { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
.positions div { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.positions b { display: block; font-size: 14.5px; }
.positions span { font-size: 13.5px; color: var(--muted); line-height: 1.45; display: block; }
.headline { background: var(--warn-soft); border-radius: 5px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.headline .k { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); }
.headline b { font-size: 15.5px; }
.headline span { font-size: 14.5px; }

/* Sections */
section.s { display: flex; flex-direction: column; gap: 18px; }
.s-head { display: flex; gap: 14px; align-items: baseline; border-bottom: 1.5px solid var(--ink); padding-bottom: 8px; }
.s-head .n { font-family: var(--font-code); color: var(--mark); font-size: 14px; }
.s-head h2 { font-size: clamp(24px, 4.6vw, 30px); }
.intro { color: var(--muted); max-width: 64ch; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
nav.toc a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
nav.toc a:hover { color: var(--ink); border-color: var(--ink); }

/* Findings */
.finding { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.finding h3 { font-size: 21px; line-height: 1.3; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
.chip.stands { color: var(--warn); border-color: var(--warn); background: transparent; }
.chip.reconciled { color: var(--mark); border-color: var(--mark); background: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
dl.fields { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 8px 16px; margin: 0; font-size: 14.5px; }
dl.fields dt { color: var(--muted); font-weight: 600; }
dl.fields dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { dl.fields { grid-template-columns: 1fr; gap: 2px; } dl.fields dd { margin-bottom: 8px; } }

/* Evidence */
details.ev { font-size: 14px; }
details.ev summary { cursor: pointer; color: var(--muted); list-style: none; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary::before { content: "+"; font-family: var(--font-code); width: 14px; }
details.ev[open] summary::before { content: "−"; }
details.ev summary .qid { font-family: var(--font-code); font-size: 12px; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink); }
.ev-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--rule); }
.ev-item { display: flex; flex-direction: column; gap: 2px; }
.ev-item .q { font-weight: 600; }
.ev-item .a { color: var(--mark); }
.ev-item .x { font-family: var(--font-q); font-size: 15.5px; color: var(--muted); font-style: italic; white-space: pre-line; }

/* Spectrum */
.axes { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
.axis { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.axis:last-child { border-bottom: none; }
.axis .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.axis .top b { font-size: 15px; }
.axis .top span { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { position: relative; height: 22px; }
.track .line { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule); }
.track .tick { position: absolute; top: 5px; width: 1px; height: 12px; background: var(--rule); }
.track .tick.mid { background: var(--muted); }
.track .dot { position: absolute; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--ink); border: 3px solid var(--sheet); box-shadow: 0 0 0 1.5px var(--ink); }
.ends { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); gap: 12px; }
.ends span:last-child { text-align: right; }

/* Party table */
.table-wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
th { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td .ag { font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.ag.agree { color: var(--agree); } .ag.partial { color: var(--partial); } .ag.disagree { color: var(--disagree); } .ag.unclear { color: var(--muted); }
td .note { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; }
td details summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
td details p { font-size: 13px; margin-top: 4px; }
td details a { color: var(--mark); font-size: 12.5px; word-break: break-word; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.profile-portrait { font-family: var(--font-q); font-size: 20px; line-height: 1.55; max-width: 60ch; }
.sublist { display: flex; flex-direction: column; gap: 14px; }
.obs { display: flex; flex-direction: column; gap: 4px; padding-left: 14px; border-left: 2px solid var(--mark); }
.obs.spec { border-left-style: dashed; border-left-color: var(--muted); }
.obs blockquote { margin: 0; font-family: var(--font-q); font-style: italic; color: var(--muted); }
.label-sm { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
ul.qs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-family: var(--font-q); font-size: 17px; }

/* Corrections */
.fix { align-self: flex-start; background: none; border: none; padding: 2px 0; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.fix-box { display: flex; flex-direction: column; gap: 8px; }
.fix-box textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px; min-height: 70px; resize: vertical; }
.tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--sheet);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 14.5px; z-index: 5; }
.tray button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--sheet); background: var(--sheet); color: var(--ink); cursor: pointer; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
.portrait-top { display: flex; flex-direction: column; gap: 22px; }
.portrait-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.axis .bar-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
/* Wide screens: use the width for side-by-side layouts, keep text lines readable. */
.intro, .portrait .summary, .finding p, dl.fields dd { max-width: 70ch; }
.cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 900px) {
  .portrait { padding: 48px 56px; }
  .portrait-top { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: start; }
  .portrait-top .traits { grid-template-columns: 1fr; border-top: none; padding-top: 0; }
  .positions { grid-template-columns: repeat(4, 1fr); }
  .cards { grid-template-columns: 1fr 1fr; }
  .axis { display: grid; grid-template-columns: 210px 1fr; gap: 6px 28px; align-items: center; }
  .axis .top { flex-direction: column; gap: 0; }
  .axis .bar-wrap { display: flex; flex-direction: column; gap: 4px; }
  .axis details.ev { grid-column: 2; }
}

/* Collapsible cards: the summary is the headline, the body holds the reasoning */
details.x > summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
details.x > summary::-webkit-details-marker { display: none; }
details.x > summary .more { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
details.x > summary .more::before { content: "+"; font-family: var(--font-code); }
details.x[open] > summary .more::before { content: "−"; }
details.x[open] > summary .more span::after { content: "Hide details"; }
details.x:not([open]) > summary .more span::after { content: "Show details"; }
details.x > .body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; margin-top: 2px; border-top: 1px dashed var(--rule); }
.lead { font-size: 15px; }
.toolbar { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.thinkers { display: flex; flex-direction: column; gap: 8px; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
</style>

t together only if that kind of private adult conduct is not a fundamental right. Your answer that \"laws should always apply uniformly\" does not settle this. A law can apply to everyone and still be written by the majority to restrict the minority's way of life.", "evidence": ["P13", "P19", "P17", "U17", "P24", "P21"], "why_it_matters": "Your strong support for judicial review against majorities depends on which personal choices count as fundamental rights and which can yield to majority culture.", "what_would_resolve": "A clear statement of which consensual adult choices are protected rights and which can be restricted for social cohesion, and what test separates them.", "status": "reconciled"}, {"id": "t4", "category": "logical", "title": "Equal treatment versus distinctions by origin", "detail": "You rate equal rights and impartial treatment under the law 5 out of 5. On admissions you write, \"No individual should be given less opportunity because of their individual birth circumstances.\" On surveillance, you call for a \"Distinction between surveillance on native citizens and immigrants or naturalized immigrants.\" Naturalized immigrants are citizens. Giving them weaker privacy protection than native-born citizens treats citizens differently by where they were born.", "evidence": ["P5", "P14", "P10", "U25"], "why_it_matters": "Your rejection of group-based admissions preferences rests on equal individual treatment, and the same principle would bar treating naturalized citizens or children differently by origin.", "what_would_resolve": "A statement of whether naturalized citizens would have the same legal protections as native-born citizens, and why a child's parents' status is not a birth circumstance in your sense.", "status": "reconciled"}, {"id": "t1", "category": "practical", "title": "Deficit reduction versus a long list of new spending", "detail": "You rate deficit reduction 5 out of 5 and call deficit spending \"an existential threat to society.\" You also back new federal spending: a universal public option, subsidies to rapidly replace fossil fuels, and subsidies for strategic industries. You want the overall tax burden to stay broadly similar. You do name ways to pay. You would slowly reduce retirement benefits if needed, raise the estate tax, close most loopholes, use a carbon tax, and tax the richest more when the gap is wide. The open question is whether those sources and cuts cover the new programs and still shrink the deficit.", "evidence": ["U2", "U1", "U5", "U11", "U15", "U20", "P33"], "why_it_matters": "Your claim that government can expand coverage and investment without raising the overall tax burden depends on how this conflict is settled.", "what_would_resolve": "A ranking of which programs you would cut or delay first if loophole closures and estate tax increases fell short of covering both the new spending and deficit reduction.", "status": "reconciled"}, {"id": "t5", "category": "practical", "title": "Rapid building versus keeping environmental review", "detail": "You want to rapidly replace fossil fuels and substantially liberalize housing construction. Both need many new projects approved quickly, including the power plants and transmission lines that clean energy needs. You also want to keep existing environmental safeguards. You say protections matter \"even if it means reduced growth\" and that the burden of proof rests on those seeking to impact the environment. Your answer to the conflict is better agency staffing and faster processing. That works only if staffing, not the safeguards themselves, is what slows these projects.", "evidence": ["U12", "U11", "P32", "P33"], "why_it_matters": "Whether your clean energy and housing goals can be met on the timeline you want depends on how much review you are willing to relax.", "what_would_resolve": "Evidence on whether better agency staffing and faster processing alone can clear the backlog of energy, transmission, and housing projects, or a statement of which safeguards you would trim if they cannot.", "status": "reconciled"}, {"id": "t2", "category": "empirical", "title": "Loopholes and estate taxes as the main revenue source", "detail": "On Social Security and Medicare you write that \"if tax loopholes were closed this wouldn’t be an issue.\" That is a factual claim: that closing loopholes raises enough money to cover the long-run shortfall in retirement programs. Across several answers, closing loopholes and raising the estate tax are your main way to raise money instead of much higher income taxes. If loophole closures raise less than you expect, you have said you would slowly reduce benefits to protect spending on the young.", "evidence": ["U20", "U1", "P6", "P2"], "why_it_matters": "Your preference for keeping income taxes roughly unchanged while protecting spending on the young depends on this assumption holding.", "what_would_resolve": "Revenue estimates for the specific loopholes you would close and the estate tax rate you would set, compared with the size of the retirement program shortfall and the deficit.", "status": "reconciled"}, {"id": "t6", "category": "empirical", "title": "Cutting immigration while needing workers and revenue", "detail": "You would reduce overall legal immigration, and you also write that \"low birth rates make immigration vital to future growth.\" You already weigh this trade-off openly. You put national cohesion first and try to protect growth by choosing high-skilled, English-speaking immigrants and admitting refugees for low-wage jobs. You chose to reduce total numbers, not just change the mix. The open question is factual: whether fewer but more skilled immigrants would add as much to growth and federal revenue as the current flow. That matters because you also rate deficit reduction 5 out of 5.", "evidence": ["U6", "P22", "U2", "U20"], "why_it_matters": "Your plan to protect spending on the young without large tax increases depends on enough future workers to fund retirement programs.", "what_would_resolve": "Projections of how a smaller, more skilled immigration flow would affect the worker to retiree ratio and federal revenue compared with current levels.", "status": "reconciled"}], "blind_spots": [{"title": "Birth circumstances count in some places, not others", "evidence": ["P14", "P5", "P15", "U6", "U7", "U25"], "assumption": "Your rule that no one should lose opportunity because of birth circumstances applies fully to people born to citizens, but not to naturalized citizens or to children born here to two unauthorized parents.", "why_it_matters": "Your positions on birthright citizenship and on surveillance of naturalized citizens depend on treating people differently because of their parents or their place of birth.", "what_would_resolve": "A clear statement of which people the equal-treatment principle covers, and why it stops at that line.", "detail": "On admissions you wrote, \"No individual should be given less opportunity because of their individual birth circumstances,\" and you rated equal treatment under law 5 out of 5. You also say government owes its obligations to its own citizens. That scope could explain some of your immigration views. It does not explain two others. First, you would end birthright citizenship when both parents lack legal status. Citizenship is the very thing being decided, and the deciding factor is the child's parents, which is a birth circumstance. You made an exception for children under 18 on legal residency, so you already see that children did not choose how they arrived. Second, on surveillance you draw a \"Distinction between surveillance on native citizens and immigrants or naturalized immigrants.\" A naturalized citizen is a citizen, so even your citizens-first scope does not separate them from native citizens. You have not said why equal treatment under law stops there."}, {"title": "Majority culture versus protection from the majority", "evidence": ["P19", "P21", "P4", "P13", "P28", "P24"], "assumption": "The majority can decide what the law permits, and promote its culture, without that power reaching the minority rights you want courts to protect.", "why_it_matters": "Your strong support for courts that override majorities rests on preventing majority tyranny, and your cultural positions give the majority more power over minorities.", "what_would_resolve": "A specific line between promoting a shared culture and restricting a minority's lawful, harmless way of life, applied to a few concrete cases.", "detail": "You cite \"tyranny of the majority\" twice, and you would strike down a ban on peaceful criticism of the government without hesitation. You also give adults broad religious accommodation. On a harmless minority way of life, you wrote \"Laws should always apply uniformly\" and \"State should promote social cohesion to majority culture.\" Uniform laws avoid targeting a minority by name. But the majority still writes those laws, and you chose an option that allows some legal limits on conduct that harms no one. On an offensive political movement, you said suppression could be legitimate if compelling evidence showed substantial harm. That is a speech restriction, and the same majority would decide what counts as harm. You have not said what keeps these powers from becoming the majority rule you reject in court cases."}, {"title": "Deficit alarm rests on closing loopholes", "evidence": ["U2", "U1", "U20", "P6", "U5", "U13", "U11", "U15", "U21"], "assumption": "Closing loopholes, a higher estate tax, and spending reforms can together cut deficits while keeping the overall tax burden similar and funding your new priorities.", "why_it_matters": "You call deficits an existential threat, and your plan to address them without large tax increases or deep cuts depends on this revenue existing.", "what_would_resolve": "Official estimates of how much revenue closing specific loopholes would raise, compared with the size of the deficit and the cost of a universal public option, more school funding, and a large military.", "detail": "You wrote \"Dangerous deficit spending is an existential threat to society\" and rated it 5 out of 5. You would pay for deficit reduction with spending reforms, gradual benefit adjustments, a higher estate tax, and closing loopholes, while keeping the overall tax burden broadly similar. On Social Security you wrote, \"However if tax loopholes were closed this wouldn’t be an issue.\" At the same time you want universal health coverage through a public option, more money for public schools, clean energy and industrial subsidies, and a large, globally capable military. You have not said which spending you would cut, or whether the revenue you name covers both the existing deficit and these new costs."}, {"title": "Strict environmental review versus building what you want", "evidence": ["U12", "U11", "P33", "P32", "P26"], "assumption": "Better agency staffing and faster processing, without changing the review rules, will be enough to build the clean energy and housing you want built quickly.", "why_it_matters": "Your goals of rapid clean energy and substantially more housing depend on projects getting approved, and your permitting position may work against them.", "what_would_resolve": "Data on how long environmental review and related lawsuits delay transmission lines, renewable projects, and dense housing, and how often they block them.", "detail": "You wrote \"Burden of proof rests on those seeking to impact the environment,\" rated 5 out of 5. You would keep existing safeguards and speed them up through better staffing, and you rejected even moderate streamlining. You accept reduced growth as the price of environmental protection. But two of your other goals are also about building. You want to replace fossil fuels rapidly, and you want to substantially liberalize housing construction. Transmission lines, solar and wind farms, and apartment buildings go through the same reviews and legal challenges. Here the trade-off is not growth against the environment. It is one environmental goal against another. You have not said what you would do if faster processing does not clear these projects quickly enough. On market regulation in general you also said neither side deserves a presumption, which is a different standard from the one you apply here."}, {"title": "Unexamined faith in more incarceration", "evidence": ["U8", "U9", "P34", "U2"], "assumption": "Longer sentences and more incarceration are worth their cost, and prisons can be made to deliver the rehabilitation you require of them.", "why_it_matters": "Your strongest criminal justice positions, both rated 5 out of 5, depend on harsher penalties working and on prisons actually rehabilitating people.", "what_would_resolve": "Research comparing the effect of longer sentences with the effect of faster and more certain punishment on crime, plus recidivism rates for people released from prison.", "detail": "On policing and sentencing you chose the toughest options, saying government should enforce laws \"even if it means conviction increases substantially.\" On criminal justice in general you chose a balance of enforcement with substantial rehabilitation. You require that jail \"should ultimately guide ppl to rehabilitation.\" You rated deficits an existential threat, but you did not weigh what more incarceration would cost. Your main concrete proposal is cutting the time between arrest and jail, which is about the speed and certainty of punishment. You passed over the option that focused on certainty without raising severity. You have not said why longer sentences are needed on top of faster punishment, or what you would do if prisons do not rehabilitate."}], "open_questions": ["You say markets should generally be the default, but you would end charter schools and private vouchers. What makes K-12 education different from the other areas where you prefer markets?", "You call abortion care a healthcare right the state should not infringe, and you favor restrictive policies on medical treatment for minors in gender identity cases. How do you decide when the state may limit a medical choice?", "You would ideally have an independent body acting on \"true science\" to prevent disaster. Who would decide what counts as true science, and what would stop that body from being captured by one side?"], "affiliations": {"traditions": [{"name": "Classical liberalism (constitutional strand)", "definition": "Classical liberalism holds that government exists to protect individual rights under impartial laws, with written limits that even majorities cannot override.", "overlap": "You define justice as equal rights and impartial treatment under the law, and you rated it 5. You want courts to strike down a popular law banning criticism of government because it is needed to \"prevent tyranny of the majority.\" You back strong judicial review and ground rights in human dignity. You reject group preferences in admissions and say unequal outcomes are not unjust in themselves. You make markets the default, with government fixing identifiable failures.", "differences": "Classical liberals usually stop the state at the harm principle, the idea that only harm to others justifies restricting someone. You go further. You would allow some legal limits on a consensual minority way of life and want the state to \"promote social cohesion to majority culture.\" You would possibly allow suppressing offensive political movements. You would cap gambling and ban most hard drugs for adults. You put national citizens far ahead of foreigners in public spending.", "evidence": ["P5", "P19", "P21", "P17", "P10", "P14", "P7", "P13", "P28", "P8", "P20"]}, {"name": "Liberal nationalism", "definition": "Liberal nationalism holds that liberal democracy works best when citizens share a national culture, and that a state owes special duties to its own citizens.", "overlap": "You say a substantive national culture matters alongside civic principles, and that the state should preserve it through assimilation requirements and immigration rules. You say a government's obligation is to \"their citizen welfare only.\" You would spend $10 billion on moderate domestic benefits over larger gains abroad. You want lower legal immigration focused on skilled immigrants with democratic values, because you see weak shared culture as a threat to cohesion. All of these were rated 5.", "differences": "Liberal nationalists such as Yael Tamir usually pair national identity with generous welfare and room for minority cultures. You favor only modest redistribution and would let the state restrict some minority ways of life. Your enforcement views are stricter than most of the tradition. You want removals of unauthorized residents who use public benefits and an end to birthright citizenship for children of two unauthorized parents.", "evidence": ["P22", "P15", "P20", "U6", "U7", "P6", "P13"]}, {"name": "The social market economy", "definition": "The social market economy, from postwar Germany, uses competitive private markets as the engine of the economy, with the state enforcing competition, guaranteeing a social minimum, and keeping public finances sound.", "overlap": "You keep private enterprise and favor measures that promote competition and worker mobility. You want stronger antitrust enforcement alongside simpler regulation. You see a strong public duty to guarantee a decent minimum, and you back a universal public option that competes with private insurers. You make deficit reduction a central priority and call deficit spending \"an existential threat to society.\" You prefer carbon pricing as a market tool for climate.", "differences": "The tradition's founders preferred general rules over targeted state support for chosen industries. You back targeted subsidies for strategic sectors and subsidies that speed the replacement of fossil fuels. You would also intervene against large firms only where consumer harm or market failure is shown, which is narrower than the tradition's concern with concentrated private power.", "evidence": ["P29", "U4", "P23", "U5", "U2", "P33", "U15", "U11", "P27"]}, {"name": "Burkean conservatism", "definition": "Burkean conservatism, after Edmund Burke, favors slow reform of inherited institutions because they hold the lessons of past generations.", "overlap": "You want traditions reformed gradually, and only with \"significant collective approval over time.\" You give public order weight equal to protest rights. You want a substantial increase in police presence, arrests, and penalties to restore order, and you rated it 5. You see a shared national culture as a source of social trust.", "differences": "Burkean conservatives tend to defer to inherited moral norms. On abortion you take a national rights-based view, protecting access through viability as a healthcare right. You protect adult choices on gender identity. You treat climate change as an existential threat that justifies strong intervention. You also give courts strong power over elected majorities, which Burkeans often view with more caution.", "evidence": ["P4", "P30", "U8", "P22", "U16", "U17", "P33", "P21"]}], "thinkers": [{"name": "Alexis de Tocqueville", "why": "You twice use his phrase \"tyranny of the majority,\" and like him you pair firm limits on majorities with concern for shared customs that hold a democracy together.", "cited_by_you": false, "evidence": ["P4", "P19", "P21", "P22"]}, {"name": "Friedrich Hayek", "why": "Hayek defended markets and impartial general rules over engineered outcomes while still accepting a guaranteed minimum, which matches your mix of rule-of-law justice, market defaults, and a decent public minimum.", "cited_by_you": false, "evidence": ["P5", "P10", "P7", "P23"]}, {"name": "David Miller", "why": "Miller argues that citizens owe special duties to fellow nationals and that states may control immigration to protect a shared public culture, which is close to your citizens-first and assimilation views.", "cited_by_you": false, "evidence": ["P15", "P20", "P22", "U6"]}], "party_summary": "You agree with Democrats on clean energy, abortion through viability, public schools over vouchers, targeted industrial policy, defense levels, and China trade. You agree with Republicans on the minimum wage, reducing legal immigration, policing, sentencing, civil-service firing, and allied defense spending. Neither party fully matches you on deficit reduction as a central priority, keeping environmental review intact, a universal public option, or pairing new revenue with gradual benefit changes for Social Security and Medicare.", "party_rows": [{"qid": "U1", "issue": "Federal taxation", "your_position": "Keep the overall burden similar, close most loopholes, and raise estate taxes.", "D": {"agreement": "partial", "note": "Democrats also target loopholes and inherited gains, but they want a substantial tax increase on high earners and corporations.", "summary": "The 2024 Democratic platform calls for a 25 percent minimum income tax on billionaires, taxing capital gains of millionaires at the same rate as wages, ending the stepped-up basis and carried interest loopholes, and raising the corporate rate from 21 to 28 percent. It pledges no tax increase for anyone earning under $400,000 and uses the revenue for families, health care, and child care.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans cut taxes and made the 2017 rates permanent, while you want a similar burden with higher estate taxes.", "summary": "The 2024 Republican platform pledges to make the 2017 Trump tax cuts permanent, end taxes on tips, and pursue additional tax cuts. The 2025 reconciliation law (Public Law 119-21) made the 2017 individual rates permanent and added new deductions, which the Congressional Budget Office scores as a $4.5 trillion revenue reduction over ten years.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "CBO: Effects on Deficits and the Debt of Public Law 119-21", "url": "https://www.cbo.gov/publication/61466", "date": "2025"}]}}, {"qid": "U2", "issue": "Federal spending and deficits", "your_position": "Make deficit reduction a central priority through spending reform and some new revenue.", "D": {"agreement": "partial", "note": "Democrats pair new spending with taxes on the wealthy and treat deficit reduction as a byproduct, not a central goal.", "summary": "The 2024 Democratic platform pairs new investment in families, health care, and climate with higher taxes on the wealthy and corporations, and says this will reduce the deficit. It opposes adding to the debt for tax cuts. It does not propose broad spending cuts.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans promise spending cuts, but their main 2025 law added about $3.4 trillion to deficits.", "summary": "The 2024 Republican platform promises to rein in wasteful federal spending and restore fiscal sanity. In practice, the 2025 reconciliation law adds about $3.4 trillion to deficits over 2025 to 2034 by Congressional Budget Office estimates, while cutting Medicaid and other spending. Congress also passed a $9 billion rescissions package in July 2025.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "CBO: Effects on Deficits and the Debt of Public Law 119-21", "url": "https://www.cbo.gov/publication/61466", "date": "2025"}, {"title": "ICAEW: Chart of the week, One Big Beautiful Bill Act 2025 (summarizes CBO estimate)", "url": "https://www.icaew.com/insights/viewpoints-on-the-news/2025/jul-2025/chart-of-the-week-one-big-beautiful-bill-act-2025", "date": "2025-07"}, {"title": "Rep. Tokuda: vote against Rescissions Act cuts to public broadcasting and foreign aid", "url": "https://tokuda.house.gov/media/in-the-news/tokuda-and-case-vote-against-cuts-to-public-broadcasting-foreign-aid", "date": "2025-07-21"}]}}, {"qid": "U3", "issue": "Minimum wage", "your_position": "Keep the federal floor modest and leave most increases to states and cities.", "D": {"agreement": "disagree", "note": "Democrats want a federal minimum of $15 to $17 an hour, indexed to inflation.", "summary": "The 2024 Democratic platform pledges to raise the federal minimum wage to at least $15 an hour. In April 2025 congressional Democrats reintroduced the Raise the Wage Act, which would lift the federal minimum to $17 by 2030 and then index it, with more than 140 House Democratic cosponsors.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Pelosi joins House Democrats introducing Raise the Wage Act of 2025", "url": "https://pelosi.house.gov/news/press-releases/pelosi-joins-house-democrats-introducing-bill-raise-minimum-wage", "date": "2025-04"}, {"title": "House Education and Workforce Democrats: Labor leaders introduce bill to raise minimum wage", "url": "https://democrats-edworkforce.house.gov/media/press-releases/labor-leaders-introduce-bill-to-raise-minimum-wage", "date": "2025-04-08"}]}, "R": {"agreement": "agree", "note": "Republicans have kept the federal floor at $7.25, which matches your position.", "summary": "The 2024 Republican platform does not address the minimum wage. The federal floor has stayed at $7.25 under Republican control of Congress and the White House. Senator Josh Hawley, a Republican, introduced a bipartisan bill in June 2025 to raise it to $15 and index it, but he is described as a rare Republican on this issue.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Sen. Hawley: Hawley, Welch introduce legislation to increase federal minimum wage to $15", "url": "https://www.hawley.senate.gov/hawley-welch-introduce-legislation-to-increase-federal-minimum-wage-to-15-per-hour", "date": "2025-06-10"}, {"title": "Pelosi joins House Democrats introducing Raise the Wage Act of 2025", "url": "https://pelosi.house.gov/news/press-releases/pelosi-joins-house-democrats-introducing-bill-raise-minimum-wage", "date": "2025-04"}]}}, {"qid": "U4", "issue": "Business regulation and antitrust", "your_position": "Strengthen antitrust enforcement while simplifying burdensome regulations.", "D": {"agreement": "partial", "note": "Democrats match your stronger antitrust stance but expand regulation rather than simplify it.", "summary": "The 2024 Democratic platform praises the Biden administration's increased antitrust enforcement by the Justice Department and Federal Trade Commission, its Competition Council, a ban on non-compete agreements, and a crackdown on junk fees. It pledges to keep using antitrust law against hospital, insurance, drug, and media mergers.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans match your wish to cut regulation but pursue broad deregulation with only selective antitrust cases.", "summary": "The 2024 Republican platform promises to slash regulations. Executive Order 14192 (January 2025) requires agencies to repeal ten rules for each new one. The administration has also continued the large antitrust cases against Google and Meta that began under prior administrations.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House fact sheet: 10-to-1 deregulation initiative (Executive Order 14192)", "url": "https://www.whitehouse.gov/fact-sheets/2025/01/fact-sheet-president-donald-j-trump-launches-massive-10-to-1-deregulation-initiative/", "date": "2025-01-31"}, {"title": "Technology Policy Institute: After Google and Meta, what comes next for antitrust policy", "url": "https://techpolicyinstitute.org/publications/antitrust-and-competition/after-google-and-meta-what-comes-next-for-antitrust-policy-with-jon-nuechterlein-and-bill-kovacic/", "date": "2025"}]}}, {"qid": "U5", "issue": "Healthcare system", "your_position": "A universal public option with near-universal coverage, keeping private insurers.", "D": {"agreement": "partial", "note": "The party mainly builds on the Affordable Care Act, though a large faction wants single-payer, which sits next to your option.", "summary": "The 2024 Democratic platform says health care is a right and pledges to protect and build on the Affordable Care Act, keep the expanded premium tax credits, and extend drug price caps. In January 2026 House Democrats, joined by 17 Republicans, passed a three-year extension of the expanded credits, which expired at the end of 2025.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "Ballotpedia News: House passes three-year extension of expanded ACA subsidies", "url": "https://news.ballotpedia.org/2026/01/12/house-passes-three-year-extension-of-expanded-aca-subsidies/", "date": "2026-01-12"}, {"title": "Rep. Jayapal: Jayapal, Sanders, Dingell introduce Medicare for All Act", "url": "https://jayapal.house.gov/2025/04/29/jayapal-sanders-dingell-hundreds-of-health-care-workers-introduce-medicare-for-all", "date": "2025-04-29"}]}, "R": {"agreement": "disagree", "note": "Republicans favor a market-led system and cut Medicaid spending in 2025.", "summary": "The 2024 Republican platform promises more transparency, choice, and competition in health care and to protect Medicare. The 2025 reconciliation law added Medicaid work requirements and cut federal Medicaid spending. In January 2026 President Trump proposed the Great Healthcare Plan, which would send subsidy money to individuals for health savings accounts instead of to insurers.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "Morgan Lewis: One Big Beautiful Bill Act key final Medicaid changes explained", "url": "https://www.morganlewis.com/pubs/2025/07/one-big-beautiful-bill-act-key-final-medicaid-changes-explained", "date": "2025-07"}, {"title": "White House: President Trump unveils the Great Healthcare Plan", "url": "https://www.whitehouse.gov/releases/2026/01/president-trump-unveils-the-great-healthcare-plan-to-lower-costs-and-deliver-money-directly-to-the-people", "date": "2026-01-15"}, {"title": "Ballotpedia News: House passes three-year extension of expanded ACA subsidies", "url": "https://news.ballotpedia.org/2026/01/12/house-passes-three-year-extension-of-expanded-aca-subsidies/", "date": "2026-01-12"}]}}, {"qid": "U6", "issue": "Legal immigration levels", "your_position": "Reduce legal immigration and favor skilled applicants, while keeping traditional refugees.", "D": {"agreement": "disagree", "note": "Democrats want more family and employment visas and over 100,000 refugees a year.", "summary": "The 2024 Democratic platform calls on Congress to increase the number of family-sponsored and employment-based immigrant visas so people do not wait decades. It highlights rebuilding refugee admissions to over 100,000 a year.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "The platform matches your option, though 2025 refugee cuts go further than your support for traditional refugees.", "summary": "The 2024 Republican platform calls for merit-based immigration and an end to chain migration. In office, the administration set the fiscal 2026 refugee ceiling at a record-low 7,500 (later raised to 17,500), added a $100,000 fee to new H-1B worker visas, and in January 2026 paused immigrant visa issuance for nationals of 75 countries.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Presidential Determination on Refugee Admissions for Fiscal Year 2026 (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/presidential-determination-refugee-admissions-for-fiscal-year-2026", "date": "2025-09-30"}, {"title": "CRS: U.S. Refugee Admissions Program in FY2025 and FY2026", "url": "https://www.everycrsreport.com/reports/IF13277.html", "date": "2026-07-28"}, {"title": "White House proclamation: Restriction on Entry of Certain Nonimmigrant Workers ($100,000 H-1B fee)", "url": "https://www.whitehouse.gov/presidential-actions/2025/09/restriction-on-entry-of-certain-nonimmigrant-workers/", "date": "2025-09-19"}, {"title": "Mintz: State Department suspends immigrant visa processing for 75 countries", "url": "https://www.mintz.com/insights-center/viewpoints/2806/2026-01-29-state-department-suspends-immigrant-visa-processing-75", "date": "2026-01-29"}]}}, {"qid": "U7", "issue": "Unauthorized immigration", "your_position": "Enforce borders rigorously and increase removals, with legal status only for those who arrived as children.", "D": {"agreement": "partial", "note": "Democrats back more border agents and status for Dreamers, but also a path for most long-term residents, which you reject.", "summary": "The 2024 Democratic platform backs the 2024 bipartisan border deal, more border agents and immigration judges, and a pathway to citizenship for Dreamers, farmworkers, care workers, and other long-term undocumented residents. In February 2026 Democratic leaders Hakeem Jeffries and Chuck Schumer conditioned Homeland Security funding on limits for immigration agents, such as judicial warrants to enter homes, no masks, and body cameras.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "News4Jax (AP): What Democrats are demanding in the fight over ICE funding", "url": "https://www.news4jax.com/news/politics/2026/02/04/what-democrats-are-demanding-in-the-fight-over-immigration-and-customs-enforcement-funding/", "date": "2026-02-04"}]}, "R": {"agreement": "partial", "note": "Republicans share your enforcement priority but seek mass deportation beyond the criminal and benefit-using groups you name.", "summary": "The 2024 Republican platform promises the largest deportation program in American history, to finish the border wall, and to invoke the Alien Enemies Act against suspected gang members. The 2025 reconciliation law funded large increases in immigration enforcement and detention.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "News4Jax (AP): What Democrats are demanding in the fight over ICE funding", "url": "https://www.news4jax.com/news/politics/2026/02/04/what-democrats-are-demanding-in-the-fight-over-immigration-and-customs-enforcement-funding/", "date": "2026-02-04"}]}}, {"qid": "U8", "issue": "Policing and public disorder", "your_position": "Substantially increase police presence, arrests, prosecution, and penalties.", "D": {"agreement": "partial", "note": "Democrats fund more police but pair enforcement with accountability rules and violence prevention programs.", "summary": "The 2024 Democratic platform says to fund the police, not defund them. It backs 100,000 more officers for accountable community policing, $5 billion for community violence intervention, action against retail crime, and passage of the George Floyd Justice in Policing Act.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "Republicans favor an aggressive crackdown, which matches your option.", "summary": "The 2024 Republican platform promises to replenish police departments, protect officers from lawsuits, and stand up to progressive prosecutors. In August 2025 President Trump declared a crime emergency in Washington, D.C., took control of its police, deployed the National Guard, and ordered moves against cashless bail nationwide.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Declaring a Crime Emergency in the District of Columbia", "url": "https://www.whitehouse.gov/presidential-actions/2025/08/declaring-a-crime-emergency-in-the-district-of-columbia/", "date": "2025-08-11"}, {"title": "NPR: Trump signs executive orders focused on law and order in Washington, D.C.", "url": "https://npr.org/2025/08/26/nx-s1-5515695/trump-signs-executive-orders-focused-on-law-and-order-in-washington-d-c", "date": "2025-08-26"}]}}, {"qid": "U9", "issue": "Sentencing and incarceration", "your_position": "Increase penalties, especially for repeat offenders, with real rehabilitation in prison.", "D": {"agreement": "disagree", "note": "Democrats want less incarceration for nonviolent offenses.", "summary": "The 2024 Democratic platform supports rehabilitation and reentry, says no one should be jailed for marijuana possession, highlights Biden's commutations for nonviolent drug offenses, and pledges to end private prisons. It also funds more police and prosecutors for violent crime.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "Republicans favor tougher penalties, though they say less than you do about rehabilitation.", "summary": "The 2024 Republican platform promises to lock up violent offenders and crush gang violence. Executive Order 14164 (January 2025) directs the Attorney General to seek the death penalty in all appropriate federal cases and lifts the prior moratorium.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Executive Order 14164, Restoring the Death Penalty and Protecting Public Safety", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/restoring-the-death-penalty-and-protecting-public-safety/", "date": "2025-01-20"}]}}, {"qid": "U10", "issue": "Drugs and addiction", "your_position": "Legalize cannabis, expand treatment, and keep criminal penalties for the most dangerous drugs.", "D": {"agreement": "agree", "note": "The party file places Democrats at your option, though the platform does not explicitly call for federal legalization.", "summary": "The 2024 Democratic platform says no one should be in jail for using or possessing marijuana and pledges to expunge federal marijuana convictions. It backs drug courts, diversion, and treatment for substance use disorders while fighting fentanyl trafficking.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans favor broad prohibition, but the party is divided on cannabis.", "summary": "The 2024 Republican platform focuses on enforcement: a naval blockade against fentanyl, dismantling cartels, and drug-free schools. In December 2025, however, President Trump ordered the Attorney General to speed the move of marijuana from Schedule I to Schedule III for medical research, while saying this does not legalize it.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Increasing Medical Marijuana and Cannabidiol Research (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/12/increasing-medical-marijuana-and-cannabidiol-research/", "date": "2025-12-18"}, {"title": "Deseret News: Trump moves to reschedule marijuana", "url": "https://www.deseret.com/politics/2025/12/18/trump-reschedules-marijuana-drug-medical-use", "date": "2025-12-18"}]}}, {"qid": "U11", "issue": "Energy and electricity", "your_position": "Rapidly prioritize clean energy with regulation and subsidies to replace fossil fuels.", "D": {"agreement": "agree", "note": "Democrats back net-zero by 2050 and clean energy tax credits.", "summary": "The 2024 Democratic platform calls the Biden record the most aggressive climate agenda in history, backs net-zero emissions by 2050, and credits the Inflation Reduction Act's clean energy tax credits. It also points to record domestic energy production and pledges to cut oil and gas subsidies.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans prioritize fossil fuels and ended most wind and solar credits.", "summary": "The 2024 Republican platform promises to drill, end restrictions on oil, gas, and coal, and make America energy dominant, while unleashing all sources including nuclear. In 2025 the president declared a national energy emergency, and the reconciliation law ended wind and solar tax credits for most projects placed in service after 2027 while keeping nuclear and other credits.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Declaring a National Energy Emergency", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/declaring-a-national-energy-emergency/", "date": "2025-01-20"}, {"title": "White House: Unleashing American Energy (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/unleashing-american-energy/", "date": "2025-01-20"}, {"title": "Pierce Atwood: Congress phases out energy tax credits", "url": "https://www.pierceatwood.com/alerts/congress-phases-out-energy-tax-credits", "date": "2025-07"}, {"title": "White House: Reinvigorating the Nuclear Industrial Base (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/05/reinvigorating-the-nuclear-industrial-base/", "date": "2025-05-23"}]}}, {"qid": "U12", "issue": "Environmental review and permitting", "your_position": "Keep existing safeguards and speed reviews through better agency staffing.", "D": {"agreement": "partial", "note": "Democrats want moderate streamlining that keeps strong review, one step from your position.", "summary": "The 2024 Democratic platform pledges to improve and speed up environmental review and clean energy permitting and to build more transmission. It does not propose limiting legal challenges.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "E&E News: House approves permitting bill after tumultuous week", "url": "https://www.eenews.net/articles/house-approves-permitting-bill-after-tumultuous-week/", "date": "2025-12-18"}]}, "R": {"agreement": "disagree", "note": "Republicans passed a bill that exempts some projects and restricts court challenges.", "summary": "The 2024 Republican platform promises to streamline permitting. In December 2025 House Republicans passed the SPEED Act, which sets tighter deadlines, exempts some projects from review, and restricts judicial review under the National Environmental Policy Act.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "E&E News: House approves permitting bill after tumultuous week", "url": "https://www.eenews.net/articles/house-approves-permitting-bill-after-tumultuous-week/", "date": "2025-12-18"}]}}, {"qid": "U13", "issue": "K-12 education and school choice", "your_position": "Restrict vouchers and charters and concentrate resources in district public schools.", "D": {"agreement": "agree", "note": "Democrats oppose private school vouchers and focus funding on public schools.", "summary": "The 2024 Democratic platform focuses on public schools: more Title I funding, community schools, tutoring, and universal preschool. It does not mention charter schools or vouchers. In April 2026 Senate Democrats introduced a bill to repeal the federal scholarship tax credit created by the 2025 reconciliation law.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Ballotpedia News: Senate Democrats introduce bill to repeal federal education tax credit scholarship", "url": "https://news.ballotpedia.org/2026/04/24/senate-democrats-introduce-bill-to-repeal-federal-education-tax-credit-scholarship/", "date": "2026-04-24"}]}, "R": {"agreement": "disagree", "note": "Republicans support universal school choice and created a federal scholarship tax credit.", "summary": "The 2024 Republican platform supports universal school choice in every state, ending teacher tenure, and closing the federal Department of Education. The 2025 reconciliation law created the first federal tax credit, up to $1,700 per taxpayer, for donations to private school scholarship groups in states that opt in, and a March 2025 executive order directed steps to close the Education Department.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Ballotpedia News: Budget reconciliation bill enacts first federal private school choice program", "url": "https://news.ballotpedia.org/2025/07/10/budget-reconciliation-bill-enacts-first-federal-private-school-choice-program/", "date": "2025-07-10"}, {"title": "White House: Executive Order 14242, Improving Education Outcomes by Empowering Parents, States, and Communities", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/improving-education-outcomes-by-empowering-parents-states-and-communities/", "date": "2025-03-20"}]}}, {"qid": "U14", "issue": "College affordability and student loans", "your_position": "States should fund public colleges with aid and fair loans, with no debt forgiveness.", "D": {"agreement": "partial", "note": "Democrats share your support for more aid but keep pursuing student debt relief, which you oppose.", "summary": "The 2024 Democratic platform pledges to double the maximum Pell Grant by 2029, expand free community college, and keep pursuing student debt relief through every available tool after the Supreme Court blocked broad cancellation.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "partial", "note": "Republicans share your opposition to forgiveness but are cutting federal lending rather than expanding public support.", "summary": "The 2024 Republican platform promises to drive down tuition and support cheaper alternatives to four-year degrees. The 2025 reconciliation law ends Grad PLUS loans for new borrowers, caps Parent PLUS loans, replaces income-driven plans with a new Repayment Assistance Plan, and a 2025 executive order began closing the Education Department.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "AACRAO: A complete overhaul to the federal financial aid system", "url": "https://www.aacrao.org/news/a-complete-overhaul-to-the-federal-financial-aid-system/", "date": "2025"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}, {"title": "White House: Executive Order 14242, Improving Education Outcomes by Empowering Parents, States, and Communities", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/improving-education-outcomes-by-empowering-parents-states-and-communities/", "date": "2025-03-20"}]}}, {"qid": "U15", "issue": "Industrial policy and manufacturing", "your_position": "Targeted subsidies for strategic sectors, with performance requirements.", "D": {"agreement": "agree", "note": "Democrats back the CHIPS Act approach of targeted investment.", "summary": "The 2024 Democratic platform credits the CHIPS and Science Act and the Inflation Reduction Act with bringing home semiconductor and clean energy manufacturing and creating about 800,000 factory jobs. It favors targeted tariffs on Chinese goods over broad tariffs on allies.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "CBS News: Senate approves Democratic resolution to block Trump's tariffs on Canada", "url": "https://www.cbsnews.com/news/senate-trump-tariffs-canada", "date": "2025-10-29"}]}, "R": {"agreement": "partial", "note": "Republicans pursue broader industrial policy through wide tariffs, one step beyond your targeted approach.", "summary": "The 2024 Republican platform calls for baseline tariffs on foreign goods, Buy American rules, and making the US a manufacturing superpower. The administration imposed broad tariffs, took a 9.9 percent government stake in Intel in August 2025 by converting CHIPS Act grants, and after the Supreme Court struck down its emergency tariffs in February 2026 replaced them under other trade laws.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Al Jazeera: Trump says US to take 10 percent stake in Intel", "url": "https://www.aljazeera.com/economy/2025/8/22/trump-says-us-to-take-10-percent-stake-in-intel", "date": "2025-08-22"}, {"title": "Jones Day: United States Supreme Court invalidates IEEPA tariffs", "url": "https://www.jonesday.com/de/insights/2026/02/united-states-supreme-court-invalidates-ieepa-tariffs", "date": "2026-02"}, {"title": "Covington: IEEPA tariffs terminated, replacement Section 122 tariffs take effect", "url": "https://www.cov.com/en/news-and-insights/insights/2026/02/ieepa-tariffs-terminated-replacement-section-122-tariffs-take-effect", "date": "2026-02"}, {"title": "CBS News: Senate approves Democratic resolution to block Trump's tariffs on Canada", "url": "https://www.cbsnews.com/news/senate-trump-tariffs-canada", "date": "2025-10-29"}]}}, {"qid": "U16", "issue": "Abortion", "your_position": "Protect access nationally through viability, with later medical exceptions.", "D": {"agreement": "agree", "note": "Democrats want to restore Roe's viability standard nationally.", "summary": "The 2024 Democratic platform pledges that a Democratic Congress will pass national legislation to make Roe the law of the land again, which protected abortion until fetal viability. It also pledges to repeal the Hyde Amendment and protect IVF and contraception.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "disagree", "note": "Republicans leave abortion to the states.", "summary": "The 2024 Republican platform says the power to regulate abortion now rests with the states and a vote of the people. It opposes late-term abortion while supporting access to birth control and IVF. The 2025 reconciliation law cut Medicaid funding to certain abortion providers for one year.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "Public Law 119-21 (One Big Beautiful Bill Act), enrolled text", "url": "https://www.congress.gov/119/plaws/publ21/PLAW-119publ21.pdf", "date": "2025-07-04"}]}}, {"qid": "U17", "issue": "Transgender policy", "your_position": "Protect adult choices, with restrictive rules for minors, schools, and sex-separated settings.", "D": {"agreement": "disagree", "note": "Democrats want broad protections and oppose bans on care for minors.", "summary": "The 2024 Democratic platform pledges to pass the Equality Act, oppose state and federal bans on gender-affirming care, and ensure transgender students are treated fairly at school. It defends Biden's Title IX protections for gender identity.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "Rep. Steube: Protection of Women and Girls in Sports Act passes House in bipartisan vote", "url": "https://steube.house.gov/press-releases/steubes-protection-of-women-and-girls-in-sports-act-passes-u-s-house-in-bipartisan-vote", "date": "2025-01-14"}]}, "R": {"agreement": "partial", "note": "Republicans match your rules for minors and sports but also define sex as binary across federal policy.", "summary": "The 2024 Republican platform promises to keep men out of women's sports, ban taxpayer funding for sex change surgery, and stop schools from promoting gender transition. In 2025 executive orders defined sex as binary for federal policy, barred transgender girls and women from female school sports, and moved to restrict gender transition care for people under 19.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Defending Women from Gender Ideology Extremism and Restoring Biological Truth to the Federal Government", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/defending-women-from-gender-ideology-extremism-and-restoring-biological-truth-to-the-federal-government/", "date": "2025-01-20"}, {"title": "White House: Keeping Men Out of Women's Sports (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/02/keeping-men-out-of-womens-sports/", "date": "2025-02-05"}, {"title": "White House: Protecting Children from Chemical and Surgical Mutilation (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/protecting-children-from-chemical-and-surgical-mutilation/", "date": "2025-01-28"}, {"title": "Rep. Steube: Protection of Women and Girls in Sports Act passes House in bipartisan vote", "url": "https://steube.house.gov/press-releases/steubes-protection-of-women-and-girls-in-sports-act-passes-u-s-house-in-bipartisan-vote", "date": "2025-01-14"}]}}, {"qid": "U18", "issue": "Voting and elections", "your_position": "Accessible voting with standard ID requirements, plus ranked-choice voting.", "D": {"agreement": "partial", "note": "Democrats share your focus on access but oppose new ID and citizenship-proof rules.", "summary": "The 2024 Democratic platform pledges to pass the John Lewis Voting Rights Advancement Act and the Freedom to Vote Act to secure access to the ballot. Democrats opposed the 2025 SAVE Act, saying proof-of-citizenship rules would block eligible voters, and Senate leader Chuck Schumer called it dead on arrival.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}, {"title": "CBS News: SAVE Act passes House, with 4 Democrats backing bill", "url": "https://www.cbsnews.com/news/house-passes-save-act-proof-of-citizenship-voter-registration-federal-elections", "date": "2025-04-10"}]}, "R": {"agreement": "partial", "note": "Republicans share your ID requirement but also want limits on mail voting and single-day voting.", "summary": "The 2024 Republican platform calls for voter ID, paper ballots, proof of citizenship, and voting on a single day. A March 2025 executive order sought documentary proof of citizenship to register, and the House passed the SAVE Act requiring it in April 2025.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Preserving and Protecting the Integrity of American Elections (executive order)", "url": "https://www.whitehouse.gov/presidential-actions/2025/03/preserving-and-protecting-the-integrity-of-american-elections/", "date": "2025-03-25"}, {"title": "CBS News: SAVE Act passes House, with 4 Democrats backing bill", "url": "https://www.cbsnews.com/news/house-passes-save-act-proof-of-citizenship-voter-registration-federal-elections", "date": "2025-04-10"}]}}, {"qid": "U19", "issue": "Federal civil service", "your_position": "Make it easier to dismiss underperforming employees and tie advancement to results.", "D": {"agreement": "disagree", "note": "Democrats want to preserve strong civil-service protections.", "summary": "The 2024 Democratic platform warns against plans to fire nonpolitical civil servants and replace them with loyalists. It supports public sector bargaining rights through the Public Service Freedom to Negotiate Act.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08-19"}, {"title": "2024 Democratic Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-democratic-party-platform", "date": "2024-08-19"}]}, "R": {"agreement": "agree", "note": "Republicans removed firing protections for policy roles, which matches your option.", "summary": "The 2024 Republican platform promises to fire corrupt employees and end weaponized government. In 2025 an executive order created a new job category, now Schedule Policy/Career, that removes firing protections for policy roles, finalized by OPM in February 2026. About 317,000 employees left federal service in 2025 under the workforce reduction effort.", "sources": [{"title": "2024 Republican Party Platform, full text (American Presidency Project)", "url": "https://www.presidency.ucsb.edu/documents/2024-republican-party-platform", "date": "2024-07-08"}, {"title": "White House: Restoring Accountability to Policy-Influencing Positions Within the Federal Workforce", "url": "https://www.whitehouse.gov/presidential-actions/2025/01/restoring-accountability-to-policy-influencing-positions-within-the-federal-workforce/", "date": "2025-01-20"}, {"title": "OPM: OPM finalizes Schedule Policy/Career rule to strengthen accountability", "url": "https://www.opm.gov/news/news-releases/opm-finalizes-schedule-policycareer-rule-to-strengthen-accountability/", "date": "2026-02-05"}, {"title": "White House: Implementing the President's DOGE Workforce Optimization Initiative", "url": "https://www.whitehouse.gov/presidential-actions/2025/02/implementing-the-presidents-department-of-government-efficiency-workforce-optimization-initiative/", "date": "2025-02-11"}, {"title": "Transport Topics (AP): Federal workforce down 317,000", "url": "https://www.ttnews.com/article/federal-workforce-down-317000", "date": "2026-01"}]}}, {"qid": "U20", "issue": "Social Security and Medicare", "your_position": "Combine new revenue with gradual benefit changes, protecting spending on the young.", "D": {"agreement": "partial", "note": "Democrats share your support for new revenue but rule out any benefit cuts.", "summary": "The 2024 Democratic platform rejects any cut to Social Security or Medicare benefits and any privatization. It pledges to expand Social Security benefits and keep Medicare solvent by having the wealthiest Americans pay more.", "sources": [{"title": "2024 Democratic Party Platform (Democratic National Committee)", "url": "https://democrats.org/wp-content/uploads/2025/07/2024-Democratic-Party-Platform.pdf", "date": "2024-08
